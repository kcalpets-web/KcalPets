<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luthonia Clay Lab</title>
<style>
  body{margin:0;background:#1d1830;color:#f4f0ff;font:14px system-ui,sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 4px} p{margin:0 0 12px;color:#b9b3d6;font-size:12px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  figure{margin:0;text-align:center} figcaption{font-size:11px;color:#b9b3d6;margin-top:4px}
  canvas{background:#2a2442;border-radius:8px} .px{image-rendering:pixelated}
  input{width:240px}
</style></head>
<body>
<h1>Luthonia · ห้องทดลองดินปั้น</h1>
<p>tools only — เปิดผ่าน server: <code>python3 -m http.server 8766</code> แล้วไปที่ /tools/art/lab.html · ลากแถบเพื่อหมุน</p>
<label>หมุน <input id="yaw" type="range" min="-1.6" max="1.6" step=".02" value="-.38"></label>
<div class="row" id="out"></div>
<script type="module">
import { render, pixelate, NAMES } from './clay.js';
const out = document.getElementById('out');
function draw() {
  out.innerHTML = ''; const yaw = +document.getElementById('yaw').value;
  for (const n of NAMES.pets.concat(NAMES.icons)) {
    const big = render(n, 256, yaw), isPet = NAMES.pets.includes(n);
    const px = pixelate(big, isPet ? 24 : 16, isPet ? 24 : 16, isPet ? 14 : 8);
    const z = document.createElement('canvas'); z.width = z.height = 128; z.className = 'px';
    const g = z.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(px, 0, 0, 128, 128);
    const f = document.createElement('figure'); big.style.width = big.style.height = '128px';
    f.append(big, z); f.insertAdjacentHTML('beforeend', '<figcaption>' + n + '</figcaption>'); out.append(f);
  }
}
document.getElementById('yaw').oninput = draw; draw();
window.__lab = { render, pixelate, NAMES };
</script>
</body></html>
