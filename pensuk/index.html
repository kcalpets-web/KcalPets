/* ---- animated water: tiles merge into one pond (also across chunks); sandy bank + foam only toward land ---- */
function isWater(gc, gr){ const t = tileAt(gc, gr); return !!t && t.k==='water'; }
function drawWater(gc, gr, time, seed, i){
  const e = .12, wl = isWater(gc-1,gr), wr = isWater(gc+1,gr), wt = isWater(gc,gr-1), wb = isWater(gc,gr+1);
  const c0 = gc + (wl?0:e), c1 = gc+1-(wr?0:e), r0 = gr + (wt?0:e), r1 = gr+1-(wb?0:e);
  const A = P(c0,r0), B = P(c1,r0), C = P(c1,r1), D = P(c0,r1);
  const g = ctx.createLinearGradient(A[0], A[1], C[0], C[1]);
  g.addColorStop(0,'#3d9bd6'); g.addColorStop(.6,'#5fb7e6'); g.addColorStop(1,'#2f86c4');
  ctx.save(); quad(ctx, A, B, C, D, g); ctx.clip();
  ctx.fillStyle = 'rgba(10,60,110,.18)';                      // depth: darker toward the middle
  const [mx,my] = P(gc+.5, gr+.5); ctx.beginPath(); ctx.ellipse(mx, my, TW*.3, TH*.3, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.2;
  for (let k=0;k<2;k++){
    const t = (time*.35 + k*.5 + hrnd(seed,i,5)) % 1, [x,y] = P(gc+.3+hrnd(seed,i,6+k)*.4, gr+.3+hrnd(seed,i,8+k)*.4);
    ctx.globalAlpha = 1-t; ctx.beginPath(); ctx.ellipse(x, y, TW*.05+TW*.18*t, TH*.05+TH*.18*t, 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const sh = Math.sin(time*1.3 + gc + gr)*TW*.08;
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(mx+sh, my-TH*.08, TW*.18, TH*.05, -.45, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // foam lapping at the shore
  ctx.strokeStyle = 'rgba(255,255,255,' + (.45 + Math.sin(time*2 + gc)*.2) + ')'; ctx.lineWidth = 1.6; ctx.setLineDash([3,4]);
  ctx.lineDashOffset = -time*6; ctx.beginPath();
  if (!wt){ ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); }
  if (!wr){ ctx.moveTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); }
  if (!wb){ ctx.moveTo(C[0],C[1]); ctx.lineTo(D[0],D[1]); }
  if (!wl){ ctx.moveTo(D[0],D[1]); ctx.lineTo(A[0],A[1]); }
  ctx.stroke(); ctx.setLineDash([]);
  if (hrnd(seed,i,12) < .6){ const [lx,ly] = P(gc+.3+hrnd(seed,i,13)*.4, gr+.3+hrnd(seed,i,14)*.4), bob = Math.sin(time*1.5+i)*1;
    ctx.fillStyle = '#4c9a3a'; ctx.beginPath(); ctx.ellipse(lx, ly+bob, TW*.08, TH*.09, 0, .3, Math.PI*2-.1); ctx.lineTo(lx, ly+bob); ctx.fill();
    if (hrnd(seed,i,15) < .5){ ctx.fillStyle = '#ffb3d1'; ctx.beginPath(); ctx.arc(lx+TW*.02, ly+bob-TH*.04, TW*.025, 0, Math.PI*2); ctx.fill(); } }
}

/* ---- sky: time of day, sun / moon, night tint, night glows ---- */
let NIGHT = 0, skyKey = '';
function updateSky(){
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  // 0 = full day, 1 = full night; dusk 17–19, dawn 5–7
  NIGHT = h < 5 || h >= 19.5 ? 1 : h < 7 ? 1-(h-5)/2 : h >= 17.5 ? (h-17.5)/2 : 0;
  const key = Math.round(NIGHT*10) + (h>=17 && h<20 ? 'd' : '');
  if (key === skyKey) return; skyKey = key;
  cv.style.background = NIGHT > .8 ? 'linear-gradient(#0d1b3d,#1d3466 50%,#2b4a6e)'
    : (h >= 16.5 && h < 20) ? 'linear-gradient(#f6b26b,#f9d29d 40%,#e9f2d0 80%)'
    : (h >= 5 && h < 7.5) ? 'linear-gradient(#f7c6a3,#cfe6f5 50%,#e6f6d6)'
    : 'linear-gradient(#8fd0f5,#cfeefc 40%,#e6f6d6 80%)';
}
function drawSunMoon(time){
  const x = cssW - 56, y = 74;
  if (NIGHT > .5){
    ctx.fillStyle = 'rgba(255,255,230,.15)'; ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(13,27,61,.9)'; ctx.beginPath(); ctx.arc(x+7, y-4, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; for (let k=0;k<14;k++){ const sx = (k*97.3)%cssW, sy = 20 + (k*53.1)%140;
      ctx.globalAlpha = .4 + Math.sin(time*2 + k)*.3; ctx.fillRect(sx, sy, 1.6, 1.6); } ctx.globalAlpha = 1;
  } else {
    const g = ctx.createRadialGradient(x, y, 4, x, y, 46); g.addColorStop(0,'rgba(255,240,170,.9)'); g.addColorStop(1,'rgba(255,240,170,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe680'; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.fill();
  }
}
const glows = [];                                            // reused each frame: [x, y, r, x, y, r, …]
function addGlow(x, y, r){ glows.push(x, y, r); }
function drawNight(){
  if (NIGHT <= 0.02){ glows.length = 0; return; }
  ctx.fillStyle = `rgba(16,24,64,${.42*NIGHT})`; ctx.fillRect(0,0,cssW,cssH);
  ctx.globalCompositeOperation = 'lighter';
  for (let k=0;k<glows.length;k+=3){
    const g = ctx.createRadialGradient(glows[k], glows[k+1], 1, glows[k], glows[k+1], glows[k+2]);
    g.addColorStop(0, `rgba(255,200,90,${.55*NIGHT})`); g.addColorStop(1,'rgba(255,200,90,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(glows[k], glows[k+1], glows[k+2], 0, Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over'; glows.length = 0;
}
function drawClouds(time){
  ctx.fillStyle = NIGHT > .5 ? 'rgba(200,210,255,.18)' : 'rgba(255,255,255,.8)';
  for (let k=0;k<3;k++){
    const span = cssW + 200, x = ((time*(6+k*3) + k*190) % span) - 100, y = 26 + k*30, s = 1 - k*.15;
    ctx.beginPath(); ctx.ellipse(x, y, 34*s, 12*s, 0, 0, Math.PI*2); ctx.ellipse(x-20*s, y+4*s, 20*s, 10*s, 0, 0, Math.PI*2);
    ctx.ellipse(x+22*s, y+3*s, 22*s, 10*s, 0, 0, Math.PI*2); ctx.ellipse(x+4*s, y-8*s, 18*s, 12*s, 0, 0, Math.PI*2); ctx.fill();
  }
}

/* ---- butterflies in WORLD space (stay put while panning); fireflies at night ---- */
const flies = [0,1,2,3,4].map(k => ({ gx:0, gy:0, h:1, tx:0, ty:0, th:1, ph:k*1.7, col:['#ff8fb1','#ffd166','#8ecae6','#cdb4db','#b5e48c'][k], dir:1, rest:0, init:false }));
function flyTarget(f){
  let c = pet.x + (Math.random()-.5)*7, r = pet.y + (Math.random()-.5)*7;
  for (let k=0;k<6;k++){ const tc = Math.floor(pet.x + (Math.random()-.5)*8), tr = Math.floor(pet.y + (Math.random()-.5)*8), t = tileAt(tc,tr);
    if (t && (t.k==='wild' || (t.k==='obj' && (objById(hitZone,t.o)||{}).type==='flowerbed'))){ c = tc+.5; r = tr+.5; break; } }
  f.tx = c; f.ty = r; f.th = .6 + Math.random()*1.2;
}
function updateFlies(dt){
  for (const f of flies){
    if (!f.init){ f.gx = pet.x + (Math.random()-.5)*5; f.gy = pet.y + (Math.random()-.5)*5; f.init = true; flyTarget(f); }
    if (f.rest > 0){ f.rest -= dt; continue; }
    const dx = f.tx-f.gx, dy = f.ty-f.gy, d = Math.hypot(dx,dy), sp = .9*dt;
    f.h += (f.th - f.h)*Math.min(1, dt*2);
    if (d < .05){ f.rest = Math.random() < .5 ? 1+Math.random()*2 : 0; flyTarget(f); continue; }
    f.gx += dx/d*Math.min(sp,d); f.gy += dy/d*Math.min(sp,d);
    const sdx = dx - dy; if (Math.abs(sdx) > .02) f.dir = sdx > 0 ? 1 : -1;
  }
}
function drawFlies(time){
  for (const f of flies){
    const [x0,y0] = P(f.gx, f.gy, TH*f.h);
    if (x0 < -20 || x0 > cssW+20 || y0 < -20 || y0 > cssH+20) continue;
    if (NIGHT > .6){                                          // fireflies
      const a = .5 + Math.sin(time*3 + f.ph)*.5; ctx.fillStyle = `rgba(230,255,120,${a})`;
      ctx.beginPath(); ctx.arc(x0, y0, 2.4, 0, Math.PI*2); ctx.fill(); addGlow(x0, y0, 12); continue;
    }
    const flap = f.rest > 0 ? .35 + Math.abs(Math.sin(time*3+f.ph))*.3 : Math.abs(Math.sin(time*18 + f.ph));
    const bob = f.rest > 0 ? 0 : Math.sin(time*4+f.ph)*3, s = TW*.07;
    ctx.save(); ctx.translate(x0, y0+bob); ctx.scale(f.dir, 1);
    ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.ellipse(-s*.5*flap, -s*.4, s*.6*flap+.5, s*.55, -.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s*.4*flap, s*.25, s*.45*flap+.5, s*.38, .4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = shadeHex(f.col,-.25);
    ctx.beginPath(); ctx.ellipse( s*.35*flap, -s*.35, s*.45*flap+.5, s*.45, .4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(0,-s*.6); ctx.lineTo(0, s*.5); ctx.stroke();
    ctx.restore();
  }
}

/* =====================================================================
   NATURE — things grow back like a real field (real time, also while the app is closed)
   • Regrow:  every SPAWN_MS each area may sprout 1 small item on a free tile
              (not next to buildings, not under the pet; stops at NATURE_CAP items per area)
   • Grow up: untouched items (no job running) grow into the next size after GROW_UP[k].ms
   ===================================================================== */
const SPAWN_MS = 5*60*1000;                                  // ⚠️ one regrowth roll per area every 5 min
const NATURE_CAP = 15;                                       // ⚠️ max natural items per 5×5 area
const SPAWN_TABLE = [['grass',.4],['wild',.25],['pebble',.2],['sapling',.15]];
const GROW_UP = { grass:{to:'bush', ms:30*60e3}, sapling:{to:'tree', ms:60*60e3}, pebble:{to:'rock', ms:45*60e3}, rock:{to:'boulder', ms:3*3600e3} };
function nearObj(z, i){                                      // keep 1 tile of space around buildings
  const c = i%GRID, r = (i/GRID)|0;
  for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){ const t = tileAt(z.cx*GRID+c+dc, z.cy*GRID+r+dr); if (t && t.k==='obj') return true; }
  return false;
}
function natureTick(){
  const now = Date.now(); let changed = false, firstGrow = false;
  S.farm.natureAt = S.farm.natureAt || now;
  const rolls = Math.min(24, Math.floor((now - S.farm.natureAt)/SPAWN_MS));   // catch up after being away (cap 2 h)
  if (rolls > 0) S.farm.natureAt += rolls*SPAWN_MS;
  for (const z of S.farm.zones){
    let natural = 0;
    for (let i=0;i<z.tiles.length;i++){
      const t = z.tiles[i];
      if (!RES[t.k]) continue; natural++;
      if (!t.born){ t.born = now; continue; }
      const g = GROW_UP[t.k];
      if (g && !t.job && now - t.born >= g.ms){ t.k = g.to; t.born = now; markDirty(z); changed = true; firstGrow = true; }
    }
    for (let k=0;k<rolls && natural < NATURE_CAP;k++){
      if (Math.random() > .5) continue;
      const free = [];
      for (let i=0;i<z.tiles.length;i++){
        const gc = z.cx*GRID + i%GRID, gr = z.cy*GRID + ((i/GRID)|0);
        if (z.tiles[i].k==='clear' && !nearObj(z,i) && !(Math.floor(pet.x)===gc && Math.floor(pet.y)===gr)) free.push(i);
      }
      if (!free.length) break;
      let r = Math.random(), kind = 'grass'; for (const [k2,w] of SPAWN_TABLE){ if ((r -= w) < 0){ kind = k2; break; } }
      const t = z.tiles[free[(Math.random()*free.length)|0]]; t.k = kind; t.born = now; natural++;
      markDirty(z); changed = true; firstGrow = true;
    }
  }
  if (changed){ save(); if (firstGrow && !st('natureSeen')){ bump('natureSeen');
    queueReward('🌱 ธรรมชาติเติบโต!\nพื้นที่ว่างจะมีหญ้า ดอกไม้ หินเล็ก และต้นกล้างอกใหม่เรื่อย ๆ\nถ้าไม่เก็บ มันจะโตขึ้น: หญ้า→พุ่มไม้, ต้นกล้า→ต้นไม้ใหญ่, หินเล็ก→ก้อนหิน→หินใหญ่\n(พื้นที่รอบสิ่งปลูกสร้าง 1 ช่องจะไม่มีอะไรงอก)'); flushRewards(); } }
}

/* ---- pet (global tile coords) ---- */
const pet = makePetAnim();
function walkable(t){ return !!t && (t.k==='clear' || t.k==='path' || (t.k==='water' && t.bridge)); }
function walkAt(x, y){ return walkable(tileAt(Math.floor(x), Math.floor(y))); }
function hasWalkable(){ for (const z of S.farm.zones) for (const t of z.tiles) if (walkable(t)) return true; return false; }
function pathClear(x0,y0,x1,y1){
  const n = Math.max(1, Math.ceil(Math.hypot(x1-x0,y1-y0)/0.2));
  for (let k=1;k<=n;k++) if (!walkAt(x0+(x1-x0)*k/n, y0+(y1-y0)*k/n)) return false;
  return true;
}
function pickPetTarget(a){
  if (a.holdSit) return;
  if (Math.random() < .3){                                   // stroll to the pond for a drink
    for (let tries=0; tries<12; tries++){
      const wc = Math.floor(a.x + (Math.random()-.5)*8), wr = Math.floor(a.y + (Math.random()-.5)*8);
      if (!isWater(wc,wr)) continue;
      const [dc,dr] = [[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0], nc = wc+dc, nr = wr+dr;
      if (!walkable(tileAt(nc,nr))) continue;
      const tx = nc+.5 - dc*.3, ty = nr+.5 - dr*.3;
      if (!pathClear(a.x,a.y,tx,ty)) continue;
      a.tx = tx; a.ty = ty; a.drinkNext = true; a.faceTo = ((wc-wr)-(nc-nr)) >= 0 ? 1 : -1; return;
    }
  }
  for (let tries=0; tries<20; tries++){
    const tc = Math.floor(a.x + (Math.random()-.5)*8), tr = Math.floor(a.y + (Math.random()-.5)*8);
    if (!walkable(tileAt(tc,tr))) continue;
    const tx = tc+.25+Math.random()*.5, ty = tr+.25+Math.random()*.5;
    if (pathClear(a.x,a.y,tx,ty)){ a.tx = tx; a.ty = ty; a.drinkNext = false; return; }
  }
  a.tx = a.x; a.ty = a.y;
}
function placePet(){
  for (const z of S.farm.zones) for (let i=0;i<z.tiles.length;i++) if (walkable(z.tiles[i])){
    pet.x = pet.tx = z.cx*GRID + (i%GRID) + .5; pet.y = pet.ty = z.cy*GRID + ((i/GRID)|0) + .5;
    pet.state = 'idle'; pet.timer = 1; return; }
}
const petSize = () => TW*0.62*petStage(S.pet.lv).scale;
function drawPet(){ const [sx,sy] = P(pet.x, pet.y); drawPetModel(ctx, S.pet.type, pet, sx, sy, petSize(), petStage(S.pet.lv).form); }

/* ---- main render loop ---- */
let raf = 0, lastT = 0, tutAcc = 0, skyAcc = 1e9, natAcc = 9000;
const badges = [];                                           // reused: [kind, gc, gr, zoneIdx, li/objId, …]
const visZones = [];
function frame(now){
  raf = requestAnimationFrame(frame);
  if (now - lastT < 33) return;                              // ~30fps cap: plenty for a farm, saves battery
  const dt = Math.min(100, now - lastT); lastT = now; frameNo++;
  if (!cssW) resizeFarm();
  if ((skyAcc += dt) > 30000){ skyAcc = 0; updateSky(); }
  const time = now/1000, wall = Date.now();
  ctx.clearRect(0,0,cssW,cssH);
  if (inRoom){ drawRoom(time, dt/1000); drawNight(); if ((tutAcc += dt) > 400){ tutAcc = 0; questTick(); } return; }   // inside a house
  drawSunMoon(time); drawClouds(time);

  // visible chunks, back → front
  visZones.length = 0;
  for (const z of S.farm.zones) if (chunkOnScreen(z)) visZones.push(z);
  visZones.sort((a,b) => (a.cx+a.cy) - (b.cx+b.cy));
  const D = SIDE_D();
  for (const z of visZones){
    const e = chunkCanvas(z), c = e.cv, k = TW / e.tw, [tx,ty] = P(z.cx*GRID, z.cy*GRID);   // k ≠ 1 only mid-pinch
    ctx.drawImage(c, tx - (GRID*e.tw+6)/2*k, ty - 3*k, c.width/DPR*k, c.height/DPR*k);
  }
  let gcMin = 1e9, gcMax = -1e9, grMin = 1e9, grMax = -1e9;
  for (const z of visZones){ gcMin = Math.min(gcMin, z.cx*GRID); gcMax = Math.max(gcMax, z.cx*GRID+GRID-1); grMin = Math.min(grMin, z.cy*GRID); grMax = Math.max(grMax, z.cy*GRID+GRID-1); }
  for (const z of visZones) for (let i=0;i<z.tiles.length;i++) if (z.tiles[i].k==='water') drawWater(z.cx*GRID+i%GRID, z.cy*GRID+((i/GRID)|0), time, z.seed, i);
  drawTutHighlight(time);
  if ((tutAcc += dt) > 400){ tutAcc = 0; questTick(); }
  if ((natAcc += dt) > 10000){ natAcc = 0; natureTick(); }  // nature check every 10 s

  if (!walkAt(pet.x, pet.y) && !pet.holdSit) placePet();
  updatePetAnim(pet, dt/1000, hasWalkable(), pickPetTarget);
  updateFlies(dt/1000);
  updateFishing(wall);

  // Y-sorted pass over global diagonals
  badges.length = 0;
  const petDepth = pet.x + pet.y; let petDrawn = false;
  for (let s = gcMin+grMin; s <= gcMax+grMax; s++){
    const c0 = Math.max(gcMin, s-grMax), c1 = Math.min(gcMax, s-grMin);
    for (let gc=c0; gc<=c1; gc++){
      const gr = s - gc, t = tileAt(gc, gr); if (!t) continue;
      const z = hitZone, li = hitLi;
      if (RES[t.k]){ drawRes(t, gc, gr, time, z.seed, li); if (t.job) badges.push(0, gc, gr, z, li); }
      else if (t.k==='water' && t.bridge) drawBridge(gc, gr);
      else if (t.k==='obj'){
        const o = objById(z, t.o), lc = li%GRID, lr = (li/GRID)|0;
        if (o && lc===o.c+o.w-1 && lr===o.r+o.h-1){ drawStruct(o, time, z.cx*GRID, z.cy*GRID);
          if (!o.done || (o.type==='plot' && o.plant)) badges.push(1, gc, gr, z, o.id); }
      }
    }
    if (!petDrawn && petDepth < s+1.5){ drawPet(); drawFishLine(time); petDrawn = true; }
  }
  if (!petDrawn){ drawPet(); drawFishLine(time); }
  if (placing) drawGhost(time);
  for (let k=0;k<badges.length;k+=5){
    if (badges[k]===0) jobBadge(badges[k+3].tiles[badges[k+4]], badges[k+1], badges[k+2], time, wall);
    else buildBadge(objById(badges[k+3], badges[k+4]), badges[k+3], time, wall);
  }
  drawFlies(time);
  drawNight();
  drawFishButtons(time);                                    // UI on top of everything (not tinted at night)
}


/* ---- progress badges ---- */
function pill(x, y, w, h, fill){ ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x-w/2, y-h/2, w, h, h/2) : ctx.rect(x-w/2,y-h/2,w,h); ctx.fill(); }
function badge(x, y, p, left, ready, time, tool){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (ready){ const by = y + Math.sin(time*5)*3;
    pill(x, by, 58, 24, '#4caf6a'); ctx.fillStyle = '#fff'; ctx.font = '700 13px Mali, sans-serif'; ctx.fillText('✔ เก็บ!', x, by+1); return; }
  pill(x, y, 72, 22, 'rgba(255,255,255,.92)');
  ctx.fillStyle = '#eadbc4'; ctx.fillRect(x-24, y+5, 48, 4);
  ctx.fillStyle = '#4caf6a'; ctx.fillRect(x-24, y+5, 48*p, 4);
  ctx.fillStyle = '#3b2a1a'; ctx.font = '600 11px Mali, sans-serif'; ctx.fillText(fmtShort(left), x+6, y-3);
  if (tool){ ctx.save(); ctx.translate(x-24, y-3); ctx.rotate(Math.sin(time*10)*.5); ctx.font = '13px serif'; ctx.fillText(tool, 0, 0); ctx.restore(); }
}
function jobBadge(t, gc, gr, time, wall){
  const R = RES[t.k]; if (!R) return; const [x,y] = P(gc+.5, gr+.5, TH*R.h + 14), left = (t.job.end-wall)/1000;
  badge(x, y, 1 - Math.max(0,left)/t.job.dur, left, left <= 0, time, R.tool);
}
function buildBadge(o, z, time, wall){
  if (!o) return;
  const it = FARM_ITEMS[o.type], [x,y] = P(z.cx*GRID+o.c+o.w/2, z.cy*GRID+o.r+o.h/2, TH*it.H + 16);
  if (!o.done){ const left = (o.end-wall)/1000; badge(x, y, 1 - Math.max(0,left)/buildSec(it), left, left <= 0, time, '🔨'); }
  else { const left = (o.plant + GROW_MS - wall)/1000; badge(x, y, 1 - Math.max(0,left)/(GROW_MS/1000), left, left <= 0, time, '🌱'); }
}

/* ---- placement mode (Shop › ฟาร์ม). Footprint must sit inside ONE chunk, all tiles clear ---- */
let placing = null;                                          // {type, w, h, gc, gr, valid}
function footprintZone(p){
  if (p.gc == null) return null;
  const cx = Math.floor(p.gc/GRID), cy = Math.floor(p.gr/GRID), z = chunkMap.get(ck(cx,cy)); if (!z) return null;
  const lc = p.gc - cx*GRID, lr = p.gr - cy*GRID;
  if (lc + p.w > GRID || lr + p.h > GRID) return null;
  for (let dr=0;dr<p.h;dr++) for (let dc=0;dc<p.w;dc++) if (z.tiles[(lr+dr)*GRID+lc+dc].k!=='clear') return null;
  return { z, lc, lr };
}
/* opts.store → placed from 📦 storage (free, already built)
   opts.move  → {z, o, ...} the object was lifted; cancel puts it back where it was */
function startPlacing(type, opts){
  const it = FARM_ITEMS[type]; opts = opts || {};
  if (inRoom) exitHome();
  placing = { type, w:opts.w||it.w, h:opts.h||it.h, gc:null, gr:null, valid:false, store:!!opts.store, move:opts.move||null };
  goTab('tFarm'); $('zoneBar').style.display = 'none'; $('placeBar').style.display = 'flex';
  if (placing.move){ placeAt(placing.move.gc, placing.move.gr); }
  else if (it.once && !placing.store && footprintZone({gc:0,gr:0,w:2,h:2})){ placeAt(0,0); centerOn(1,1); } else renderPlaceBar();
}
function endPlacing(){
  if (placing && placing.move){                              // cancelled move → put it back untouched
    const m = placing.move, o = addObj(m.z, m.o.type, m.o.c, m.o.r, m.o.w, m.o.h, true); o.plant = m.o.plant; o.room = m.o.room;
  }
  placing = null; $('placeBar').style.display = 'none'; $('zoneBar').style.display = 'flex';
}
function placeAt(gc, gr){ placing.gc = gc; placing.gr = gr; placing.valid = !!footprintZone(placing); renderPlaceBar(); }
function renderPlaceBar(){
  const it = FARM_ITEMS[placing.type], verb = placing.move ? 'ย้าย' : 'วาง';
  $('pInfo').textContent = placing.gc == null ? `แตะพื้นที่โล่งเพื่อ${verb} ${it.name} (${placing.w}×${placing.h})`
    : placing.valid ? `${verb} ${it.name} มาตรงนี้ได้ ✓` : 'วางไม่ได้ — ทุกช่องต้องโล่งและอยู่ในพื้นที่ 5×5 เดียวกัน';
  $('pOk').disabled = !placing.valid;
}
function drawGhost(time){
  if (placing.gc == null) return;
  const col = placing.valid ? 'rgba(76,175,106,.5)' : 'rgba(220,60,60,.5)';
  for (let dr=0;dr<placing.h;dr++) for (let dc=0;dc<placing.w;dc++){
    const c = placing.gc+dc, r = placing.gr+dr; quad(ctx, P(c,r), P(c+1,r), P(c+1,r+1), P(c,r+1), col); }
  ctx.globalAlpha = .55 + Math.sin(time*4)*.1;
  drawStruct({ type:placing.type, c:placing.gc, r:placing.gr, w:placing.w, h:placing.h, done:true, id:0, plant:0 }, time, 0, 0);
  ctx.globalAlpha = 1;
}
$('pRot').onclick = () => { if (roomPlace){ const w = roomPlace.w; roomPlace.w = roomPlace.h; roomPlace.h = w; if (roomPlace.c != null) roomPlaceAt(roomPlace.c, roomPlace.r); return; }
  const w = placing.w; placing.w = placing.h; placing.h = w; if (placing.gc != null) placeAt(placing.gc, placing.gr); else renderPlaceBar(); };
$('pCancel').onclick = () => roomPlace ? endRoomPlace() : endPlacing();
$('pOk').onclick = () => {
  if (paint) return endPaint();
  if (roomPlace){ if (roomPlace.valid) commitRoomPlace(); return; }
  const it = FARM_ITEMS[placing.type], fz = footprintZone(placing); if (!fz) return;
  if (placing.move || placing.store){                        // move / place from storage: free & instant
    const m = placing.move, o = addObj(fz.z, placing.type, fz.lc, fz.lr, placing.w, placing.h, true);
    if (m){ o.plant = m.o.plant; o.room = m.o.room; } else S.store[placing.type]--;
    placing.move = null; bump('moveStore'); endPlacing(); save(); renderShop();
    return;
  }
  if (it.once && starterOwned()) return sheet('สร้างบ้านหลังแรกไปแล้วครับ', OK);
  if (S.coins < it.price || !canPay(it.cost)) return sheet('เหรียญหรือวัตถุดิบไม่พอแล้ว', OK);
  confirmDo(`สร้าง ${it.name} ที่นี่?\n🪙 ${it.price || 'ฟรี'} ${it.price ? 'เหรียญ' : ''}\n${costText(it.cost)}\n⏱ ใช้เวลาสร้าง ${fmt(buildSec(it))}`, () => {
    S.coins -= it.price; pay(it.cost);
    const o = addObj(fz.z, placing.type, fz.lc, fz.lr, placing.w, placing.h, false);
    o.end = Date.now() + buildSec(it)*1000;
    endPlacing(); save(); refreshHeader(); renderMats(); renderShop();
  });
};

/* =====================================================================
   FISHING — tap a pond → 🎣 cast → wait for the bobber to dip → ❗ pull in time
   Phases: ready → cast (0.6 s arc) → wait (2–6 s) → bite (window 0.6–0.9 s) → result
   Pulling during "wait" scares the fish; missing the window lets it escape.
   ===================================================================== */
const CATCH = [ {k:'tilapia', w:48, win:900, exp:4}, {k:'carp', w:24, win:800, exp:5}, {k:'shrimp', w:12, win:800, exp:4},
                {k:'goldfish', w:5, win:600, exp:12}, {k:'boot', w:11, win:900, exp:1} ];
let fishing = null;                                          // {gc, gr, phase, t0, biteAt, winEnd, pick}
function startFishing(gc, gr){
  fishPrompt = null;
  fishing = { gc, gr, phase:'ready', t0:0, biteAt:0, winEnd:0, pick:null, cool:0 };
  goTab('tFarm'); $('zoneBar').style.display = 'none'; $('fishBar').style.display = 'flex';
  centerOn(gc+.5, gr+.5); renderFishBar();
}
function endFishing(){ fishing = null; $('fishBar').style.display = 'none'; $('zoneBar').style.display = 'flex'; }
function renderFishBar(){
  if (!fishing) return;
  const f = fishing, b = $('fBtn');
  const txt = { ready:'แตะ "เหวี่ยงเบ็ด" แล้วรอทุ่นจม', cast:'กำลังเหวี่ยงเบ็ด…', wait:'รอปลากินเบ็ด… ยังไม่ต้องดึงนะ 🤫', bite:'❗ ปลากินเบ็ดแล้ว! ดึงเลย!!' };
  $('fInfo').textContent = txt[f.phase];
  b.textContent = f.phase==='ready' ? '🎣 เหวี่ยงเบ็ด' : f.phase==='bite' ? '❗ ดึง!' : '🎣 ดึงเบ็ด';
  b.className = 'btn ' + (f.phase==='bite' ? 'ok bite' : f.phase==='ready' ? '' : 'ghost');
  b.disabled = f.phase==='cast' || Date.now() < f.cool;
}
function fishPress(){
  const f = fishing; if (!f) return; const now = Date.now();
  if (f.phase==='ready'){ f.phase = 'cast'; f.t0 = now; renderFishBar(); return; }
  if (f.phase==='wait'){ f.phase = 'ready'; f.cool = now + 800; renderFishBar(); return sheet('ดึงเร็วไป! ปลาตกใจหนีไปแล้ว 😅\nรอให้ทุ่นจมก่อนแล้วค่อยดึงนะครับ', OK); }
  if (f.phase==='bite'){
    const c = f.pick; f.phase = 'ready'; f.cool = now + 1200;
    S.inv[c.k] = (S.inv[c.k]||0) + 1; bump('fish'); gainExp(c.exp); petHappy(pet);
    save(); refreshHeader(); renderMats(); renderFishBar();
    reward(`${c.k==='boot' ? 'อ้าว… ได้' : 'ได้ปลา!'} ${MAT[c.k]}${c.k==='goldfish' ? ' ✨ หายาก!' : ''}\n⭐ Exp +${c.exp}`);
  }
}
function updateFishing(now){
  const f = fishing; if (!f) return;
  if (f.phase==='cast' && now - f.t0 > 600){ f.phase = 'wait'; f.biteAt = now + 2000 + Math.random()*4000; renderFishBar(); }
  else if (f.phase==='wait' && now >= f.biteAt){
    let r = Math.random()*CATCH.reduce((s,c) => s+c.w, 0); f.pick = CATCH.find(c => (r -= c.w) < 0) || CATCH[0];
    f.phase = 'bite'; f.winEnd = now + f.pick.win; renderFishBar();
    try { navigator.vibrate && navigator.vibrate(120); } catch(e){}
  }
  else if (f.phase==='bite' && now > f.winEnd){ f.phase = 'ready'; f.cool = now + 600; renderFishBar(); sheet('ช้าไปนิด! ปลาหลุดไปแล้ว 🐟💨\nเมื่อทุ่นจมให้กด "ดึง!" ทันที', OK); }
  else if (f.phase==='ready' && f.cool && now >= f.cool){ f.cool = 0; renderFishBar(); }
}
/* bobber only (no rod): drops onto the pond, bobs while waiting, dips + ❗ on a bite */
function drawFishLine(time){
  const f = fishing; if (!f || f.phase==='ready') return;
  let [bx,by] = P(f.gc+.5, f.gr+.5);
  if (f.phase==='cast'){ const t = Math.min(1, (Date.now()-f.t0)/600); by -= (1-t)*TH*1.6; }   // drops in from above
  else if (f.phase==='wait') by += Math.sin(time*3)*1.5;
  else if (f.phase==='bite'){ by += 5 + Math.sin(time*40)*2.5; bx += Math.sin(time*31)*1.5; }
  if (f.phase!=='cast'){
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.2; const t = (time*(f.phase==='bite' ? 2.5 : .8)) % 1;
    ctx.globalAlpha = 1-t; ctx.beginPath(); ctx.ellipse(bx, by+3, 4+TW*.2*t, 2+TH*.2*t, 0, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(bx, by-2, 5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by-2, 5, 0, Math.PI); ctx.fill();
  if (f.phase==='bite'){ ctx.font = '700 22px Mali, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#e63946'; ctx.fillText('❗', bx, by - 20 + Math.sin(time*12)*2); }
}

/* --- touch: drag to pan (threshold 8 px), tap = act. Placement → pet → tile --- */
let drag = null;
const LONG_MS = 500;                                         // long-press threshold
/* pinch: track active pointers; 2 fingers → zoom about their midpoint and pan with it */
const ptrs = new Map();                                      // pointerId → {x, y}
let pinch = null;                                            // {d0, z0, wc, wr}
function pinchState(){
  const [a, b] = [...ptrs.values()], br = cv.getBoundingClientRect();
  return { d: Math.hypot(a.x-b.x, a.y-b.y) || 1, mx: (a.x+b.x)/2 - br.left, my: (a.y+b.y)/2 - br.top };
}
cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch(_){}
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (ptrs.size === 2 && inRoom){ if (drag){ clearTimeout(drag.timer); drag.moved = true; } return; }   // no zoom inside a room
  if (ptrs.size === 2){                                      // second finger → start pinch, cancel tap/long-press
    if (drag){ clearTimeout(drag.timer); drag.moved = true; }
    const p = pinchState(), [wc, wr] = screenToWorld(p.mx, p.my);
    pinch = { d0:p.d, z0:zoom, wc, wr }; pinching = true; return;
  }
  if (ptrs.size > 2) return;
  drag = { x:e.clientX, y:e.clientY, cx:camX, cy:camY, moved:false, long:false };
  const d = drag;
  d.timer = setTimeout(() => { if (drag !== d || d.moved || placing || fishing) return;
    const b = cv.getBoundingClientRect();
    if (inRoom){ if (!roomPlace && roomLongPress(d.x-b.left, d.y-b.top)) d.long = true; return; }
    const g = pick(d.x-b.left, d.y-b.top);
    if (longPress(g.c, g.r)) d.long = true; }, LONG_MS); });
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && ptrs.size >= 2){
    const p = pinchState();
    zoom = Math.max(ZMIN, Math.min(ZMAX, pinch.z0 * p.d / pinch.d0)); TW = TWBASE*zoom; TH = TW/2; OY = cssH*.5 - GRID*TH/2;
    camX = p.mx - OX - (pinch.wc-pinch.wr)*TW/2; camY = p.my - OY - (pinch.wc+pinch.wr)*TH/2;   // world anchor follows the fingers
    clampCam(); return;
  }
  if (!drag) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if (!drag.moved && Math.hypot(dx,dy) > 8){ drag.moved = true; clearTimeout(drag.timer); }
  if (drag.moved && !inRoom){ camX = drag.cx + dx; camY = drag.cy + dy; clampCam(); }
});
function endPointer(e){
  ptrs.delete(e.pointerId);
  if (pinch && ptrs.size < 2){                               // pinch finished → repaint ground at the final zoom
    pinch = null; pinching = false; renderZoneBar();
    if (drag){ clearTimeout(drag.timer); drag = null; }       // the remaining finger must not trigger a tap
    return true;
  }
  return false;
}
cv.addEventListener('pointercancel', e => { endPointer(e); if (drag) clearTimeout(drag.timer); drag = null; });
cv.addEventListener('wheel', e => {                          // desktop / trackpad pinch
  e.preventDefault(); const b = cv.getBoundingClientRect();
  zoomAt(zoom * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), e.clientX-b.left, e.clientY-b.top);
}, { passive:false });
cv.addEventListener('pointerup', e => {
  if (endPointer(e)) return;
  const d = drag; drag = null; if (!d) return; clearTimeout(d.timer); if (d.moved || d.long || ptrs.size) return;
  const b = cv.getBoundingClientRect(), sx = e.clientX-b.left, sy = e.clientY-b.top;
  if (inRoom) return roomTap(sx, sy);
  const g = pick(sx, sy);
  if (paint){ paintAt(g.c, g.r); return; }
  if (placing){ placeAt(g.c, g.r); return; }
  if (fishing) return;
  for (let k=0;k<fishBtns.length;k+=6)
    if (sx >= fishBtns[k] && sx <= fishBtns[k]+fishBtns[k+2] && sy >= fishBtns[k+1] && sy <= fishBtns[k+1]+fishBtns[k+3]) return startFishing(fishBtns[k+4], fishBtns[k+5]);
  const ps = petSize(), [px,py0] = P(pet.x, pet.y), py = py0 - ps*0.55 - pet.hopH*ps;
  if (Math.hypot(sx-px, sy-py) < Math.max(30, ps*0.6)) return tapPet();
  tapTile(g.c, g.r);
});
function rnd([a,b]){ return a + Math.floor(Math.random()*(b-a+1)); }
function costText(cost){ return Object.entries(cost).map(([k,v]) => `${MAT[k]} ${v} (มี ${S.inv[k]})`).join('\n'); }
function canPay(cost){ return Object.entries(cost).every(([k,v]) => S.inv[k] >= v); }
function pay(cost){ Object.entries(cost).forEach(([k,v]) => S.inv[k] -= v); }
const yieldText = y => Object.entries(y).map(([k,[a,b]]) => `${MAT[k]} ${a===b?a:a+'–'+b}`).join(', ');

/* =====================================================================
   PATHS & BRIDGES — 1×1 floor pieces the player paints tile by tile
   • Path tiles auto-connect: an edge border is drawn ONLY where the neighbour is
     not path (checked across chunk borders), so adjacent tiles read as one walkway.
   • Bridges sit on water tiles, make them walkable; plank direction follows the
     land/bridge neighbours (along c if east/west is land, else along r).
   • Paint mode: confirm price once, then every tap places one piece (charged per piece).
     Long-press a piece → remove it (full refund, so redesigning is free).
   ===================================================================== */
const PATHS = {
  stone: { name:'🪨 ทางเดินหิน',  price:2, cost:{},         base:'#d6cfbf', edge:'#9d9483', dot:'#bdb4a2' },
  wood:  { name:'🪵 ทางเดินไม้',  price:3, cost:{},         base:'#c99a62', edge:'#8a5f32', dot:'#a97a45' },
  brick: { name:'🧱 ทางเดินอิฐ',  price:4, cost:{},         base:'#c8735a', edge:'#91472f', dot:'#e0a089' }
};
const BRIDGE = { name:'🌉 สะพานไม้', price:20, cost:{wood:2} };
let paint = null;                                            // {kind:'path'|'bridge', type}
function markAround(gc, gr){                                 // a piece changes how its neighbours' edges look
  for (const [dc,dr] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){ const t = tileAt(gc+dc, gr+dr); if (t) markDirty(hitZone); }
}
function startPaint(kind, type){
  const it = kind==='bridge' ? BRIDGE : PATHS[type];
  confirmDo(`โหมดวาง${it.name}\n🪙 ${it.price} เหรียญ${Object.keys(it.cost).length ? ' + ' + Object.entries(it.cost).map(([k,v]) => MAT[k]+' '+v).join(', ') : ''} ต่อช่อง\n\nแตะ${kind==='bridge' ? 'ที่บ่อน้ำ' : 'ช่องว่าง'}ได้เรื่อย ๆ ทีละช่อง แล้วกด "✔ เสร็จ" เมื่อพอ\n(กดค้างที่${kind==='bridge' ? 'สะพาน' : 'ทางเดิน'}เพื่อรื้อ คืนเงินเต็ม)`, () => {
    if (inRoom) exitHome();
    paint = { kind, type }; goTab('tFarm');
    $('zoneBar').style.display = 'none'; $('placeBar').style.display = 'flex';
    $('pRot').style.display = 'none'; $('pCancel').style.display = 'none'; $('pOk').disabled = false; $('pOk').textContent = '✔ เสร็จ';
    renderPaintBar();
  });
}
function endPaint(){
  paint = null; $('placeBar').style.display = 'none'; $('zoneBar').style.display = 'flex';
  $('pRot').style.display = ''; $('pCancel').style.display = ''; $('pOk').textContent = '✔ วาง';
}
function renderPaintBar(msg){
  const it = paint.kind==='bridge' ? BRIDGE : PATHS[paint.type];
  $('pInfo').textContent = msg || `${it.name} • แตะ${paint.kind==='bridge' ? 'บ่อน้ำ' : 'ช่องว่าง'}เพื่อวาง (🪙 ${it.price}/ช่อง • มี ${S.coins})`;
}
function paintAt(gc, gr){
  const t = tileAt(gc, gr), it = paint.kind==='bridge' ? BRIDGE : PATHS[paint.type];
  if (!t) return renderPaintBar('นอกพื้นที่ฟาร์ม');
  const ok = paint.kind==='bridge' ? (t.k==='water' && !t.bridge) : (t.k==='clear' || (t.k==='path' && t.p !== paint.type));
  if (!ok) return renderPaintBar(paint.kind==='bridge' ? 'สะพานวางได้บนน้ำเท่านั้น' : 'วางได้บนช่องว่างเท่านั้น (เก็บหญ้า/หินก่อน)');
  if (S.coins < it.price || !canPay(it.cost)) return renderPaintBar('เหรียญหรือวัตถุดิบไม่พอแล้ว');
  if (t.k==='path'){ S.coins += PATHS[t.p].price; }          // swapping path type refunds the old piece
  S.coins -= it.price; pay(it.cost);
  if (paint.kind==='bridge'){ t.bridge = true; bump('bridgePlace'); }
  else { t.k = 'path'; t.p = paint.type; bump('pathPlace'); }
  markAround(gc, gr); save(); refreshHeader(); renderMats(); renderPaintBar();
}
function removePiece(gc, gr){
  const t = tileAt(gc, gr); if (!t) return false;
  if (t.k==='path'){
    const it = PATHS[t.p];
    sheet(`${it.name}\nจะรื้อออกไหม? (คืน 🪙 ${it.price})`, [ { label:'รื้อออก', cls:'ok', fn:() => {
      S.coins += it.price; t.k = 'clear'; delete t.p; markAround(gc, gr); save(); refreshHeader(); } }, { label:'ปิด', cls:'ghost' } ]);
    return true;
  }
  if (t.k==='water' && t.bridge){
    sheet(`${BRIDGE.name}\nจะรื้อออกไหม? (คืน 🪙 ${BRIDGE.price} + ${MAT.wood} ${BRIDGE.cost.wood})`, [ { label:'รื้อออก', cls:'ok', fn:() => {
      if (Math.floor(pet.x)===gc && Math.floor(pet.y)===gr) placePet();
      S.coins += BRIDGE.price; S.inv.wood += BRIDGE.cost.wood; delete t.bridge; markAround(gc, gr); save(); refreshHeader(); renderMats(); } }, { label:'ปิด', cls:'ghost' } ]);
    return true;
  }
  return false;
}
/* path tile painter (called from paintChunk with chunk-local projection lp) */
function paintPathTile(g, lp, z, cc, rr, t, i){
  const P0 = PATHS[t.p] || PATHS.stone, gc = z.cx*GRID+cc, gr = z.cy*GRID+rr;
  const A = lp(cc,rr), B = lp(cc+1,rr), C = lp(cc+1,rr+1), D = lp(cc,rr+1);
  quad(g, A, B, C, D, P0.base);
  // texture
  if (t.p==='wood'){ g.strokeStyle = P0.edge; g.lineWidth = 1;
    for (let k=1;k<4;k++){ const a = lp(cc+k/4, rr), b = lp(cc+k/4, rr+1); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); } }
  else if (t.p==='brick'){ g.strokeStyle = P0.dot; g.lineWidth = 1;
    for (let k=1;k<3;k++){ let a = lp(cc+k/3, rr), b = lp(cc+k/3, rr+1); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
      a = lp(cc, rr+k/3); b = lp(cc+1, rr+k/3); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); } }
  else for (let k=0;k<7;k++){ const [x,y] = lp(cc+.15+hrnd(z.seed,i,200+k)*.7, rr+.15+hrnd(z.seed,i,220+k)*.7);
      g.fillStyle = k%2 ? P0.dot : '#e8e2d4'; g.beginPath(); g.ellipse(x, y, TW*.07, TH*.07, 0, 0, Math.PI*2); g.fill(); }
  // auto-connect: border only where the neighbour is NOT path (grass tufts overlap the border)
  const isP = (c,r) => { const n = tileAt(c,r); return !!n && n.k==='path'; };
  g.strokeStyle = P0.edge; g.lineWidth = Math.max(1.5, TW*.035); g.lineCap = 'round';
  const e = .06, edges = [[!isP(gc,gr-1), A, B], [!isP(gc+1,gr), B, C], [!isP(gc,gr+1), C, D], [!isP(gc-1,gr), D, A]];
  for (const [open, a, b] of edges) if (open){
    g.beginPath(); g.moveTo(a[0]+(b[0]-a[0])*e, a[1]+(b[1]-a[1])*e); g.lineTo(b[0]-(b[0]-a[0])*e, b[1]-(b[1]-a[1])*e); g.stroke();
    g.strokeStyle = 'rgba(110,170,70,.9)'; g.lineWidth = 1.2;                   // little grass tufts creeping over the edge
    for (let k=1;k<4;k++){ const x = a[0]+(b[0]-a[0])*k/4, y = a[1]+(b[1]-a[1])*k/4; g.beginPath(); g.moveTo(x,y); g.lineTo(x+1.5, y-TH*.1); g.stroke(); }
    g.strokeStyle = P0.edge; g.lineWidth = Math.max(1.5, TW*.035);
  }
}
/* bridge on a water tile (Y-sorted pass) */
function drawBridge(gc, gr){
  const landOrBridge = (c,r) => { const n = tileAt(c,r); return !!n && (n.k!=='water' || n.bridge); };
  const alongC = landOrBridge(gc-1,gr) || landOrBridge(gc+1,gr) || !(landOrBridge(gc,gr-1) || landOrBridge(gc,gr+1));
  const z = TH*.18, w = .32;                                 // deck height & half-width
  const c0 = alongC ? gc : gc+.5-w, c1 = alongC ? gc+1 : gc+.5+w, r0 = alongC ? gr+.5-w : gr, r1 = alongC ? gr+.5+w : gr+1;
  box(c0, r0, c1, r1, z*.4, z, '#b9834b', '#8f5f30', '#7a4f26');
  ctx.strokeStyle = 'rgba(70,40,15,.55)'; ctx.lineWidth = 1;    // plank seams
  for (let k=1;k<5;k++){ const f = k/5;
    const a = alongC ? P(gc+f, r0, z) : P(c0, gr+f, z), b = alongC ? P(gc+f, r1, z) : P(c1, gr+f, z);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
  ctx.strokeStyle = '#6b4220'; ctx.lineWidth = Math.max(1.5, TW*.03);                // rails + posts on both sides
  for (const side of [0,1]){
    const a = alongC ? P(gc, side ? r1 : r0, z) : P(side ? c1 : c0, gr, z), b = alongC ? P(gc+1, side ? r1 : r0, z) : P(side ? c1 : c0, gr+1, z);
    const h = TH*.32;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]-h); ctx.lineTo(b[0], b[1]-h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[0], a[1]-h); ctx.moveTo(b[0], b[1]); ctx.lineTo(b[0], b[1]-h); ctx.stroke();
  }
}

/* =====================================================================
   HOUSE INTERIOR — tap a finished home (บ้านหลังแรก / บ้านไร่) to go inside
   • Homes can be MOVED but never stored or demolished (someone lives there).
   • Room = N×N iso floor + 2 back walls. Uses the same projection P() by swapping
     camera/zoom to room values while inside and restoring them on exit.
   • Furniture is bought in Shop › 🛋 ในบ้าน (coins) → S.furn inventory → placed in a room.
     Long-press furniture → move / put back in inventory. The pet comes inside too.
   ===================================================================== */
const HOME_SIZE = { starter:6, house:8 };                    // room N×N per home type ⚠️
const FURN = {
  rug:      { name:'🟥 พรมผืนใหญ่',  w:2, h:2, price:20, flat:true },
  bed:      { name:'🛏 เตียงนอน',     w:1, h:2, price:60 },
  table:    { name:'🪵 โต๊ะไม้',       w:1, h:1, price:30 },
  chair:    { name:'🪑 เก้าอี้',        w:1, h:1, price:15 },
  sofa:     { name:'🛋 โซฟา',          w:2, h:1, price:50 },
  shelf:    { name:'📚 ชั้นหนังสือ',    w:1, h:1, price:40 },
  plant:    { name:'🪴 ต้นไม้ในกระถาง', w:1, h:1, price:15 },
  lamp:     { name:'💡 โคมไฟตั้งพื้น',  w:1, h:1, price:20 },
  petbed:   { name:'🐾 ที่นอนน้อง',     w:1, h:1, price:25, flat:true }
};
const WALLS  = [['ครีม','#f6e7c8','#e3d0aa'], ['ฟ้าพาสเทล','#d6ecf7','#b9d8ea'], ['ชมพูอ่อน','#f9dbe2','#ecbfca'], ['เขียวมิ้นต์','#d8f0e0','#b8dcc4']];
const FLOORS = [['ไม้','#c99a62','#b48550'], ['กระเบื้อง','#e8e4dc','#d3cdc1'], ['พรมฟ้า','#9cc3e0','#88b2d2']];
let inRoom = null;                                           // {z, o, N, saved:{camX,camY,zoom}}
const roomPet = makePetAnim();
let roomPlace = null;                                        // {type, w, h, c, r, valid, move}
const isHome = type => !!HOME_SIZE[type];

function enterHome(z, o){
  o.room = o.room || { items:[], wall:0, floor:0, nextId:1 };
  if (placing) endPlacing(); if (paint) endPaint(); if (fishing) endFishing();
  const N = HOME_SIZE[o.type];
  inRoom = { z, o, N, saved:{ camX, camY, zoom } };
  layoutRoom();
  roomPet.x = roomPet.tx = N/2 + .2; roomPet.y = roomPet.ty = N - .8; roomPet.state = 'idle'; roomPet.timer = 1;
  $('zoneBar').style.display = 'none'; $('roomBar').style.display = 'flex'; $('roomTitle').textContent = `🏠 ${FARM_ITEMS[o.type].name.split(' ').slice(1).join(' ')} ของ ${S.profile.name}`;
  $('roomTitle').style.display = 'block'; $('mats').style.display = 'none'; $('hint').style.display = 'none';
  bump('enterHome'); save();
}
function layoutRoom(){                                       // fit the N×N room in the portrait canvas
  const N = inRoom.N;
  TW = Math.min(110, (cssW - 24) / N); TH = TW/2; zoom = TW / TWBASE;
  OY = cssH*.5 - GRID*TH/2; centerOn(N/2, N/2); camY += TH*1.2;   // nudge down so the walls fit above
}
function exitHome(){
  if (!inRoom) return;
  if (roomPlace) endRoomPlace();
  const s = inRoom.saved; inRoom = null;
  zoom = s.zoom; TW = TWBASE*zoom; TH = TW/2; OY = cssH*.5 - GRID*TH/2; camX = s.camX; camY = s.camY;
  $('roomBar').style.display = 'none'; $('zoneBar').style.display = 'flex'; $('roomTitle').style.display = 'none';
  $('mats').style.display = ''; $('hint').style.display = '';
  renderZoneBar(); save();
}
function roomItemAt(c, r, solidOnly){                       // solid furniture wins over a rug under it
  let flatHit = null;
  for (const it of inRoom.o.room.items) if (c >= it.c && c < it.c+it.w && r >= it.r && r < it.r+it.h){
    if (!FURN[it.type].flat) return it; flatHit = it; }
  return solidOnly ? null : flatHit;
}
function roomWalk(x, y){
  const N = inRoom.N; if (x < .2 || y < .2 || x > N-.2 || y > N-.2) return false;
  return !roomItemAt(Math.floor(x), Math.floor(y), true);
}
function roomTarget(a){
  for (let k=0;k<20;k++){
    const tx = .5 + Math.random()*(inRoom.N-1), ty = .5 + Math.random()*(inRoom.N-1);
    if (!roomWalk(tx,ty)) continue;
    let ok = true; const n = Math.ceil(Math.hypot(tx-a.x, ty-a.y)/.2);
    for (let s=1;s<=n;s++) if (!roomWalk(a.x+(tx-a.x)*s/n, a.y+(ty-a.y)*s/n)){ ok = false; break; }
    if (ok){ a.tx = tx; a.ty = ty; return; }
  }
  a.tx = a.x; a.ty = a.y;
}

function drawRoom(time, dt){
  const { N, o } = inRoom, R = o.room, wall = WALLS[R.wall] || WALLS[0], floor = FLOORS[R.floor] || FLOORS[0];
  const g = ctx.createLinearGradient(0,0,0,cssH); g.addColorStop(0,'#3b2a1e'); g.addColorStop(1,'#5a4130');
  ctx.fillStyle = g; ctx.fillRect(0,0,cssW,cssH);
  const H = TH*3.2;
  // back walls (c = 0 plane on the left, r = 0 plane on the right) + baseboard
  quad(ctx, P(0,0,0), P(0,N,0), P(0,N,H), P(0,0,H), wall[2]);
  quad(ctx, P(0,0,0), P(N,0,0), P(N,0,H), P(0,0,H), wall[1]);
  quad(ctx, P(0,0,0), P(0,N,0), P(0,N,TH*.25), P(0,0,TH*.25), '#a8865f');
  quad(ctx, P(0,0,0), P(N,0,0), P(N,0,TH*.25), P(0,0,TH*.25), '#b8966e');
  // windows on the right wall: sky colour follows real time
  const sky = NIGHT > .6 ? '#23365f' : NIGHT > .2 ? '#f2b47a' : '#9fd6f5';
  for (const u of N > 6 ? [.2, .6] : [.35]){
    const a = P(N*u, 0, H*.45), b = P(N*(u+.18), 0, H*.45), c = P(N*(u+.18), 0, H*.85), d = P(N*u, 0, H*.85);
    quad(ctx, a, b, c, d, '#fff'); const m = .08;
    quad(ctx, P(N*u+m,0,H*.48), P(N*(u+.18)-m,0,H*.48), P(N*(u+.18)-m,0,H*.82), P(N*u+m,0,H*.82), sky);
    if (NIGHT > .6) addGlow((a[0]+c[0])/2, (a[1]+c[1])/2, TW*.6);
  }
  // door on the left wall (way back out)
  quad(ctx, P(0,N*.62,0), P(0,N*.82,0), P(0,N*.82,H*.62), P(0,N*.62,H*.62), '#8a5a33');
  // floor
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    quad(ctx, P(c,r), P(c+1,r), P(c+1,r+1), P(c,r+1), (c+r)%2 ? floor[1] : floor[2]);
    if (R.floor===0){ ctx.strokeStyle = 'rgba(90,55,25,.25)'; ctx.lineWidth = 1; const a = P(c+.5,r), b = P(c+.5,r+1); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
  }
  // flat items first (rugs, pet bed), then Y-sorted furniture + pet
  for (const it of R.items) if (FURN[it.type].flat) drawFurn(it, time);
  roomPet.night = NIGHT > .6;
  updatePetAnim(roomPet, dt, true, roomTarget);
  const order = R.items.filter(it => !FURN[it.type].flat).sort((a,b) => (a.c+a.w+a.r+a.h) - (b.c+b.w+b.r+b.h));
  let petDone = false; const pd = roomPet.x + roomPet.y;
  for (const it of order){
    if (!petDone && pd < it.c+it.w-1 + it.r+it.h-1 + 1.2){ drawRoomPet(); petDone = true; }
    drawFurn(it, time);
  }
  if (!petDone) drawRoomPet();
  if (roomPlace && roomPlace.c != null){
    const col = roomPlace.valid ? 'rgba(76,175,106,.5)' : 'rgba(220,60,60,.5)';
    for (let dr=0;dr<roomPlace.h;dr++) for (let dc=0;dc<roomPlace.w;dc++){ const c = roomPlace.c+dc, r = roomPlace.r+dr; quad(ctx, P(c,r), P(c+1,r), P(c+1,r+1), P(c,r+1), col); }
    ctx.globalAlpha = .6; drawFurn({ type:roomPlace.type, c:roomPlace.c, r:roomPlace.r, w:roomPlace.w, h:roomPlace.h }, time); ctx.globalAlpha = 1;
  }
}
function drawRoomPet(){ const [sx,sy] = P(roomPet.x, roomPet.y); drawPetModel(ctx, S.pet.type, roomPet, sx, sy, TW*.7*petStage(S.pet.lv).scale, petStage(S.pet.lv).form); }
function drawFurn(it, time){
  const m = .08, c0 = it.c+m, r0 = it.r+m, c1 = it.c+it.w-m, r1 = it.r+it.h-m, cm = (c0+c1)/2, rm = (r0+r1)/2, U = TH;
  switch (it.type){
    case 'rug':
      quad(ctx, P(c0,r0,1), P(c1,r0,1), P(c1,r1,1), P(c0,r1,1), '#c0392b');
      quad(ctx, P(c0+.15,r0+.15,1), P(c1-.15,r0+.15,1), P(c1-.15,r1-.15,1), P(c0+.15,r1-.15,1), '#e8b04b');
      quad(ctx, P(c0+.3,r0+.3,1), P(c1-.3,r0+.3,1), P(c1-.3,r1-.3,1), P(c0+.3,r1-.3,1), '#c0392b'); break;
    case 'petbed': { const [x,y] = P(cm,rm);
      ctx.fillStyle = '#7b5ea7'; ctx.beginPath(); ctx.ellipse(x, y, TW*.36, TH*.36, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#b39ddb'; ctx.beginPath(); ctx.ellipse(x, y-2, TW*.26, TH*.24, 0, 0, Math.PI*2); ctx.fill(); break; }
    case 'bed':
      box(c0,r0,c1,r1,0,U*.35,null,'#8a5a33','#6e4524');
      box(c0+.03,r0+.03,c1-.03,r1-.03,U*.35,U*.55,'#ffffff','#eceff4','#d9dee6');
      box(c0+.03,r0+.6,c1-.03,r1-.03,U*.55,U*.6,'#5c8fd6','#4a7cc2','#3c69a8');
      box(c0+.1,r0+.08,c1-.1,r0+.45,U*.55,U*.75,'#fffdf7','#efe9dc','#ded6c6');
      box(c0,r0,c1,r0+.08,0,U*1.1,'#a26b3c','#8a5a33','#6e4524'); break;
    case 'table':
      for (const [lc,lr] of [[c0+.05,r0+.05],[c1-.13,r0+.05],[c0+.05,r1-.13],[c1-.13,r1-.13]]) box(lc,lr,lc+.08,lr+.08,0,U*.75,'#6e4524','#6e4524','#5a381d');
      box(c0,r0,c1,r1,U*.75,U*.85,'#c99a62','#a87a45','#8f6334');
      ball(ctx, ...P(cm,rm,U*.95), TW*.06, TW*.05, '#fff', '#f2c94c', '#c9a227'); break;
    case 'chair':
      for (const [lc,lr] of [[c0+.15,r0+.15],[c1-.22,r0+.15],[c0+.15,r1-.22],[c1-.22,r1-.22]]) box(lc,lr,lc+.07,lr+.07,0,U*.45,'#6e4524','#6e4524','#5a381d');
      box(c0+.12,r0+.12,c1-.12,r1-.12,U*.45,U*.53,'#d9a066','#b9824a','#9c6d37');
      box(c0+.12,r0+.12,c1-.12,r0+.2,U*.53,U*1.1,'#d9a066','#b9824a','#9c6d37'); break;
    case 'sofa': {
      const alongC = it.w >= it.h;
      box(c0,r0,c1,r1,0,U*.45,'#e07a5f','#c8664c','#ad543c');
      if (alongC){ box(c0,r0,c1,r0+.25,U*.45,U*.95,'#e8907a','#c8664c','#ad543c'); box(c0,r0,c0+.18,r1,U*.45,U*.7,'#e8907a','#c8664c','#ad543c'); box(c1-.18,r0,c1,r1,U*.45,U*.7,'#e8907a','#c8664c','#ad543c'); }
      else { box(c0,r0,c0+.25,r1,U*.45,U*.95,'#e8907a','#c8664c','#ad543c'); box(c0,r0,c1,r0+.18,U*.45,U*.7,'#e8907a','#c8664c','#ad543c'); box(c0,r1-.18,c1,r1,U*.45,U*.7,'#e8907a','#c8664c','#ad543c'); }
      break; }
    case 'shelf':
      box(c0+.1,r0,c1-.1,r0+.35,0,U*2.2,'#a87a45','#8f6334','#7a5229');
      for (let k=0;k<3;k++){ const z0 = U*(.3+k*.65);
        for (let b=0;b<4;b++){ const u0 = .12+b*.19; faceQuad('L', c0+.1, r0, c1-.1, r0+.35, u0, u0+.14, z0, z0+U*.45, ['#e63946','#457b9d','#f4a261','#2a9d8f'][(b+k)%4]); } }
      break;
    case 'plant':
      box(cm-.18,rm-.18,cm+.18,rm+.18,0,U*.45,'#c8735a','#b0604a','#93503d');
      ball(ctx, ...P(cm-.08,rm,U*.85), TW*.14, TH*.3, '#a6e07f', '#4aa846', '#2b6f2e');
      ball(ctx, ...P(cm+.08,rm,U*.95), TW*.14, TH*.3, '#a6e07f', '#4aa846', '#2b6f2e');
      ball(ctx, ...P(cm,rm,U*1.2), TW*.15, TH*.32, '#b8ea92', '#58b552', '#2f7a33'); break;
    case 'lamp': {
      box(cm-.15,rm-.15,cm+.15,rm+.15,0,U*.08,'#555','#444','#333');
      box(cm-.03,rm-.03,cm+.03,rm+.03,U*.08,U*1.6,'#666','#555','#444');
      const [gx,gy] = P(cm,rm,U*1.8);
      if (NIGHT > .3) addGlow(gx, gy, TW*.9);
      ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.moveTo(gx-TW*.16, gy+TH*.2); ctx.lineTo(gx-TW*.09, gy-TH*.25); ctx.lineTo(gx+TW*.09, gy-TH*.25); ctx.lineTo(gx+TW*.16, gy+TH*.2); ctx.closePath(); ctx.fill();
      break; }
  }
}

/* room placement (reuses the place bar) */
function startRoomPlace(type, move){
  const f = FURN[type];
  roomPlace = { type, w:move ? move.w : f.w, h:move ? move.h : f.h, c:null, r:null, valid:false, move:move||null };
  $('roomBar').style.display = 'none'; $('placeBar').style.display = 'flex';
  if (move) roomPlaceAt(move.c, move.r); else renderRoomPlaceBar();
}
function roomPlaceAt(c, r){
  const p = roomPlace; p.c = c; p.r = r; const N = inRoom.N;
  p.valid = c >= 0 && r >= 0 && c+p.w <= N && r+p.h <= N;
  // a flat piece (rug, pet bed) may sit under / next to furniture; two solid or two flat pieces may not overlap
  const flat = !!FURN[p.type].flat;
  if (p.valid) for (const it of inRoom.o.room.items)
    if (c < it.c+it.w && c+p.w > it.c && r < it.r+it.h && r+p.h > it.r && !!FURN[it.type].flat === flat){ p.valid = false; break; }
  renderRoomPlaceBar();
}
function renderRoomPlaceBar(){
  const f = FURN[roomPlace.type];
  $('pInfo').textContent = roomPlace.c == null ? `แตะพื้นในบ้านเพื่อวาง ${f.name}` : roomPlace.valid ? `วาง ${f.name} ตรงนี้ได้ ✓` : 'วางไม่ได้ — ชนของชิ้นอื่นหรือออกนอกห้อง';
  $('pOk').disabled = !roomPlace.valid;
}
function endRoomPlace(cancel){
  if (cancel !== false && roomPlace && roomPlace.move) inRoom.o.room.items.push(roomPlace.move);   // cancelled move → put back
  roomPlace = null; $('placeBar').style.display = 'none'; if (inRoom) $('roomBar').style.display = 'flex';
}
function commitRoomPlace(){
  const p = roomPlace, R = inRoom.o.room;
  if (p.move){ p.move.c = p.c; p.move.r = p.r; p.move.w = p.w; p.move.h = p.h; R.items.push(p.move); }
  else { S.furn[p.type]--; R.items.push({ id:R.nextId++, type:p.type, c:p.c, r:p.r, w:p.w, h:p.h }); bump('decorPlace'); }
  roomPlace.move = null; endRoomPlace(false); save();
}
function openFurnMenu(){

function questTick(){
  const q = curQuest(), navShop = document.querySelector('[data-t=tShop]'), navMis = document.querySelector('[data-t=tMission]');
  if (!q){ $('tut').style.display = 'none'; navShop.classList.remove('pulse'); navMis.classList.remove('pulse'); return; }
  const prog = Math.min(q.need, q.goal()), done = prog >= q.need;
  const key = q.id + prog + questCollapsed;
  if (key === questShown && !questDirty) return;            // re-render only on change
  questShown = key; questDirty = false;
  $('tut').style.display = 'flex'; $('tut').classList.toggle('done', done); $('tut').classList.toggle('mini', questCollapsed && !done);
  $('tutStep').textContent = `📜 เควส ${S.qDone.length+1}/${QUESTS.length} · ${q.name}` + (q.need > 1 ? ` (${prog}/${q.need})` : '') + (done ? ' ✔' : '');
  $('tutText').textContent = done ? 'สำเร็จแล้ว! แตะเพื่อรับรางวัล 🎁' : fillPet(q.text);
  $('tutProg').style.width = (prog/q.need*100) + '%';
  navShop.classList.toggle('pulse', !done && q.nav==='tShop');
  navMis.classList.toggle('pulse', !done && q.nav==='tMission');

/* Farm highlight for the current quest (drawn under objects, pulsing) */
function drawTutHighlight(time){
  const q = curQuest(); if (!q || !q.hl || q.goal() >= q.need) return;
  ctx.globalAlpha = .3 + Math.sin(time*5)*.18;
  if (q.hl==='pet'){
    const [sx,sy] = P(pet.x, pet.y); ctx.fillStyle = '#ffd84d';
    ctx.beginPath(); ctx.ellipse(sx, sy, TW*.45, TH*.45, 0, 0, Math.PI*2); ctx.fill();
  } else if (q.hl==='corner'){
    quad(ctx, P(0,0), P(2,0), P(2,2), P(0,2), '#ffd84d');
  } else {
    for (const z of visZones) for (let i=0;i<z.tiles.length;i++){
      const t = z.tiles[i]; let on = false;
      if (q.hl==='small' || q.hl==='medium' || q.hl==='large') on = SIZE_OF(t.k)===q.hl;
      else if (q.hl==='water') on = t.k==='water';
      else if (t.k==='obj'){ const o = objById(z, t.o); on = !!o && ((q.hl==='plot' && o.type==='plot') || (q.hl==='starter' && o.type==='starter')); }
      if (on){ const c = z.cx*GRID + i%GRID, r = z.cy*GRID + ((i/GRID)|0); quad(ctx, P(c,r), P(c+1,r), P(c+1,r+1), P(c,r+1), '#ffd84d'); }
    }
  }
  ctx.globalAlpha = 1;
}

  if (shopTab === 'home'){
    const info = document.createElement('div'); info.className = 'muted';
    info.textContent = 'ของตกแต่งในบ้าน • ซื้อแล้วเก็บในกระเป๋า → เข้าบ้าน (แตะที่บ้าน) → 🛋 ของตกแต่ง → วาง';
    L.appendChild(info);
    Object.entries(FURN).forEach(([id,f]) => {
      const c = document.createElement('div'); c.className = 'card mrow' + ((curQuest()||{}).id==='decor' ? ' tutGlow' : '');
      c.innerHTML = `<div><b>${f.name}</b><div class="muted">📐 ${f.w}×${f.h} • มีในกระเป๋า ${(S.furn||{})[id]||0}</div></div>`;
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = `🪙 ${f.price}`; b.disabled = S.coins < f.price;
      b.onclick = () => confirmDo(`ซื้อ ${f.name} ราคา ${f.price} เหรียญ?`, () => { S.coins -= f.price; S.furn[id] = (S.furn[id]||0) + 1; save(); refreshHeader(); renderShop();
        reward(`${f.name} +1\nเข้าบ้านแล้วกด 🛋 ของตกแต่ง เพื่อวาง`); });
      c.appendChild(b); L.appendChild(c);
    });
    return;
  }
  if (shopTab === 'farm'){
    const info = document.createElement('div'); info.className = 'muted';
    info.textContent = 'สิ่งปลูกสร้างและของตกแต่งบ้าน/ฟาร์ม • จ่ายเหรียญ + วัตถุดิบ • เวลาสร้างขึ้นกับขนาดและราคา';
    L.appendChild(info);
    const stored = Object.entries(S.store||{}).filter(([,n]) => n > 0);
    if (stored.length){
      const h = document.createElement('b'); h.textContent = '📦 คลังของฉัน (วางได้ฟรี ไม่ต้องรอสร้าง)'; L.appendChild(h);
      stored.forEach(([id,n]) => { const it = FARM_ITEMS[id], c = document.createElement('div'); c.className = 'card mrow';
        c.innerHTML = `<div><b>${it.name}</b><div class="muted">📐 ${it.w}×${it.h} • มี ${n} ชิ้น</div></div>`;
        const b = document.createElement('button'); b.className = 'btn ok'; b.textContent = 'นำออกมาวาง'; b.onclick = () => startPlacing(id, { store:true });
        c.appendChild(b); L.appendChild(c); });
      const h2 = document.createElement('b'); h2.textContent = '🛠 สร้างใหม่'; L.appendChild(h2);
    }
    const hp = document.createElement('b'); hp.textContent = '🛤 ทางเดิน & สะพาน (วางทีละช่อง เชื่อมกันเอง)'; L.appendChild(hp);
    [...Object.entries(PATHS).map(([k,pp]) => ['path', k, pp]), ['bridge', null, BRIDGE]].forEach(([kind, k, it]) => {
      const q = (curQuest()||{}).id, glow = (q==='path' && kind==='path') || (q==='bridge' && kind==='bridge');
      const c = document.createElement('div'); c.className = 'card mrow' + (glow ? ' tutGlow' : '');
      c.innerHTML = `<div><b>${it.name}</b><div class="muted">🪙 ${it.price}${Object.keys(it.cost).length ? ' + ' + Object.entries(it.cost).map(([m,v]) => MAT[m]+' '+v).join(', ') : ''} ต่อช่อง${kind==='bridge' ? ' • วางบนน้ำ ข้ามบ่อได้' : ''}</div></div>`;
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'วาง'; b.onclick = () => startPaint(kind, k);
      c.appendChild(b); L.appendChild(c);
    });
    const h3 = document.createElement('b'); h3.textContent = '🏗 สิ่งปลูกสร้าง'; L.appendChild(h3);
    Object.entries(FARM_ITEMS).forEach(([id,it]) => {
      if (it.once && starterOwned()) return;                 // starter house: only one
      const okCoin = S.coins >= it.price, okMat = canPay(it.cost);
      const c = document.createElement('div'); c.className = 'card' + ((curQuest()||{}).id==='house' && it.once || (curQuest()||{}).id==='plot' && id==='plot' ? ' tutGlow' : '');
      c.innerHTML = `<div class="mrow"><b>${it.name}</b><span class="coin" style="padding:2px 10px"><i></i>${it.price || 'ฟรี'}</span></div>
        <div class="muted">${it.desc}</div>
        <div class="muted" style="margin-top:6px">📐 ${it.w}×${it.h} (${it.w*it.h} ช่อง) • ⏱ ${fmt(buildSec(it))}</div>
        <div style="margin-top:4px;font-size:14px">${Object.entries(it.cost).map(([k,v]) =>
          `<span style="color:${S.inv[k]>=v?'#2e7d32':'#c0392b'}">${MAT[k]} ${S.inv[k]}/${v}</span>`).join(' • ')}</div>`;
      const b = document.createElement('button'); b.className = 'btn' + (okCoin && okMat ? '' : ' ghost'); b.style.cssText = 'width:100%;margin-top:8px';
      b.textContent = okCoin && okMat ? 'เลือกตำแหน่งสร้าง' : (okCoin ? 'วัตถุดิบไม่พอ' : 'เหรียญไม่พอ');
      b.disabled = !(okCoin && okMat); b.onclick = () => startPlacing(id);
      c.appendChild(b); L.appendChild(c);
    });
    return;
  }
  const h1 = document.createElement('b'); h1.textContent = '🛒 ซื้อของ'; L.appendChild(h1);
  SHOP_BUY.forEach(it => L.appendChild(shopRow(it, 'ซื้อ', () => {
    if (S.coins < it.p) return sheet('เหรียญทองไม่พอ\nทำภารกิจเพื่อรับเหรียญเพิ่มนะครับ', OK);
    confirmDo(`ซื้อ ${MAT[it.k]} 1 ชิ้น ราคา ${it.p} เหรียญ?`, () => { S.coins -= it.p; S.inv[it.k]++; if (it.k==='food') bump('buyFood'); save(); refreshHeader(); renderMats(); renderShop(); });
  })));
  const h = document.createElement('b'); h.textContent = '💰 ขายของ'; h.style.marginTop = '8px'; L.appendChild(h);
  SHOP_SELL.forEach(it => L.appendChild(shopRow(it, 'ขาย', () => {
    if (!S.inv[it.k]) return;
    confirmDo(`ขาย ${MAT[it.k]} 1 ชิ้น ได้ ${it.p} เหรียญ? (มี ${S.inv[it.k]})`, () => { S.inv[it.k]--; S.coins += it.p; save(); refreshHeader(); renderMats(); renderShop(); });
  }, true)));
}
function shopRow(it, verb, fn, sell){
  const c = document.createElement('div'); c.className='card mrow';
  c.innerHTML = `<div><b>${MAT[it.k]}</b><div class="muted">${sell ? 'มี '+(S.inv[it.k]||0)+' • ' : ''}${it.p} เหรียญ</div></div>`;
  const b = document.createElement('button'); b.className = 'btn' + (sell?' ghost':''); b.textContent = verb; b.onclick = fn;
  if (sell && !S.inv[it.k]) b.disabled = true;
  c.appendChild(b); return c;
}
function renderBag(){
  const L = $('bagList');
  L.innerHTML = '<b>🎒 กระเป๋า</b>' + Object.keys(MAT).filter(k => S.inv[k] || ['stone','grass','wood','seed','veg','food'].includes(k)).map(k => `<div class="card mrow"><span>${MAT[k]}</span><b>${S.inv[k]||0}</b></div>`).join('') +
    `<div class="card"><b>ระดับผู้เล่น Lv.${S.lv}/${MAX_LV}</b><div class="muted">Exp ${S.exp}/${needExp(S.lv)} • ฟาร์ม ${S.farm.zones.length}/${MAX_ZONES} พื้นที่ (พื้นที่ละ 5×5 ต่อกันเป็นผืนเดียว)<br>` +
    `ทุก Lv. ปลดล็อกพื้นที่ใหม่ติดกับฟาร์มเดิม จนถึง Lv.${MAX_ZONES}<br>Exp: เก็บชิ้นเล็ก +3 • กลาง +6 • ใหญ่ +15 • สร้างเสร็จ +10 • เก็บเกี่ยว +5 • ภารกิจ +20 • ให้อาหาร +3</div></div>` +
    `<div class="card"><b>ข้อมูลของคุณ</b><div class="muted">BMR ${S.analysis.bmr} • TDEE ${S.analysis.tdee} kcal • BMI ${S.analysis.bmi}</div></div>`;
  const out = document.createElement('button'); out.className='btn ghost'; out.textContent='ออกจากระบบ';
  out.onclick = () => confirmDo('ออกจากระบบ?\n(ครั้งหน้าต้องเข้าสู่ระบบใหม่)', () => { cloudFlush(); cloudSynced = false; clearTimeout(cloudRetry); stopLoop(); endPlacingSafe(); USER=null; S=null; store.set('pensuk_last', null);
    if (fb && fb.auth.currentUser) fb.auth.signOut(); $('lPass').value=''; $('lErr').textContent=''; show('sLogin'); });
  const mv = document.createElement('button'); mv.className = 'btn ghost'; mv.textContent = '📲 สร้างโค้ดย้ายเครื่อง';
  mv.onclick = exportSave;
  const acct = document.createElement('div'); acct.className = 'card';
  acct.innerHTML = `<b>บัญชี</b><div class="muted">${USER.startsWith('g_') ? '🔑 Google: ' + ((fb && fb.auth.currentUser && fb.auth.currentUser.email) || 'เชื่อมต่อแล้ว') + ' • บันทึกบนคลาวด์อัตโนมัติ เล่นได้ทุกเครื่อง' : '👤 ' + USER + ' • บันทึกในเครื่องนี้'}</div>`;

  L.append(acct, mv, out);
}
function endPlacingSafe(){ if (placing) endPlacing(); }

/* ---- boot ---- */
autoLogin();
initFirebase();
</script>
</body>
</html>
