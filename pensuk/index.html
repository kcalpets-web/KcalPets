const SIZE_OF = k => RES[k] ? RES[k].size : null;
let questDirty = true, questShown = '', questCollapsed = false;
/* progress is stored as the list of finished quest ids (S.qDone) so the chain can be re-ordered safely */
const QUEST_V1 = ['hello','small','corner','house','houseOk','mLog','mClaim','buyFood','feed','medium','plot','harvest','large','zone2','fish','speed'];
function questMigrate(){
  if (!S.qDone){ S.qDone = QUEST_V1.slice(0, S.q || 0); }
}
const qIndex = () => QUESTS.findIndex(q => !S.qDone.includes(q.id));
const curQuest = () => { if (!S || !S.qDone) return null; const i = qIndex(); return i < 0 ? null : QUESTS[i]; };
const fillPet = s => s.replace(/\{pet\}/g, S.pet ? S.pet.name : 'น้อง')
  .replace(/\{plv\}/g, S.pet ? S.pet.lv : 1).replace(/\{plv1\}/g, S.pet ? S.pet.lv + 1 : 2).replace(/\{pcost\}/g, S.pet ? needPetExp(S.pet.lv) : 30);

function questTick(){
  brkTick();
  $('evFab').style.display = eventOn() && !tool ? 'block' : 'none'; $('evFab').classList.toggle('pulse', evClaimable());
  if (KRATHONGS.length){ const now = performance.now()/1000; KRATHONGS = KRATHONGS.filter(k => now - k.t0 < 120); } if (S.pet && S.farm) petDailyFind();
  if ((curQuest()||{}).id === 'trash' && !S.trashGift){ S.trashGift = 1; S.store = S.store || {}; S.store.flowerbed = (S.store.flowerbed||0) + 1; save(); renderShop(); }
  const q = curQuest(), navShop = document.querySelector('[data-t=tShop]'), navMis = document.querySelector('[data-t=tMission]');
  if (!q){ $('tut').style.display = 'none'; navShop.classList.remove('pulse'); navMis.classList.remove('pulse'); $('toolFab').classList.remove('pulse'); return; }
  const prog = Math.min(q.need, q.goal()), done = prog >= q.need;
  const key = q.id + prog + questCollapsed;
  if (key === questShown && !questDirty) return;            // re-render only on change
  questShown = key; questDirty = false;
  $('tut').style.display = 'flex'; $('tut').classList.toggle('done', done); $('tut').classList.toggle('mini', questCollapsed && !done);
  $('tutStep').textContent = `📜 เควส ${S.qDone.length+1}/${QUESTS.length} · ${q.name}` + (q.need > 1 ? ` (${prog}/${q.need})` : '') + (done ? ' ✔' : '');
  $('tutText').textContent = done ? 'สำเร็จแล้ว! แตะเพื่อรับรางวัล 🎁' : fillPet(q.text);
  $('tutProg').style.width = (prog/q.need*100) + '%';
  navShop.classList.toggle('pulse', !done && q.nav==='tShop');
  navMis.classList.toggle('pulse', !done && q.nav==='tMission');
  $('toolFab').classList.toggle('pulse', !done && !!q.tool && !tool);
  if (q.shop) shopTab = q.shop;
}
function rewardText(r){ return Object.entries(r).filter(([,v]) => v).map(([k,v]) => k==='coins' ? `🪙 ${v.toLocaleString()} เหรียญทอง` : `${MAT[k]} +${v}`).join('\n'); }
function claimQuest(){
  const q = curQuest(); if (!q || q.goal() < q.need) return;
  Object.entries(q.reward).forEach(([k,v]) => k==='coins' ? S.coins += v : invAdd(k, v)); sfx('coin');
  gainExp(10); S.qDone.push(q.id); save(); refreshHeader(); renderMats(); questDirty = true; questTick();
  const next = curQuest();
  reward(`📜 เควส "${q.name}" สำเร็จ!\n${rewardText(q.reward)}\n⭐ Exp +10` + (next ? `\n\nเควสถัดไป: ${next.name}` : '\n\n🎉 จบเควสสอนเล่นทั้งหมดแล้ว!'));
}
$('tut').onclick = () => { const q = curQuest(); if (!q) return;
  if (q.goal() >= q.need) return claimQuest();
  questCollapsed = !questCollapsed; questDirty = true; questTick(); };

/* Quest log tab */
function renderQuests(){
  const L = $('questList'); L.innerHTML = '<b>📜 เควสสอนเล่น</b><div class="muted">ทำตามลำดับเพื่อเรียนรู้ทุกระบบของเกม • แตะกล่องเควสบนฟาร์มเพื่อย่อ/ขยาย</div>';
  QUESTS.forEach((q,i) => {
    const state = S.qDone.includes(q.id) ? 'done' : i === qIndex() ? 'now' : 'lock';
    const c = document.createElement('div'); c.className = 'card' + (state==='now' ? ' tutGlow' : '');
    c.style.opacity = state==='lock' ? .55 : 1;
    c.innerHTML = `<div class="mrow"><b>${state==='done'?'✅':state==='now'?'▶️':'🔒'} ${i+1}. ${q.name}</b><span class="muted">${rewardText(q.reward).replace(/\n/g,' • ') || '—'}</span></div>
      <div class="muted" style="margin-top:4px">${state==='lock' ? 'ทำเควสก่อนหน้าให้สำเร็จก่อน' : fillPet(q.text)}</div>`;
    if (state==='now' && q.goal() >= q.need){ const b = document.createElement('button'); b.className = 'btn ok'; b.style.cssText = 'width:100%;margin-top:8px';
      b.textContent = 'รับรางวัล'; b.onclick = claimQuest; c.appendChild(b); }
    L.appendChild(c);
  });
}

/* Farm highlight for the current quest (drawn under objects, pulsing) */
function drawTutHighlight(time){
  const q = curQuest(); if (!q || !q.hl || q.goal() >= q.need) return;
  ctx.globalAlpha = .3 + Math.sin(time*5)*.18;
  if (q.hl==='pet'){
    const [sx,sy] = P(pet.x, pet.y); ctx.fillStyle = '#ffd84d';
    ctx.beginPath(); ctx.ellipse(sx, sy, TW*.45, TH*.45, 0, 0, Math.PI*2); ctx.fill();
  } else if (q.hl==='corner'){
    quad(ctx, P(0,0), P(2,0), P(2,2), P(0,2), '#ffd84d');
  } else {
    for (const z of visZones) for (let i=0;i<z.tiles.length;i++){
      const t = z.tiles[i]; let on = false;
      if (q.hl==='small' || q.hl==='medium' || q.hl==='large') on = SIZE_OF(t.k)===q.hl;
      else if (q.hl==='water') on = t.k==='water';
      else if (t.k==='obj'){ const o = objById(z, t.o); on = !!o && ((q.hl==='plot' && o.type==='plot') || (q.hl==='starter' && o.type==='starter')); }
      if (on){ const c = z.cx*GRID + i%GRID, r = z.cy*GRID + ((i/GRID)|0); quad(ctx, P(c,r), P(c+1,r), P(c+1,r+1), P(c,r+1), '#ffd84d'); }
    }
  }
  ctx.globalAlpha = 1;
}
$('tutAva').innerHTML = BEAGLE;
function renderMats(){
  const seeds = Object.values(CROPS).reduce((n,c) => n + inv(c.seed), 0);
  $('mats').innerHTML = ['stone','grass','wood','plank'].filter(k => k!=='plank' || inv(k)).map(k => `<div>${MAT[k].split(' ')[0]} ${inv(k)}</div>`).join('') + `<div>🌱 ${seeds}</div>`;

function procTap(z, o){ workshop(z, o); }
function workshop(z, o){
  const it = FARM_ITEMS[o.type], list = PROC[o.type], busy = !!o.pj, now = Date.now();
  sheet(`${it.name}\n${it.desc}`, [{ label:'ปิด', cls:'ghost' }]);
  const box = document.createElement('div'); box.className = 'ws';
  const stEl = document.createElement('div'); stEl.className = 'card wst';
  const close = () => $('modal').classList.remove('on');
  if (busy){
    const r = list[o.pj.i], left = (o.pj.end - now)/1000;
    if (left <= 0){
      stEl.innerHTML = `<b>✅ ${recName(r)} เสร็จแล้ว!</b>`;
      const b = document.createElement('button'); b.className = 'btn ok'; b.textContent = 'รับของ'; b.onclick = () => { close(); collectJob(z, o); setTimeout(flushRewards, 150); };
      stEl.appendChild(b);
    } else {
      stEl.innerHTML = `<b>⏳ กำลังทำ ${recName(r)}</b><div class="muted">เหลืออีก ${fmt(left)} • ทำได้ทีละ 1 อย่าง</div>`;
      const sb = speedBtn(left, () => { o.pj.end = Date.now(); workshop(z, o); }), b = document.createElement('button');
      b.className = 'btn ok'; b.textContent = sb.label; b.onclick = () => { close(); sb.fn(); }; stEl.appendChild(b);
    }
  } else stEl.innerHTML = `<b>● ว่าง</b><div class="muted">เลือกสิ่งที่จะทำด้านล่าง (ทำได้ทีละ 1 อย่าง)</div>`;
  box.appendChild(stEl);
  box.appendChild(cardGrid(list.map((r, i) => {
    const ok = canPay(r.in), f = r.furn && FURN[r.furn];
    const make = () => confirmDo(`ทำ ${recName(r)}?\nใช้ ${inText(r.in)}\n⏱ ${fmt(r.sec)}`, () => {
      pay(r.in); o.pj = { i, end: Date.now() + r.sec*1000 }; bump('procStart'); save(); renderMats(); sfx('pop'); markDirty(z); });
    return { ref: f ? 'f:'+r.furn : 'm:'+r.out, name:nm(recName(r)), dot:!ok, dim:busy,
      sub:`⏱ ${fmt(r.sec)} • ${f ? `📐 ${f.w*f.h} ช่อง` : `ขาย ${sellPrice(r.out).toLocaleString()}`}<br>${needMini(r.in)}`,
      price: busy ? 'รอคิว' : ok ? 'ทำ' : 'ของไม่พอ', cnt: (f ? (S.furn||{})[r.furn] : inv(r.out)) || null,
      on:() => { closeModal();
        if (busy) return sheet(`${it.name} กำลังทำอย่างอื่นอยู่\nทำได้ทีละ 1 อย่าง — รอให้เสร็จหรือ ⚡ เร่งก่อน`, [{ label:'กลับ', cls:'ghost', fn:() => workshop(z, o) }]);
        if (!ok) return detailSheet(f ? 'f:'+r.furn : 'm:'+r.out, `${recName(r)}\nวัตถุดิบยังไม่พอ`, needLine(r.in), [{ label:'กลับ', cls:'ghost', fn:() => workshop(z, o) }]);
        make(); } }; }), 64));
  $('mbody').appendChild(box);
}
function collectJob(z, o){
  const r = PROC[o.type][o.pj.i];
  if (r.furn){ S.furn[r.furn] = (S.furn[r.furn]||0) + 1; bump('craft'); }
  else { invAdd(r.out, 1); bump('proc_'+r.out); }
  bump('proc'); delete o.pj; gainExp(8); sfx('done'); save(); refreshHeader(); renderMats(); markDirty(z);
  reward(`${recName(r)} +1` + (r.furn ? '\nเข้าบ้านแล้วกด 🛋 ของตกแต่ง เพื่อวาง' : '') + '\n⭐ Exp +8');
}
/* ---------- vegetable plots: choose which seed to plant ---------- */
function plotTap(z, o){
  if (!o.plant){                                              // v0.17.2: pick a seed once, then drag to sow
    if (!Object.values(CROPS).some(c => inv(c.seed) > 0)) return sheet('ยังไม่มีเมล็ดพันธุ์\n• เคลียร์หญ้า/หิน/ต้นไม้ มีโอกาสได้เมล็ดฟรี\n• หรือซื้อที่ ร้านค้า › ทั่วไป',
      [{label:'ไปที่ร้านค้า', cls:'ok', fn:() => openShop('general')}, {label:'ปิด', cls:'ghost'}]);
    $('toolBar').style.display = 'flex'; $('zoneBar').style.display = 'none'; pickTool('sow'); return;
  }
  const c = cropOf(o), left = cropLeft(o);
  if (left > 0) return sheet(`${c.e} ${c.name} กำลังโต… อีก ${fmt(left)}`, [ speedBtn(left, () => { o.plant = Date.now() - c.sec*1000; }), {label:'ปิด', cls:'ghost'} ]);
  return confirmDo(`เก็บเกี่ยว${c.name}?`, () => {
    const n = rnd(c.yield); invAdd(c.prod, n); o.plant = 0; delete o.crop; o.idle = Date.now(); bump('harvest'); gainExp(EXP.harvest); sfx('coin');
    save(); refreshHeader(); renderMats(); reward(`${MAT[c.prod]} +${n}\n⭐ Exp +${EXP.harvest}`);
  });
}

/* ---------- 📋 orders: 3 slots, pay ~1.5× shop price, refill 10 min after delivery/skip ---------- */
const ORDER_WAIT = 10*60*1000;
function orderPool(){
  const k = ['wood','stone','grass','tilapia','carp','shrimp'];
  for (const c of Object.values(CROPS)) if (S.lv >= c.lv) k.push(c.prod);
  if (ownsDone('sawmill')) k.push('plank');
  if (ownsDone('mill')) k.push('milled');
  if (ownsDone('kitchen')) k.push('soup');
  if (ownsDone('jamhouse')) k.push('sauce', 'jam');
  return k;
}
function newOrder(){
  const pool = orderPool(), n = Math.min(pool.length, S.lv >= 5 ? rnd([1,3]) : rnd([1,2])), items = {};
  while (Object.keys(items).length < n){
    const k = pool[Math.floor(Math.random()*pool.length)];
    items[k] = SELL[k] <= 200 ? rnd([2,5]) : SELL[k] <= 600 ? rnd([1,3]) : 1;
  }
  const value = Object.entries(items).reduce((s,[k,v]) => s + SELL[k]*v, 0);
  return { items, coins: Math.round(value*1.5/10)*10, exp: Math.min(60, 5 + Math.floor(value/100)), wait:0 };
}
function ensureOrders(){
  S.orders = S.orders || [];
  while (S.orders.length < 3) S.orders.push(newOrder());
  S.orders.forEach((o,i) => { if (o.wait && Date.now() >= o.wait) S.orders[i] = newOrder(); });
}
const BEAUTY = { flowerbed:1, lamp:1, bench:1, fence:1, fountain:3, gazebo:3, lanna:2, lotuspond:3 };
const beautyScore = () => S.farm.zones.reduce((s,z) => s + z.objs.reduce((t,o) => t + (o.done ? BEAUTY[o.type]||0 : 0), 0), 0);
function renderOrders(L){
  ensureOrders();
  const b = beautyScore(), tip = Math.min(600, b*30), got = S.tipDate === todayKey();
  const tc = document.createElement('div'); tc.className = 'card';
  tc.innerHTML = `<div class="mrow"><b>💐 ทิปจากคนมาเที่ยวฟาร์ม</b><span>✨ ความสวย ${b}</span></div>
    <div class="muted">วางน้ำพุ ศาลา กระบะดอกไม้ โคมไฟ ม้านั่ง รั้ว เพิ่มความสวย • วันละครั้ง สูงสุด 600</div>`;
  const tb = document.createElement('button'); tb.className = 'btn ok'; tb.style.cssText = 'width:100%;margin-top:8px';
  tb.textContent = got ? '✅ รับทิปวันนี้แล้ว' : tip ? `รับทิป 🪙 ${tip}` : 'ยังไม่มีของตกแต่งในฟาร์ม'; tb.disabled = got || !tip;
  tb.onclick = () => confirmDo(`รับทิป 🪙 ${tip}?`, () => { S.tipDate = todayKey(); S.coins += tip; sfx('coin'); save(); refreshHeader(); renderShop(); });
  tc.appendChild(tb); L.appendChild(tc);
  const h = document.createElement('b'); h.textContent = '📋 คำสั่งซื้อ (จ่ายแพงกว่าขายร้าน ~1.5 เท่า)'; L.appendChild(h);
  S.orders.forEach((o, i) => {
    const c = document.createElement('div'); c.className = 'card' + ((curQuest()||{}).id==='order' ? ' tutGlow' : '');
    if (o.wait){ c.innerHTML = `<b>🚚 กำลังหาลูกค้าใหม่…</b><div class="muted">ออเดอร์ใหม่ใน ${fmt((o.wait-Date.now())/1000)}</div>`; L.appendChild(c); return; }
    const ok = Object.entries(o.items).every(([k,v]) => inv(k) >= v);
    c.innerHTML = `<div class="mrow"><b>ออเดอร์ ${i+1}</b><b>🪙 ${o.coins.toLocaleString()} • ⭐ ${o.exp}</b></div>
      <div style="margin-top:6px;font-size:15px">${Object.entries(o.items).map(([k,v]) => `<div style="color:${inv(k)>=v?'#2e7d32':'#c0392b'}">${MAT[k]} ${inv(k)}/${v}</div>`).join('')}</div>`;
    const row = document.createElement('div'); row.className = 'row'; row.style.marginTop = '8px';
    const d = document.createElement('button'); d.className = 'btn ok'; d.textContent = 'ส่งของ'; d.disabled = !ok;
    d.onclick = () => confirmDo(`ส่งออเดอร์ ${i+1}?\nได้ 🪙 ${o.coins.toLocaleString()} และ ⭐ Exp ${o.exp}`, () => {
      Object.entries(o.items).forEach(([k,v]) => S.inv[k] -= v); S.coins += o.coins; gainExp(o.exp); bump('order');
      S.orders[i] = { wait: Date.now() + ORDER_WAIT }; sfx('coin'); save(); refreshHeader(); renderMats(); renderShop();
      reward(`📋 ส่งออเดอร์สำเร็จ!\n🪙 ${o.coins.toLocaleString()} เหรียญทอง\n⭐ Exp +${o.exp}`); });
    const s = document.createElement('button'); s.className = 'btn ghost'; s.textContent = 'ข้าม'; s.style.flex = '0 0 80px';
    s.onclick = () => confirmDo('ข้ามออเดอร์นี้?\nออเดอร์ใหม่จะมาใน 10 นาที', () => { S.orders[i] = { wait: Date.now() + ORDER_WAIT }; save(); renderShop(); });
    row.append(d, s); c.appendChild(row); L.appendChild(c);
  });
}

    : t.harvest ? `ใช้ ${t.e} ${t.name}?\nลากนิ้วผ่านแปลงผักที่สุกแล้ว เพื่อเก็บเกี่ยวทันที\n(แปลงที่ยังไม่สุกจะไม่โดนเก็บ • เลื่อน/ซูมใช้ 2 นิ้ว)`

/* apply the active tool along the finger path (sampled every ~¼ tile so fast swipes don't skip tiles) */
function toolStroke(x0, y0, x1, y1){
  const step = Math.max(6, TW/4), n = Math.max(1, Math.ceil(Math.hypot(x1-x0, y1-y0)/step));
  for (let k=1;k<=n;k++){ const x = x0+(x1-x0)*k/n, y = y0+(y1-y0)*k/n, g = pick(x, y); toolHit(g.c, g.r); }
}
function toolHit(gc, gr){
  const key = gc*100003 + gr;
  if (toolDrag && toolDrag.last === key) return;              // one hit per tile entry (re-enter to hit again)
  if (toolDrag) toolDrag.last = key;
  const t = tileAt(gc, gr); if (!t) return;
  if (TOOLS[tool].sow){                                       // 🌱 drag-to-sow (v0.17.2): empty finished plot → plant the chosen seed
    if (t.k !== 'obj') return; const z = hitZone, o = objById(z, t.o);
    if (!o || o.type !== 'plot' || !o.done || o.plant) return;
    const c = CROPS[sowSeed]; if (!c) return;
    if (inv(c.seed) < 1){ if (Date.now() - toolMsgAt > 2000){ toolMsgAt = Date.now(); floatText(gc, gr, 'เมล็ดหมด', '#c0392b'); } return; }
    S.inv[c.seed]--; o.plant = Date.now(); o.crop = sowSeed; o.idle = Date.now(); bump('sow'); if (sowSeed !== 'carrot') bump('plant_other');
    burst(gc, gr, TOOLS.sow.col, 8); sfx('pop'); buzz(10); floatText(gc, gr, `−1${c.e}`, '#2e7d32'); markDirty(z); renderMats(); renderSeedBar(); saveSoon(); return;
  }
  if (TOOLS[tool].dig){                                       // 🪏 staged digging (v0.15): grass → free plot → pond • fill pond → grass
    const z = hitZone, mode = toolDrag && toolDrag.mode, lc = gc - z.cx*GRID, lr = gr - z.cy*GRID;   // one stroke = one kind of action
    const setMode = m => { if (toolDrag) toolDrag.mode = m; };
    if (t.k === 'clear' && (!mode || mode === 'till')){           // dig 1: grass → tilled plot (free, plant right away)
      setMode('till'); const o = addObj(z, 'plot', lc, lr, 1, 1, true); o.dug = 1; o.idle = Date.now();
      bump('till'); burst(gc, gr, TOOLS.shovel.col, 8); sfx('chop'); buzz(15); floatText(gc, gr, '🟫 แปลงผัก', '#7a5236'); saveSoon(); return;
    }
    if (t.k === 'obj' && (!mode || mode === 'pond')){             // dig 2: empty plot → pond (+1 soil); planted plots are protected
      const o = objById(z, t.o); if (!o || o.type !== 'plot' || !o.done) return;
      if (o.plant){ if (Date.now() - toolMsgAt > 2000){ toolMsgAt = Date.now(); floatText(gc, gr, 'มีผักปลูกอยู่', '#c0392b'); } return; }
      setMode('pond'); removeObj(z, o); t.k = 'water'; invAdd('soil', 1); bump('dig');
      burst(gc, gr, TOOLS.shovel.col, 8); sfx('chop'); buzz(15); floatText(gc, gr, '💧 +1🟤', '#2f6f8f'); markDirty(z); saveSoon(); return;
    }
    if (t.k === 'water' && (!mode || mode === 'fill')){           // fill: pond → grass (−1 soil)
      if (t.bridge){ floatText(gc, gr, 'รื้อสะพานก่อน', '#c0392b'); return; }
      if (inv('soil') < 1){ if (Date.now() - toolMsgAt > 2000){ toolMsgAt = Date.now(); floatText(gc, gr, 'ต้องใช้ 🟤 ดิน', '#c0392b'); } return; }
      setMode('fill'); S.inv.soil--; t.k = 'clear'; bump('fill'); burst(gc, gr, TOOLS.shovel.col, 8); sfx('chop'); buzz(15);
      floatText(gc, gr, '−1🟤', '#7a5236'); markDirty(z); saveSoon(); return;
    }
    return;
  }
  if (TOOLS[tool].harvest){                                   // 🌾 sickle: harvest every ripe plot the finger passes
    if (t.k !== 'obj') return; const z = hitZone, o = objById(z, t.o);
    if (!o || o.type !== 'plot' || !o.done || !o.plant || cropLeft(o) > 0) return;
    const c = cropOf(o), n = rnd(c.yield); invAdd(c.prod, n); o.plant = 0; delete o.crop; o.idle = Date.now();
    bump('harvest'); bump('reap'); gainExp(EXP.harvest); burst(gc, gr, TOOLS.reap.col, 8); sfx('snip'); buzz(15);
    floatText(gc, gr, `+${n}${c.e}`, '#2e7d32'); markDirty(z); saveSoon(); return;
  }
  if (!RES[t.k]) return;
  const z = hitZone, R = RES[t.k], T = TOOLS[tool];
  if (!T.fits.includes(t.k)){
    if (Date.now() - toolMsgAt > 2500){ toolMsgAt = Date.now(); const need = TOOLS[toolFor(t.k)]; floatText(gc, gr, `ใช้ ${need.e}`, '#c0392b'); }
    return;
  }
  if (t.job) delete t.job;                                    // v0.8 timed jobs finish instantly with tools
  t.hp = (t.hp == null ? HITS[R.size] : t.hp) - 1;
  burst(gc, gr, T.col, R.size === 'large' ? 10 : 6); sfx(T.snd); buzz(12);
  if (use3D()) R3D.hit(z, (gr - z.cy*GRID)*GRID + (gc - z.cx*GRID));   // 3D: wobble the model that was hit
  if (t.hp > 0){ t.shake = performance.now(); return; }
  collectRes(t, z, R, gc, gr);
}
function collectRes(t, z, R, gc, gr){
  const got = [];
  Object.entries(R.yield).forEach(([m,rg]) => { if (m === 'seed') return; const n = rnd(rg); if (n){ invAdd(m, n); got.push(`+${n}${MAT[m].split(' ')[0]}`); } });
  const sd = seedDrop(R.size); if (sd){ invAdd(sd, 1); got.push(`+1${CROPS_BY_SEED[sd].e}🌱`); }
  if (eventOn() && (t.k === 'grass' || t.k === 'wild') && Math.random() < FLOWER_P){ invAdd('flower', 1); got.push('+1🌸'); bump('flowerGet'); }   // 🏮 v0.18
  t.k = 'clear'; delete t.hp; delete t.shake; markDirty(z);
  bump('collect_'+R.size); bump('toolUse'); gainExp(SIZE_EXP[R.size]);
  floatText(gc, gr, got.join(' '), '#2e7d32'); saveSoon();
}
const CROPS_BY_SEED = Object.fromEntries(Object.values(CROPS).map(c => [c.seed, c]));
function seedDrop(size){                                       // ⚠️ small 30% • medium/large 60%, cheaper crops more likely
  if (Math.random() > (size === 'small' ? .3 : .6)) return null;
  const ok = Object.values(CROPS).filter(c => S.lv >= c.lv), w = ok.map((c,i) => ok.length - i), sum = w.reduce((a,b) => a+b, 0);
  let r = Math.random()*sum; for (let i=0;i<ok.length;i++){ if ((r -= w[i]) <= 0) return ok[i].seed; }
  return ok[0].seed;
}

/* ---- pooled particles + floating text (screen space, no allocation per frame) ---- */
const FX = Array.from({length:80}, () => ({ on:false, x:0, y:0, vx:0, vy:0, life:0, col:'', txt:'' }));
function fxSpawn(x, y, vx, vy, life, col, txt){ const p = FX.find(q => !q.on); if (!p) return; Object.assign(p, { on:true, x, y, vx, vy, life, max:life, col, txt:txt||'' }); }
function burst(gc, gr, cols, n){ const [x,y] = P(gc+.5, gr+.5, TH*.4);
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 40 + Math.random()*90; fxSpawn(x, y, Math.cos(a)*s, Math.sin(a)*s*.6 - 90, .55, cols[i%cols.length]); } }
function floatText(gc, gr, txt, col){ if (!txt) return; const [x,y] = P(gc+.5, gr+.5, TH*1.2); fxSpawn(x, y, 0, -40, 1.3, col, txt); }
function drawToolFx(time, dt){
  drawHoldRing();
  for (const p of FX){ if (!p.on) continue;
    p.life -= dt; if (p.life <= 0){ p.on = false; continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; if (!p.txt) p.vy += 320*dt;
    ctx.globalAlpha = Math.min(1, p.life/p.max*1.6);
    if (p.txt){ ctx.font = '700 15px Mali, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(p.txt, p.x, p.y); ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y); }
    else { ctx.fillStyle = p.col; ctx.fillRect(p.x-2.5, p.y-2.5, 5, 5); }
  }
  ctx.globalAlpha = 1;
  if (tool && toolDrag && toolDrag.x != null){                 // tool follows the finger, lifted above it so the finger never hides the tile
    ctx.save(); ctx.translate(toolDrag.x + 18, toolDrag.y - 44); ctx.rotate(Math.sin(time*18)*.45 - .3);
    drawIco(ctx, TOOL_ICO[tool], 0, 0, 46, TOOLS[tool].e);   // 🌱 sow shows the chosen seed packet
    ctx.restore();                                           // ⚠️ v0.17.3: must pair with save() or the HUD transform leaks
  }
}
/* remaining-hits pips over a medium/large item that has been hit */
function hpBadge(t, gc, gr){
  const R = RES[t.k]; if (!R || t.hp == null) return; const max = HITS[R.size], [x,y] = P(gc+.5, gr+.5, TH*R.h + 12);
  pill(x, y, 10 + max*9, 14, 'rgba(255,255,255,.92)');
  for (let k=0;k<max;k++){ ctx.fillStyle = k < t.hp ? '#e0892f' : '#e8dccb'; ctx.beginPath(); ctx.arc(x - (max-1)*4.5 + k*9, y, 3.2, 0, Math.PI*2); ctx.fill(); }
}

/* =====================================================================
   🔊 SOUND — tiny WebAudio synth (no files). Mute is remembered per device.
   ===================================================================== */
let AC = null, muted = !!store.get('pensuk_mute');
$('bMute').textContent = muted ? '🔇' : '🔊';
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }
function tone(f0, f1, dur, type, vol, at){
  const t0 = AC.currentTime + (at||0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur+.02);
}
let noiseBuf = null;
function noise(dur, freq, vol){
  if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate*.3, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t0 = AC.currentTime;
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t0); s.stop(t0+dur);
}
function sfx(kind){
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    switch (kind){
      case 'snip':  noise(.07, 5200, .35); tone(2400, 1800, .05, 'triangle', .05); break;
      case 'chop':  noise(.08, 900, .5); tone(160, 70, .14, 'triangle', .25); break;
      case 'clink': tone(1900, 1700, .1, 'triangle', .18); tone(2900, 0, .07, 'sine', .08, .02); noise(.04, 3000, .2); break;
      case 'coin':  tone(988, 0, .09, 'square', .07); tone(1319, 0, .22, 'square', .07, .08); break;
      case 'pop':   tone(520, 880, .09, 'sine', .2); break;
      case 'done':  [523,659,784,1047].forEach((f,i) => tone(f, 0, .18, 'triangle', .14, i*.09)); break;
      case 'bark':  tone(620, 320, .09, 'sawtooth', .06); tone(560, 300, .09, 'sawtooth', .05, .13); break;
      case 'tick':  tone(1200, 0, .03, 'sine', .06); break;
    }
  } catch(e){}
}

/* =====================================================================
   🎯 NEW DAILY MISSIONS — web-only, no health-data link needed
   📵 rest: counts only while this screen is open & visible, hold 3 s to exit
   🏋️ squats: DeviceMotion vertical acceleration (polarity-agnostic peak pattern)
   🙆 neck: front camera + MediaPipe Face Landmarker (on-device, nothing uploaded)
   ===================================================================== */
function missionDefs(age){
  const older = age >= 60 ? .8 : 1;
  return {
    rest:  { icon:'📵', label:'พักจอ (วางมือถือ พักสายตา)', unit:'นาที', step:5, base:30 },
    squat: { icon:'🏋️', label:'ลุกนั่ง', unit:'ครั้ง', step:2, base: Math.max(10, Math.round(20*older/2)*2) },
    neck:  { icon:'🙆', label:'บริหารต้นคอ (ซ้าย ขวา เงย ก้ม)', unit:'รอบ', step:1, base:3 }
  };
}
function buildMissions(){
  const a = analyse(S.profile), D = missionDefs(a.age);
  S.analysis = a;
  S.missions = Object.entries(D).map(([key,d]) => ({ key, ...d, target:d.base, progress:0, claimed:false }));
  S.goalLocked = false; S.missionDate = todayKey();
}
const mFmt = (m, v) => m.key === 'rest' ? `${Math.floor(v)}` : `${Math.floor(v)}`;

/* ---- streak + daily-bonus rewards ---- */
function keyOf(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function yesterdayKey(){ const d = new Date(); d.setDate(d.getDate()-1); return keyOf(d); }
const streakNow = () => (S.streakDate === todayKey() || S.streakDate === yesterdayKey()) ? (S.streak||0) : 0;
function claimBonus(){
  const s = S.streakDate === yesterdayKey() ? (S.streak||0) + 1 : S.streakDate === todayKey() ? (S.streak||1) : 1;
  S.streak = s; S.streakDate = todayKey(); S.bonusClaimed = true; S.bestStreak = Math.max(S.bestStreak||0, s);
  const lg = gainLove(LOVE_ALL_BONUS);
  const candle = eventOn(); if (candle){ evState().candles++; bump('candle'); }   // 🏮 v0.18: 🕯 one lucky candle per completed day
  const extra = Math.min(6, s-1)*50, chest = s % 7 === 0;
  S.coins += COIN_ALL_BONUS + extra + (chest ? 1000 : 0);
  if (chest){ invAdd('sd_pumpkin', 1); invAdd('sd_berry', 1); }
  sfx('done'); save(); refreshHeader(); renderMissions();
  reward(`🎉 ครบ 3 ภารกิจ!\n${loveTxt(LOVE_ALL_BONUS, lg)}${candle ? '\n🕯 เทียนนำโชค +1 (เทศกาลลอยกระทง)' : ''}\n🪙 ${COIN_ALL_BONUS} โบนัส` + (extra ? `\n🔥 ต่อเนื่อง ${s} วัน +${extra}` : `\n🔥 เริ่มนับต่อเนื่องวันที่ 1`) +
    (chest ? `\n🎁 กล่องพิเศษ 7 วัน: 🪙 1,000 + ${MAT.sd_pumpkin} + ${MAT.sd_berry}` : `\n(อีก ${7 - s%7} วันได้กล่องพิเศษ)`));
}

function renderMissions(){
  const L = $('missionList'); L.innerHTML = '';

    <div class="muted">ภารกิจละ 💗 ${LOVE_PER_MISSION} + 🪙 ${COIN_PER_MISSION} • ครบ 3 ภารกิจ โบนัส 💗 ${LOVE_ALL_BONUS} + 🪙 ${COIN_ALL_BONUS}${careFull() ? ' • ดูแลน้องครบ 💗 ×1.5' : ''}</div>
    <div style="margin-top:6px;font-weight:600">🔥 ทำครบต่อเนื่อง ${sk} วัน <span class="muted">• ครบ 7 วันได้กล่องพิเศษ</span></div>`;
  L.appendChild(head);

    c.innerHTML = `<div class="mrow"><b>${m.icon} ${m.label}</b><span>${pct}%</span></div><div class="bar"><b style="width:${pct}%"></b></div>

  }

  edit.onclick = () => confirmDo('เริ่มคุยกับเป็นสุขใหม่เพื่ออัปเดตข้อมูล?\n(ความคืบหน้าภารกิจวันนี้จะถูกรีเซ็ต)', () => { stopLoop(); startChat(); });
  L.appendChild(edit);
}
function manualLog(m, card){
  if (card.querySelector('.man')) return;
  const r = document.createElement('div'); r.className = 'row man'; r.style.marginTop = '8px';
  const inp = document.createElement('input'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.placeholder = 'บันทึก ' + m.unit;
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'บันทึก'; b.style.flex = '0 0 90px';
  b.onclick = () => { const v = parseFloat(inp.value); if (!(v > 0)) return;
    confirmDo(`บันทึก ${v} ${m.unit} ใน "${m.label}"?\n(ใช้เมื่อเครื่องไม่รองรับการนับอัตโนมัติ)`, () => { addProgress(m, v); renderMissions(); }); };
  r.append(inp, b); card.appendChild(r); inp.focus();

function addProgress(m, v){

/* 🏋️ SQUATS — vertical linear acceleration v = dot(acc, ĝ).
   One rep = peak beyond ±T, opposite peak, then same-sign peak again (works whatever the axis sign
   convention of the browser), lasting ≥ 0.9 s, then a short calm period before the next rep. */
function actSquat(box, m){
  actHead(box, '🏋️ ลุกนั่ง', true);
  const c = document.createElement('div'); c.className = 'actc';
  c.innerHTML = `<div id="sBig" style="font-size:88px;font-weight:700;color:var(--pri2);line-height:1">${Math.floor(m.progress)}</div>
    <div id="sGoal" class="muted">${doneLine(m)}</div>
    <div id="sPet" style="font-size:64px;transition:transform .15s">${S.pet.emoji}</div>
    <div class="card" style="text-align:left;line-height:1.6">1. ยืนตรง ถือมือถือแนบอกด้วยสองมือ (จอตั้ง)<br>2. ย่อตัวลงเหมือนนั่งเก้าอี้ แล้วลุกขึ้นช้า ๆ<br>3. เป็นสุขจะนับให้ทุกครั้งที่ลุกขึ้นครบ 1 รอบ<br>
      <span class="muted">💡 ถ้าทรงตัวไม่ดี ลุกนั่งจากเก้าอี้ได้ • ห้ามเขย่ามือถือนะ!</span></div>
    <div id="sMsg" class="muted"></div>
    <button class="btn ok" id="sGo" style="width:100%;min-height:56px">▶ เริ่มนับ</button>`;
  box.appendChild(c); inAppWarn(c);
  let on = false, gx = 0, gy = 0, gz = 0, v = 0, phase = 0, pol = 0, t1 = 0, calm = 0, gotEvt = false;
  const T = 1.1, onMotion = e => {
    gotEvt = true;
    const ag = e.accelerationIncludingGravity, la = e.acceleration; if (!ag || ag.x == null) return;
    gx = gx*.9 + ag.x*.1; gy = gy*.9 + ag.y*.1; gz = gz*.9 + ag.z*.1;           // low-pass → gravity direction
    const gn = Math.hypot(gx,gy,gz) || 1;
    const lx = la && la.x != null ? la.x : ag.x - gx, ly = la && la.y != null ? la.y : ag.y - gy, lz = la && la.z != null ? la.z : ag.z - gz;
    v = v*.6 + ((lx*gx + ly*gy + lz*gz)/gn)*.4;                                 // smoothed vertical component
    const now = performance.now();
    if (phase && now - t1 > 6000){ phase = 0; }                                 // too slow → reset
    if (phase === 0){ if (now < calm) return; if (Math.abs(v) > T){ pol = Math.sign(v); phase = 1; t1 = now; } }
    else if (phase === 1){ if (v*pol < -T) phase = 2; }
    else if (phase === 2){ if (v*pol > T){
        if (now - t1 >= 900){ rep(); } phase = 0; calm = now + 450; } }
  };
  function rep(){
    const was = m.progress; m.progress += 1; bump('missionLog'); bump('squat'); save();
    $('sBig').textContent = Math.floor(m.progress); $('sGoal').textContent = doneLine(m);
    const p = $('sPet'); p.style.transform = 'translateY(-26px) scale(1.15)'; setTimeout(() => p.style.transform = '', 160);
    sfx(was < m.target && m.progress >= m.target ? 'done' : 'pop'); buzz(40);
  }
  $('sGo').onclick = async () => {
    if (on) return;
    try { if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission){
        const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') throw new Error('denied'); } }
    catch(e){ $('sMsg').textContent = 'ไม่ได้รับอนุญาตให้ใช้เซนเซอร์การเคลื่อนไหว — ใช้ "✍️ บันทึก" ในหน้าภารกิจแทนได้'; return; }
    on = true; window.addEventListener('devicemotion', onMotion);
    $('sGo').textContent = '⏺ กำลังนับ… (กด "จบ" ด้านบนเมื่อเสร็จ)'; $('sGo').disabled = true; $('sMsg').textContent = 'เริ่มลุกนั่งได้เลย!';
    setTimeout(() => { if (act && !gotEvt) $('sMsg').textContent = 'เครื่องนี้ไม่ส่งข้อมูลการเคลื่อนไหว — ใช้ "✍️ บันทึก" แทนได้'; }, 3000);
  };
  act.stops.push(() => window.removeEventListener('devicemotion', onMotion));
}

/* 🙆 NECK — yaw = (nose.x − eyeMid.x) / eyeDist ; pitch = (nose.y − eyeMid.y)/(chin.y − eyeMid.y) − neutral.
   Steps per round: one side → the other side → look up → look down, hold each 2 s. */
const MP_VER = '0.10.14';
let mpLandmarker = null;
async function loadFaceLandmarker(){
  if (mpLandmarker) return mpLandmarker;
  const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
  const files = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
  const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:d }, runningMode:'VIDEO', numFaces:1 });
  try { mpLandmarker = await vision.FaceLandmarker.createFromOptions(files, opts('GPU')); }
  catch(e){ mpLandmarker = await vision.FaceLandmarker.createFromOptions(files, opts('CPU')); }
  return mpLandmarker;
}
function actNeck(box, m){
  actHead(box, '🙆 บริหารต้นคอ', true);
  const c = document.createElement('div'); c.className = 'actc';
  c.innerHTML = `<div style="position:relative;width:260px;height:195px;border-radius:18px;overflow:hidden;background:#222">
      <video id="nVid" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1)"></video>

    <div id="nStep" style="font-size:22px;font-weight:700;text-align:center">มองตรงที่กล้อง</div>
    <div id="nGoal" class="muted">รอบที่ทำแล้ววันนี้ ${Math.floor(m.progress)} / ${m.target} • ${m.progress >= m.target ? '✅ ครบเป้าแล้ว' : 'ค้างท่าละ 2 วินาที'}</div>
    <div id="nMsg" class="muted" style="text-align:center"></div>
    <div class="muted" style="text-align:center;font-size:12px">🔒 ภาพจากกล้องประมวลผลในเครื่องเท่านั้น ไม่ถูกส่งหรือบันทึกที่ไหน</div>
    <button class="btn ok" id="nGo" style="width:100%;min-height:56px">📷 เปิดกล้องและเริ่ม</button>`;
  box.appendChild(c); inAppWarn(c);
  let stream = null, raf3 = 0, lastDet = 0, base = null, calib = [], step = 0, holdT0 = 0, sideSign = 0;
  const STEPS = ['side1','side2','up','down'], ARROW = { side1:'⬅️', side2:'➡️', up:'⬆️', down:'⬇️' };
  const LABEL = { side1:'หันหน้าไปด้านข้าง (ซ้ายก่อน)', side2:'หันไปอีกด้าน', up:'เงยหน้าขึ้น', down:'ก้มหน้าลง' };
  const setStep = () => { const s = STEPS[step]; $('nStep').textContent = LABEL[s]; $('nArrow').textContent = s==='side2' && sideSign ? (sideSign > 0 ? '⬅️' : '➡️') : ARROW[s]; holdT0 = 0; $('nRing').setAttribute('stroke-dashoffset', 264); };
  function onFace(L){
    const l = L[33], r = L[263], n = L[1], ch = L[152], mx = (l.x+r.x)/2, my = (l.y+r.y)/2, ed = Math.hypot(r.x-l.x, r.y-l.y) || .01;
    const yaw = (n.x - mx)/ed, pr = (n.y - my)/Math.max(.01, ch.y - my);
    if (!base){ calib.push([yaw, pr]); $('nStep').textContent = 'มองตรงที่กล้อง… กำลังจำท่าตรง';
      if (calib.length >= 10){ base = calib.reduce((a,b) => [a[0]+b[0]/calib.length, a[1]+b[1]/calib.length], [0,0]); setStep(); } return; }
    const dy = yaw - base[0], dp = pr - base[1], s = STEPS[step];
    let hit = false;
    if (s === 'side1'){ if (Math.abs(dy) > .25){ hit = true; if (!sideSign) sideSign = Math.sign(dy); } }
    else if (s === 'side2') hit = dy*sideSign < -.25;
    else if (s === 'up') hit = dp < -.06;
    else hit = dp > .07;
    const now = performance.now();
    if (!hit){ holdT0 = 0; $('nRing').setAttribute('stroke-dashoffset', 264); return; }
    if (!holdT0){ holdT0 = now; sfx('tick'); }
    const p = Math.min(1, (now - holdT0)/2000); $('nRing').setAttribute('stroke-dashoffset', 264*(1-p));
    if (p >= 1){
      step++; sfx('pop'); buzz(30);
      if (step >= STEPS.length){ step = 0; sideSign = 0; const was = m.progress; m.progress += 1; bump('missionLog'); save();
        $('nGoal').textContent = `รอบที่ทำแล้ววันนี้ ${Math.floor(m.progress)} / ${m.target} • ${m.progress >= m.target ? '✅ ครบเป้าแล้ว' : 'ค้างท่าละ 2 วินาที'}`;
        if (was < m.target && m.progress >= m.target) sfx('done'); $('nMsg').textContent = `ครบ 1 รอบ! 👏 เริ่มรอบถัดไป`; }
      setStep();
    }
  }
  $('nGo').onclick = async () => {
    $('nGo').disabled = true; $('nMsg').textContent = 'กำลังขอใช้กล้อง…';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name:'Unsupported' };
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:320}, height:{ideal:240} }, audio:false });
    } catch(e){
      const why = { NotAllowedError:'ไม่ได้อนุญาตให้ใช้กล้อง — ไปที่ ตั้งค่า › Safari › กล้อง › อนุญาต แล้วลองใหม่',
                    SecurityError:'ไม่ได้อนุญาตให้ใช้กล้อง — ไปที่ ตั้งค่า › Safari › กล้อง › อนุญาต แล้วลองใหม่',
                    NotFoundError:'ไม่พบกล้องหน้าในเครื่องนี้', OverconstrainedError:'ไม่พบกล้องหน้าในเครื่องนี้',
                    NotReadableError:'กล้องถูกแอปอื่นใช้อยู่ — ปิดแอปกล้อง/วิดีโอคอลแล้วลองใหม่',
                    Unsupported:'เบราว์เซอร์นี้ไม่รองรับกล้อง — เปิดเกมใน Safari' }[e && e.name] || ('เปิดกล้องไม่ได้ (' + ((e && e.name) || 'ไม่ทราบสาเหตุ') + ')');
      $('nMsg').textContent = why + (IN_APP ? ' • ตอนนี้เปิดในแอปอยู่ ลองเปิดใน Safari' : '') + ' — หรือใช้ "✍️ บันทึก" ในหน้าภารกิจแทนได้';
      $('nGo').disabled = false; return; }
    const v = $('nVid'); v.srcObject = stream; try { await v.play(); } catch(e){}
    $('nMsg').textContent = 'กำลังโหลดตัวจับใบหน้า… (ครั้งแรกประมาณ 5 MB)';
    let lm; try { lm = await loadFaceLandmarker(); } catch(e){ $('nMsg').textContent = 'โหลดตัวจับใบหน้าไม่สำเร็จ (ตรวจอินเทอร์เน็ต) — ใช้ "✍️ บันทึก" แทนได้'; return; }
    if (!act) return;
    $('nMsg').textContent = ''; $('nGo').style.display = 'none';
    const loop = now => { raf3 = requestAnimationFrame(loop); if (now - lastDet < 66 || v.readyState < 2) return; lastDet = now;
      try { const res = lm.detectForVideo(v, now); if (res.faceLandmarks && res.faceLandmarks[0]){ $('nMsg').textContent = ''; onFace(res.faceLandmarks[0]); }
            else { $('nMsg').textContent = '👀 ไม่เห็นใบหน้า — ถือมือถือให้หน้าอยู่ในกรอบ'; holdT0 = 0; } } catch(e){} };
    raf3 = requestAnimationFrame(loop);
  };
  act.stops.push(() => { cancelAnimationFrame(raf3); if (stream) stream.getTracks().forEach(t => t.stop()); });
}

/* =====================================================================
   SAVE MIGRATION → v0.9
   ===================================================================== */
function v09Migrate(){
  if ((S.econ || 1) < 2){                                     // prices ×20 → existing coins ×20 so nothing gets cheaper/dearer
    S.coins = (S.coins || 0) * ECON; S.econ = 2;
    if (S.farm) S.farm.zones.forEach(z => z.objs.forEach(o => { if (o.type === 'plot' && o.plant && !o.crop) o.crop = 'carrot'; }));
  }
  if (S.profile && S.missions && !S.missions.some(m => m.key === 'rest')) buildMissions();   // old walk/run missions → new set
  if (S.profile){ delete S.profile.act; delete S.profile.interests; }
}

/* =====================================================================
   🔔 MOVE BREAKS ("ขยับตัวหน่อย!") — v0.11.2
   Every `every` minutes of REAL time a short activity becomes available (max 2 waiting).
   If the game is open & idle on the main screen a popup + sound announces it; otherwise it
   waits for the player. Reward 50 coins + ❤️2, up to 6 per day ⚠️. Quiet hours 22:00–07:00.
   No server needed (lock-screen push would need Firebase Blaze + Cloud Functions).
   ===================================================================== */
const BRK = {
  squat:  { icon:'🏋️', label:'ลุกนั่ง 5 ครั้ง',      key:'squat',  unit:'ครั้ง', target:5 },
  neck:   { icon:'🙆', label:'บริหารคอ 1 รอบ',       key:'neck',   unit:'รอบ',  target:1 },
  rest:   { icon:'📵', label:'พักสายตา 2 นาที',       key:'rest',   unit:'นาที', target:2 },
  breath: { icon:'🫁', label:'หายใจลึก ๆ 1 นาที',     key:'breath', unit:'นาที', target:1 },
  water:  { icon:'💧', label:'ดื่มน้ำ 1 แก้ว',         key:'water',  unit:'แก้ว', target:1 }
};
const BRK_COIN = 25, BRK_MAX = 6;                          // ⚠️ v0.17: 💗 10 + 🪙 25 (was 🪙 50)
const brkCfg = () => (S.brkCfg = S.brkCfg || { on:true, every:60, quiet:true });
function brkState(){
  const b = S.brk = S.brk || { next: Date.now() + brkCfg().every*60000, pending:[], date:todayKey(), count:0 };
  if (b.date !== todayKey()){ b.date = todayKey(); b.count = 0; }
  return b;
}
const quietNow = () => { const h = new Date().getHours(); return brkCfg().quiet && (h >= 22 || h < 7); };
function brkNew(){ const ks = Object.keys(BRK), b = brkState(); let k;
  do { k = ks[(Math.random()*ks.length)|0]; } while (b.pending.includes(k) && b.pending.length < ks.length); return k; }
function brkTick(){
  if (!S || !S.pet || !S.farm) return;
  const b = brkState(), cfg = brkCfg(), now = Date.now();
  if ((curQuest()||{}).id === 'brk' && !b.pending.length) b.pending.push('squat');   // tutorial: first one right away
  if (!cfg.on || b.count + b.pending.length >= BRK_MAX){ if (now >= b.next) b.next = now + cfg.every*60000; return; }
  if (now < b.next) return;
  b.next = now + cfg.every*60000;                             // catches up after the app was closed (one per check)
  if (quietNow() || b.pending.length >= 2) return;
  b.pending.push(brkNew()); save(); markBrkNav();
  const idle = $('sMain').classList.contains('on') && !$('modal').classList.contains('on') && !act && document.visibilityState === 'visible';
  if (idle) brkPrompt(b.pending[b.pending.length-1]);
}
function markBrkNav(){ const n = document.querySelector('[data-t=tMission]'); if (n) n.classList.toggle('brk', !!(S.brk && S.brk.pending.length)); }
function brkPrompt(k){
  const d = BRK[k]; sfx('bark'); buzz([80,60,80]);
  sheet(`🔔 ขยับตัวหน่อย!\n${S.pet.name} ชวนทำ ${d.icon} ${d.label}\nได้ 🪙 ${BRK_COIN} + ❤️ 2`, [
    { label:'▶ ทำเลย', cls:'ok', fn:() => brkStart(k) },
    { label:'ไว้ทีหลัง (รออยู่ในหน้าภารกิจ)', cls:'ghost' } ]);
}
function brkStart(k){
  const d = BRK[k];
  if (k === 'water') return confirmDo('💧 ดื่มน้ำ 1 แก้วแล้วใช่ไหม?', () => brkDone(k));
  openAct({ ...d, brk:k, progress:0, sec:0 });
}
function brkDone(k){
  const b = brkState(), i = b.pending.indexOf(k); if (i < 0) return;
  b.pending.splice(i, 1); b.count++; S.coins += BRK_COIN; S.pet.heart = Math.min(100, S.pet.heart + 2); bump('brkDone');
  const got = gainLove(LOVE_PER_BRK);
  sfx('coin'); save(); refreshHeader(); markBrkNav(); renderMissions();
  reward(`👏 ขยับตัวแล้ว!\n${loveTxt(LOVE_PER_BRK, got)}\n🪙 ${BRK_COIN} เหรียญทอง • ❤️ +2\n(วันนี้ ${b.count}/${BRK_MAX} ครั้ง)`);
}
function brkSkip(k){ const b = brkState(), i = b.pending.indexOf(k); if (i >= 0) b.pending.splice(i, 1); save(); markBrkNav(); renderMissions(); }
function renderBrkCard(L){
  const b = brkState(), cfg = brkCfg(), c = document.createElement('div'); c.className = 'card';
  const nextIn = Math.max(0, (b.next - Date.now())/1000);
  c.innerHTML = `<div class="mrow"><b>🔔 ขยับตัวหน่อย!</b><span class="muted">วันนี้ ${b.count}/${BRK_MAX}</span></div>
    <div class="muted">${!cfg.on ? 'ปิดการเตือนอยู่ (เปิดได้ในกระเป๋า)' : b.count >= BRK_MAX ? 'ครบโควตาวันนี้แล้ว เก่งมาก!' : quietNow() ? 'ช่วงเวลาพักผ่อน (22:00–07:00) ไม่เตือน' : b.pending.length ? `ทำได้เลย • ครั้งละ 🪙 ${BRK_COIN} + ❤️ 2` : `กิจกรรมถัดไปใน ${fmt(nextIn)}`}</div>`;
  b.pending.forEach(k => { const d = BRK[k], r = document.createElement('div'); r.className = 'row'; r.style.marginTop = '8px';
    const go = document.createElement('button'); go.className = 'btn ok'; go.textContent = `${d.icon} ${d.label}`; go.onclick = () => brkStart(k);
    const sk = document.createElement('button'); sk.className = 'btn ghost'; sk.style.flex = '0 0 72px'; sk.textContent = 'ข้าม'; sk.onclick = () => confirmDo('ข้ามกิจกรรมนี้?\n(ไม่ได้รางวัล ไม่เสียอะไร)', () => brkSkip(k));
    r.append(go, sk); c.appendChild(r);
    if (k !== 'water'){ const m = document.createElement('button'); m.className = 'btn ghost'; m.style.cssText = 'width:100%;margin-top:6px;min-height:40px;font-size:13px';
      m.textContent = '✍️ ทำแล้ว (เครื่องนับให้ไม่ได้)'; m.onclick = () => confirmDo(`ทำ ${d.label} แล้วใช่ไหม?`, () => brkDone(k)); c.appendChild(m); } });
  L.appendChild(c);
}
function renderBrkSettings(L){
  const cfg = brkCfg(), c = document.createElement('div'); c.className = 'card';
  c.innerHTML = '<b>🔔 เตือนขยับตัว</b><div class="muted">เตือนให้ทำกิจกรรมสั้น ๆ ระหว่างวัน (ตอนเปิดเกม / รอไว้ตอนกลับมา)</div>';
  const row = document.createElement('div'); row.className = 'row'; row.style.cssText = 'margin-top:8px;flex-wrap:wrap;gap:6px';
  const chip = (txt, on, fn) => { const b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : ''); b.textContent = txt; b.onclick = fn; row.appendChild(b); };
  chip(cfg.on ? '✅ เปิด' : '⛔ ปิด', cfg.on, () => { cfg.on = !cfg.on; save(); renderBag(); });
  for (const m of [30,60,90]) chip(`ทุก ${m} นาที`, cfg.every === m, () => { cfg.every = m; brkState().next = Date.now() + m*60000; save(); renderBag(); });
  chip(cfg.quiet ? '🌙 ไม่เตือน 22–07 น.' : '🌙 เตือนตลอด', cfg.quiet, () => { cfg.quiet = !cfg.quiet; save(); renderBag(); });
  c.appendChild(row); L.appendChild(c);
}
/* 🫁 breathing: circle grows 4 s (breathe in) / shrinks 4 s (breathe out); counts visible time only */
function actBreath(box, m){
  actHead(box, '🫁 หายใจลึก ๆ', true);
  const c = document.createElement('div'); c.className = 'actc'; c.style.justifyContent = 'center';
  c.innerHTML = `<div id="bCirc" style="width:120px;height:120px;border-radius:50%;background:radial-gradient(#bfe6ff,#6fb7e6);transition:transform 4s ease-in-out;box-shadow:0 0 40px #6fb7e688"></div>
    <div id="bTxt" style="font-size:26px;font-weight:700;margin-top:30px">หายใจเข้า…</div><div id="bTime" class="muted">0 / 60 วินาที</div>`;
  box.appendChild(c);
  let inhale = true, last = performance.now();
  const flip = () => { inhale = !inhale; $('bCirc').style.transform = inhale ? 'scale(1.9)' : 'scale(1)'; $('bTxt').textContent = inhale ? 'หายใจเข้า…' : 'หายใจออก…'; };
  setTimeout(() => $('bCirc').style.transform = 'scale(1.9)', 50);
  const br = setInterval(flip, 4000);
  const tk = setInterval(() => { const now = performance.now(), d = Math.min(1.5, (now-last)/1000); last = now;
    if (document.visibilityState !== 'visible') return;
    m.sec += d; m.progress = m.sec/60; $('bTime').textContent = `${Math.min(60, Math.floor(m.sec))} / 60 วินาที`;
    if (m.progress >= m.target){ sfx('done'); closeAct(); } }, 1000);
  act.stops.push(() => { clearInterval(br); clearInterval(tk); });
}

/* =====================================================================
   v0.14 — LONG-PRESS LIFT & DRAG (1 s). The held object becomes a translucent ghost that
   follows the finger (lifted 40 px above it so the finger never hides the target tile).
   Drop on the map → move there (invalid spot → snaps back). Drop zones appear while lifting:
     📦 store (back to storage / furniture back to the bag)
     🗑️ trash  (delete; refunds ⌊cost/2⌋ of each material — confirm first)
   Homes can only be moved. Rotation: tap the object → 🔄 หมุน.
   ===================================================================== */
let lift = null;                                              // { room:bool, home:bool }
function dzHot(el, x, y){ const r = el.getBoundingClientRect(); return x >= r.left-10 && x <= r.right+10 && y >= r.top-10 && y <= r.bottom+10; }
function showDrop(on, opts){
  const bar = $('dropBar'); bar.style.display = on ? 'flex' : 'none'; $('toolFab').style.visibility = on ? 'hidden' : '';   // 🧰 would cover the trash zone
  if (!on) return;
  $('dropStore').querySelector('small').textContent = opts.room ? 'เก็บกลับกระเป๋า' : 'เก็บเข้าคลัง';
  $('dropTrash').style.display = opts.room ? 'none' : '';
  $('dropStore').classList.toggle('off', !!opts.home); $('dropTrash').classList.toggle('off', !!opts.home);
}
function liftStartFarm(z, o){
  const lifted = { ...o }; removeObj(z, o);
  startPlacing(o.type, { w:o.w, h:o.h, move:{ z, o:lifted, gc:z.cx*GRID+o.c, gr:z.cy*GRID+o.r } });
  $('placeBar').style.display = 'none'; lift = { room:false, home:isHome(o.type) }; showDrop(true, lift);
  sfx('pop'); buzz(30);
}
function liftStartRoom(it){
  const R = inRoom.o.room; R.items.splice(R.items.indexOf(it), 1); startRoomPlace(it.type, it);
  $('placeBar').style.display = 'none'; lift = { room:true, home:false }; showDrop(true, lift);
  sfx('pop'); buzz(30);
}
function liftMove(e){
  const b = cv.getBoundingClientRect(), sx = e.clientX - b.left, sy = e.clientY - b.top - 40;
  const hs = dzHot($('dropStore'), e.clientX, e.clientY) && !lift.home, ht = !lift.room && dzHot($('dropTrash'), e.clientX, e.clientY) && !lift.home;
  $('dropStore').classList.toggle('hot', hs); $('dropTrash').classList.toggle('hot', ht);
  if (hs || ht) return;
  const g = pick(sx, sy);
  if (lift.room){ const p = roomPlace; roomPlaceAt(g.c - ((p.w-1)>>1), g.r - ((p.h-1)>>1)); }
  else { const p = placing; placeAt(g.c - ((p.w-1)>>1), g.r - ((p.h-1)>>1)); $('placeBar').style.display = 'none'; }
}
function liftDrop(){
  const L = lift; lift = null;
  const toStore = $('dropStore').classList.contains('hot'), toTrash = $('dropTrash').classList.contains('hot');
  $('dropStore').classList.remove('hot'); $('dropTrash').classList.remove('hot'); showDrop(false);
  if (L.room){
    if (toStore){ const it = roomPlace.move; roomPlace.move = null; endRoomPlace(false); S.furn[it.type] = (S.furn[it.type]||0) + 1; sfx('pop'); save(); return; }
    if (roomPlace.valid){ commitRoomPlace(); sfx('pop'); } else endRoomPlace();
    return;
  }
  const type = placing.type, it = FARM_ITEMS[type];
  if (toStore){
    const m = placing.move; placing.move = null; endPlacing();
    S.store = S.store || {}; S.store[type] = (S.store[type]||0) + 1; bump('moveStore'); bump('dragStore'); sfx('pop'); save(); renderShop();
    return reward(`📦 เก็บ ${it.name} เข้าคลังแล้ว\nนำออกมาวางใหม่ได้ฟรีที่ ร้านค้า › ฟาร์ม › 📦 คลังของฉัน` + (m.o.plant ? '\n(ผักที่ปลูกอยู่หายไป)' : ''));
  }
  if (toTrash){
    const back = Object.fromEntries(Object.entries(it.cost).map(([k,v]) => [k, Math.floor(v/2)]).filter(([,v]) => v > 0));
    return sheet(`🗑️ ลบ ${it.name} ทิ้ง?\nลบแล้วย้อนกลับไม่ได้\nได้วัตถุดิบคืนครึ่งหนึ่ง: ${Object.keys(back).length ? Object.entries(back).map(([k,v]) => `${MAT[k]} ${v}`).join(', ') : '—'}`, [
      { label:'🗑️ ลบทิ้ง', cls:'ok', fn:() => { placing.move = null; endPlacing(); Object.entries(back).forEach(([k,v]) => invAdd(k, v)); bump('trash'); sfx('chop'); save(); renderMats();
          reward(`🗑️ ลบ ${it.name} แล้ว` + (Object.keys(back).length ? '\nได้คืน ' + Object.entries(back).map(([k,v]) => `${MAT[k]} +${v}`).join(', ') : '')); } },
      { label:'ยกเลิก (วางกลับที่เดิม)', cls:'ghost', fn:() => endPlacing() } ]);
  }
  if (placing.valid){ bump('dragMove'); $('pOk').onclick(); sfx('pop'); } else endPlacing();   // invalid spot → back where it was
}
/* long-press progress ring under the finger (HUD, both 2D and 3D) */
function drawHoldRing(){
  if (!drag || drag.moved || drag.long || drag.tool || !drag.t0 || placing || fishing || paint) return;
  const p = (performance.now() - drag.t0) / LONG_MS; if (p < .15 || p > 1) return;
  const b = cv.getBoundingClientRect(), x = drag.x - b.left, y = drag.y - b.top - 46;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#e0892f'; ctx.beginPath(); ctx.arc(x, y, 18, -Math.PI/2, -Math.PI/2 + p*Math.PI*2); ctx.stroke();
}
/* 🔄 rotate in place (tap menu) — keeps the same anchor; refuses if the turned footprint doesn't fit */
function rotateObj(z, o){
  const lifted = { ...o }; removeObj(z, o);
  const p = { gc:z.cx*GRID+o.c, gr:z.cy*GRID+o.r, w:o.h, h:o.w }, fz = footprintZone(p);
  const n = addObj(fz ? fz.z : z, o.type, fz ? fz.lc : lifted.c, fz ? fz.lr : lifted.r, fz ? p.w : lifted.w, fz ? p.h : lifted.h, true);
  n.plant = lifted.plant; n.crop = lifted.crop; n.pj = lifted.pj; n.room = lifted.room; save();
  if (!fz) sheet('หมุนตรงนี้ไม่ได้ — พื้นที่ไม่พอ ลองย้ายไปที่โล่งก่อนนะครับ', OK); else sfx('pop');
}
function roomItemMenu(it){
  const R = inRoom.o.room;
  sheet(`${FURN[it.type].name}\n💡 กดค้าง 1 วินาทีแล้วลากเพื่อย้าย หรือลากไป 📦 เพื่อเก็บกลับกระเป๋า`, [
    ...(it.w !== it.h ? [{ label:'🔄 หมุน', cls:'ok', fn:() => { R.items.splice(R.items.indexOf(it), 1); const w = it.w; it.w = it.h; it.h = w;
        startRoomPlace(it.type, it); if (roomPlace.valid) commitRoomPlace(); else { endRoomPlace(false); it.h = it.w; it.w = w; R.items.push(it); sheet('หมุนตรงนี้ไม่ได้ — ชนของชิ้นอื่นหรือออกนอกห้อง', OK); } } }] : []),
    { label:'ปิด', cls:'ghost' } ]);
}

/* ---- 🧊 3D renderer (v0.16: 3D only). The old 2D renderer stays ONLY as an emergency fallback
   for devices without WebGL (a notice tells the player); it is no longer maintained for new features. ---- */
const want3D = () => true;
const gfxEco = () => store.get('pensuk_gfx') === 'eco';            // ⚙️ per-device quality: 'eco' | default high
let r3dLoading = false, r3dFailNote = false;
function load3D(){
  if (R3D){ R3D.on = true; return; }
  if (r3dLoading) return; r3dLoading = true;
  import('./r3d.js').then(m => { R3D = m.start(); R3D.on = true; R3D.setQuality(gfxEco()); invalidateAll(); })
    .catch(e => { console.log('3D unavailable', e); r3dLoading = false;
      if (!r3dFailNote){ r3dFailNote = true; sheet('เครื่องนี้แสดงกราฟิก 3D ไม่ได้ 😢\nตอนนี้ใช้ภาพแบบสำรองไปก่อน\n\nลองเปิดเกมใน Safari หรือ Chrome โดยตรง (ไม่ใช่ในแอป LINE/Facebook) หรือรีสตาร์ตเบราว์เซอร์', OK); } });
}
function setGfx(eco){ store.set('pensuk_gfx', eco ? 'eco' : 'high'); if (R3D) R3D.setQuality(eco); renderBag(); }

/* ---- boot ---- */
autoLogin();
initFirebase();
</script>
