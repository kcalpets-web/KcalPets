<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>เป็นสุข</title>
<!-- home-screen name & icon (iOS + Android). Files live next to this page on GitHub Pages -->
<meta name="apple-mobile-web-app-title" content="เป็นสุข">
<meta name="application-name" content="เป็นสุข">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff7ea">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- three.js is self-hosted in ./lib (no CDN); the 3D renderer r3d.js is loaded on demand -->
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/" } }</script>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ea;--card:#ffffff;--ink:#3b2a1a;--sub:#8a7560;--pri:#e0892f;--pri2:#c96f17;--ok:#4caf6a;--line:#f0e0c8;--gold:#f2b705}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Mali',system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
h1{margin:0;font-size:28px}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:600 17px 'Mali';padding:0 18px;cursor:pointer}
.btn:active{background:var(--pri2)}
.btn.ghost{background:#fff;color:var(--pri2);border:2px solid var(--pri)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
input,select{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font:16px 'Mali';background:#fff;color:var(--ink)}
.pad{padding:16px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px}
.muted{color:var(--sub);font-size:14px}
.err{color:#c0392b;font-size:14px;min-height:18px}
/* ---------- chat ---------- */
#chatLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:16px;white-space:pre-line}
.bot{background:#fff;border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--pri);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.botrow{display:flex;gap:6px;align-items:flex-end}
.ava{width:36px;height:36px;flex:none}
#chatIn{padding:10px;border:2px solid var(--pri);border-radius:16px;background:#fff;display:flex;flex-direction:column;gap:8px;margin:2px 0 6px 42px;box-shadow:0 3px 10px #e0892f22}
#chatIn:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--pri);background:#fff;color:var(--pri2);font:600 16px 'Mali'}
.chip.sel{background:var(--pri);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:2px solid var(--line);gap:8px}
.ico{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em;background:url(icons/atlas.webp?v=0.18.0) no-repeat;background-size:10.4em 7.8em;
  background-position:calc(var(--x)*-1.3em) calc(var(--y)*-1.3em)}                 /* clay icon atlas (8×5 cells), see tools/icons.html */
#nav button b .ico{width:1.25em;height:1.25em;background-size:10em 7.5em;background-position:calc(var(--x)*-1.25em) calc(var(--y)*-1.25em);vertical-align:-.15em}
.coin{display:flex;align-items:center;gap:6px;font-weight:700;background:#fff4cc;border-radius:20px;padding:4px 12px}
.coin i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe680,var(--gold) 60%,#b88600);display:inline-block}
/* ---------- cards ---------- */
.scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:12px;background:#f3e6d3;border-radius:6px;overflow:hidden;margin:8px 0}
.bar b{display:block;height:100%;background:var(--ok);width:0}
input[type=range]{min-height:36px;border:0;padding:0;accent-color:var(--pri)}
/* ---------- pets ---------- */
.petgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.petc{background:#fff;border:3px solid var(--line);border-radius:16px;min-height:120px;font-size:44px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.petc span{font-size:14px;color:var(--ink)}
.petc canvas{width:96px;height:84px}
.petc.sel{border-color:var(--pri);background:#fff1df}
/* ---------- farm / nav ---------- */
#farmWrap{flex:1;position:relative;min-height:0}
#farm3d{position:absolute;inset:0;width:100%;height:100%;display:block}
#farm.see3d{background:transparent!important}
#farm{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:linear-gradient(#9fd8f7,#cfeefc 35%,#e6f6d6 75%)}
/* v0.10 tilt-shift: blur the top & bottom of the view (miniature photo look); pointer-events off */
.ts{position:absolute;left:0;right:0;pointer-events:none;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
.tsT{top:0;height:24%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tsB{bottom:0;height:20%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(40,25,10,.22))}
#mats{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
#mats div{background:#ffffffd9;border-radius:12px;padding:2px 10px;font-size:14px;font-weight:600}
#zoneBar{position:absolute;left:8px;right:8px;bottom:30px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#placeBar{position:absolute;left:8px;right:8px;bottom:28px;display:none;flex-direction:column;gap:8px;background:#ffffffee;border-radius:16px;padding:10px;box-shadow:0 4px 16px #0002}
#placeBar b{font-size:14px;text-align:center}
#fishBar{position:absolute;left:8px;right:8px;bottom:28px;display:none;flex-direction:column;gap:8px;background:#ffffffee;border-radius:16px;padding:10px;box-shadow:0 4px 16px #0002}
#fishBar b{font-size:15px;text-align:center}
#fBtn.bite{animation:pulse .35s infinite;background:#e63946}
#zLabel{cursor:pointer}
#roomBar{position:absolute;left:8px;right:8px;bottom:28px;display:none;gap:6px}
#roomBar .btn{flex:1;padding:0 6px;font-size:15px}
#roomTitle{position:absolute;left:8px;right:8px;top:8px;display:none;text-align:center;font-weight:700;color:#fff;background:#0004;border-radius:14px;padding:6px 10px}
#zoneBar b{background:#ffffffd9;border-radius:14px;padding:6px 12px;font-size:15px}
#zoneBar .btn{min-width:64px;background:#ffffffe6}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:var(--sub)}
nav{display:flex;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;border:0;background:none;font:600 13px 'Mali';color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button b{font-size:22px}
nav button.on{color:var(--pri2)}
#tut{position:absolute;left:8px;right:8px;top:44px;display:none;gap:8px;align-items:center;background:#fffdf7f0;border:2px solid var(--pri);border-radius:16px;padding:8px 10px;box-shadow:0 4px 14px #0002}
#tut svg{width:44px;height:44px;flex:none}
#tut{cursor:pointer} #tut.done{border-color:var(--ok);background:#f1fbf3f2;animation:glow 1.2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #4caf6a66}50%{box-shadow:0 0 0 8px #4caf6a22}}
#tut.mini #tutText{display:none} #tut.mini svg{width:30px;height:30px}
#tutStep{font-size:13px;color:var(--pri2)} #tutText{font-size:15px;line-height:1.35}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
nav button.pulse b{animation:pulse 1s infinite} nav button.pulse{color:var(--pri2)}
.tutGlow{border-color:var(--pri)!important;box-shadow:0 0 0 4px #e0892f44}
.tab{display:none;flex:1;flex-direction:column;min-height:0}
.tab.on{display:flex}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.on{display:flex}
#mbox{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#mbody{font-size:17px;line-height:1.5;white-space:pre-line}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}   /* 🃏 v0.17.2 card grid: 2 cols on phones, 3+ on tablets */
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 6px;font:inherit;color:var(--ink);text-align:center;box-shadow:0 2px 6px #0000000d;min-height:44px}
.gcard b{font-size:14px;line-height:1.25}.gcard small{font-size:11.5px;color:var(--sub);line-height:1.35}
.gcard .pr{margin-top:4px;background:var(--pri);color:#fff;border-radius:12px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.gcard.dim{opacity:.55}.gcard .lk{font-size:12px;color:var(--sub)}.gcard .dot{position:absolute;top:9px;left:9px;width:10px;height:10px;border-radius:50%;background:#e8735a}
.gcard .cnt{position:absolute;top:6px;right:8px;font-style:normal;font-weight:700;font-size:13px;background:#fff4cc;border-radius:10px;padding:0 7px}
.gcard.sel{border-color:var(--pri);background:#fff1df;box-shadow:0 0 0 3px #e0892f55}.gcard .ok{color:#2e7d32}.gcard .no{color:#c0392b}
.bico{display:inline-block;background-repeat:no-repeat;flex:none}.dico{text-align:center;margin-bottom:4px}
#seedBar{position:absolute;left:8px;right:8px;bottom:118px;display:none;gap:6px;overflow-x:auto;background:#ffffffee;border-radius:16px;padding:6px;box-shadow:0 4px 16px #0002}
#seedBar .gcard{flex:0 0 80px;padding:6px 4px}#seedBar .gcard b{font-size:12px}
.ws{white-space:normal;margin-top:10px;font-size:15px;max-height:52vh;overflow-y:auto}.ws .card{margin:8px 0}.ws .wst{background:#fff7e6}.ws .wst .btn{width:100%;margin-top:8px}
.needs{margin-top:10px;white-space:normal;font-size:15px}
.needs .nd{display:flex;align-items:center;gap:8px;margin:6px 0}.needs .nd span{flex:0 0 92px}.needs .nd em{flex:0 0 30px;text-align:right;font-style:normal;font-weight:700}
.needs .nd i{flex:1;height:12px;border-radius:8px;background:#0001;overflow:hidden}.needs .nd b{display:block;height:100%;border-radius:8px}
.needs .sk{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.needs .sk span{font-size:12px;padding:2px 8px;border-radius:10px;background:#0000000d;color:#888}.needs .sk span.on{background:#e6f4e2;color:#2e7d32}
.mbtns{display:flex;flex-direction:column;gap:8px}
#mbox{max-height:88vh;overflow-y:auto}
#dropBar{position:absolute;left:10px;right:10px;bottom:24px;display:none;justify-content:space-between;pointer-events:none;z-index:3}
.dz{width:96px;height:84px;border-radius:22px;background:#ffffffee;box-shadow:0 4px 16px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;border:3px dashed #e0892f;transition:transform .12s}
.dz small{font:600 11px 'Mali';color:#7a5a3a;text-align:center;line-height:1.2}
.dz.hot{transform:scale(1.18);background:#fff1df;border-style:solid} #dropTrash.hot{border-color:#e63946;background:#ffe9ea}
.dz.off{opacity:.35;filter:grayscale(1)}
#nav button.brk::after{content:'🔔';position:absolute;top:2px;right:18%;font-size:14px;animation:pulse 1s infinite}
#nav button{position:relative}
.mute{border:0;background:none;font-size:20px;min-width:40px;min-height:40px;padding:0}
#evFab{position:absolute;left:10px;bottom:96px;width:54px;height:54px;border-radius:50%;border:3px solid #e86f8a;background:#fff5f7;font-size:26px;box-shadow:0 4px 12px #0003;display:none}
#evFab.pulse{animation:pulse 1s infinite}
#toolFab{position:absolute;right:10px;bottom:96px;width:58px;height:58px;border-radius:50%;border:3px solid var(--pri);background:#fff;font-size:28px;box-shadow:0 4px 12px #0003}
#toolFab.on{background:var(--pri);color:#fff} #toolFab.pulse{animation:pulse 1s infinite}
#toolBar{position:absolute;left:8px;right:8px;bottom:28px;display:none;gap:4px;background:#ffffffee;border-radius:18px;padding:8px;box-shadow:0 4px 16px #0002}
#toolBar .tb{flex:1;min-width:0;min-height:64px;border:2px solid var(--line);border-radius:14px;background:#fff;font:600 13px 'Mali';color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#toolBar .tb b{font-size:26px} #toolBar .tb.on{border-color:var(--pri);background:#fff1df;box-shadow:0 0 0 3px #e0892f55} #toolBar .tb.x{flex:.6;color:var(--sub)}
#act{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:var(--bg);max-width:480px;margin:0 auto}
#act.dark{background:#0b0d12}
.actc{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;overflow-y:auto}
</style>
</head>
<body>
<div id="app">

<!-- ===== 1. LOGIN / REGISTER ===== -->
<section class="screen on" id="sLogin">
  <div class="center">
    <div style="text-align:center"><svg class="ava" style="width:110px;height:110px" viewBox="0 0 64 64" id="bigBeagle"></svg></div>
    <h1 style="text-align:center">เป็นสุข</h1>
    <div class="muted" style="text-align:center">ดูแลสุขภาพไปพร้อมกับเพื่อนสี่ขา</div>
    <input id="lUser" placeholder="ชื่อผู้ใช้" autocomplete="username">
    <input id="lPass" type="password" placeholder="รหัสผ่าน (อย่างน้อย 4 ตัว)" autocomplete="current-password">
    <div class="err" id="lErr"></div>
    <button class="btn" id="bLogin">เข้าสู่เกม</button>
    <button class="btn ghost" id="bReg">สมัครสมาชิกใหม่</button>
    <button class="btn" id="bGoogle" style="display:none;background:#fff;color:#3c4043;border:2px solid #dadce0">
      <span style="font-weight:700;color:#4285f4">G</span>&nbsp; เข้าสู่ระบบด้วย Google</button>
    <button class="btn ghost" id="bImport">📲 มีโค้ดย้ายเครื่อง</button>
    <div class="muted" style="text-align:center" id="lNote">บัญชีแบบชื่อผู้ใช้เก็บไว้ในเครื่องนี้ • ย้ายเครื่องได้ด้วย "โค้ดย้ายเครื่อง" ในหน้ากระเป๋า</div>
    <div class="muted" style="text-align:center;font-size:12px;opacity:.7;margin-top:6px" id="lVer"></div>
  </div>
</section>

<!-- ===== 2. CHAT WITH เป็นสุข ===== -->
<section class="screen" id="sChat">
  <div class="top"><b>💬 คุยกับเป็นสุข</b><span class="muted" id="chatStep"></span></div>
  <div id="chatLog"></div>
  <div id="chatIn"></div>
</section>

<!-- ===== 2-3. GOAL REVIEW (±20%) ===== -->
<section class="screen" id="sGoal">
  <div class="top"><b>🎯 เป้าหมายรายวันของคุณ</b></div>
  <div class="scroll" id="goalList"></div>
  <div class="pad"><button class="btn ok" style="width:100%" id="bGoalOk">ยืนยันเป้าหมาย</button></div>
</section>

<!-- ===== 5. PET SELECT ===== -->
<section class="screen" id="sPet">
  <div class="top"><b>🐾 เลือกน้องที่จะดูแล</b></div>
  <div class="scroll">
    <div class="petgrid" id="petGrid"></div>
    <button class="btn ghost" id="bRand">🎲 สุ่มให้หน่อย</button>
    <input id="petName" maxlength="12" placeholder="ตั้งชื่อน้อง (ไม่เกิน 12 ตัวอักษร)">
    <div class="err" id="petErr"></div>
  </div>
  <div class="pad"><button class="btn ok" style="width:100%" id="bPetOk">รับน้องมาเลี้ยง</button></div>
</section>

<!-- ===== MAIN (farm / missions / shop / bag) ===== -->
<section class="screen" id="sMain">
  <div class="top">
    <div><b id="hName"></b><div class="muted" id="hPet"></div></div>
    <div style="display:flex;align-items:center;gap:4px"><button id="bMute" class="mute" aria-label="เปิด/ปิดเสียง">🔊</button><div class="coin">🪙 <span id="hCoin">0</span></div></div>
  </div>

  <div class="tab on" id="tFarm">
    <div id="farmWrap">
      <canvas id="farm"></canvas>
      <div class="ts tsT"></div><div class="ts tsB"></div><div class="vig"></div>
      <div id="mats"></div>
      <div id="tut"><svg viewBox="0 0 64 64" id="tutAva"></svg><div style="flex:1"><b id="tutStep"></b><div id="tutText"></div><div class="bar" style="height:6px;margin:5px 0 0"><b id="tutProg"></b></div></div></div>
      <div id="zoneBar"><button class="btn ghost" id="zPrev" aria-label="ซูมออก">－</button><b id="zLabel"></b><button class="btn ghost" id="zNext" aria-label="ซูมเข้า">＋</button></div>
      <div id="fishBar"><b id="fInfo"></b><div class="row"><button class="btn" id="fBtn" style="flex:2;min-height:56px;font-size:20px">🎣 เหวี่ยงเบ็ด</button><button class="btn ghost" id="fCancel">เลิกตก</button></div></div>
      <div id="placeBar"><b id="pInfo"></b><div class="row"><button class="btn ghost" id="pRot">⟲ หมุน</button><button class="btn ok" id="pOk">✔ วาง</button><button class="btn ghost" id="pCancel">✕ ยกเลิก</button></div></div>
      <div id="roomTitle"></div>
      <div id="roomBar"><button class="btn" id="rFurn">🛋 ของตกแต่ง</button><button class="btn ghost" id="rStyle">🎨 ผนัง/พื้น</button><button class="btn ghost" id="rExit">🚪 ออกจากบ้าน</button></div>
      <button id="toolFab" aria-label="เครื่องมือ">🧰</button>
      <button id="evFab" aria-label="อีเวนต์">🏮</button>
      <div id="toolBar"></div>
      <div id="seedBar"></div>
      <div id="dropBar"><div id="dropStore" class="dz">📦<small>เก็บเข้าคลัง</small></div><div id="dropTrash" class="dz">🗑️<small>ลบทิ้ง<br>คืนครึ่งหนึ่ง</small></div></div>
      <div id="hint">แตะ 🧰 เลือกเครื่องมือ แล้วลากนิ้วเก็บหญ้า/หิน/ต้นไม้</div>
    </div>
  </div>
  <div class="tab" id="tMission"><div class="scroll" id="missionList"></div></div>
  <div class="tab" id="tShop"><div class="scroll" id="shopList"></div></div>
  <div class="tab" id="tQuest"><div class="scroll" id="questList"></div></div>
  <div class="tab" id="tBag"><div class="scroll" id="bagList"></div></div>

  <nav id="nav">
    <button data-t="tFarm" class="on"><b>🏡</b>ฟาร์ม</button>
    <button data-t="tMission"><b>🎯</b>ภารกิจ</button>
    <button data-t="tShop"><b>🛒</b>ร้านค้า</button>
    <button data-t="tQuest"><b>📜</b>เควส</button>
    <button data-t="tBag"><b>🎒</b>กระเป๋า</button>
  </nav>
</section>
</div>

<!-- full-screen mission activity (rest / squats / neck) -->
<div id="act"></div>

<!-- shared confirm / reward sheet -->
<div id="modal"><div id="mbox"><div id="mbody"></div><div class="mbtns" id="mbtns"></div></div></div>

<script>
'use strict';
/* =====================================================================
   เป็นสุข — Prototype v0.1
   Flow: Login → Chat (onboarding) → Goal (±20%) → Pet → Farm/Missions/Shop
   ===================================================================== */

/* ---------------- Safe storage (sandbox may block localStorage) ---------------- */
const mem = {};
const store = {

/* =====================================================================
   PLAYER LEVEL  — Exp from actions, Lv N needs N×50 Exp (bar resets), max Lv20
   FARM ZONES    — each zone is a full 5×5 farm; Lv N unlocks zone N (max MAX_ZONES)
   PET GROWTH    — pet Exp from feeding/missions, Lv N needs N×30, max Lv20
                   stage changes every 5 Lv (size scales up)
   ===================================================================== */
const MAX_LV = 50, MAX_PET_LV = 20;
const EXP = { build:10, harvest:5, mission:20, feed:3 };   // clearing Exp depends on size (SIZE_EXP)
const MAX_ZONES = 50;                                        // Lv N → N zones, up to Lv.50
const PET_STAGES = [ {lv:1, name:'ร่างที่ 1 · วัยเบบี๋',   scale:.78, form:0},     // 3 evolution forms
                     {lv:8, name:'ร่างที่ 2 · วัยรุ่น',    scale:.98, form:1},
                     {lv:15,name:'ร่างที่ 3 · โตเต็มวัย',  scale:1.15,form:2} ];
const needExp = lv => lv*50, needPetExp = lv => lv*30;
const zonesFor = lv => Math.min(MAX_ZONES, lv);
const petStage = lv => PET_STAGES.reduce((s,u) => lv>=u.lv ? u : s, PET_STAGES[0]);

function gainExp(n){
  if (S.lv >= MAX_LV) return;
  S.exp += n; const msgs = [];
  while (S.lv < MAX_LV && S.exp >= needExp(S.lv)){
    S.exp -= needExp(S.lv); const before = zonesFor(S.lv); S.lv++;
    msgs.push(`⭐ เลื่อนเป็น Lv.${S.lv}`);
    if (zonesFor(S.lv) > before){ msgs.push(`🔓 ปลดล็อกฟาร์มแปลงที่ ${zonesFor(S.lv)} (5×5) แล้ว!`); if (S.farm) ensureZones(); }
  }
  if (S.lv >= MAX_LV) S.exp = 0;
  if (msgs.length) queueReward(msgs.join('\n'));
}
function gainPetExp(n){
  const p = S.pet; if (p.lv >= MAX_PET_LV) return;
  p.pexp += n; const msgs = [];
  while (p.lv < MAX_PET_LV && p.pexp >= needPetExp(p.lv)){
    p.pexp -= needPetExp(p.lv); const st = petStage(p.lv).name; p.lv++;
    msgs.push(`${p.emoji} ${p.name} เลื่อนเป็น Lv.${p.lv}`);
    if (petStage(p.lv).name !== st){ msgs.push(`✨ ${p.name} พัฒนาร่างเป็น "${petStage(p.lv).name}" แล้ว!`); pet.evolve = 2.5; }
  }
  if (p.lv >= MAX_PET_LV) p.pexp = 0;
  if (msgs.length) queueReward(msgs.join('\n'));
}
/* =====================================================================
   💗 PET CARE (v0.17) — "your health grows your pet"
   • 💗 พลังใจ (S.love) comes ONLY from real health actions (missions, move breaks, 3-a-day bonus);
     it cannot be bought with coins. Spending it levels the pet: Lv N → N+1 costs needPetExp(N) = N×30 💗.
   • Evolution needs a streak too: Lv.8 (ร่าง 2) needs a best streak ≥ 3 days, Lv.15 (ร่าง 3) ≥ 7 days.
   • 3 needs decay with real time (no timers kept running — evaluated on read):
         value(t) = clamp(v0 − 100·Δhours / H, 0, 100)      H: food 24 h, bath 48 h, play 24 h ⚠️
     All three ≥ 60 → every 💗 earned ×1.5 (care bonus).
   • Never punishing: low needs only make the pet sleepy / waiting — no sickness, no loss.
   ===================================================================== */
const LOVE_PER_MISSION = 30, LOVE_ALL_BONUS = 20, LOVE_PER_BRK = 10, CARE_OK = 60, CARE_MULT = 1.5;   // ⚠️
const NEED = { food:{ e:'🍖', name:'อิ่ม',  hrs:24 }, bath:{ e:'🛁', name:'สะอาด', hrs:48 }, play:{ e:'🎾', name:'สนุก', hrs:24 } };
function needVal(k){ const n = S.pet.need && S.pet.need[k]; if (!n) return 50;     // never cared yet → half (no free care bonus)
  return Math.max(0, Math.min(100, n.v - (Date.now() - n.t)/3.6e6 * 100/NEED[k].hrs)); }
function needSet(k, v){ S.pet.need = S.pet.need || {}; S.pet.need[k] = { v:Math.max(0, Math.min(100, v)), t:Date.now() }; }
const careFull = () => Object.keys(NEED).every(k => needVal(k) >= CARE_OK);
const careAvg  = () => Object.keys(NEED).reduce((a,k) => a + needVal(k), 0) / 3;
const petMood  = () => { const a = careAvg(); return a >= 70 ? '😊' : a >= 35 ? '🙂' : '😴'; };
/** add 💗 from a health action; returns the amount actually given (after the care bonus) */
function gainLove(n){ const got = Math.round(n * (careFull() ? CARE_MULT : 1)); S.love = (S.love || 0) + got; bump('loveGain', got); return got; }
const loveTxt = (base, got) => `💗 พลังใจ +${got}` + (got > base ? ` (ดูแลน้องครบ ×${CARE_MULT})` : '');
function bestStreak(){ return Math.max(S.bestStreak || 0, streakNow()); }
/** streak needed to go from lv → lv+1 (0 = none) */
const petGate = lv => lv + 1 === 8 ? 3 : lv + 1 === 15 ? 7 : 0;
function petLevelUp(){
  const p = S.pet, cost = needPetExp(p.lv), g = petGate(p.lv);
  if (p.lv >= MAX_PET_LV || (S.love||0) < cost || (g && bestStreak() < g)) return;
  S.love -= cost; const st0 = petStage(p.lv).name; p.lv++; bump('petUp');
  let msg = `${p.emoji} ${p.name} เลื่อนเป็น Lv.${p.lv}! (ใช้ 💗 ${cost})`;
  if (petStage(p.lv).name !== st0){ msg += `\n✨ พัฒนาร่างเป็น "${petStage(p.lv).name}" แล้ว!`; pet.evolve = 2.5; }
  const sk = PET_SKILLS.find(k => k.lv === p.lv); if (sk) msg += `\n🐾 ความสามารถใหม่: ${sk.name} — ${sk.text}`;
  petHappy(pet); sfx('done'); save(); refreshHeader(); reward(msg);
}
/* 🐾 pet skills unlocked by level — the pet helps on the farm */
const PET_SKILLS = [
  { lv:3,  name:'ขุดหาของ',      text:'วันละครั้ง น้องขุดเจอเมล็ดหรือเหรียญในฟาร์ม' },

  { lv:8,  name:'ช่วยเก็บเกี่ยว',   text:'เก็บแปลงผักที่สุกให้เองวันละ 3 แปลง' },
  { lv:12, name:'เฝ้าแปลง',       text:'แปลงที่ขุดไว้อยู่ได้ 48 ชม. (จาก 24 ชม.)' } ];
const petSkill = lv => S.pet && S.pet.lv >= lv;
/** Lv.3: once a day the pet digs something up */
function petDailyFind(){
  if (!petSkill(3) || S.petFindDate === todayKey()) return;
  S.petFindDate = todayKey();
  const seeds = Object.values(CROPS).filter(c => S.lv >= c.lv).map(c => c.seed), r = Math.random();
  if (r < .6){ const k = seeds[(Math.random()*seeds.length)|0] || 'seed', n = 1 + (Math.random()*2|0); invAdd(k, n); queueReward(`🐾 ${S.pet.name} ขุดเจอของ!\n${MAT[k]} +${n}`); }
  else { const c = 100 + ((Math.random()*5)|0)*25; S.coins += c; queueReward(`🐾 ${S.pet.name} ขุดเจอของ!\n🪙 ${c} เหรียญทอง`); }
  bump('petFind'); save(); refreshHeader(); renderMats(); flushRewards();
}
/** Lv.8: harvest up to 3 ripe plots a day (called from natureTick) */
function petAutoHarvest(){
  if (!petSkill(8)) return;
  const d = S.petHarv && S.petHarv.d === todayKey() ? S.petHarv : (S.petHarv = { d:todayKey(), n:0 });
  if (d.n >= 3) return;
  for (const z of S.farm.zones) for (const o of z.objs){
    if (d.n >= 3) return;
    if (o.type !== 'plot' || !o.done || !o.plant || cropLeft(o) > 0) continue;
    const c = cropOf(o), n = rnd(c.yield); invAdd(c.prod, n); o.plant = 0; delete o.crop; o.idle = Date.now(); d.n++;
    bump('harvest'); bump('petHarvest'); markDirty(z); floatText(z.cx*GRID + o.c, z.cy*GRID + o.r, `🐾+${n}${c.e}`, '#2e7d32'); save(); renderMats();
  }
}

/* =====================================================================
   SAVE TRANSFER CODE — move a local account to another phone/browser without a server
   code = "PS1." + base64( gzip( JSON {u, pw, save} ) )   (falls back to "PS0." uncompressed)
   ===================================================================== */
async function packSave(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream){
    const gz = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    return 'PS1.' + b64(new Uint8Array(gz));
  }
  return 'PS0.' + b64(bytes);
}
async function unpackSave(code){
  code = code.trim(); const kind = code.slice(0,4), raw = ub64(code.slice(4));
  if (kind === 'PS1.'){ const txt = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); return JSON.parse(txt); }
  if (kind === 'PS0.') return JSON.parse(new TextDecoder().decode(raw));
  throw new Error('bad code');
}
function b64(u8){ let s = ''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); }
function ub64(str){ const s = atob(str), u8 = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u8[i] = s.charCodeAt(i); return u8; }
async function exportSave(){
  save();
  const code = await packSave({ u:USER, pw:(users()[USER]||{}).pw || null, save:S });
  let copied = false; try { await navigator.clipboard.writeText(code); copied = true; } catch(e){}
  sheet(`📲 โค้ดย้ายเครื่อง (${Math.round(code.length/1024)} KB)\n${copied ? '✅ คัดลอกแล้ว' : 'กดค้างเพื่อคัดลอก'} — ส่งให้ตัวเองทาง LINE/อีเมล แล้วไปที่เครื่องใหม่ → หน้าเข้าสู่ระบบ → "📲 มีโค้ดย้ายเครื่อง" → วางโค้ด\n\n⚠️ โค้ดนี้คือเซฟทั้งหมด อย่าส่งให้คนอื่น`, [

    { label:'ปิด', cls:'ghost' } ]);
}

/* Google sign-in → play at once with this device's save, then reconcile with the cloud.
   cloudSynced stays false until the cloud copy has been read, so a fresh/empty local save can
   never overwrite a newer cloud save. Read times out after 6 s and is retried every 15 s. */
let cloudSynced = false, cloudRetry = 0;
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, bad) => setTimeout(() => bad(new Error('timeout')), ms))]); }
function googleLogin(u){
  const key = 'g_' + u.uid;
  if (!store.get('pensuk_save_'+key)) store.set('pensuk_save_'+key, newSave());
  cloudSynced = false;
  login(key);
  cloudSync(u.uid, key);
}
async function cloudSync(uid, key){
  clearTimeout(cloudRetry);
  if (!fb || USER !== key) return;
  try {
    const d = await withTimeout(fb.db.collection('users').doc(uid).get(), 6000);
    if (USER !== key) return;                                       // player logged out meanwhile
    const cloud = d.exists ? d.data().save : null;
    cloudSynced = true;
    if (cloud && (cloud.savedAt||0) > (S.savedAt||0)){              // cloud is newer → load it
      stopLoopSafe(); store.set('pensuk_save_'+key, cloud); login(key);
    } else cloudQueue(true);                                        // this device is newer → upload
  } catch(e){
    console.log('cloud read failed', e);
    cloudRetry = setTimeout(() => cloudSync(uid, key), 15000);
  }
}
function stopLoopSafe(){ try { if (typeof stopLoop === 'function') stopLoop(); } catch(e){} }
function cloudQueue(now){
  if (!fb || !USER || !USER.startsWith('g_') || !fb.auth.currentUser || !cloudSynced) return;
  clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudFlush, now ? 0 : 3000);
}
function cloudFlush(){
  clearTimeout(cloudTimer);
  if (!fb || !USER || !USER.startsWith('g_') || !fb.auth.currentUser || !S || !cloudSynced) return;
  fb.db.collection('users').doc(fb.auth.currentUser.uid).set({ save: JSON.parse(JSON.stringify(S)), savedAt: S.savedAt || Date.now() })
    .catch(e => console.log('cloud write failed', e));
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') cloudFlush(); });

/* =====================================================================
   LINK A USERNAME ACCOUNT TO GOOGLE (keep existing progress)
   1. popup sign-in (must start inside the tap → called straight from the confirm button)
   2. read users/{uid}:
        • no cloud save / cloud save never finished onboarding → move this save up
        • cloud already has progress → show both, player picks which one to keep (2nd confirm)
   3. write chosen save as g_<uid> locally + to Firestore, switch the session to Google.
   The old username account stays on this device (marked .linked) as a backup.
   ===================================================================== */
function saveSummary(x){
  const t = x && x.savedAt ? new Date(x.savedAt).toLocaleString('th-TH', { dateStyle:'short', timeStyle:'short' }) : '-';
  return `Lv.${x.lv||1} • 🪙 ${x.coins||0} • น้อง ${x.pet ? x.pet.name : '-'} • ฟาร์ม ${x.farm && x.farm.zones ? x.farm.zones.length : 1} พื้นที่\nเล่นล่าสุด ${t}`;
}
async function linkGoogle(){
  const fromUser = USER;
  if (!fb) return sheet('ตอนนี้ยังเชื่อม Google ไม่ได้\n(ต้องเปิดเกมจากลิงก์บนเว็บ และต่ออินเทอร์เน็ต)', [{label:'ตกลง',cls:'ok'}]);
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt:'select_account' });
  let u;
  try { u = (await fb.auth.signInWithPopup(prov)).user; }
  catch(e){
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    return sheet('เชื่อม Google ไม่สำเร็จ\n' + (e.code||e.message), [{label:'ตกลง',cls:'ok'}]);
  }
  const cancel = () => { fb.auth.signOut(); };
  if (USER !== fromUser) return cancel();
  let cloud = null;
  try { const d = await withTimeout(fb.db.collection('users').doc(u.uid).get(), 8000); cloud = d.exists ? d.data().save : null; }
  catch(e){ cancel(); return sheet('อ่านข้อมูลบนคลาวด์ไม่สำเร็จ ลองใหม่อีกครั้ง', [{label:'ตกลง',cls:'ok'}]); }
  save();
  const mine = JSON.parse(JSON.stringify(S));
  const finish = pick => {
    const key = 'g_' + u.uid, keep = JSON.parse(JSON.stringify(pick));
    keep.savedAt = Date.now();
    const all = users(); if (all[fromUser]){ all[fromUser].linked = u.email || 'Google'; store.set('pensuk_users', all); }
    stopLoopSafe(); endPlacingSafe();
    store.set('pensuk_save_'+key, keep);
    cloudSynced = true;                                            // we just read the cloud copy
    login(key); cloudQueue(true);
    sheet('🔗 เชื่อมกับ Google สำเร็จ!\n\n' + (u.email||'') + '\nครั้งต่อไปกด "เข้าสู่ระบบด้วย Google" ได้ทุกเครื่อง', [{label:'ตกลง',cls:'ok'}]);
  };
  const sure = (t, fn) => sheet(t, [{label:'ยืนยัน',cls:'ok',fn},{label:'ยกเลิก',cls:'ghost',fn:cancel}]);   // cancel → sign Google back out
  if (!cloud || !cloud.profile) return finish(mine);               // Google account is empty → move progress up
  sheet('บัญชี Google นี้มีเซฟอยู่แล้ว เลือกเซฟที่จะเก็บไว้\n\n👤 เซฟในเครื่องนี้ (' + fromUser + ')\n' + saveSummary(mine) +
        '\n\n🔑 เซฟบน Google\n' + saveSummary(cloud) + '\n\n⚠️ เซฟที่ไม่ได้เลือกในบัญชี Google จะถูกแทนที่', [
    { label:'เก็บเซฟในเครื่องนี้', cls:'ok', fn: () => sure('ใช้เซฟของ "' + fromUser + '" แทนเซฟบน Google?\n(เซฟบน Google เดิมจะหายไป)', () => finish(mine)) },
    { label:'ใช้เซฟบน Google', cls:'ghost', fn: () => sure('ใช้เซฟบน Google?\n(เซฟของ "' + fromUser + '" ยังอยู่ในเครื่องนี้เป็นสำรอง)', () => finish(cloud)) },
    { label:'ยกเลิก', cls:'ghost', fn: cancel }
  ]);
}

/* =====================================================================
   PET MODEL — procedural pseudo-3D chibi pets (no image assets)
   • Volume: every body part is a radial-gradient sphere (key light top-left,
     rim-dark bottom-right) + soft contact shadow → reads as 3D on a flat canvas
   • Rig (local units, s = pet size, origin = feet, +x = facing direction):
       far legs → tail → body → near legs → far ear → head → near ear → face
   • Motion: trot gait (diagonal leg pairs), phase advanced by distance walked
     (no foot sliding), body bob ×2 step freq, squash & stretch on landing,
     ease-in/ease-out speed, breathing, blink, tail wag, head look, sniff, sit,
     sleep at night, happy hop with heart particles
   ===================================================================== */
const SPECIES = {
  dog:     { body:'#f4e6cf', head:'#c98a45', patch:'#7a4a24', ear:'floppy', earCol:'#7a4320', muzzle:'#fffaf2', nose:'#2b1a0e',
             tail:'wag', tailCol:'#c98a45', legLen:.30, bodyR:[.42,.27], headR:.31, legs:4, legCol:'#f4e6cf' },
  cat:     { body:'#f3a85c', head:'#f3a85c', patch:'#d9772e', ear:'tri', earCol:'#f3a85c', earIn:'#ffc2c8', muzzle:'#fff3e3', nose:'#f07d8a',
             tail:'long', tailCol:'#f3a85c', legLen:.29, bodyR:[.40,.25], headR:.31, legs:4, legCol:'#f3a85c', stripes:true },
  rabbit:  { body:'#f6f2ee', head:'#f6f2ee', patch:null, ear:'long', earCol:'#f6f2ee', earIn:'#ffc6d0', muzzle:'#ffffff', nose:'#f39aa8',
             tail:'puff', tailCol:'#ffffff', legLen:.20, bodyR:[.38,.30], headR:.32, legs:4, legCol:'#f6f2ee', hopper:true },
  hamster: { body:'#eab06b', head:'#eab06b', patch:null, ear:'round', earCol:'#d9934c', earIn:'#ffc6c0', muzzle:'#fff6e8', nose:'#f39aa8',
             tail:'none', tailCol:'#eab06b', legLen:.11, bodyR:[.40,.34], headR:.30, legs:4, legCol:'#f2c590', belly:'#fff6e8' },
  chick:   { body:'#ffd84d', head:'#ffd84d', patch:null, ear:'tuft', earCol:'#ffcc1f', muzzle:null, nose:null,
             tail:'feather', tailCol:'#ffcc1f', legLen:.20, bodyR:[.32,.30], headR:.27, legs:2, legCol:'#f28c1b', beak:'#f28c1b' },
  pig:     { body:'#f8b8c4', head:'#f8b8c4', patch:null, ear:'tri', earCol:'#f4a2b2', earIn:'#e9879b', muzzle:null, nose:null,
             tail:'curl', tailCol:'#f4a2b2', legLen:.20, bodyR:[.44,.30], headR:.31, legs:4, legCol:'#f4a2b2', snout:'#f39aae' }
};

/* hex colour shade: amt −1..1 (pre-computed once per species → no per-frame string work) */
function shadeHex(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const t = amt<0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t-r)*p+r); g = Math.round((t-g)*p+g); b = Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
for (const k in SPECIES){ const sp = SPECIES[k];
  sp.bodyHi = shadeHex(sp.body,.45); sp.bodyLo = shadeHex(sp.body,-.28);
  sp.headHi = shadeHex(sp.head,.45); sp.headLo = shadeHex(sp.head,-.25);
  sp.legFar = shadeHex(sp.legCol,-.22); sp.earLo = shadeHex(sp.earCol,-.25);
}

/* Sphere with volumetric shading (cx,cy centre; rx,ry radii) */
function ball(g, cx, cy, rx, ry, hi, base, lo){
  const r = Math.max(rx,ry);
  const gr = g.createRadialGradient(cx-rx*.35, cy-ry*.45, r*.08, cx, cy, r*1.05);
  gr.addColorStop(0, hi); gr.addColorStop(.55, base); gr.addColorStop(1, lo);
  g.fillStyle = gr; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); g.fill();
}
/* Leg as a rounded capsule rotated from the hip, with a paw */
function leg(g, hx, hy, len, ang, w, col){
  g.save(); g.translate(hx,hy); g.rotate(ang);
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,len); g.stroke();
  g.fillStyle = col; g.beginPath(); g.ellipse(w*.18, len, w*.62, w*.45, 0, 0, Math.PI*2); g.fill();
  g.restore();
}

/* Creates an independent animation state (farm pet & each selection card own one) */
function makePetAnim(){
  return { x:0.5, y:0.5, tx:0.5, ty:0.5, speed:0, face:1, phase:0, walk:0,
           state:'idle', timer:1.5, blinkT:2, blink:0, wag:0, look:0, lookT:0,
           hopH:0, hopV:0, lookTo:0, night:false, nightT:0, evolve:0, drinkNext:false, faceTo:0, squash:0, breathe:0, sitK:0, sniffK:0, sleepK:0, hearts:[
             {a:0,x:0,y:0},{a:0,x:0,y:0},{a:0,x:0,y:0},{a:0,x:0,y:0},{a:0,x:0,y:0}] };   // pooled particles
}

/* Behaviour + physics step. dt in seconds. pickTarget(a) sets a.tx/a.ty. */
function updatePetAnim(a, dt, canWalk, pickTarget){
  if ((a.nightT = (a.nightT||0) - dt) <= 0){ const h = new Date().getHours(); a.night = h>=22 || h<6; a.nightT = 5; }  // check clock every 5 s
  const night = a.night;
  a.breathe += dt * (a.state==='sleep' ? 1.6 : 3.2);
  a.wag += dt * (a.state==='walk' ? 10 : a.state==='sleep' ? 0 : 14);

  // blink every 2–5 s (double-blink sometimes)
  if ((a.blinkT -= dt) <= 0){ a.blink = 0.16; a.blinkT = Math.random()<.2 ? .25 : 2+Math.random()*3; }
  a.blink = Math.max(0, a.blink - dt);

  // head look-around while idle
  if ((a.lookT -= dt) <= 0){ a.lookT = 1+Math.random()*2.5; a.lookTo = (Math.random()-.5)*0.5; }
  a.look += ((a.lookTo||0) - a.look) * Math.min(1, dt*4);

  // vertical hop physics (gravity in s-units/s²)
  if (a.hopH > 0 || a.hopV > 0){ a.hopV -= 9*dt; a.hopH += a.hopV*dt; if (a.hopH <= 0){ a.hopH = 0; a.hopV = 0; a.squash = .25; } }
  a.squash = Math.max(0, a.squash - dt*1.8);

  // state machine
  // naps: rare & short by day, frequent & long at night (22:00–06:00); a tap wakes the pet

  if (a.state==='walk'){
    const dx = a.tx-a.x, dy = a.ty-a.y, d = Math.hypot(dx,dy);
    const want = Math.min(SPEED_MAX, d*2.2);                      // arrive: slow down near target
    a.speed += (want - a.speed) * Math.min(1, dt*5);              // accelerate / decelerate smoothly
    if (d > 0.01){
      const step = Math.min(d, a.speed*dt);
      a.x += dx/d*step; a.y += dy/d*step;
      a.phase += step * 26;                                       // gait locked to distance → no foot sliding
      const screenDx = dx - dy;                                   // iso screen-x direction = c − r
      if (Math.abs(screenDx) > 0.05) a.face = screenDx > 0 ? 1 : -1;
    }
    a.walk = Math.min(1, a.speed/SPEED_MAX*1.6);
    if (d < 0.03 && a.speed < 0.15){
      const r = Math.random(), napP = night ? .45 : .08;
      if (a.drinkNext){ a.drinkNext = false; a.state = 'sniff'; a.timer = 3+Math.random()*2; if (a.faceTo) a.face = a.faceTo; }   // drinking at the pond
      else if (r < napP){ a.state = 'sleep'; a.timer = night ? 20+Math.random()*25 : 8+Math.random()*7; }
      else { const q = Math.random(); a.state = q<.5 ? 'idle' : q<.8 ? 'sit' : 'sniff';
             a.timer = a.state==='sit' ? 3+Math.random()*4 : 1.5+Math.random()*2.5; }
    }
  } else {
    a.speed = 0; a.walk += (0 - a.walk)*Math.min(1, dt*6);
    if (!a.holdSit && (a.timer -= dt) <= 0){
      if (canWalk){ pickTarget(a); a.state='walk'; } else { a.timer = 2; }
    }
  }
  // blend weights for poses (smooth transitions, no snapping)
  const k = Math.min(1, dt*5);
  a.sitK   += ((a.state==='sit')  -a.sitK)*k;
  a.sniffK += ((a.state==='sniff')-a.sniffK)*k;
  a.sleepK += ((a.state==='sleep')-a.sleepK)*k;

  if (a.evolve > 0) a.evolve -= dt;
  // hearts float up and fade
  for (const h of a.hearts){ if (h.a>0){ h.a -= dt*.7; h.y -= dt*.9; h.x += Math.sin(h.a*9)*dt*.2; } }
}
const SPEED_MAX = 0.9;   // tiles per second
/* 3 evolution forms: proportions change (big-head baby → longer-legged adult) + accessory */
const FORMS = [ {head:1.18, leg:.72, bx:.9,  by:.95},     // ร่าง 1: chibi
                {head:1.0,  leg:1.0, bx:1.0, by:1.0 },    // ร่าง 2: + collar & bell
                {head:.92,  leg:1.15,bx:1.1, by:1.03} ];  // ร่าง 3: + scarf, crown, sparkles

function petHappy(a){
  if (a.hopH===0) a.hopV = 2.6;
  if (a.holdSit) return;
  a.state = 'idle'; a.timer = 1.5;                           // also wakes a napping pet
  let n = 0; for (const h of a.hearts){ if (h.a<=0 && n<3){ h.a = 1+n*.15; h.x = (n-1)*.25; h.y = -1.1; n++; } }
}

/* Draw the pet with feet at (sx,sy). s = size in px. */
function drawPetModel(g, type, a, sx, sy, s, form){
  const sp = SPECIES[type] || SPECIES.dog, F = FORMS[form||0];
  // evolution glow (expanding light burst behind the pet)
  if (a.evolve > 0){
    const k = a.evolve/2.5, rr = s*(1.6-k*.8), gg = g.createRadialGradient(sx, sy-s*.5, 1, sx, sy-s*.5, rr);
    gg.addColorStop(0, `rgba(255,250,210,${.9*k})`); gg.addColorStop(1,'rgba(255,230,140,0)');
    g.fillStyle = gg; g.beginPath(); g.arc(sx, sy-s*.5, rr, 0, Math.PI*2); g.fill();
  }
  const sit = a.sitK, sniff = a.sniffK, sleep = a.sleepK, walk = a.walk;
  const step = Math.sin(a.phase), bob = Math.abs(Math.cos(a.phase))*walk*.05;
  const breath = Math.sin(a.breathe)*.012;
  const hopUp = a.hopH;                                  // s-units

  // ---- contact shadow (stays on ground, shrinks while airborne) ----
  const sh = 1/(1+hopUp*1.5);
  g.fillStyle = 'rgba(40,30,20,'+(.28*sh)+')';
  g.beginPath(); g.ellipse(sx, sy, s*.5*sh, s*.16*sh, 0, 0, Math.PI*2); g.fill();

  g.save();
  g.translate(sx, sy - hopUp*s);
  g.scale(a.face, 1);
  // squash & stretch (landing / breathing)
  const sq = a.squash*Math.sin(a.squash*12);
  g.scale(1+sq*.25, 1-sq*.25+breath);

  const brx = sp.bodyR[0]*F.bx, bry = sp.bodyR[1]*F.by;
  const legLen = sp.legLen*F.leg*s, legW = s*(sp.legs===2 ? .055 : .11);
  const lower = (sit*.12 + sleep*.22)*s + bob*s*-1;        // body drops when sitting/sleeping
  const bodyY = -(legLen + bry*s*.7) + lower + (sp.hopper ? -Math.abs(step)*walk*.12*s : 0);
  const tilt = -sit*.32 + sniff*.12;                        // sit leans back, sniff leans forward

  // ---------- far legs (darker, slightly up = behind) ----------
  const hipY = bodyY + bry*s*.45;
  const swing = .55*walk;
  if (sp.legs===4){
    if (sleep < .5){
      leg(g, -brx*s*.55, hipY-1, legLen*(1-sit*.6), sit>.05 ? .9*sit : step*swing, legW, sp.legFar);       // back far
      leg(g,  brx*s*.5,  hipY-1, legLen, -step*swing*(sp.hopper?-1:1), legW, sp.legFar);                // front far
    }
  } else {
    leg(g, -brx*s*.1, hipY, legLen*(1-sleep), -step*swing, legW, shadeHex(sp.legCol,-.15));
  }

  // ---------- tail (behind body) ----------
  g.save(); g.translate(-brx*s*.92, bodyY - bry*s*.2); g.rotate(tilt);
  const wag = Math.sin(a.wag)*(.45 - sleep*.4);
  g.lineCap = 'round';
  switch (sp.tail){
    case 'wag':     g.rotate(-.9 + wag); g.strokeStyle = sp.tailCol; g.lineWidth = s*.09;
                    g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(-s*.12,-s*.15,-s*.06,-s*.32); g.stroke();
                    g.fillStyle = '#fff'; g.beginPath(); g.arc(-s*.06,-s*.32,s*.055,0,Math.PI*2); g.fill(); break;   // beagle white tip
    case 'long':    g.rotate(-.5 + wag*.5); g.strokeStyle = sp.tailCol; g.lineWidth = s*.08;
                    g.beginPath(); g.moveTo(0,0); g.bezierCurveTo(-s*.3,-s*.05,-s*.15,-s*.45,-s*.32,-s*.5); g.stroke(); break;
    case 'puff':    ball(g, -s*.02, 0, s*.12, s*.12, '#ffffff', '#f6f2ee', '#d9d2cb'); break;
    case 'curl':    g.rotate(wag*.4); g.strokeStyle = sp.tailCol; g.lineWidth = s*.045;
                    g.beginPath(); g.arc(-s*.06, -s*.02, s*.06, 0, Math.PI*1.7); g.stroke(); break;
    case 'feather': g.rotate(-.6 + wag*.3); g.fillStyle = sp.tailCol;
                    for (let i=0;i<3;i++){ g.beginPath(); g.ellipse(-s*.06, -s*.04*i, s*.1, s*.04, -.3*i, 0, Math.PI*2); g.fill(); } break;
  }
  g.restore();

  // ---------- body ----------
  g.save(); g.translate(0, bodyY); g.rotate(tilt);
  ball(g, 0, 0, brx*s, bry*s, sp.bodyHi, sp.body, sp.bodyLo);
  g.save(); g.beginPath(); g.ellipse(0, 0, brx*s, bry*s, 0, 0, Math.PI*2); g.clip();
  if (sp.patch && !sp.stripes){                              // beagle saddle
    g.fillStyle = sp.patch; g.beginPath(); g.ellipse(-brx*s*.15, -bry*s*.55, brx*s*.7, bry*s*.6, 0, 0, Math.PI*2); g.fill(); }
  if (sp.stripes){ g.strokeStyle = sp.patch; g.lineWidth = s*.05;
    for (let i=-1;i<=1;i++){ g.beginPath(); g.moveTo(i*s*.15, -bry*s); g.quadraticCurveTo(i*s*.15+s*.04, -bry*s*.4, i*s*.15, -bry*s*.1); g.stroke(); } }
  if (sp.belly){ g.fillStyle = sp.belly; g.beginPath(); g.ellipse(brx*s*.15, bry*s*.55, brx*s*.6, bry*s*.5, 0, 0, Math.PI*2); g.fill(); }
  // soft top highlight sits over patterns to keep the volume read
  const hl = g.createLinearGradient(0,-bry*s,0,bry*s); hl.addColorStop(0,'rgba(255,255,255,.25)'); hl.addColorStop(.5,'rgba(255,255,255,0)'); hl.addColorStop(1,'rgba(0,0,0,.12)');
  g.fillStyle = hl; g.fillRect(-brx*s, -bry*s, brx*s*2, bry*s*2);
  g.restore();
  if (sp.legs===2){                                          // chick wing
    g.fillStyle = shadeHex(sp.body,-.08); g.beginPath();
    g.ellipse(-s*.02, -s*.02, s*.17, s*.11, -.4 + Math.sin(a.wag*.8)*.15*walk, 0, Math.PI*2); g.fill(); }
  g.restore();

  // ---------- near legs ----------
  if (sp.legs===4){
    if (sleep < .5){
      if (sit > .3){ ball(g, -brx*s*.45, hipY + legLen*.35, s*.17, s*.13, sp.bodyHi, sp.body, sp.bodyLo); }   // folded haunch
      else leg(g, -brx*s*.4, hipY, legLen, -step*swing, legW, sp.legCol);                                        // back near
      leg(g, brx*s*.62, hipY, legLen, (sp.hopper ? -step : step)*swing + sit*.15, legW, sp.legCol);               // front near
    }
  } else {
    leg(g, s*.08, hipY, legLen*(1-sleep), step*swing, legW, sp.legCol);
  }

  // ---------- head ----------
  const hr = sp.headR*F.head*s;
  const hx = brx*s*.78 + sniff*s*.08 - sleep*s*.05;
  const hy = bodyY - bry*s*.55 - hr*.55 - sit*s*.1 + sniff*s*.32 + sleep*s*.28 + Math.sin(a.phase*2)*walk*s*.02
             + (sniff ? Math.sin(a.breathe*4)*sniff*s*.03 : 0);
  g.save(); g.translate(hx, hy); g.rotate(a.look*.4*(1-sleep) + sleep*.25);

  // scarf tail (form 3) flutters behind the neck
  if (form===2){ const fl = Math.sin(a.wag*.7)*hr*.15 + walk*hr*.2;
    g.fillStyle = '#3d7fd9'; g.beginPath(); g.moveTo(-hr*.3, hr*.75); g.quadraticCurveTo(-hr*.9, hr*.7+fl, -hr*1.25, hr*.95+fl);
    g.lineTo(-hr*1.1, hr*1.15+fl); g.quadraticCurveTo(-hr*.7, hr*1.0, -hr*.2, hr*1.0); g.closePath(); g.fill(); }
  // far ear (behind head)
  drawEar(g, sp, hr, -1, a, sleep);
  ball(g, 0, 0, hr, hr*.93, sp.headHi, sp.head, sp.headLo);
  // collar (form 2: red + bell) / scarf band (form 3: blue)
  if (form>=1){ g.strokeStyle = form===1 ? '#d93a3a' : '#3d7fd9'; g.lineWidth = hr*(form===1 ? .14 : .22); g.lineCap = 'round';
    g.beginPath(); g.ellipse(-hr*.05, hr*.72, hr*.55, hr*.2, 0, .1, Math.PI-.1); g.stroke();
    if (form===1) ball(g, hr*.25, hr*.98, hr*.12, hr*.12, '#fff6b0', '#f2c230', '#a87d0b');
    else { g.fillStyle = '#2f68b8'; g.beginPath(); g.arc(hr*.28, hr*.92, hr*.12, 0, Math.PI*2); g.fill(); } }
  if (sp.patch && type==='dog'){                             // white blaze
    g.fillStyle = sp.muzzle; g.beginPath(); g.ellipse(hr*.25, -hr*.15, hr*.13, hr*.6, .2, 0, Math.PI*2); g.fill(); }
  if (sp.stripes){ g.strokeStyle = sp.patch; g.lineWidth = s*.035;
    for (let i=-1;i<=1;i++){ g.beginPath(); g.moveTo(i*hr*.25, -hr*.95); g.lineTo(i*hr*.22, -hr*.6); g.stroke(); } }

  // muzzle / snout / beak (3/4 view: shifted toward facing side)
  if (sp.muzzle){ ball(g, hr*.48, hr*.32, hr*.42, hr*.3, '#ffffff', sp.muzzle, shadeHex(sp.muzzle,-.12)); }
  if (sp.snout){ ball(g, hr*.62, hr*.25, hr*.32, hr*.24, shadeHex(sp.snout,.3), sp.snout, shadeHex(sp.snout,-.2));
    g.fillStyle = '#b8586c'; g.beginPath(); g.ellipse(hr*.52, hr*.25, hr*.05, hr*.08, 0, 0, Math.PI*2); g.ellipse(hr*.74, hr*.25, hr*.05, hr*.08, 0, 0, Math.PI*2); g.fill(); }
  if (sp.beak){ g.fillStyle = sp.beak; g.beginPath(); g.moveTo(hr*.7, hr*.02); g.lineTo(hr*1.12, hr*.18); g.lineTo(hr*.7, hr*.34); g.closePath(); g.fill(); }
  if (sp.nose){ g.fillStyle = sp.nose; g.beginPath(); g.ellipse(hr*.82, hr*.18, hr*.1, hr*.075, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.arc(hr*.79, hr*.15, hr*.03, 0, Math.PI*2); g.fill(); }

  // eyes: big glossy, near eye larger (3/4 perspective)
  const closed = a.blink > 0 || sleep > .5;
  drawEye(g, hr*.05, -hr*.08, hr*.14, closed);
  drawEye(g, hr*.5,  -hr*.06, hr*.17, closed);
  // blush
  g.fillStyle = 'rgba(255,120,140,.35)';
  g.beginPath(); g.ellipse(hr*.42, hr*.35, hr*.13, hr*.08, 0, 0, Math.PI*2); g.fill();
  // mouth (small "w" smile), opens a bit when happy/hopping
  if (!sp.beak && !sp.snout){
    g.strokeStyle = '#4a2b18'; g.lineWidth = Math.max(1, s*.018); g.lineCap='round';
    g.beginPath(); g.moveTo(hr*.62, hr*.42); g.quadraticCurveTo(hr*.7, hr*.52, hr*.78, hr*.42); g.stroke();
    if (a.hopH > 0.05){ g.fillStyle = '#ff7a8a'; g.beginPath(); g.ellipse(hr*.7, hr*.52, hr*.06, hr*.07, 0, 0, Math.PI*2); g.fill(); }
  }
  // near ear (in front)
  drawEar(g, sp, hr, 1, a, sleep);
  if (form===2){ g.font = Math.round(hr*.9)+'px serif'; g.textAlign='center'; g.textBaseline='bottom'; g.fillText('👑', 0, -hr*.75); }
  g.restore();
  g.restore();

  // ---------- form-3 sparkles ----------
  if (form===2 && sleep < .5){ g.fillStyle = '#ffd84d';
    for (let k=0;k<3;k++){ const t = (a.breathe*.18 + k/3) % 1, ang = k*2.1 + a.breathe*.2;
      g.globalAlpha = Math.sin(t*Math.PI); g.font = Math.round(s*.16)+'px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('✦', sx + Math.cos(ang)*s*.6, sy - s*(.3 + t*.9) - hopUp*s); }
    g.globalAlpha = 1; }
  // ---------- Zzz & hearts (not mirrored) ----------
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (sleep > .5){
    const t = (a.breathe*.25)%1;
    g.globalAlpha = 1-t; g.fillStyle = '#5b6b8a'; g.font = '600 '+Math.round(s*.25)+'px Mali, sans-serif';
    g.fillText('z', sx + a.face*s*(.5+t*.2), sy - s*(1+t*.5)); g.globalAlpha = 1;
  }
  for (const h of a.hearts){ if (h.a > 0){
    g.globalAlpha = Math.min(1, h.a); g.font = Math.round(s*.28)+'px serif';
    g.fillText('❤️', sx + h.x*s, sy + h.y*s - hopUp*s); g.globalAlpha = 1; } }
}
function drawEye(g, x, y, r, closed){
  if (closed){ g.strokeStyle = '#2b1a0e'; g.lineWidth = r*.35; g.lineCap='round';
    g.beginPath(); g.arc(x, y, r*.8, .15*Math.PI, .85*Math.PI); g.stroke(); return; }
  g.fillStyle = '#20140c'; g.beginPath(); g.ellipse(x, y, r*.85, r, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x+r*.25, y-r*.35, r*.32, 0, Math.PI*2); g.fill();     // key glint
  g.beginPath(); g.arc(x-r*.25, y+r*.35, r*.13, 0, Math.PI*2); g.fill();                              // fill glint
}
function drawEar(g, sp, hr, side, a, sleep){
  // side −1 = far ear (back, darker), +1 = near ear
  const far = side < 0, col = far ? sp.earLo : sp.earCol, ox = far ? -hr*.45 : hr*.05;
  const flop = Math.sin(a.wag*.5)*.12 + a.hopV*.06;
  g.save();
  switch (sp.ear){
    case 'floppy':
      if (far) break;   // beagle: both drop ears visible at sides
      for (const ex of [-hr*.72, hr*.32]){
        g.save(); g.translate(ex, -hr*.35); g.rotate(.15 + flop - sleep*.1);
        ball(g, 0, hr*.42, hr*.27, hr*.52, shadeHex(sp.earCol,.2), sp.earCol, shadeHex(sp.earCol,-.3)); g.restore(); }
      break;
    case 'tri':
      g.translate(ox, -hr*.7); g.rotate(far ? -.3 : .15 + flop*.3);
      g.fillStyle = col; g.beginPath(); g.moveTo(-hr*.28, hr*.15); g.lineTo(0, -hr*.42); g.lineTo(hr*.28, hr*.15); g.closePath(); g.fill();
      if (!far && sp.earIn){ g.fillStyle = sp.earIn; g.beginPath(); g.moveTo(-hr*.15, hr*.1); g.lineTo(0, -hr*.25); g.lineTo(hr*.15, hr*.1); g.closePath(); g.fill(); }
      break;
    case 'long':
      g.translate(ox+hr*.1, -hr*.75); g.rotate((far ? -.35 : .1) + flop - sleep*.9*(far?-1:1));
      ball(g, 0, -hr*.55, hr*.2, hr*.62, shadeHex(col,.3), col, shadeHex(col,-.2));
      if (!far){ g.fillStyle = sp.earIn; g.beginPath(); g.ellipse(0, -hr*.5, hr*.09, hr*.45, 0, 0, Math.PI*2); g.fill(); }
      break;
    case 'round':
      g.translate(ox, -hr*.78);
      ball(g, 0, 0, hr*.22, hr*.2, shadeHex(col,.3), col, shadeHex(col,-.2));
      if (!far){ g.fillStyle = sp.earIn; g.beginPath(); g.arc(0, 0, hr*.11, 0, Math.PI*2); g.fill(); }
      break;
    case 'tuft':
      if (far) break;
      g.translate(-hr*.05, -hr*.88); g.strokeStyle = col; g.lineWidth = hr*.1; g.lineCap = 'round';
      for (let i=-1;i<=1;i++){ g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(i*hr*.15, -hr*.2, i*hr*.2 + flop*hr*.3, -hr*.28); g.stroke(); }
      break;
  }
  g.restore();
}

/* =====================================================================
   2) CHAT ONBOARDING — เป็นสุข asks 5 questions (v0.9: activity level & interests removed)
   ===================================================================== */
const ACT = { 'เบา':1.375, 'ปานกลาง':1.55, 'หนัก':1.725 };       // TDEE multipliers
const INTERESTS = ['เดิน','วิ่ง','ออกกำลังกาย'];
let draft = {}, qIdx = 0;

const QUESTIONS = [
  { key:'name', ask:'สวัสดีครับ! ผมชื่อ "เป็นสุข" เป็นน้องบีเกิ้ล 🐶\nอยากให้ผมเรียกคุณว่าอะไรดีครับ?', type:'text',
    check:v => v.length>=1 && v.length<=16 ? null : 'ชื่อยาว 1–16 ตัวอักษรนะครับ' },
  { key:'sex', ask:'ยินดีที่ได้รู้จักครับ คุณ{name}!\nขอทราบเพศหน่อยครับ (ใช้คำนวณพลังงานพื้นฐาน)', type:'chips', opts:['ชาย','หญิง'] },
  { key:'dob', ask:'วัน เดือน ปีเกิดของคุณคือวันไหนครับ?', type:'date',
    check:v => { const a = ageOf(v); return a>=7 && a<=100 ? null : 'อายุควรอยู่ระหว่าง 7–100 ปีครับ'; } },
  { key:'h', ask:'ส่วนสูงเท่าไหร่ครับ? (ซม.)', type:'num', min:100, max:230, unit:'ซม.' },
  { key:'w', ask:'น้ำหนักเท่าไหร่ครับ? (กก.)', type:'num', min:20, max:250, unit:'กก.' },
];

function ageOf(dob){
  const d = new Date(dob), n = new Date();
  if (isNaN(d)) return -1;
  let a = n.getFullYear() - d.getFullYear();
  if (n.getMonth() < d.getMonth() || (n.getMonth()===d.getMonth() && n.getDate() < d.getDate())) a--;
  return a;
}
function bubble(text, who){
  const log = $('chatLog');
  if (who === 'bot'){
    const r = document.createElement('div'); r.className = 'botrow';
    r.innerHTML = `<svg class="ava" viewBox="0 0 64 64">${BEAGLE}</svg>`;
    const m = document.createElement('div'); m.className = 'msg bot'; m.textContent = text; r.appendChild(m);
    log.insertBefore(r, $('chatIn').parentNode===log ? $('chatIn') : null);
  } else {
    const m = document.createElement('div'); m.className = 'msg me'; m.textContent = text; log.insertBefore(m, $('chatIn').parentNode===log ? $('chatIn') : null);
  }
  log.scrollTop = log.scrollHeight;
}
function startChat(){
  show('sChat'); const box = $('chatIn'); box.innerHTML = ''; $('chatLog').innerHTML = ''; $('chatLog').appendChild(box); draft = {}; qIdx = 0; askNext();
}
/* Answer box lives INSIDE the chat log, directly under the latest question (eye line), not docked at the bottom */
function dockInput(){ const log = $('chatLog'), box = $('chatIn'); log.appendChild(box);
  requestAnimationFrame(() => box.scrollIntoView({ block:'nearest', behavior:'smooth' })); }
function askNext(){
  const q = QUESTIONS[qIdx];
  $('chatStep').textContent = (qIdx+1)+'/'+QUESTIONS.length;
  setTimeout(() => { bubble(q.ask.replace('{name}', draft.name||''), 'bot'); renderInput(q); dockInput(); }, 250);
}
function renderInput(q){
  const box = $('chatIn'); box.innerHTML = '';
  const err = document.createElement('div'); err.className = 'err';
  if (q.type==='chips'){
    const c = document.createElement('div'); c.className = 'chips';
    q.opts.forEach(o => { const b = document.createElement('button'); b.className='chip'; b.textContent=o; b.onclick=()=>answer(q,o,o); c.appendChild(b); });
    box.appendChild(c);
  } else if (q.type==='multi'){
    const sel = new Set(), c = document.createElement('div'); c.className = 'chips';
    q.opts.forEach(o => { const b = document.createElement('button'); b.className='chip'; b.textContent=o;
      b.onclick=()=>{ sel.has(o)?sel.delete(o):sel.add(o); b.classList.toggle('sel'); }; c.appendChild(b); });
    const ok = document.createElement('button'); ok.className='btn'; ok.textContent='ส่ง';
    ok.onclick=()=>{ if(!sel.size) return err.textContent='เลือกอย่างน้อย 1 ข้อครับ'; const v=[...sel]; answer(q,v,v.join(', ')); };
    box.append(c, err, ok);
  } else {
    const row = document.createElement('div'); row.className='row';
    const inp = document.createElement('input');
    inp.type = q.type==='num' ? 'number' : q.type==='date' ? 'date' : 'text';
    if (q.type==='num'){ inp.inputMode='decimal'; inp.placeholder=q.unit; }
    const ok = document.createElement('button'); ok.className='btn'; ok.textContent='ส่ง'; ok.style.flex='0 0 80px';
    const go = () => {
      let v = inp.value.trim(), shown = v;
      if (q.type==='num'){ v = parseFloat(v);
        if (isNaN(v) || v<q.min || v>q.max) return err.textContent = `กรอก ${q.min}–${q.max} ${q.unit} นะครับ`;
        shown = v+' '+q.unit; }
      if (q.type==='date' && v){ const d=new Date(v); shown = d.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}); }
      if (!v && v!==0) return err.textContent = 'ยังไม่ได้กรอกเลยครับ';
      const e = q.check && q.check(v); if (e) return err.textContent = e;
      answer(q, v, shown);
    };
    ok.onclick = go; inp.onkeydown = e => { if (e.key==='Enter') go(); };
    row.append(inp, ok); box.append(row, err); setTimeout(()=>inp.focus(), 300);
  }
}
function answer(q, v, shown){
  draft[q.key] = v; bubble(shown, 'me'); $('chatIn').innerHTML = '';
  qIdx++;
  if (qIdx < QUESTIONS.length) return askNext();
  // All 7 answers collected → summary + confirm
  setTimeout(() => {
    bubble(`ขอบคุณครับ! สรุปข้อมูลของคุณ{name}:\nเพศ ${draft.sex} • อายุ ${ageOf(draft.dob)} ปี\nสูง ${draft.h} ซม. • หนัก ${draft.w} กก.`.replace('{name}',draft.name), 'bot');
    const box = $('chatIn');
    const ok = document.createElement('button'); ok.className='btn ok'; ok.textContent='ถูกต้อง ให้เป็นสุขวิเคราะห์เลย';
    const re = document.createElement('button'); re.className='btn ghost'; re.textContent='เริ่มกรอกใหม่';
    ok.onclick = () => { S.profile = {...draft}; buildMissions(); save(); openGoal(); };
    re.onclick = startChat;
    box.append(ok, re); dockInput();
  }, 300);
}

/* =====================================================================
   2-3) ANALYSIS → 3 DAILY MISSIONS
   BMR  (Mifflin-St Jeor):  10·kg + 6.25·cm − 5·age + (♂ +5 | ♀ −161)
   TDEE = BMR × activity factor   (เบา 1.375 / ปานกลาง 1.55 / หนัก 1.725)
   Active burn budget = (TDEE − BMR) × 0.35  → used for the exercise mission
   ===================================================================== */
const round = (v, step) => Math.max(step, Math.round(v/step)*step);
function analyse(p){
  const age = ageOf(p.dob);
  const bmr = 10*p.w + 6.25*p.h - 5*age + (p.sex==='ชาย' ? 5 : -161);
  const tdee = bmr * (ACT[p.act] || ACT['เบา']);            // v0.9: activity question removed → light
  const bmi = p.w / Math.pow(p.h/100, 2);
  return { age, bmr:Math.round(bmr), tdee:Math.round(tdee), bmi:+bmi.toFixed(1) };
}
/* Goal screen: each target adjustable within base × [0.8, 1.2] */
function openGoal(){
  show('sGoal');
  const a = S.analysis || analyse(S.profile), L = $('goalList'); L.innerHTML = '';
  const info = document.createElement('div'); info.className='card';
  info.innerHTML = `<b>🐶 เป้าหมายสุขภาพประจำวัน</b><div class="muted" style="margin-top:6px">📵 พักจอ • 🏋️ ลุกนั่ง • 🙆 บริหารต้นคอ — ทำในเกมได้เลย เป็นสุขช่วยนับให้</div><div class="muted" style="margin-top:6px">
    พลังงานพื้นฐาน (BMR) ${a.bmr.toLocaleString()} kcal • ใช้ต่อวัน (TDEE) ${a.tdee.toLocaleString()} kcal • BMI ${a.bmi}<br>
    ปรับเป้าหมายได้ลดลงหรือเพิ่มขึ้นไม่เกิน 20%</div>`;
  L.appendChild(info);
  S.missions.forEach(m => {
    const lo = round(m.base*0.8, m.step) < m.base*0.8 ? round(m.base*0.8,m.step)+m.step : round(m.base*0.8,m.step);
    const hi = round(m.base*1.2, m.step) > m.base*1.2 ? round(m.base*1.2,m.step)-m.step : round(m.base*1.2,m.step);
    const c = document.createElement('div'); c.className='card';
    c.innerHTML = `<div class="mrow"><b>${m.icon} ${m.label}</b><b class="val">${m.target.toLocaleString()} ${m.unit}</b></div>
      <input type="range" min="${lo}" max="${hi}" step="${m.step}" value="${m.target}">
      <div class="mrow muted"><span>−20%: ${lo.toLocaleString()}</span><span>แนะนำ ${m.base.toLocaleString()}</span><span>+20%: ${hi.toLocaleString()}</span></div>`;
    const r = c.querySelector('input'), val = c.querySelector('.val');
    r.oninput = () => { m.target = +r.value; val.textContent = m.target.toLocaleString()+' '+m.unit; };
    L.appendChild(c);
  });
}
$('bGoalOk').onclick = () => confirmDo('ยืนยันเป้าหมายรายวันทั้ง 3 ภารกิจ?\n(ปรับได้อีกครั้งในหน้าภารกิจก่อนเริ่มทำ)', () => {
  S.goalLocked = true; save(); S.pet ? openMain() : openPet();
});

/* =====================================================================
   5) PET SELECT + RANDOM + NAMING
   ===================================================================== */
const PETS = [
  {id:'dog',e:'🐕',n:'น้องหมา'},{id:'cat',e:'🐈',n:'น้องแมว'},{id:'rabbit',e:'🐇',n:'น้องกระต่าย'},
  {id:'hamster',e:'🐹',n:'น้องแฮมสเตอร์'},{id:'chick',e:'🐥',n:'น้องเจี๊ยบ'},{id:'pig',e:'🐖',n:'น้องหมู'}
];
let petSel = null;
function openPet(){
  show('sPet'); const g = $('petGrid'); g.innerHTML = '';
  previews.length = 0;
  PETS.forEach(p => { const b = document.createElement('button'); b.className='petc'; b.dataset.id=p.id;
    const c = document.createElement('canvas'); const dpr = Math.min(2, devicePixelRatio||1);
    c.width = 96*dpr; c.height = 84*dpr; const g2 = c.getContext('2d'); g2.setTransform(dpr,0,0,dpr,0,0);
    const a = makePetAnim(); a.timer = Math.random()*2;
    previews.push({ id:p.id, g:g2, a });
    b.appendChild(c); const sp = document.createElement('span'); sp.textContent = p.n; b.appendChild(sp);
    b.onclick = () => { pickPet(p.id); petHappy(a); }; g.appendChild(b); });
  if (!prevRaf){ prevLast = 0; prevRaf = requestAnimationFrame(previewLoop); }
}
/* Selection cards: each pet idles in place (sit / sniff / look / blink), turning to face left & right */
const previews = []; let prevRaf = 0, prevLast = 0;
function previewLoop(now){
  if (!$('sPet').classList.contains('on')){ prevRaf = 0; return; }   // stop when leaving the screen
  prevRaf = requestAnimationFrame(previewLoop);
  if (now - prevLast < 33) return; const dt = prevLast ? (now-prevLast)/1000 : 0.033; prevLast = now;
  for (const v of previews){
    updatePetAnim(v.a, dt, false, null);
    if (v.a.state!=='sleep' && (v.a.mood = (v.a.mood||2) - dt) <= 0){        // rotate idle poses every 2–4 s
      v.a.mood = 2 + Math.random()*2; const r = Math.random();
      v.a.state = r<.4 ? 'idle' : r<.7 ? 'sit' : 'sniff'; v.a.timer = 99;
      if (Math.random() < .5) v.a.face *= -1;
    }
    v.g.clearRect(0,0,96,84);
    drawPetModel(v.g, v.id, v.a, 48, 76, 56, 0);
  }
}
function pickPet(id){ petSel = id; document.querySelectorAll('.petc').forEach(b => b.classList.toggle('sel', b.dataset.id===id)); }
$('bRand').onclick = () => {
  // short shuffle animation then land on a random pet
  let n = 0; const t = setInterval(() => { pickPet(PETS[n++ % PETS.length].id);
    if (n > 10){ clearInterval(t); pickPet(PETS[Math.floor(Math.random()*PETS.length)].id); } }, 90);
};
$('bPetOk').onclick = () => {

  if (!name) return $('petErr').textContent = 'ตั้งชื่อน้องก่อนนะครับ';
  const p = PETS.find(x => x.id===petSel);
  confirmDo(`รับ ${p.n} ${p.e} ชื่อ "${name}" มาเลี้ยง?`, () => {

    S.farm = { zones:[], cur:0 }; ensureZones(); S.q = 0; S.qDone = []; S.furn = {}; save(); openMain();
    reward(`ฟาร์มรกร้างพร้อมแล้ว!\nทำ 📜 เควสตามที่เป็นสุขบอกบนจอ เพื่อเรียนรู้วิธีเล่นทีละขั้นนะครับ 🐶`);
  });
};

/* =====================================================================
   MAIN shell: header, tabs, daily reset

function openMain(){
  show('sMain'); dailyReset();
  refreshHeader(); renderMats(); renderMissions(); renderShop(); renderBag();

function refreshHeader(){
  const pct = S.lv>=MAX_LV ? 100 : Math.floor(S.exp/needExp(S.lv)*100);
  if (S.pet.pexp){ S.love = (S.love||0) + S.pet.pexp; S.pet.pexp = 0; }   // v0.17: old pet Exp becomes 💗
  const canUp = S.pet.lv < MAX_PET_LV && (S.love||0) >= needPetExp(S.pet.lv) && !(petGate(S.pet.lv) && bestStreak() < petGate(S.pet.lv));

   Chunk n (unlocked at player Lv n, max 50) sits at SPIRAL[n] so every new chunk
   touches an existing one. Global tile (gc,gr) = (cx·5 + c, cy·5 + r).

   Grid→Screen:  P(gc,gr,z) = ( OX + camX + (gc − gr)·TW/2 ,  OY + camY + (gc + gr)·TH/2 − z )
   Screen→Grid:  u = (sx−OX−camX)/(TW/2), v = (sy−OY−camY)/(TH/2)
                 gc = floor((u+v)/2),  gr = floor((v−u)/2)
   Depth (Y-sort): global diagonal s = gc + gr ascending across ALL visible chunks.
                   Multi-tile structures draw once at their front tile (c+w−1, r+h−1).
   Ground: one offscreen cache per chunk (LRU ≤ 12), painted back→front (cx+cy ascending);

const ICO = ['farm','missions','shop','quests','bag','coin','scissors','axe','hammer','reap','shovel','toolbox',
  'stone','grass','wood','seed','veg','food','tilapia','carp','goldfish','shrimp','boot','corn','tomato','rice','pumpkin','berry',

const EMO = [['🌾(?=\\s?เคียว)','reap'],['💠','polish'],['🟫','plank'],
  ['🏡','farm'],['🎯','missions'],['🛒','shop'],['📜','quests'],['🎒','bag'],['🪙','coin'],['✂','scissors'],['🪓','axe'],['🔨','hammer'],['🪏','shovel'],['🧰','toolbox'],
  ['🪨','stone'],['🌿','grass'],['🪵','wood'],['🌱','seed'],['🥕','veg'],['🦴','food'],['🐟','tilapia'],['🐡','carp'],['🐠','goldfish'],['🦐','shrimp'],['👢','boot'],
  ['🌽','corn'],['🍅','tomato'],['🌾','rice'],['🎃','pumpkin'],['🍓','berry'],['📏','beam'],['🟤','soil'],['🍚','milled'],['🥣','soup'],['🍛','friedrice'],
  ['🫙','jam'],['🥫','sauce'],['📦','store'],['🗑','trash'],['🌸','flower'],['🪷','krathong'],['🕯','candle']];
const EMO_RE = new RegExp(EMO.map(([e]) => '(' + e + ')\\uFE0F?').join('|'), 'gu');
const icoSpan = name => { const i = ICO.indexOf(name), sp = document.createElement('span'); sp.className = 'ico'; sp.setAttribute('aria-hidden', 'true');
  sp.style.setProperty('--x', i % 8); sp.style.setProperty('--y', (i/8)|0); return sp; };
const icoHTML = name => icoSpan(name).outerHTML;
const SKIP_ICO = /^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT|CANVAS)$/;
function iconizeText(tn){
  const txt = tn.nodeValue; EMO_RE.lastIndex = 0; if (!EMO_RE.test(txt)) return;
  const p = tn.parentNode; if (!p || SKIP_ICO.test(p.nodeName)) return;
  const frag = document.createDocumentFragment(); let last = 0; EMO_RE.lastIndex = 0;
  for (let m; (m = EMO_RE.exec(txt)); ){
    const gi = m.slice(1).findIndex(x => x !== undefined);           // which EMO entry matched
    if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
    frag.appendChild(icoSpan(EMO[gi][1])); last = m.index + m[0].length;
  }
  if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
  p.replaceChild(frag, tn);
}
function iconize(root){
  if (root.nodeType === 3) return iconizeText(root);
  if (root.nodeType !== 1 || SKIP_ICO.test(root.nodeName)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  for (let n; (n = w.nextNode()); ) list.push(n);                 // collect first, then replace (walker would break mid-edit)
  for (const n of list) iconizeText(n);
}
/* new / changed text anywhere in the page is converted in one batch per microtask (cheap regex test per text node) */
let icoQ = new Set(), icoPending = false;
new MutationObserver(ms => {
  for (const m of ms){ if (m.type === 'characterData') icoQ.add(m.target); else for (const n of m.addedNodes) icoQ.add(n); }
  if (!icoPending){ icoPending = true; queueMicrotask(() => { icoPending = false; const q = icoQ; icoQ = new Set(); for (const n of q) if (n.isConnected) iconize(n); }); }
}).observe(document.body, { childList:true, subtree:true, characterData:true });
iconize(document.body);
/* canvas: draw an atlas cell (tool cursor) — falls back to the emoji until the atlas is loaded */
const icoImg = new Image(); icoImg.src = 'icons/atlas.webp?v=' + APP_VER;   // version query busts the phone cache when the atlas changes
function drawIco(c, name, x, y, size, fallback){
  const i = ICO.indexOf(name);
  if (icoImg.complete && icoImg.naturalWidth && i >= 0) c.drawImage(icoImg, (i%8)*128, ((i/8)|0)*128, 128, 128, x - size/2, y - size/2, size, size);
  else { c.font = (size*.8|0) + 'px serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(fallback || '', x, y); }
}
