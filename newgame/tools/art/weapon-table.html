const G = [['⚔️ ดาบ / กระบอง / ค้อน มือเดียว', r => r.kind === 'one', '#c07a3a'], ['🗡️ อาวุธสองมือ (ฟันกวาด)', r => r.kind === 'two', '#b0503a'], ['🔱 หอก', r => r.kind === 'spear', '#3a7ab0'], ['🔪 มีด · 🦎 แส้', r => r.kind === 'knife' || r.kind === 'whip', '#7a5ab0'], ['🏹 ธนู (ยิงไกล)', r => r.kind === 'bow', '#4a9a5a']];
let h = '';
for (const [t, f, col] of G) { const L = R.filter(f).sort((a, b) => a.atk - b.atk); h += `<h2 style="background:${col}">${t} · ${L.length}</h2><table><tr><th></th><th>ชื่อ</th><th>ดาเมจ</th><th>มือ</th><th>ระยะ</th><th>หาได้จาก</th></tr>`;
  for (const x of L) { const src = tag(x.buy, 'buy', '🪙') + tag(x.craft, 'craft', '🔨') + tag(x.drop, 'drop', '💀') + tag(x.rew, 'rew', '🎁') || '<span class="t none">⚠️ ยังไม่มีทางได้</span>'; const hd = HAND[x.kind];
    h += `<tr><td class="p"><img src="${pic(x)}"></td><td class="n">${x.name}${x.magic ? ' ✨' : ''}${x.boom ? ' ↩️' : ''}</td><td class="a">${x.atk}</td><td><span class="t ${hd[1]}">${hd[0]}</span></td><td><span class="t ${x.kind === 'bow' ? 'rg' : 'ml'}">${RNG[x.kind]}</span></td><td>${src}</td></tr>` }
  h += '</table>' }
document.getElementById('out').innerHTML = h; window.__done = 1;
</script></body></html>
