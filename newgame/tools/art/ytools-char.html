<!doctype html><html><head><meta charset="utf-8"><title>KEALEE Y tools with the hero</title><style>body{margin:0;background:#1e1a2a;font:700 22px system-ui;color:#fff}#w{position:relative;width:1600px;height:700px}canvas{display:block}.lb{position:absolute;top:14px;width:400px;text-align:center}.lb small{display:block;font-size:15px;color:#c8c0e0;font-weight:600;margin-top:4px}</style></head><body><div id="w"></div>
<script type="module">
/* v4.88 mock: the hero with the new 🕸️ net and 🪢 rope (on the back · in the hand · thrown) */
import * as THREE from '../../lib/three.module.min.js';
import { part, ANIMALS } from '../../src/clay.js';
import { vinyl } from '../../src/vinyl.js';
const W = 1600, H = 700, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(W, H); document.getElementById('w').appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const S = new THREE.Scene(); S.background = new THREE.Color('#2a2440'); S.add(new THREE.HemisphereLight('#ffffff', '#605870', 1.5)); const k = new THREE.DirectionalLight('#ffffff', 2.3); k.position.set(-2, 5, 6); k.castShadow = true; k.shadow.camera.left = -9; k.shadow.camera.right = 9; k.shadow.camera.top = 5; k.shadow.camera.bottom = -5; k.shadow.mapSize.set(2048, 1024); S.add(k);
const cam = new THREE.OrthographicCamera(-8, 8, 3.5, -3.5, .1, 50); cam.position.set(0, 3, 10); cam.lookAt(0, .2, 0);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .8 }, o));
const netTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.strokeStyle = '#f4ecd8'; g.lineWidth = 7; for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32, 128); g.stroke(); g.beginPath(); g.moveTo(0, i * 32); g.lineTo(128, i * 32); g.stroke() } g.fillStyle = '#c8b890'; for (let i = 0; i <= 4; i++) for (let j = 0; j <= 4; j++) { g.beginPath(); g.arc(i * 32, j * 32, 5, 0, 6.3); g.fill() } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t })();
const netMat = rep => { const t = netTex.clone(); t.needsUpdate = true; t.repeat.set(...rep); return new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: .4, side: THREE.DoubleSide, roughness: .9 }) };
const ropeTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d'); g.fillStyle = '#b8884a'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#7a5428'; g.lineWidth = 6; for (let i = -64; i < 128; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 64); g.stroke() } g.strokeStyle = '#e0b878'; g.lineWidth = 2; for (let i = -60; i < 128; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 64); g.stroke() } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t })();
const ropeMat = u => { const t = ropeTex.clone(); t.needsUpdate = true; t.repeat.set(u, 1); return new THREE.MeshStandardMaterial({ map: t, roughness: .95 }) };
const tube = (pts, rad, u, closed = false) => { const cv = new THREE.CatmullRomCurve3(pts.map(p => p.isVector3 ? p : new THREE.Vector3(...p)), closed); const m = new THREE.Mesh(new THREE.TubeGeometry(cv, Math.max(24, pts.length * 12), rad, 10, closed), ropeMat(u)); m.castShadow = true; return m };
const GY = -1.6, X = [-6, -2, 2, 6];
const ground = x => { const g = new THREE.Mesh(new THREE.CircleGeometry(1.95, 48), M('#5a8a3a', { roughness: 1 })); g.rotation.x = -Math.PI / 2; g.position.set(x, GY, 0); g.receiveShadow = true; S.add(g) };
/* the held net (pole along +y, hoop at the top) */
const netHeld = () => { const g = new THREE.Group(); part(g, '#6a4024', '#a8703e', [0, -.2, 0], [.05, 1.1, .05], [0, 0, 0], { A: 0 }); part(g, '#4a2a18', '#7a4a2a', [0, -1.0, 0], [.065, .22, .065], [0, 0, 0], { A: 0 });
  const hoop = new THREE.Mesh(new THREE.TorusGeometry(.5, .045, 10, 32), M('#8a5a30')); hoop.position.set(0, 1.35, 0); hoop.rotation.x = Math.PI / 2 - .25; g.add(hoop);
  const bag = new THREE.Mesh(new THREE.ConeGeometry(.5, 1.0, 24, 6, true), netMat([4, 3])); bag.rotation.x = Math.PI - .25; bag.position.set(0, .78, .12); g.add(bag); g.traverse(o => o.isMesh && (o.castShadow = true)); return g };
const coil = () => { const g = new THREE.Group(); for (let i = 0; i < 5; i++) { const t = new THREE.Mesh(new THREE.TorusGeometry(.62 - i * .012, .07, 10, 40), ropeMat(18)); t.position.set((i - 2) * .03, (i - 2) * .025, (i - 2) * .05); t.rotation.set(0, (i - 2) * .06, (i - 2) * .05); t.castShadow = true; g.add(t) }
  for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.TorusGeometry(.11, .05, 8, 16), ropeMat(4)); w.position.set(s * .6, 0, 0); w.rotation.y = Math.PI / 2; g.add(w) } return g };
/* the hero (scaled to ~2.3 high) · arm pose · hand position */
const look = { v: 2, sex: 'm', skin: '#f2cfa6', hair: 'messy', wear: 'traveler', top: '#3a8ad8', legs: 'pants', eyes: 'round' };
const hero = (x, ry, arm) => { const g = new THREE.Group(); vinyl(g, look); const b = new THREE.Box3().setFromObject(g), h = b.max.y - b.min.y, s = 2.3 / h; g.scale.setScalar(s); g.position.set(x, GY - b.min.y * s, 0); g.rotation.y = ry; S.add(g);
  let A = null, Hd = null; g.traverse(o => { if (o.userData.role === 'armR') A = o; if (o.name === 'handR') Hd = o }); if (arm && A) { A.rotation.x = arm[0]; A.rotation.z = arm[1] || 0 } g.traverse(o => o.isMesh && (o.castShadow = true));
  g.updateMatrixWorld(true); const hp = new THREE.Vector3(); if (Hd) Hd.getWorldPosition(hp); return { g, hp, s } };

/* a folded net hung at the hip: a soft bundle of cord · lead weights peeking out · tied with a cord */
const netPack = () => { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.SphereGeometry(.5, 20, 14), M('#e8dcc0', { roughness: 1 })); b.scale.set(1, .8, .75); g.add(b); const o = new THREE.Mesh(new THREE.SphereGeometry(.53, 20, 14), netMat([5, 4])); o.scale.copy(b.scale); g.add(o);
  for (let i = 0; i < 7; i++) { const a = i / 7 * 6.283, w = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), M('#7a7a88', { roughness: .4, metalness: .3 })); w.position.set(Math.cos(a) * .42, -.3 + Math.sin(i * 2.1) * .06, Math.sin(a) * .32); g.add(w) }
  const t = new THREE.Mesh(new THREE.TorusGeometry(.3, .045, 8, 20), ropeMat(4)); t.rotation.x = Math.PI / 2; t.position.y = .28; g.add(t); g.traverse(o => o.isMesh && (o.castShadow = true)); return g };
const atHips = (g, s, kc = 1) => { const n = netPack(); n.scale.setScalar(.3 / s); n.position.set(-.44 / s, .72 / s, .04 / s); g.add(n); const c = coil(); c.scale.setScalar(.21 * kc / s); c.position.set(.44 / s, .78 / s, -.02 / s); c.rotation.set(0, Math.PI / 2 + .2, -.15); g.add(c) };
const castNet = (cx, cz, y, R0, open) => { const geo = new THREE.SphereGeometry(R0, 28, 10, 0, Math.PI * 2, 0, Math.PI / (open ? 2.2 : 3.2)); const net = new THREE.Mesh(geo, netMat([6, 3])); net.scale.set(1, open ? .95 : .55, 1); net.position.set(cx, y, cz); net.castShadow = true; S.add(net);
  const th = Math.PI / (open ? 2.2 : 3.2); for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283, rr = R0 * Math.sin(th); const w = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 8), M('#7a7a88', { roughness: .4, metalness: .3 })); w.position.set(cx + Math.cos(a) * rr, y + Math.cos(th) * R0 * net.scale.y, cz + Math.sin(a) * rr); S.add(w) } return net };
const dots = (pts) => pts.forEach(p => { const sp = new THREE.Mesh(new THREE.SphereGeometry(.035, 6, 6), new THREE.MeshBasicMaterial({ color: '#ffffff' })); sp.position.copy(p); S.add(sp) });

/* ① walking: the net bundle on the left hip · the rope coil on the right */
{ ground(X[0]); const { g, s } = hero(X[0], -.35); atHips(g, s) }
/* ② net chosen (Y): the bundle comes off the hip into the right hand, ready to throw · white circle ahead */
{ ground(X[1]); const { g, hp, s } = hero(X[1] - .7, .7, [-1.3, .15]); atHips(g, s); g.children.filter(c => c.children.length && c.scale.x < 1 && c.position.x < 0).forEach(c => c.visible = false);
  const n = netPack(); n.scale.setScalar(.34); n.position.copy(hp).add(new THREE.Vector3(.08, .05, .12)); S.add(n);
  const ring = new THREE.Mesh(new THREE.RingGeometry(.62, .7, 40), new THREE.MeshBasicMaterial({ color: '#ffffff' })); ring.rotation.x = -Math.PI / 2; ring.position.set(X[1] + 1.1, GY + .02, .3); S.add(ring) }
/* ③ rope chosen (Y): the coil comes off the hip into the right hand · loose end hanging · white circle ahead */
{ ground(X[2]); const { g, hp, s } = hero(X[2] - .7, .7, [-1.3, .15]); atHips(g, s); g.children.filter(c => c.children.length && c.scale.x < 1 && c.position.x > 0).forEach(c => c.visible = false);
  const c = coil(); c.scale.setScalar(.25); c.position.copy(hp).add(new THREE.Vector3(.1, .05, .15)); c.rotation.set(.2, .4, 0); S.add(c);
  S.add(tube([hp.clone().add(new THREE.Vector3(.3, -.1, .2)), hp.clone().add(new THREE.Vector3(.35, -.5, .25)), hp.clone().add(new THREE.Vector3(.25, -.8, .2))], .03, 6));
  const ring = new THREE.Mesh(new THREE.RingGeometry(.55, .62, 40), new THREE.MeshBasicMaterial({ color: '#ffffff' })); ring.rotation.x = -Math.PI / 2; ring.position.set(X[2] + 1.1, GY + .02, .3); S.add(ring) }
/* ④ the rope shoots out as a line to the dropped thing · the coil shrinks at the hip */
{ ground(X[3]); const { g, hp, s } = hero(X[3] - 1.1, 1.0, [-1.6, .1]); atHips(g, s, .75);
  const bx = X[3] + 1.0, bd = new THREE.Group(); part(bd, '#a8301e', '#e8604a', [0, .18, 0], [.32, .18, .26], [0, .4, 0], { A: .08 }); part(bd, '#e8d8b0', '#fff6e0', [.1, .36, .05], [.08, .1, .08], [0, 0, .4], { A: .05 }); bd.scale.setScalar(1.1); bd.position.set(bx, GY, .2); S.add(bd);
  const ring = new THREE.Mesh(new THREE.RingGeometry(.55, .62, 40), new THREE.MeshBasicMaterial({ color: '#ffffff' })); ring.rotation.x = -Math.PI / 2; ring.position.set(bx, GY + .02, .2); S.add(ring);
  S.add(tube([hp, new THREE.Vector3((hp.x + bx) / 2, hp.y + .25, .2), new THREE.Vector3(bx - .1, GY + .35, .2)], .035, 12)); const kn = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), ropeMat(2)); kn.position.set(bx - .1, GY + .35, .2); S.add(kn) }

r.render(S, cam);
const L = [['① เดินปกติ', 'ตาข่ายพับ (ซ้าย) · ขดเชือก (ขวา) ที่เอว'], ['② เลือกตาข่าย (Y)', 'หยิบห่อตาข่ายจากเอวมาถือ · วงขาวข้างหน้า'], ['③ เลือกเชือก (Y)', 'หยิบขดเชือกจากเอวมาถือ · ปลายห้อย'], ['④ เหวี่ยงเชือก', 'เชือกพุ่งเป็นเส้นไปที่ของ แล้วดึงกลับ']];
L.forEach(([t, s], i) => { const d = document.createElement('div'); d.className = 'lb'; d.style.left = (i * 400) + 'px'; d.innerHTML = t + '<small>' + s + '</small>'; document.getElementById('w').appendChild(d) });
window.done = 1;
</script></body></html>
