<script type="module">
/* v4.77 mock: 🔨 enhance aura levels (+0 · +3 · +6 · +9 · +10) — knightSword */

import { WEAPON_MESH } from '../../src/weapons.js';
const W = 1600, H = 620, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(W, H); document.getElementById('w').appendChild(r.domElement);

LV.forEach(([t, name, a], i) => { const x = -6.4 + i * 3.2, g = new THREE.Group(); WEAPON_MESH.knightSword(g); g.rotation.set(0, .5, -.25); g.scale.setScalar(3); g.position.set(x, -.3, 0); S.add(g);
  if (a) { const [col, op, n] = a;

    if (t === '+10') for (let j = 0; j < 7; j++) { const ray = new THREE.Mesh(new THREE.PlaneGeometry(.12, 3.6), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .35, blending: THREE.AdditiveBlending, depthWrite: false })); ray.position.set(x, .2, -.6); ray.rotation.z = j / 7 * Math.PI; S.add(ray) } }
  const lb = document.createElement('div'); lb.className = 'lb'; lb.style.left = i * 320 + 'px'; lb.innerHTML = `${t}<small>${name}</small>`; document.getElementById('w').appendChild(lb) });
const cam = new THREE.OrthographicCamera(-8, 8, 3.1, -3.1, .1, 50); cam.position.set(0, 0, 20); cam.lookAt(0, 0, 0); r.render(S, cam); window.__done = 1;
