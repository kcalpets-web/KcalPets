<!doctype html><html><head><meta charset="utf-8"><title>KEALEE throne arena</title><style>body{margin:0;background:#111}</style></head><body>
<script type="module">
/* v5.46 preview (designer): the grand throne hall of Luminia = the dark cloud's arena · the six kingdom bosses appear one by one, then all fight at once
   #wide = the whole hall · #walk = the walk-in shot (hero on the carpet, bosses rising) */
import { THREE, HUMANS } from '../../src/clay.js';
import { sandWorm, iceGiant, demonTree, boneGiant, lavaDemon } from '../../src/bosses.js';
import { eel } from '../../src/eel.js';
const W = 1200, H = 760, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1.5); r.setSize(W, H); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const S = new THREE.Scene(); S.background = new THREE.Color('#1c1626'); S.fog = new THREE.Fog('#1c1626', 46, 110);
S.add(new THREE.HemisphereLight('#c8c0ff', '#3a2a30', .9)); const sun = new THREE.DirectionalLight('#ffe8c8', 1.6); sun.position.set(-14, 40, 22); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 120 }); S.add(sun);
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .85, flatShading: true }, o));
const M = { floor: std('#d8d0c4', { roughness: .5, flatShading: false }), tile: std('#a89c8c'), stone: std('#e8e0d0'), dark: std('#8a8070'), gold: std('#e8b840', { metalness: .5, roughness: .35 }), red: std('#a82430', { roughness: 1 }), redd: std('#6a1420'), water: new THREE.MeshStandardMaterial({ color: '#3a8ab8', roughness: .15, metalness: .1, transparent: true, opacity: .9 }), glass: new THREE.MeshStandardMaterial({ color: '#7a4ac8', emissive: '#5a2aa8', emissiveIntensity: .6, roughness: .3 }), cloud: std('#2a2238', { transparent: true, opacity: .92 }), cloud2: std('#3e3054', { transparent: true, opacity: .85 }), glow: new THREE.MeshBasicMaterial({ color: '#c070ff' }), crack: std('#3a2a20') };
const add = (geo, m, x, y, z, rx = 0, ry = 0, rz = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.set(rx, ry, rz); o.castShadow = o.receiveShadow = true; S.add(o); return o };
const box = (x, y, z, w, h, d, m) => add(new THREE.BoxGeometry(w, h, d), m, x, y + h / 2, z);
const at = (fn, x, z, ry, s, y = 0) => { const g = new THREE.Group(); fn(g); g.position.set(x, y, z); g.rotation.y = ry; g.scale.setScalar(s); g.traverse(o => { if (o.isMesh) o.castShadow = true }); S.add(g); return g };
/* the hall: 56 × 70 · marble floor with a tile grid · the red carpet from the door (+z) to the throne (−z) */
const HW = 19, HD = 25; add(new THREE.PlaneGeometry(HW * 2, HD * 2), M.floor, 0, 0, 0, -Math.PI / 2).castShadow = false;
for (let i = -4; i <= 4; i++) { box(i * 4.6, .01, 0, .12, .02, HD * 2, M.tile); } for (let j = -5; j <= 5; j++) box(0, .01, j * 4.8, HW * 2, .02, .12, M.tile);
box(0, .02, 2, 5, .06, HD * 2 - 6, M.red); for (const sx of [-1, 1]) box(sx * 2.6, .03, 2, .3, .06, HD * 2 - 6, M.gold);
/* walls · tall windows of violet glass · two rows of columns with gold capitals */
for (const sx of [-1, 1]) { box(sx * HW, 0, 0, 1.4, 30, HD * 2, M.stone); for (let j = -2; j <= 2; j++) { box(sx * (HW - .75), 6, j * 9, .2, 10, 3.2, M.glass); add(new THREE.CircleGeometry(1.6, 16, 0, Math.PI), M.glass, sx * (HW - .74), 16, j * 9, 0, -sx * Math.PI / 2, 0) } }
box(0, 0, -HD, HW * 2, 30, 1.4, M.stone); box(0, 0, HD, HW * 2, 30, 1.4, M.stone); box(0, 0, HD - .6, 8, 12, .4, M.redd);
for (const sx of [-1, 1]) for (let j = -2; j <= 2; j++) { const x = sx * 11.5, z = j * 9.5; add(new THREE.CylinderGeometry(1, 1.15, 24, 14), M.stone, x, 12, z); box(x, 0, z, 2.8, .8, 2.8, M.dark); box(x, 24, z, 2.8, 1, 2.8, M.gold) }
/* the throne on a dais at the back · banners behind it (black while the cloud holds the city) */
for (let i = 0; i < 4; i++) box(0, 0, -HD + 6 - i * .9, 14 - i * 2, .5 + i * .5, 2 + (3 - i) * .9, i % 2 ? M.dark : M.stone);
box(0, 2.5, -HD + 3.2, 3.6, 7, 1.2, M.gold); box(0, 2.5, -HD + 4.2, 3, 1.2, 2.4, M.red); for (const sx of [-1, 1]) box(sx * 1.7, 2.5, -HD + 4.2, .5, 2.2, 2.4, M.gold); add(new THREE.SphereGeometry(.5, 10, 8), M.glow, 0, 10.2, -HD + 3.2);
for (const sx of [-1, 1]) add(new THREE.PlaneGeometry(3, 9), std('#1a1020', { side: THREE.DoubleSide }), sx * 7, 12, -HD + .8);
/* the dark cloud swirling under the high vaults (the cloud boss comes down from here) */
for (let i = 0; i < 26; i++) { const a = i / 26 * 6.283, r0 = 5 + (i % 3) * 4; add(new THREE.IcosahedronGeometry(2.2 + (i % 3) * .8, 1), i % 2 ? M.cloud : M.cloud2, Math.cos(a) * r0, 27 + (i % 4), -4 + Math.sin(a) * r0 * .9) }
for (let i = 0; i < 5; i++) add(new THREE.CylinderGeometry(.08, .2, 6 + i, 5), M.glow, (i - 2) * 4, 23, -6 + (i % 2) * 3, .3 * (i - 2), 0, .2);
/* the arena features: 🌊 a pool for the eel (left) · 🪱 a cracked sand pit for the worm (right) · 🌳 roots through the floor · 🌋 a lava crack */
add(new THREE.CylinderGeometry(7.5, 7.5, .4, 32), M.dark, -11, .2, 5); add(new THREE.CylinderGeometry(6.8, 6.8, .42, 32), M.water, -11, .22, 5);
add(new THREE.CylinderGeometry(6.5, 7, .1, 20), std('#d8b878'), 11, .06, 6); for (let i = 0; i < 8; i++) box(11 + Math.cos(i) * 5.5, .05, 6 + Math.sin(i) * 5.5, 3, .1, .4, M.crack).rotation.y = i;
for (let i = 0; i < 9; i++) box(-6 + i * .8, .05, -13 + Math.sin(i) * 2, 1.2, .12, .3, std('#ff6a20', { emissive: '#ff4a00', emissiveIntensity: 1.2 })).rotation.y = i * .7;
/* the six bosses (rising one by one in the cut-scene · all fighting at once after) · the hero on the carpet */
const BOSS = [
  [g => eel(g, { sparks: 1 }), -11, 5, .9, 1.1, -.3],
  [g => sandWorm(g), 11, 6, -.9, 1, 0],
  [g => demonTree(g), -12, -9, .6, 1, 0],
  [g => iceGiant(g), 12, -8, -.6, 1, 0],
  [g => lavaDemon(g), -5, -14, .25, 1, 0],
  [g => boneGiant(g), 5, -15, -.25, 1, 0]];
const WALK = location.hash === '#walk';
for (const [fn, x, z, ry, s, y] of BOSS) at(fn, x, z, ry, s, y);
at(HUMANS.kealee, 0, WALK ? 17 : 9, Math.PI, .82);
for (const L of [[-11, 5, '#5ac8ff'], [11, 6, '#ffb040'], [-12, -9, '#6aff8a'], [12, -8, '#9ad8ff'], [-5, -14, '#ff6a20'], [5, -15, '#c8a0ff']]) { const p = new THREE.PointLight(L[2], 30, 18); p.position.set(L[0], 6, L[1]); S.add(p) }
const cam = new THREE.PerspectiveCamera(WALK ? 42 : 46, W / H, .1, 200);
if (WALK) { cam.position.set(1.8, 3, 22.5); cam.lookAt(0, 5, -6) } else { cam.position.set(0, 21, 23); cam.lookAt(0, 0, -5) }
r.render(S, cam); window.done = 1;
</script></body></html>
