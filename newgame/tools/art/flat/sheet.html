<!doctype html><html><head><meta charset="utf-8"><title>KEALEE flat icons</title><script src="list.js"></script>
<style>body{margin:0;background:#a8a05a;font-family:system-ui}.g{display:grid;grid-template-columns:repeat(8,120px);gap:14px;padding:20px;width:max-content}
.c{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font:700 13px system-ui;text-shadow:0 1px 2px #000a}
.b{width:96px;height:96px;border-radius:50%;border:5px solid #241a2a;display:grid;place-items:center;box-shadow:0 5px 0 #0004}.b img{width:60px;height:60px}
h1{color:#fff;font:900 20px system-ui;margin:16px 20px 0;text-shadow:0 1px 2px #0008}</style></head><body>
<h1>KEALEE · ไอคอนวาดเองครบชุด (64) — ใช้แทน emoji บนปุ่ม</h1><div class="g" id="g"></div>
<script>const C = ['#4e86d6', '#e2b444', '#dd6a50', '#5aa86a']; document.getElementById('g').innerHTML = ICONS.map(([e, k], i) => `<div class="c"><div class="b" style="background:${C[i % 4]}"><img src="../../../assets/icons/${k}.svg"></div>${e}</div>`).join('')</script></body></html>
