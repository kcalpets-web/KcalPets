<!doctype html><html lang="th"><head><meta charset="utf-8"><title>KEALEE · our chibi on KRIG</title>
<style>body{margin:0;background:#f4efe6}canvas{display:block}</style></head><body>
<script type="module">
/* v3.49 preview: the game's own chibi (vinyl.js · the look the player makes) on the standard KRIG bones · the 10 shared clips · other looks on the same rig */
import * as THREE from '../../lib/three.module.min.js';
import { vinyl } from '../../src/vinyl.js';
import { krigVinyl, posevinyl, CLIP_TH } from '../../src/krig.js';
const W = 1800, H = 1860, R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(W, H); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.shadowMap.enabled = true; R.setScissorTest(true); document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.add(new THREE.HemisphereLight('#fff6ec', '#b8a890', 1.35)); const key = new THREE.DirectionalLight('#fff1dc', 2.3); key.position.set(-2, 4, 4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -1.4, right: 1.4, top: 2.4, bottom: -.4 }); S.add(key); const rim = new THREE.DirectionalLight('#dce8ff', 1); rim.position.set(3, 2, -4); S.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 40), new THREE.ShadowMaterial({ opacity: .18 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; S.add(floor);
const ME = { v: 2, sex: 'm', skin: '#f2dcc8', hair: 'afro', hairCol: '#2a1a14', glasses: 'round', mouth: 'cat', top: '#1e1e22', wear: 'traveler', eyes: 'round' };
const LOOKS = [ME, { v: 2, sex: 'f', skin: '#f9e0d2', hair: 'long', hairCol: '#9a5a34', top: '#d84a9a', bottom: 'skirt', wear: 'traveler', eyes: 'round' }, { v: 2, sex: 'm', skin: '#e2b183', hair: 'spiky', hairCol: '#3a2418', top: '#3a8ad8', wear: 'knight', eyes: 'smile' }];
const make = (look, clip, t, yaw) => () => { const r = new THREE.Group(); vinyl(r, look); krigVinyl(r); posevinyl(r, clip, t); r.rotation.y = yaw; return r };
const cells = [], add = (x, y, w, h, build, label, cam = [0, 1.05, 4.6], look = [0, .92, 0]) => cells.push({ x, y, w, h, build, label, cam, look });
const C10 = [['idle', .5], ['walk', .25], ['run', .15], ['jump', .55], ['sit', .3], ['wave', .3], ['attack', .32], ['hurt', .15], ['fall', .3], ['cheer', .4]];
C10.forEach(([c, t], i) => add((i % 5) * 360, Math.floor(i / 5) * 620, 360, 600, make(ME, c, t, c === 'walk' || c === 'run' ? .9 : .35), `${CLIP_TH[c]} · ${c}`, c === 'jump' || c === 'cheer' || c === 'fall' ? [0, 1.25, 5.2] : undefined, c === 'jump' || c === 'cheer' || c === 'fall' ? [0, 1.1, 0] : undefined));
[[1, 'wave', .3], [1, 'walk', .25], [1, 'sit', .3], [2, 'attack', .32], [2, 'run', .15], [2, 'cheer', .4]].forEach(([l, c, t], i) => add(i * 300, 1240, 300, 600, make(LOOKS[l], c, t, c === 'walk' || c === 'run' ? .9 : .35), `ตัวอื่น · ${CLIP_TH[c]}`, c === 'cheer' ? [0, 1.25, 5.2] : undefined, c === 'cheer' ? [0, 1.1, 0] : undefined));
for (const c of cells) { const g = c.build(); S.add(g); g.updateMatrixWorld(true); const cam = new THREE.PerspectiveCamera(30, c.w / c.h, .05, 30); cam.position.set(...c.cam); cam.lookAt(...c.look);
  R.setViewport(c.x, H - c.y - c.h, c.w, c.h); R.setScissor(c.x, H - c.y - c.h, c.w, c.h); R.setClearColor('#f4efe6'); R.clear(); R.render(S, cam); S.remove(g) }
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.drawImage(R.domElement, 0, 0); g.font = '700 20px system-ui'; g.fillStyle = '#3a2a30'; g.textAlign = 'center'; for (const c of cells) g.fillText(c.label, c.x + c.w / 2, c.y + c.h - 14);
g.textAlign = 'left'; g.font = '800 24px system-ui'; g.fillText('ตัวละครแบบเดิมของเกม + Rig มาตรฐาน · ท่าทาง 10 แบบ', 16, 32);
document.body.replaceChildren(cv); window.__done = true;
</script></body></html>
