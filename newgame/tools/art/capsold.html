<!doctype html><html><head><meta charset="utf-8"><title>KEALEE old castles</title><style>body{margin:0;background:#2a2638;font:700 16px system-ui;color:#fff}#w{position:relative;width:1800px;height:900px}.lb{position:absolute;width:600px;text-align:center;text-shadow:0 2px 3px #000}</style></head><body><div id="w"></div>
<script type="module">

</script></body></html>
