<!doctype html><html><head><meta charset="utf-8"><title>Luminia ruins preview</title><style>html,body{margin:0;background:#9ac8e8}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from '../../lib/three.module.min.js';
import { buildLumCity } from '../../src/lumcity.js';
const W = 1200, H = 800, R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(W, H); R.shadowMap.enabled = true; R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#a8d0ec'); S.fog = new THREE.Fog('#c8dcea', 90, 260);
S.add(new THREE.HemisphereLight('#fff4e0', '#5a6a4a', 1.1)); const sun = new THREE.DirectionalLight('#fff0d8', 2.2); sun.position.set(-60, 90, 50); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, far: 300 }); S.add(sun);
const g = new THREE.Mesh(new THREE.CylinderGeometry(52, 62, 7, 48), new THREE.MeshStandardMaterial({ color: '#6a9a4a', roughness: 1 })); g.position.y = 3.5; g.receiveShadow = true; S.add(g);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: '#5a8a42', roughness: 1 })); fl.rotation.x = -Math.PI / 2; S.add(fl);
for (let i = 0; i < 160; i++) { const a = Math.random() * 6.28, r = 64 + Math.random() * 90, t = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + Math.random() * 3, 0), new THREE.MeshStandardMaterial({ color: i % 2 ? '#4f8f3c' : '#3e7a30', flatShading: true })); t.position.set(Math.cos(a) * r, 4 + Math.random() * 3, Math.sin(a) * r); S.add(t) }
const C = buildLumCity(0, 0, 7, 0); C.G.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true } }); S.add(C.G);
const cam = new THREE.PerspectiveCamera(42, W / H, .5, 900);
window.shot = (p, l) => { cam.position.set(...p); cam.lookAt(...l); R.render(S, cam); return true };
window.ready = true;
</script></body></html>
