<script type="module">
/* v3.49 preview of src/krig-hero.js: three adventurers on the standard KRIG bones · stance · front / back · walking (the shared clip) */
import * as THREE from '../../lib/three.module.min.js';
import { makeHero, stance, HERO_BODY } from '../../src/krig-hero.js';
import { poseAt } from '../../src/krig.js';
const W = 1800, H = 1250, R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(W, H); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.shadowMap.enabled = true; R.setScissorTest(true); document.body.appendChild(R.domElement);
