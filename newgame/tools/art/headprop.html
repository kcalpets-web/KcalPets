<!doctype html><html lang="th"><head><meta charset="utf-8"><title>KEALEE head height</title><style>body{margin:0;background:#f4ead8}canvas{display:block}</style></head><body>
<script type="module">
/* v4.30 preview: the designer's sketch — a lower crown (the top of the head above the eyes squeezed) · A = now · B · C · D lower */
import * as THREE from '../../lib/three.module.min.js';
import { vinyl, VPROP, HEAD_BROW } from '../../src/vinyl.js';
const HATS = ['none', 'beanie', 'cap', 'baseball', 'wizard', 'crown', 'sailor', 'knight', 'straw', 'catEars', 'bunnyEars', 'beret', 'headband', 'ribbon', 'goggles', 'leafhood', 'divemask', 'hood', 'flower', 'starClip', 'helmet'];
const HAIRS = ['messy', 'bob', 'pony', 'spiky', 'afro', 'twin', 'long'];
const CW = 215, CH = 290, R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setSize(CW, CH - 40); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
const S = new THREE.Scene(); S.add(new THREE.HemisphereLight('#ffffff', '#c8b8a0', 1.6)); const sun = new THREE.DirectionalLight('#fff4e0', 2.4); sun.position.set(2, 4, 3); S.add(sun);
const COLS = 6, CELLS = HATS.map((h, i) => ({ hat: h, hair: HAIRS[i % HAIRS.length] }));
const cv = document.createElement('canvas'); cv.width = CW * COLS; cv.height = CH * Math.ceil(CELLS.length / COLS) + 60; const x = cv.getContext('2d'); x.fillStyle = '#f4ead8'; x.fillRect(0, 0, cv.width, cv.height);
x.font = '900 24px system-ui'; x.fillStyle = '#3a2a30'; x.fillText('หัว C · ขอบล่างหมวกอยู่ที่แนวคิ้ว (เส้นแดงล่าง) · ไม่สูงเกินเส้นแดงบน', 16, 40);
const ref = (() => { const g = new THREE.Group(); vinyl(g, { v: 2, hat: 'beanie', hair: 'messy', prop: { ...VPROP, headTop: .7, hatKeep: true } }); g.updateMatrixWorld(true); return new THREE.Box3().setFromObject(g) })();
CELLS.forEach((L, i) => { const g = new THREE.Group(); vinyl(g, { v: 2, skin: '#f2cfa6', eyes: 'round', eyeCol: '#4a3020', sex: i % 2 ? 'f' : 'm', hairCol: ['#2a2228', '#7a4428', '#d0a040', '#5a3020'][i % 4], wear: 'traveler', top: ['#3a8ad8', '#d86a5a', '#5a8a42'][i % 3], legs: 'pants', legCol: '#3a3f58', ...L, prop: { ...VPROP, headTop: .7, hatKeep: true } }); S.add(g); g.updateMatrixWorld(true);
  const ce = new THREE.Vector3(0, (ref.min.y + ref.max.y) / 2, 0), sz = ref.getSize(new THREE.Vector3()), cam = new THREE.PerspectiveCamera(28, CW / (CH - 40), .05, 50); cam.position.set(0, ce.y, sz.y * 2.4); cam.lookAt(ce);
  R.setClearColor(0, 0); R.clear(); R.render(S, cam); S.remove(g); const cx = (i % COLS) * CW, cy = 60 + Math.floor(i / COLS) * CH; x.fillStyle = '#fffaf2'; x.beginPath(); x.roundRect(cx + 6, cy + 4, CW - 12, CH - 10, 16); x.fill(); x.drawImage(R.domElement, cx, cy + 4);
  const ty = (() => { const v = new THREE.Vector3(0, ref.max.y, 0).project(cam); return cy + 4 + (1 - v.y) / 2 * (CH - 40) })(); x.strokeStyle = '#e03a3a'; x.setLineDash([6, 5]); x.beginPath(); x.moveTo(cx + 14, ty); x.lineTo(cx + CW - 14, ty); x.stroke(); { const hd = g.getObjectByName('head'); hd.updateMatrixWorld(true); const v = new THREE.Vector3(0, HEAD_BROW, 0).applyMatrix4(hd.matrixWorld).project(cam), by = cy + 4 + (1 - v.y) / 2 * (CH - 40); x.beginPath(); x.moveTo(cx + 14, by); x.lineTo(cx + CW - 14, by); x.stroke() } x.setLineDash([]);
  x.font = '800 17px system-ui'; x.fillStyle = '#3a2a30'; x.textAlign = 'center'; x.fillText(L.hat, cx + CW / 2, cy + CH - 16); x.textAlign = 'left' });
document.body.replaceChildren(cv); window.__done = true;
</script></body></html>
