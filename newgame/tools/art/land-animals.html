<!doctype html><html><head><meta charset="utf-8"><title>KEALEE land animals</title><style>body{margin:0}</style></head><body>
<script type="module">
/* v5.48 preview (designer): each land's own animals · two rows by kingdom · the hero for size */
import { THREE, HUMANS, ANIMALS } from '../../src/clay.js';
const W = 1500, H = 760, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1.5); r.setSize(W, H); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const S = new THREE.Scene(); S.background = new THREE.Color('#eef0ea'); S.add(new THREE.HemisphereLight('#ffffff', '#b8b0a0', 1.2)); const sun = new THREE.DirectionalLight('#fff4e0', 2); sun.position.set(-4, 8, 6); sun.castShadow = true; Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 10, bottom: -10 }); S.add(sun);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshStandardMaterial({ color: '#d8d4c4' })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; S.add(fl);
const put = (fn, x, z, s = 1, ry = .5) => { const g = new THREE.Group(); fn(g); g.position.set(x, 0, z); g.rotation.y = ry; g.scale.setScalar(s); g.traverse(o => { if (o.isMesh) o.castShadow = true }); S.add(g) };
const row1 = ['crab', 'seal', 'squirrel', 'goat', 'fireLizard', 'camel'], row2 = ['fox', 'penguin', 'reindeer', 'crow', 'bat'];
row1.forEach((k, i) => put(ANIMALS[k], -6.2 + i * 2.5, -1.4, 1.3));
row2.forEach((k, i) => put(ANIMALS[k], -5 + i * 2.5, 1.8, 1.3));
put(HUMANS.kealee, 7.6, 1.8, .82, -.3);
const cam = new THREE.PerspectiveCamera(40, W / H, .1, 100); cam.position.set(0, 4.2, 11); cam.lookAt(0, .5, .2); r.render(S, cam); window.done = 1;
</script></body></html>
