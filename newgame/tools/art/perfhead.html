<!doctype html><html><head><meta charset="utf-8"><title>head perf</title></head><body><script type="module">
/* v4.48 how much the lower crown (headWarp) costs: build 40 characters with and without it */
import * as THREE from '../../lib/three.module.min.js';
import { vinyl, VPROP } from '../../src/vinyl.js';
const hats = ['none', 'beanie', 'straw', 'leafhood', 'wizard', 'hood', 'crown', 'knight'], hairs = ['messy', 'bob', 'pony', 'afro', 'long', 'spiky'];
const run = (prop) => { const t0 = performance.now(); let geo = 0, tri = 0; for (let i = 0; i < 40; i++) { const g = new THREE.Group(); vinyl(g, { v: 2, hat: hats[i % hats.length], hair: hairs[i % hairs.length], wear: 'traveler', prop }); g.traverse(o => { if (o.isMesh) { geo++; tri += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3 } }) } return { ms: +(performance.now() - t0).toFixed(0), perChar: +((performance.now() - t0) / 40).toFixed(1), meshes: geo / 40, tris: Math.round(tri / 40) } };
run(VPROP); const A = run({ ...VPROP, headTop: 1, hatKeep: false }), B = run(VPROP);
window.__res = { noWarp: A, warp: B }; window.__done = true;
</script></body></html>
