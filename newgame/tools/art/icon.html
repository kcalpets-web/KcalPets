<!doctype html>
<html><head><meta charset="utf-8"><title>KEALEE icon</title><style>body{margin:0}</style></head>
<body>
<script type="module">
/* App icon: Kealee's clay portrait on a sunset sky. Shot by shoot-icon.js → newgame/icon-512.png, icon-192.png, apple-touch-icon.png */
import { THREE, HUMANS } from '../../src/clay.js';
const N = 512, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(N, N); r.setPixelRatio(1); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
gr.addColorStop(0, '#4a3a8a'); gr.addColorStop(.55, '#ff8a6a'); gr.addColorStop(1, '#ffd08a'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
const S = new THREE.Scene(), bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace; S.background = bg;
S.add(new THREE.HemisphereLight('#fff6ec', '#a08070', 1.1)); const k = new THREE.DirectionalLight('#fff1dc', 2.2); k.position.set(-3, 4, 6); S.add(k);
const rim = new THREE.DirectionalLight('#ffd0a0', 1.6); rim.position.set(3, 3, -5); S.add(rim);
const kl = new THREE.Group(); HUMANS.kealee(kl); kl.rotation.y = .25; S.add(kl);
const cam = new THREE.PerspectiveCamera(30, 1, .1, 50); cam.position.set(.25, 1.62, 2.6); cam.lookAt(.03, 1.56, 0);
r.render(S, cam); window.__done = 1;
</script></body></html>
