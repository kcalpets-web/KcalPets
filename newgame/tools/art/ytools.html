<!doctype html><html><head><meta charset="utf-8"><title>KEALEE Y tools</title><style>body{margin:0;background:#1e1a2a;font:700 22px system-ui;color:#fff}#w{position:relative;width:1600px;height:640px}canvas{display:block}.lb{position:absolute;top:16px;width:400px;text-align:center}.lb small{display:block;font-size:15px;color:#c8c0e0;font-weight:600;margin-top:4px}</style></head><body><div id="w"></div>
<script type="module">
/* v4.88 mock: 🕸️ net (held · thrown) · 🪢 rope (held coil · thrown lasso) — clay style, for the ground-circle Y tools */
import * as THREE from '../../lib/three.module.min.js';
import { part, ANIMALS } from '../../src/clay.js';
const W = 1600, H = 640, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(W, H); document.getElementById('w').appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const S = new THREE.Scene(); S.background = new THREE.Color('#2a2440'); S.add(new THREE.HemisphereLight('#ffffff', '#605870', 1.4)); const k = new THREE.DirectionalLight('#ffffff', 2.4); k.position.set(-2, 4, 5); k.castShadow = true; S.add(k);
const cam = new THREE.OrthographicCamera(-8, 8, 3.2, -3.2, .1, 50); cam.position.set(0, 2.2, 10); cam.lookAt(0, 0, 0);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .8 }, o));
/* a net texture: a square mesh of cord, transparent holes */
const netTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.strokeStyle = '#f4ecd8'; g.lineWidth = 7; for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32, 128); g.stroke(); g.beginPath(); g.moveTo(0, i * 32); g.lineTo(128, i * 32); g.stroke() } g.fillStyle = '#c8b890'; for (let i = 0; i <= 4; i++) for (let j = 0; j <= 4; j++) { g.beginPath(); g.arc(i * 32, j * 32, 5, 0, 6.3); g.fill() } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t })();
const netMat = rep => { const t = netTex.clone(); t.needsUpdate = true; t.repeat.set(...rep); return new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: .4, side: THREE.DoubleSide, roughness: .9 }) };
/* a rope texture: twisted strands */
const ropeTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 64; const g = c.getContext('2d'); g.fillStyle = '#b8884a'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#7a5428'; g.lineWidth = 6; for (let i = -64; i < 128; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 64); g.stroke() } g.strokeStyle = '#e0b878'; g.lineWidth = 2; for (let i = -60; i < 128; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 64); g.stroke() } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t })();
const ropeMat = (u) => { const t = ropeTex.clone(); t.needsUpdate = true; t.repeat.set(u, 1); return new THREE.MeshStandardMaterial({ map: t, roughness: .95 }) };
const tube = (pts, rad, u, closed = false) => { const cv = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), closed); const m = new THREE.Mesh(new THREE.TubeGeometry(cv, Math.max(24, pts.length * 12), rad, 10, closed), ropeMat(u)); m.castShadow = true; return m };
const ground = x => { const g = new THREE.Mesh(new THREE.CircleGeometry(1.7, 40), M('#5a8a3a', { roughness: 1 })); g.rotation.x = -Math.PI / 2; g.position.set(x, -1.2, 0); g.receiveShadow = true; S.add(g) };
const X = [-6, -2, 2, 6];

/* ① the net in the hand: a wooden pole · a bent-wood hoop · a deep bag of cord · a leather grip */
{ const g = new THREE.Group(); part(g, '#6a4024', '#a8703e', [0, -.2, 0], [.05, 1.1, .05], [0, 0, 0], { A: 0 }); part(g, '#4a2a18', '#7a4a2a', [0, -1.0, 0], [.065, .22, .065], [0, 0, 0], { A: 0 });
  const hoop = new THREE.Mesh(new THREE.TorusGeometry(.5, .045, 10, 32), M('#8a5a30')); hoop.position.set(0, 1.35, 0); hoop.rotation.x = Math.PI / 2 - .25; g.add(hoop);
  const bag = new THREE.Mesh(new THREE.ConeGeometry(.5, 1.0, 24, 6, true), netMat([4, 3])); bag.rotation.x = Math.PI - .25; bag.position.set(0, 1.28 - .5, .12); g.add(bag); const knot = new THREE.Mesh(new THREE.SphereGeometry(.06, 10, 8), M('#c8b890')); knot.position.set(0, .3, .25); g.add(knot);
  g.position.set(X[0], -.4, 0); g.rotation.set(0, .4, -.35); g.scale.setScalar(1.25); S.add(g) }

/* ② the thrown net: a round cast net spread open · lead weights round the rim · the hand-line trailing off · landing over a chicken */
{ ground(X[1]); const ck = new THREE.Group(); ANIMALS.chicken(ck); ck.scale.setScalar(1.5); ck.position.set(X[1], -1.2, 0); ck.rotation.y = .6; S.add(ck);
  const pos = [], N = 28; const geo = new THREE.SphereGeometry(1.25, 28, 10, 0, Math.PI * 2, 0, Math.PI / 2.2); const net = new THREE.Mesh(geo, netMat([6, 3])); net.scale.set(1, .95, 1); net.position.set(X[1], -1.15, 0); S.add(net);
  for (let i = 0; i < N; i++) { const a = i / N * 6.283, rr = 1.25 * Math.sin(Math.PI / 2.2); const w = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), M('#7a7a88', { roughness: .4, metalness: .3 })); w.position.set(X[1] + Math.cos(a) * rr, -1.15 + Math.cos(Math.PI / 2.2) * 1.25 * .95, Math.sin(a) * rr); w.castShadow = true; S.add(w) }
  S.add(tube([[X[1], -1.15 + 1.19, 0], [X[1] - .4, .2, .2], [X[1] - 1.2, .9, .4], [X[1] - 1.8, 1.3, .3]], .025, 8)) }

/* ③ the rope at the belt: a coil of twisted rope · a tied wrap · the loose end with a knot */
{ const g = new THREE.Group(); for (let i = 0; i < 6; i++) { const t = new THREE.Mesh(new THREE.TorusGeometry(.62 - i * .012, .065, 10, 40), ropeMat(18)); t.position.set((i - 2.5) * .03, (i - 2.5) * .025, (i - 2.5) * .05); t.rotation.set(0, (i - 2.5) * .06, (i - 2.5) * .05); t.castShadow = true; g.add(t) }
  for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.TorusGeometry(.11, .05, 8, 16), ropeMat(4)); w.position.set(s * .6, 0, 0); w.rotation.y = Math.PI / 2; g.add(w) }
  g.add(tube([[.5, -.4, .1], [.35, -.9, .25], [.45, -1.3, .2], [.3, -1.6, .1]], .055, 6)); const kn = new THREE.Mesh(new THREE.SphereGeometry(.1, 12, 10), ropeMat(2)); kn.position.set(.3, -1.62, .1); g.add(kn);
  g.position.set(X[2], .1, 0); g.rotation.set(.25, -.3, .1); g.scale.setScalar(1.3); S.add(g) }

/* ④ the thrown rope: a lasso flying out (rope with thickness) · the noose closing round a dropped bundle */
{ ground(X[3]); const bd = new THREE.Group(); part(bd, '#a8301e', '#e8604a', [0, .18, 0], [.32, .18, .26], [0, .4, 0], { A: .08 }); part(bd, '#e8d8b0', '#fff6e0', [.1, .36, .05], [.08, .1, .08], [0, 0, .4], { A: .05 }); bd.scale.setScalar(1.6); bd.position.set(X[3] + .5, -1.2, 0); S.add(bd);
  const loop = tube([...Array(16)].map((_, i) => { const a = i / 16 * 6.283; return [X[3] + .5 + Math.cos(a) * .62, -.85 + Math.sin(a * 2) * .04, Math.sin(a) * .5] }), .05, 16, true); S.add(loop);
  S.add(tube([[X[3] + .5 - .62, -.85, 0], [X[3] - .3, -.2, .3], [X[3] - .9, .7, .2], [X[3] - 1.4, 1.4, .1], [X[3] - 1.9, 1.7, 0]], .05, 14));
  for (let i = 0; i < 4; i++) { const sp = new THREE.Mesh(new THREE.SphereGeometry(.03, 6, 6), new THREE.MeshBasicMaterial({ color: '#ffffff' })); sp.position.set(X[3] - .2 + i * .25, -.1 + i * .15, .4); S.add(sp) } }

r.render(S, cam);
const L = [['🕸️ ตาข่าย · ในมือ', 'ด้ามไม้ + ห่วง + ถุงตาข่าย'], ['🕸️ ตาข่าย · ตอนโยน', 'กางเป็นวงกลม · ลูกตุ้มรอบขอบ · ครอบสัตว์'], ['🪢 เชือก · ในมือ / ที่เอว', 'ขดเชือกเกลียว · ปลายมีปม'], ['🪢 เชือก · ตอนเหวี่ยง', 'เชือกมีความหนา · บ่วงคล้องของ']];
L.forEach(([t, s], i) => { const d = document.createElement('div'); d.className = 'lb'; d.style.left = (i * 400) + 'px'; d.innerHTML = t + '<small>' + s + '</small>'; document.getElementById('w').appendChild(d) });
window.done = 1;
</script></body></html>
