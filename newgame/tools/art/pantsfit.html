<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#f4ead8}canvas{display:block}</style></head><body><script type="module">
import * as THREE from '../../lib/three.module.min.js'; import { vinyl } from '../../src/vinyl.js';
const CW = 170, CH = 230, L = [['swim', 'shorts', '#1a3a6a'], ['tank', 'shorts', '#4a6aa8'], ['traveler', 'pants', '#5a4a3a'], ['sailor', 'shorts', '#2a2a40'], ['farmer', 'pants', '#4a6aa8'], ['vest', 'shorts', '#6a4a2a']], cells = [];

</script></body></html>
