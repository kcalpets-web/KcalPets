<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Game mock</title>
<style>
  :root{--ink:#2a2030;--paper:#fff8ee;--hp:#ff5d6c;--mp:#4f9cff;--xp:#ffd23f}
  html,body{margin:0;height:100%;background:#7fc8e8;font:600 13px "Noto Sans Thai",system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #cv{position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;left:0;right:0;pointer-events:none}
  .top{top:0;padding:10px 10px 0;display:flex;gap:8px;align-items:flex-start}
  .pf{display:flex;gap:8px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:5px 10px 5px 5px;box-shadow:0 3px 0 #0003}
  .av{width:42px;height:42px;border-radius:50%;background:#ffd9a8;border:3px solid var(--ink);display:grid;place-items:center;font-size:24px}
  .lv{font-size:12px} .bar{height:9px;width:96px;border:2px solid var(--ink);border-radius:6px;background:#0002;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%}
  .cur{margin-left:auto;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .pill{white-space:nowrap;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:2px 10px;box-shadow:0 3px 0 #0003;font-size:13px}
  .rt{display:flex;gap:6px}.sq{width:34px;height:34px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 #0003}
  .bot{bottom:0;padding:0 8px 14px;display:flex;gap:6px}
  .btn{flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:5px 2px;text-align:center;box-shadow:0 4px 0 #0003;font-size:11px;white-space:nowrap}
  .btn b{display:block;font-size:22px;line-height:1.1}
  .lbl{position:fixed;transform:translate(-50%,-100%);background:#2a2030e6;color:#fff;border-radius:8px;padding:2px 7px;font-size:11px;white-space:nowrap;pointer-events:none}
  .lbl.c{background:#fff8ee;color:var(--ink);border:2px solid var(--ink)}
  .dmg{position:fixed;transform:translate(-50%,-100%);color:#fff;font:900 22px system-ui;text-shadow:0 2px 0 #c0303a,0 -2px 0 #c0303a,2px 0 0 #c0303a,-2px 0 0 #c0303a}
  .vit{position:fixed;left:10px;top:76px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 8px;font-size:11px}
  .vit .bar{width:120px}
  .card{position:fixed;left:10px;right:10px;bottom:96px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px;font-size:11px;box-shadow:0 4px 0 #0003}
  .card h4{margin:0 0 4px;font-size:13px}.card .r{display:flex;justify-content:space-between}
  .tag{display:inline-block;border-radius:6px;padding:0 5px;color:#fff;font-size:10px}
  .quest{position:fixed;left:10px;bottom:96px;background:#2a2030d9;color:#fff;border-radius:10px;padding:6px 9px;font-size:11px;max-width:150px}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>

  /* middle zone close-up, "Pen Suk-like" polish: world-noise grass colour, sand blended to the shore, sea with depth + sparkles + foam,

  [[2.6, -3.2], [3.4, 6.6], [-.8, -8.6]].forEach(([x, z]) => broad(x, z, .8));
  [[1.8, -1.2], [4.2, 4.6], [-1.2, 8.8], [3.8, -6.2]].forEach(([x, z]) => at(g => PROPS.bush(g, .8), x, z));
  /* earth zone rocks + leaf zone */

  /* path: stepping stones from the tree house to the beach + to the adventure exit */
  const stones = pts => pts.forEach(([x, z], i) => { if (!i) return; const [a, b] = pts[i - 1], n = Math.ceil(Math.hypot(x - a, z - b) / .55); for (let k = 0; k < n; k++) { const t = k / n; at(g => part(g, '#b9b2a6', '#ece6da', [0, 0, 0], [.26, .06, .22], [0, rnd() * 3, 0], { A: .1, shadow: false }), a + (x - a) * t + (rnd() - .5) * .2, b + (z - b) * t + (rnd() - .5) * .2, 0, 1, .02) } });
  stones([[3.0, -7.2], [2.2, -5.4], [.6, -3.8], [-1.0, -2.6]]); stones([[3.2, 1.6], [5, 2.2], [7, 2.3], [10, 2.3]]);
  /* tree house */
  at(g => { part(g, '#5a3420', '#9a6238', [0, 1.1, 0], [.4, 1.15, .4], [0, 0, 0], { A: .12 }); [[0, 3.1, -.2, 1.5], [-1, 2.8, 0, 1], [1, 2.9, -.3, 1.05], [0, 4, -.4, 1]].forEach(([x, y, z, s]) => part(g, '#2f7a3a', '#9ade6c', [x, y, z], [s, s * .75, s], [0, 0, 0], { A: .12, f: 1.5 }));
    part(g, '#8a4c26', '#dc9a5e', [0, 1.95, .55], [.95, .62, .5]); part(g, '#a8342e', '#ff6a58', [0, 2.7, .6], [1.1, .28, .62]); part(g, '#3a2418', '#7a4a30', [-.25, 1.78, 1.02], [.22, .36, .05], [0, 0, 0], { A: 0 });
    part(g, '#ffe27a', '#fff6c8', [.4, 2.0, 1.02], [.15, .15, .04], [0, 0, 0], { A: 0 }); for (let i = 0; i < 4; i++) part(g, '#7a4422', '#c8843a', [-.25, .3 + i * .32, 1.08], [.26, .04, .04], [0, 0, 0], { A: 0 });
    part(g, '#ff6a8a', '#ffb0c0', [0, 3.75, 1.0], [.22, .2, .08], [0, 0, 0], { A: 0 }) }, 3.2, -8.4, -.15, 1);
  /* the boat vault */
  const bx = shore(-1.6) - 1.05, bz = -1.6;
  at(g => { part(g, '#7a4422', '#c8843a', [0, .05, 0], [1.25, .32, .5], [0, 0, 0], { A: .04 }); part(g, '#d8d8e0', '#ffffff', [.35, .55, 0], [.32, .22, .26]); part(g, '#a8342e', '#ff6a58', [.35, .8, 0], [.38, .07, .3]); part(g, '#6a4024', '#a8703e', [-.25, 1.35, 0], [.05, 1.1, .05], [0, 0, 0], { A: 0 });

  const VX = 1, VZ = 17, IX = 4, IZ = -19;                                   // volcano + ice mountain centres

    else {
