<!doctype html>
<meta charset="utf-8"><title>KEALEE · model lab</title>
<style>body{margin:0;background:#f4efe6;font-family:system-ui,sans-serif}#w{position:relative;width:1200px;height:980px}#bg{position:absolute;inset:0;background:url(../../docs/art/kealee-sheet.png) 0 0/1200px 980px;opacity:var(--o,.35)}canvas{position:absolute;inset:0}</style>
<!-- v3.32 the part-by-part model of KEALEE over the reference sheet · ?parts=head,hair&ghost=.35 · ?view=turn for a 3/4 turnaround -->
<div id="w"><div id="bg"></div></div>
<script type="module">
import * as THREE from '../../lib/three.module.min.js';
import { kealeeModel, KPARTS } from '../../src/kealee.js';
const Q = new URLSearchParams(location.search), parts = new Set((Q.get('parts') || KPARTS.join(',')).split(',')), view = Q.get('view') || 'sheet';
document.getElementById('bg').style.setProperty('--o', Q.get('ghost') ?? .35); if (view !== 'sheet') document.getElementById('bg').style.display = 'none';
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setSize(1200, 980); R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1; R.shadowMap.enabled = true;
document.getElementById('w').appendChild(R.domElement);
const S = new THREE.Scene(); S.add(new THREE.HemisphereLight('#fff6ec', '#a88a6a', 1.3)); const sun = new THREE.DirectionalLight('#fff1dc', 2.2); sun.position.set(2, 4, 3); S.add(sun); const rim = new THREE.DirectionalLight('#ffd7a8', .7); rim.position.set(-2, 2, -3); S.add(rim);
const root = new THREE.Group(); kealeeModel(root, { parts }); S.add(root); window.__k = root;
const PX = 520;   // sheet pixels per metre · ground at y = 900 px
if (view === 'sheet') {
  const cam = (cx, side) => { const c = new THREE.OrthographicCamera(-cx / PX, (1200 - cx) / PX, 900 / PX, -80 / PX, .1, 20); if (side) { c.position.set(-5, 0, 0); c.lookAt(0, 0, 0) } else { c.position.set(0, 0, 5); c.lookAt(0, 0, 0) } c.updateProjectionMatrix(); return c };
  const cF = cam(330, 0), cS = cam(860, 1); R.setScissorTest(true);
  R.setScissor(0, 0, 600, 980); R.setViewport(0, 0, 1200, 980); R.render(S, cF);
  R.setScissor(600, 0, 600, 980); R.render(S, cS);
} else {
  R.setClearColor('#f4efe6', 1); const W = 1200 / 3; R.setScissorTest(true);
  [[0, '3/4'], [1, 'back'], [2, 'close']].forEach(([i]) => { const c = new THREE.PerspectiveCamera(i === 2 ? 22 : 28, W / 980, .1, 30), a = [.7, 2.6, .45][i], d = [4.2, 4.2, 2.2][i], y = [.8, .8, 1.25][i]; c.position.set(Math.sin(a) * d, y + (i === 2 ? .1 : .5), Math.cos(a) * d); c.lookAt(0, y, 0); R.setScissor(i * W, 0, W, 980); R.setViewport(i * W, 0, W, 980); R.render(S, c) });
}
window.__done = 1;
</script>
