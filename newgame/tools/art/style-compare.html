<!doctype html><html><head><meta charset="utf-8"><title>KEALEE style compare</title><style>body{margin:0;background:#fff}</style></head><body>
<script type="module">
/* the same little scene in two styles · #smooth = soft vinyl/clay (round, smooth shading) · #facet = soft low-poly (big flat facets) · the player + an NPC are the vinyl chibi in both */
import * as THREE from '../../lib/three.module.min.js';
import { vinyl } from '../../src/vinyl.js';
const SM = location.hash !== '#facet', W = 1200, H = 900, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(r.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#bfe3f7'); S.fog = new THREE.Fog('#cfeaf8', 14, 30);
S.add(new THREE.HemisphereLight('#fff8ee', '#8aa070', SM ? 1.25 : 1.1)); const sun = new THREE.DirectionalLight('#fff0d8', 2.4); sun.position.set(-4, 8, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 }); sun.shadow.radius = 4; S.add(sun);
const rim = new THREE.DirectionalLight('#cfe8ff', SM ? .9 : .5); rim.position.set(3, 3, -6); S.add(rim);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: SM ? .5 : .85, flatShading: !SM }, o));
const ball = (r0, c, x, y, z, s = [1, 1, 1], o) => { const g = SM ? new THREE.SphereGeometry(r0, 40, 28) : new THREE.IcosahedronGeometry(r0, 1); const m = new THREE.Mesh(g, M(c, o)); m.position.set(x, y, z); m.scale.set(...s); m.castShadow = m.receiveShadow = true; S.add(m); return m };
const cyl = (r1, r2, h, c, x, y, z, seg) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, SM ? 24 : (seg || 6)), M(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; S.add(m); return m };
const box = (w, h, d, c, x, y, z, ry = 0) => { const g = SM ? roundBox(w, h, d, Math.min(w, h, d) * .18) : new THREE.BoxGeometry(w, h, d); const m = new THREE.Mesh(g, M(c)); m.position.set(x, y, z); m.rotation.y = ry; m.castShadow = m.receiveShadow = true; S.add(m); return m };
function roundBox(w, h, d, rr) { const g = new THREE.BoxGeometry(w, h, d, 8, 8, 8), P = g.attributes.position, v = new THREE.Vector3(); for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i); const c = new THREE.Vector3(Math.max(-w / 2 + rr, Math.min(w / 2 - rr, v.x)), Math.max(-h / 2 + rr, Math.min(h / 2 - rr, v.y)), Math.max(-d / 2 + rr, Math.min(d / 2 - rr, v.z))); v.sub(c).setLength(rr).add(c); P.setXYZ(i, v.x, v.y, v.z) } g.computeVertexNormals(); return g }
/* ground: a gentle green with a sandy path */
const gg = new THREE.PlaneGeometry(40, 40, SM ? 80 : 26, SM ? 80 : 26); gg.rotateX(-Math.PI / 2); const GP = gg.attributes.position, col = [], cc = new THREE.Color();
for (let i = 0; i < GP.count; i++) { const x = GP.getX(i), z = GP.getZ(i), n = Math.sin(x * .7) * Math.cos(z * .6) * .5 + Math.sin(x * 1.7 + z) * .25; GP.setY(i, n * .12); const path = Math.abs(x * .35 - z * .9 + .3) < 1.1; cc.set(path ? '#e8d4a8' : '#86c860').multiplyScalar(.93 + n * .08); col.push(cc.r, cc.g, cc.b) }
gg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); gg.computeVertexNormals(); const gm = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, flatShading: !SM })); gm.receiveShadow = true; S.add(gm);
/* 🌳 trees */
function tree(x, z, s = 1, leaf = '#5cb84a') { cyl(.16 * s, .24 * s, 1.6 * s, '#9a6236', x, .8 * s, z, 7); for (const [dx, dy, dz, k] of [[0, 2.1, 0, 1], [-.55, 1.8, .2, .72], [.55, 1.85, -.1, .75], [.1, 2.65, -.1, .7]]) ball(.8 * k * s, leaf, x + dx * s, dy * s, z + dz * s, [1, .9, 1]) }
tree(-3.6, -2.4, 1.15); tree(3.9, -3.2, 1.3, '#4aa848'); tree(-5.4, .8, .9, '#6cc85a');
/* 🍎 a fruit bush */ for (const [dx, dz, k] of [[0, 0, 1], [.45, .2, .75], [-.4, .25, .7]]) ball(.45 * k, '#4fae46', 2.6 + dx, .38 * k, 1.4 + dz); for (let i = 0; i < 6; i++) ball(.08, '#e8403a', 2.6 + Math.cos(i * 1.1) * .42, .45 + (i % 2) * .15, 1.4 + Math.sin(i * 1.1) * .32);
/* 🪨 rocks */ ball(.6, '#9a958c', -1.8, .3, 2.4, [1.3, .75, 1]); ball(.35, '#a8a298', -1.1, .2, 2.9, [1, .8, 1.1]);
/* 🏠 a small house */ box(2.2, 1.6, 1.8, '#f0dcb8', 1.2, .8, -3.6, -.25); { const roof = new THREE.Mesh(SM ? new THREE.ConeGeometry(1.75, 1.1, 4, 1) : new THREE.ConeGeometry(1.75, 1.1, 4, 1), M('#d8573a')); roof.position.set(1.2, 2.15, -3.6); roof.rotation.y = Math.PI / 4 - .25; roof.scale.set(1, 1, .85); roof.castShadow = true; S.add(roof) }
box(.45, .75, .08, '#8a5a30', 1.05, .4, -2.68, -.25); box(.4, .35, .06, '#bfe6ff', 1.75, .95, -2.82, -.25);
/* 🐰 a rabbit */ { const x = .9, z = 2.2; ball(.32, '#f4ece0', x, .3, z, [1, .9, 1.2]); ball(.22, '#f4ece0', x, .62, z + .26); for (const s2 of [-1, 1]) { ball(.07, '#f4ece0', x + s2 * .08, .95, z + .2, [1, 2.6, .8]); ball(.025, '#2a2028', x + s2 * .09, .66, z + .45, [1, 1, 1], { roughness: .2 }) } ball(.09, '#ffffff', x, .32, z - .38) }
/* 🐔 a chick */ { ball(.22, '#ffd860', -.4, .22, 3.2); ball(.15, '#ffd860', -.4, .45, 3.32); const bk = new THREE.Mesh(new THREE.ConeGeometry(.05, .12, SM ? 16 : 4), M('#ff9a3a')); bk.rotation.x = Math.PI / 2; bk.position.set(-.4, .45, 3.5); S.add(bk) }
/* 🌼 flowers + grass tufts */ for (let i = 0; i < 26; i++) { const x = -6 + (i * 2.37) % 12, z = -1 + ((i * 3.1) % 5.5); if (Math.abs(x * .35 - z * .9 + .3) < 1.3) continue; if (i % 3) { for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.ConeGeometry(.03, .28, SM ? 8 : 3), M('#5aa848')); b.position.set(x + k * .05, .14, z + (k % 2) * .05); b.rotation.z = (k - 1.5) * .18; S.add(b) } } else { ball(.07, ['#ff7a9a', '#ffd23f', '#ffffff', '#b07aff'][i % 4], x, .2, z); cyl(.012, .012, .2, '#4a9a3a', x, .1, z) } }
/* 🧑 the player + 👵 an NPC (vinyl chibi) */
const P1 = new THREE.Group(); vinyl(P1, { v: 2, sex: 'f', hair: 'pony', hairCol: '#5a3424', skin: '#f2cfa6', wear: 'traveler', bottom: 'skirt', top: '#3d6fc4', eyes: 'round' }); P1.position.set(-.3, 0, .9); P1.rotation.y = .5; P1.scale.setScalar(1.15); S.add(P1);
const P2 = new THREE.Group(); vinyl(P2, { v: 2, sex: 'm', hair: 'side', hairCol: '#d8d8e0', skin: '#e2b183', wear: 'farmer', bottom: 'pants', top: '#8a5a30', eyes: 'smile', eyeCol: '#4a3020' }); P2.position.set(.6, 0, -1.6); P2.rotation.y = -.3; P2.scale.setScalar(1.15); S.add(P2);
[P1, P2].forEach(p => p.traverse(o => { if (o.isMesh) o.castShadow = true }));
const c = new THREE.PerspectiveCamera(34, W / H, .1, 80); c.position.set(.6, 4.4, 9.4); c.lookAt(0, .9, -.4); r.render(S, c); window.__done = 1;
</script></body></html>
