<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kcal Pet Dungeon</title>
<meta name="description" content="เกมสัตว์เลี้ยงพิกเซลที่โตจากแคลอรี่ออกกำลังกายจริง">
<meta name="theme-color" content="#0e0a1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kcal Pet">
<style>[hidden]{display:none!important}html,body{margin:0}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one-screen handheld — crystal-dungeon room on top, chunky pixel controls below */
:root{
  --bg:#0e0a1c; --panel:#1c1535; --panel2:#272049; --line:#43387a; --edge:#0a0714;
  --fg:#f1ecff; --muted:#a99fd2; --kcal:#ffb547; --kcal-dk:#b86a12; --good:#7fe08c; --pink:#ff8fb6; --crys:#8fd6ff;
  --f-px:"Pixelify Sans","Mitr",system-ui,sans-serif;
  --f-th:"Mitr",system-ui,sans-serif;
  color-scheme:dark;
}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-th);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--crys);outline-offset:2px}
.num{font-family:var(--f-px);font-variant-numeric:tabular-nums}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
/* top bar */
.top{display:flex;gap:8px;align-items:stretch;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.pill{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 -3px 0 var(--edge);border-radius:6px;padding:5px 8px;min-width:0}
.who{flex:1;display:flex;flex-direction:column;gap:3px;text-align:left}
.who .nm{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .lv{font-family:var(--f-px);color:var(--crys);margin-right:4px}
.bar{height:7px;background:var(--edge);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--crys),#b8a4ff);width:0}
.kc{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px}
.kc b{font-family:var(--f-px);font-size:17px;color:var(--kcal);line-height:1}
.kc small{font-size:11px;color:var(--muted);white-space:nowrap}
/* stage */
#stage{flex:1;position:relative;isolation:isolate;overflow:hidden;margin:0 6px;border:3px solid var(--edge);border-radius:8px;min-height:0;background:#1a1430}
#room{position:absolute;left:0;top:0;image-rendering:pixelated}
#pet{position:absolute;image-rendering:pixelated;cursor:pointer;transform-origin:50% 100%;touch-action:manipulation}
#shadow{position:absolute;background:rgba(5,3,14,.45);border-radius:50%}
.bubble{position:absolute;background:#fff8e8;color:#2a1d3d;font-size:13px;line-height:1.35;padding:6px 10px;border-radius:8px;border:2px solid #2a1d3d;max-width:210px;pointer-events:none;transform:translate(-50%,-100%);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:opacity .25s;white-space:normal;text-align:center}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#2a1d3d;border-bottom:0}
.heart{position:absolute;color:var(--pink);font-family:var(--f-px);font-size:20px;pointer-events:none;animation:up 1.1s ease-out forwards;text-shadow:0 2px 0 #5b1838}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.float{position:absolute;font-family:var(--f-px);font-size:16px;color:var(--good);pointer-events:none;animation:up 1.3s ease-out forwards;text-shadow:0 2px 0 #123}
/* actions */
.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;padding-block:8px 4px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.btn{background:var(--panel2);border:2px solid var(--line);border-radius:7px;box-shadow:inset 0 -4px 0 var(--edge);padding:10px 6px 12px;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.15;min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--edge)}
.btn.kcal{background:var(--kcal);color:#3a1f00;border-color:#ffd38a;box-shadow:inset 0 -4px 0 var(--kcal-dk)}
.btn.go{background:#3f8f6a;border-color:#7fe0ac;box-shadow:inset 0 -4px 0 #1f5a3e}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 8px 8px;font-size:13px}
/* dock */
.dockbar{display:flex;justify-content:center;padding-block:2px 6px}
.docktog{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 18px;display:flex;align-items:center;gap:6px}
.docktog .num{color:var(--fg)}
#dock{position:absolute;left:6px;right:6px;bottom:0;background:var(--panel);border:2px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:2000;box-shadow:0 -6px 0 rgba(0,0,0,.35)}
.di{background:var(--panel2);border:2px solid var(--line);border-radius:7px;box-shadow:inset 0 -3px 0 var(--edge);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.15;position:relative}
.di span:first-child{font-size:20px}
.di.lock{opacity:.5}
.di.lock:after{content:"เร็วๆ นี้";position:absolute;top:-6px;right:-4px;font-size:9px;background:var(--line);padding:1px 4px;border-radius:4px}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(6,4,14,.72);display:flex;align-items:flex-end;justify-content:center;z-index:27}
.sheet{width:100%;max-width:480px;max-height:92%;background:var(--panel);border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 0 rgba(0,0,0,.4)}
.sh-body{overflow-y:auto;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sh-body>*{flex-shrink:0}
.sh-foot{padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:2px solid var(--edge)}
.close{width:100%;min-height:50px;background:var(--panel2);border:2px solid var(--line);border-radius:8px;box-shadow:inset 0 -4px 0 var(--edge);font-size:16px;font-weight:500}
h2{font-size:19px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:500;color:var(--muted);margin:0;letter-spacing:.02em}
p{margin:0;line-height:1.5}
.mut{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:20px;padding:6px 11px;font-size:13px;box-shadow:inset 0 -2px 0 var(--edge)}
.chip.on{background:var(--crys);color:#10213a;border-color:#d4f0ff}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--edge);border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:12px}
input[type=number],input[type=text],textarea{width:100%;background:var(--edge);border:2px solid var(--line);border-radius:7px;color:var(--fg);font:inherit;padding:10px 12px;user-select:text;-webkit-user-select:text}
input[type=number]{font-family:var(--f-px);font-size:24px;text-align:center}
textarea{font-family:ui-monospace,monospace;font-size:11px;min-height:90px;resize:vertical}
.big{font-family:var(--f-px);font-size:30px;color:var(--kcal);line-height:1}
.stat{display:grid;grid-template-columns:76px 1fr 54px;gap:8px;align-items:center;font-size:13px}
.stat .bar{height:9px}
.stat .v{text-align:right;font-family:var(--f-px)}
.sk{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sk:last-child{border-bottom:0}
.sk.off{opacity:.45}
.spr{image-rendering:pixelated;display:block;margin:0 auto}
.center{text-align:center;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:110px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10px;color:var(--muted)}
.week i{display:block;width:70%;background:var(--kcal);border-radius:2px 2px 0 0;min-height:2px}
.week i.today{background:var(--crys)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;background:var(--edge);border-radius:6px;padding:7px 10px}
.x{background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5;border-left:3px solid var(--line);padding-left:8px}
.warn{color:#ffd07a}
.pts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pts button{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px 2px;font-size:12px;box-shadow:inset 0 -3px 0 var(--edge)}
/* toast */
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff8e8;color:#2a1d3d;border:2px solid #2a1d3d;border-radius:8px;padding:8px 14px;font-size:14px;z-index:40;box-shadow:0 4px 0 rgba(0,0,0,.4);max-width:86%;text-align:center}
/* cover */
#cover{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);cursor:pointer;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cover canvas.bgc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.55}
.logo{position:relative;font-family:var(--f-px);font-weight:700;font-size:clamp(34px,11vw,52px);line-height:.95;text-align:center;color:var(--kcal);text-shadow:0 4px 0 var(--kcal-dk),0 8px 0 #2a1608}
.logo small{display:block;font-size:.5em;color:var(--crys);text-shadow:0 3px 0 #1e3c66;margin-top:8px;letter-spacing:.06em}
.tap{position:relative;font-family:var(--f-px);font-size:18px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.copy{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted)}
.lvpop .big{font-size:44px;color:var(--crys)}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(4) saturate(0)}100%{filter:none}}
.wig{animation:wig .35s steps(4)}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
/* adventure map */
.map{display:flex;flex-direction:column;gap:2px;padding:4px 0}
.mrow{display:flex;align-items:center;gap:10px}
.mrow.r{flex-direction:row-reverse}
.pin{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--panel2);border:3px solid var(--line);box-shadow:inset 0 -4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--f-px);font-size:18px;position:relative}
.pin small{font-size:10px;color:var(--muted);font-family:var(--f-th);margin-top:2px}
.pin.clear{border-color:var(--good);background:#244a3c}
.pin.next{border-color:var(--kcal);background:#4a3418;animation:pulse 1.4s ease-in-out infinite}
.pin.lock{opacity:.4}
.pin.boss{width:70px;height:70px;font-size:22px}
.pin .ck{position:absolute;top:-4px;right:-4px;background:var(--good);color:#0e2a1a;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
@keyframes pulse{50%{box-shadow:inset 0 -4px 0 var(--edge),0 0 0 5px rgba(255,181,71,.25)}}
.mlab{flex:1;min-width:0;font-size:13px;line-height:1.35}
.mlab b{font-weight:500}
.mlab .mut{font-size:12px}
.dash{height:14px;border-left:3px dotted var(--line);margin-left:28px}
.mrow.r+.dash,.dash.r{margin-left:auto;margin-right:28px}
.mons-prev{display:flex;gap:4px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
/* battle */
#battle{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:var(--bg)}
#battle .bin{max-width:480px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.bhead{display:flex;align-items:center;gap:6px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.bhead .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .t .num{color:var(--muted);font-size:12px}
.bfield{flex:1;position:relative;margin:0 6px;border:3px solid var(--edge);border-radius:8px;overflow:hidden;min-height:0}
.bfield canvas.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.bmons{position:absolute;left:0;right:0;top:6%;display:flex;justify-content:center;align-items:flex-end;gap:2px;flex-wrap:nowrap;padding:0 6px}
.mon{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer;transition:opacity .4s,filter .4s;min-width:0}
.mon canvas{image-rendering:pixelated;width:96px;height:96px}
.mon.boss canvas{width:200px;height:200px}
.mon .bar{width:74px;height:7px}
.mon.boss .bar{width:150px}
.mon .bar>i{background:linear-gradient(90deg,#ff6b6b,#ffb547)}
.mon .mn{font-size:11px;color:var(--fg);text-shadow:0 1px 0 #000;white-space:nowrap}
.mon.tgt .mn:before{content:"▼ ";color:var(--kcal)}
.mon.dead{opacity:.18;filter:grayscale(1);pointer-events:none}
.bpets{position:absolute;left:6%;bottom:4%;display:flex;gap:8px;align-items:flex-end}
.bpet{position:relative;transition:transform .15s}
.bpet canvas{image-rendering:pixelated;width:150px;height:150px}
.bpet.dead{opacity:.3;filter:grayscale(1)}
.lunge{animation:lunge .32s ease-out}
@keyframes lunge{40%{transform:translate(26px,-26px)}}
.mlunge{animation:mlunge .32s ease-out}
@keyframes mlunge{40%{transform:translate(-14px,22px)}}
.shake{animation:shake .3s steps(3)}
@keyframes shake{33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
.dmg{position:absolute;font-family:var(--f-px);font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 0 #3a0b16,0 0 4px #000;pointer-events:none;animation:up 1s ease-out forwards;z-index:3;white-space:nowrap}
.dmg.crit{color:var(--kcal);font-size:28px}
.dmg.heal{color:var(--good)}
.dmg.small{font-size:15px;color:var(--crys)}
.bwarn{position:absolute;left:50%;top:52%;transform:translateX(-50%);background:#3a0b16;border:2px solid #ff6b6b;color:#ffd0d0;border-radius:6px;padding:4px 10px;font-size:13px;white-space:nowrap}
.blog{position:absolute;left:8px;right:8px;bottom:8px;text-align:right;font-size:12px;color:var(--fg);text-shadow:0 1px 0 #000;pointer-events:none}
.bpanel{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:7px}
.pcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.pcard.turn{border-color:var(--kcal)}
.pcard .bar{height:9px}
.pcard .hpb>i{background:linear-gradient(90deg,#4cc77a,#9ef0a8)}
.pcard .enb>i{background:linear-gradient(90deg,#ffb547,#ffe08a)}
.pcard .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.skg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skb{background:var(--panel2);border:2px solid var(--line);border-radius:7px;box-shadow:inset 0 -3px 0 var(--edge);padding:7px 4px 8px;font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:46px}
.skb small{font-family:var(--f-px);font-size:11px;color:var(--kcal)}
.skb[disabled]{opacity:.35;cursor:not-allowed}
.skb.lockd small{color:var(--muted)}
.brow{display:flex;gap:6px;align-items:center}
.brow .chip{flex:1;text-align:center}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bk{background:var(--edge);border:2px solid var(--line);border-radius:7px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;line-height:1.15;min-width:0;overflow:hidden}
.bk span{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bk.miss img{filter:brightness(0);opacity:.4}
.bk.miss span{color:var(--muted)}
.tslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ts{background:var(--edge);border:2px solid var(--line);border-radius:8px;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:6px 4px;text-align:center;min-width:0}
.ts span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts.lock,.ts.empty{color:var(--muted);border-style:dashed}
.ts.lock span,.ts.empty span{font-size:10px;white-space:normal}
.frow{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;background:var(--edge);border-radius:8px;padding:5px 8px}
.fpic{background:none;border:0;padding:0}
.finfo{min-width:0;font-size:13px;line-height:1.35}
.fbtn{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.fbtn .btn.sm{min-height:32px;padding:4px 8px 6px;font-size:12px}
.petc{position:absolute;image-rendering:pixelated;cursor:pointer;transform-origin:50% 100%;touch-action:manipulation}
.pshadow{position:absolute;background:rgba(5,3,14,.45);border-radius:50%}
.bubble{z-index:1500}
.fsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fsel button{flex:0 0 auto;background:var(--edge);border:2px solid var(--line);border-radius:8px;padding:3px 6px;display:flex;flex-direction:column;align-items:center;font-size:10px;min-width:58px}
.fsel button.on{border-color:var(--kcal);background:#3a2a14}
#detox{position:fixed;inset:0;z-index:35;background:#05030c;display:flex;align-items:center;justify-content:center;transition:filter 1.2s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#detox.dim{filter:brightness(.18)}
.dxin{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.dxpets{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.dxp{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;width:104px}
.dxp canvas{image-rendering:pixelated;width:96px;height:96px}
.dxp .bar{width:100%}
.dxp .bar>i{background:linear-gradient(90deg,#ffb547,#ffe08a)}
.dxhold{position:relative;overflow:hidden;background:var(--panel2);border:2px solid var(--line);border-radius:10px;min-height:54px;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.dxhold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(143,214,255,.25)}
.dxhold.on i{width:100%;transition:width 3s linear}
.dxhold span{position:relative}
.fsel button span{white-space:nowrap}
#goal{position:absolute;left:8px;right:8px;top:8px;z-index:1400;display:flex;align-items:center;gap:8px;background:rgba(18,12,38,.88);border:2px solid var(--kcal);border-radius:10px;padding:7px 10px;text-align:left;font-size:13px;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.4)}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
let sheetStack=[];
function openSheet(html,onMount,opts){opts=opts||{};const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="sh-body">'+html+'</div>'+(opts.noClose?'':'<div class="sh-foot"><button class="close" data-close>'+(opts.closeText||'ปิด')+'</button></div>')+'</div>';
  ov.addEventListener('click',e=>{if(e.target===ov&&!opts.noClose)closeSheet(ov);const b=e.target.closest('[data-close]');if(b)closeSheet(ov)});
  $('ovRoot').appendChild(ov);sheetStack.push({ov,opts});if(onMount)onMount(ov.querySelector('.sh-body'),ov);return ov}
function closeSheet(ov){const i=sheetStack.findIndex(s=>s.ov===ov);if(i<0)return;const s=sheetStack[i];sheetStack.splice(i,1);ov.remove();if(s.opts.onClose)s.opts.onClose();setTimeout(nextPopup,60)}
function closeAll(){while(sheetStack.length){const s=sheetStack.pop();s.ov.remove()}}
const popupQ=[];function queuePopup(fn){popupQ.push(fn);if(!sheetStack.length)setTimeout(nextPopup,30)}
function nextPopup(){if(sheetStack.length||!popupQ.length||!$('cover').hidden)return;popupQ.shift()()}
function sprImg(sp,f,size){return'<img class="spr" alt="" src="'+spriteURL(sp,f)+'" width="'+size+'" height="'+size+'">'}

/* ---------- core rules ---------- */
function todayKcal(d){return S.log[d==null?dayIdx():d]||0}
function allowanceLeft(){const d=dayIdx();if(S.fed.d!==d){S.fed={d,amt:0}}return Math.max(0,S.cap-S.fed.amt)}
function capWeek(){
  const d=dayIdx();if(S.weekStart==null){S.weekStart=d;return}
  let rolled=0;
  while(d>=S.weekStart+7&&rolled<60){let sum=0;for(let i=0;i<7;i++)sum+=S.log[S.weekStart+i]||0;const avg=sum/7,prev=S.cap;
    let nc=Math.min(Math.max(avg*1.2,prev*.9),prev*1.15);nc=Math.round(Math.min(CAP_MAX,Math.max(CAP_MIN,nc))/10)*10;
    S.capHist.push({ws:S.weekStart,avg:Math.round(avg),cap:nc,prev});S.cap=nc;S.weekStart+=7;rolled++}
  if(rolled){const h=S.capHist[S.capHist.length-1];queuePopup(()=>weeklyPopup(h,rolled));save()}
}
function weeklyPopup(h,rolled){
  const up=h.cap>h.prev,down=h.cap<h.prev;
  const msg=up?'เก่งมาก! น้องย่อยพลังได้มากขึ้นแล้ว 💪':down?'สัปดาห์นี้ค่อยๆ ไปด้วยกันนะ น้องรออยู่ 🌙':'สม่ำเสมอดีมาก! รักษาจังหวะนี้ไว้นะ ✨';
  openSheet('<div class="center card" style="text-align:center"><h3>สรุปสัปดาห์ที่ผ่านมา</h3><p>เฉลี่ยวันละ <b class="num" style="color:var(--kcal)">'+fmt(h.avg)+'</b> Kcal</p><p>สัปดาห์นี้น้องย่อยพลังได้วันละ</p><div class="big">'+fmt(h.cap)+'</div><p>'+msg+'</p>'+(rolled>1?'<p class="mut">ไม่ได้เข้ามา '+rolled+' สัปดาห์ ยินดีต้อนรับกลับ!</p>':'')+'</div><p class="note">ตัวเลขนี้คิดจากค่าเฉลี่ย 7 วัน × 1.2 ขึ้นได้ไม่เกิน 15% ลดได้ไม่เกิน 10% ต่อสัปดาห์ อยู่ระหว่าง 1,000–2,500 Kcal</p>',null,{closeText:'ไปต่อกัน'})}
function addPoints(p,levels){
  for(let i=0;i<levels;i++){if(p.preset&&PRESETS[p.preset]){PRESETS[p.preset].d.forEach((v,k)=>p.pts[SK[k]]+=v)}else p.free+=10}}
function addExp(p,amt,src){
  if(p.lv>=MAXLV)return[];const ups=[];p.exp+=amt;
  while(p.lv<MAXLV&&p.exp>=need(p.lv)){p.exp-=need(p.lv);const from=p.lv;p.lv++;addPoints(p,1);ups.push({from,to:p.lv})}
  if(p.lv>=MAXLV)p.exp=0;
  return ups}
function previewFeed(p,amt){const q={lv:p.lv,exp:p.exp};let a=amt;while(q.lv<MAXLV&&a>0){const r=need(q.lv)-q.exp;if(a>=r){a-=r;q.lv++;q.exp=0}else{q.exp+=a;a=0}}return q}
function toMax(p){let t=need(p.lv)-p.exp;for(let l=p.lv+1;l<MAXLV;l++)t+=need(l);return p.lv>=MAXLV?0:t}
function showLevelUps(p,ups){
  if(!ups.length)return;const last=ups[ups.length-1];const evo=ups.filter(u=>formIdx(u.to)!==formIdx(u.from));
  const sk=SKILLS.filter(s=>ups.some(u=>s.lv>u.from&&s.lv<=u.to));
  queuePopup(()=>{SND.play(evo.length?'evolve':'level');
    const f=formIdx(p.lv);const pr=p.preset&&PRESETS[p.preset];const gain=ups.length*10;
    openSheet('<div class="center lvpop" style="display:flex;flex-direction:column;gap:10px;text-align:center"><h3>'+(evo.length?'เปลี่ยนร่างแล้ว!':'เลเวลอัป!')+'</h3><div class="big">Lv '+last.to+'</div>'+
      '<div class="'+(evo.length?'flash':'')+'">'+sprImg(p.sp,f,168)+'</div>'+(evo.length?'<p>ร่างใหม่: <b>'+FORMS[f].n+'</b></p>':'')+
      '<p>ได้ <b class="num">+'+gain+'</b> แต้ม'+(pr?' · จัดให้อัตโนมัติแบบ'+pr.n:' · <span class="warn">รอจัดเองในหน้าน้อง</span>')+'</p>'+
      sk.map(s=>'<p>ปลดสกิลใหม่: <b>'+s.n+'</b> <span class="mut">('+s.d+')</span></p>').join('')+'</div>',null,{closeText:'เยี่ยม!'})})}

/* ---------- main render ---------- */
function renderTop(){const p=mainPet();if(!p)return;
  $('tLv').textContent='Lv'+p.lv;$('tName').textContent=p.name;
  $('tExp').style.width=(p.lv>=MAXLV?100:p.exp/need(p.lv)*100)+'%';
  $('tKcal').textContent=fmt(S.wallet);$('tAllow').textContent=fmt(allowanceLeft());try{renderGoal()}catch(e){}}
let room={W:160,H:200,s:3,wallH:80,ps:4},roamers=[];
function homeIds(){const ids=teamPets().map(p=>p.id);if(S.main&&!ids.includes(S.main))ids.unshift(S.main);else if(S.main){ids.splice(ids.indexOf(S.main),1);ids.unshift(S.main)}return ids}
function syncRoamers(){if(!S)return;const ids=homeIds(),box=$('roam');
  roamers=roamers.filter(r=>{if(ids.includes(r.id))return true;r.el.remove();r.sh.remove();return false});
  ids.forEach(id=>{if(roamers.find(r=>r.id===id))return;const sh=document.createElement('div');sh.className='pshadow';const el=document.createElement('canvas');el.width=el.height=G;el.className='petc';el.setAttribute('role','button');el.setAttribute('aria-label','แตะเพื่อลูบหัว');
    el.addEventListener('click',e=>petTap(e,id));box.appendChild(sh);box.appendChild(el);roamers.push({id,el,sh,x:30+Math.random()*120,y:9999,tx:0,ty:0,dir:1,fr:0,eyes:'open',until:0,wait:0,blink:0,lastFr:0})});
  roamers.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));sizeRoamers()}
function bounds(r){const st=$('stage');return{minY:room.wallH*room.s-r.sz*.5,maxY:Math.max(room.wallH*room.s-r.sz*.5,st.clientHeight-r.sz*.98),maxX:Math.max(0,st.clientWidth-r.sz)}}
function sizeRoamers(){roamers.forEach((r,i)=>{r.sz=G*(i===0?room.ps:room.ps-1);r.el.style.width=r.el.style.height=r.sz+'px';const B=bounds(r);if(r.y===9999){r.x=Math.random()*B.maxX;r.y=B.minY+Math.random()*(B.maxY-B.minY)}r.x=Math.min(Math.max(r.x,0),B.maxX);r.y=Math.min(Math.max(r.y,B.minY),B.maxY);pickTarget(r)})}
function pickTarget(r){const B=bounds(r);r.tx=Math.random()*B.maxX;r.ty=B.minY+Math.random()*(B.maxY-B.minY);r.wait=performance.now()+1500+Math.random()*3000}
function layout(){const st=$('stage');const bw=st.clientWidth,bh=st.clientHeight;if(!bw||!bh)return;
  const s=Math.max(2,Math.round(bw/150));const W=Math.ceil(bw/s),H=Math.ceil(bh/s);
  room={W,H,s,wallH:drawRoom($('room'),W,H),ps:s+2};const cv=$('room');cv.style.width=W*s+'px';cv.style.height=H*s+'px';syncRoamers()}
function happy(id,ms){const r=roamers.find(x=>x.id===id);if(r){r.eyes='happy';r.until=performance.now()+(ms||1500)}}
let lastT=0;
function loop(t){requestAnimationFrame(loop);if(!S||!mainPet()||!$('cover').hidden)return;
  const dt=Math.min(50,t-(lastT||t));lastT=t;const hour=new Date().getHours(),night=hour>=22||hour<6;
  roamers.forEach((r,i)=>{const p=S.pets.find(x=>x.id===r.id);if(!p)return;const f=formIdx(p.lv);
    if(t>r.wait){const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);
      if(d<2)pickTarget(r);else{const sp=(f===0?.018:.045)*dt;r.x+=dx/d*Math.min(sp,d);r.y+=dy/d*Math.min(sp,d);if(Math.abs(dx)>1)r.dir=dx>0?1:-1}}
    if(t-r.lastFr>(f===0?700:430)){r.lastFr=t;r.fr^=1}
    let eyes=r.until>t?r.eyes:'open';
    if(eyes==='open'){if(night)eyes='sleep';else if(t>r.blink){eyes='blink';if(t>r.blink+140)r.blink=t+2200+Math.random()*3000}}
    if(f===0&&eyes!=='blink')eyes='open';
    drawTo(r.el,p.sp,f,r.fr,eyes);r.el.style.left=r.x+'px';r.el.style.top=r.y+'px';r.el.style.transform='scaleX('+(-r.dir)+')';r.el.style.zIndex=10+Math.round(r.y);
    const sr=SPECIES[p.sp].r,glow=(f>=4||sr==='L'||(sr==='E'&&f>=3))?ELEM[SPECIES[p.sp].el].g:null;r.el.style.filter=glow?'drop-shadow(0 0 '+(4+2*Math.sin(t/300+i))+'px '+glow+')':'';
    const w=r.sz*.5;r.sh.style.width=w+'px';r.sh.style.height=w*.28+'px';r.sh.style.left=(r.x+r.sz/2-w/2)+'px';r.sh.style.top=(r.y+r.sz*.86)+'px';r.sh.style.zIndex=9+Math.round(r.y);
    if(i===0){const b=$('bubble');b.style.left=(r.x+r.sz/2)+'px';b.style.top=(r.y+r.sz*(f===0?.32:.12))+'px'}});
}
let bubT;function say(t,ms){const b=$('bubble');b.textContent=t;b.style.opacity=1;clearTimeout(bubT);bubT=setTimeout(()=>b.style.opacity=0,ms||3200)}
function idleLine(){const p=mainPet();if(!p)return'';const al=allowanceLeft();
  if(p.lv>=MAXLV)return'โตเต็มที่แล้ว! ขอบคุณที่ดูแลกันมานะ ✨';
  if(S.wallet>0&&al>0)return'มี Kcal ในกระเป๋าแล้ว ป้อนพลังให้หน่อยน้า 🍖';
  if(al<=0)return'วันนี้อิ่มแล้ว พรุ่งนี้มาเล่นกันใหม่นะ';
  const L=['ไปเดินเล่นด้วยกันไหม~','ออกกำลังกายแล้วกลับมาเล่าให้ฟังนะ!','วันนี้ขยับตัวหรือยังเอ่ย?','ดื่มน้ำบ้างนะ อากาศร้อน','อยากโตไวๆ เลย!'];return L[Math.floor(Math.random()*L.length)]}

/* ---------- petting ---------- */
function petTap(e,id){const p=S.pets.find(x=>x.id===id);const r=roamers.find(x=>x.id===id);if(!p||!r)return;const d=dayIdx();if(S.petting.d!==d)S.petting={d,n:0,last:S.petting.last||0};
  const now=Date.now();const st=$('stage').getBoundingClientRect();const x=(e.clientX||st.left+r.x+50)-st.left,y=(e.clientY||st.top+r.y)-st.top;
  heart(x,y);r.el.classList.remove('wig');void r.el.offsetWidth;r.el.classList.add('wig');happy(id,1400);
  const who=id===S.main?'':p.name+': ';
  if(S.petting.n>=PET_MAX){say(who+'วันนี้ลูบครบแล้ว ขอบคุณน้า 💕');return}
  const left=S.petting.last+PET_CD-now;if(left>0){const m=Math.floor(left/60000),s=Math.ceil(left%60000/1000);say(who+'ชอบจัง~ ลูบได้อีกครั้งใน '+m+':'+String(s).padStart(2,'0'));return}
  S.petting.n++;S.petting.last=now;let ups=[];SND.play('pet');{const q=questState();q.pets=(q.pets||0)+1}
  if(p.lv<MAXLV){ups=addExp(p,5,'pet');floatTxt(x,y-20,'+5 EXP')}
  say(who+['ฮิฮิ จั๊กจี้~','ชอบที่สุดเลย!','อีกนิด อีกนิด~','💕 รักนะ'][Math.floor(Math.random()*4)]);
  save();renderTop();showLevelUps(p,ups)}
function heart(x,y){for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart';h.textContent='♥';h.style.left=(x-8+(i-1)*14)+'px';h.style.top=(y-10-i*6)+'px';h.style.animationDelay=(i*.12)+'s';$('stage').appendChild(h);setTimeout(()=>h.remove(),1500)}}
function floatTxt(x,y,t){const f=document.createElement('div');f.className='float';f.textContent=t;f.style.left=(x-20)+'px';f.style.top=y+'px';$('stage').appendChild(f);setTimeout(()=>f.remove(),1400)}

/* ---------- exercise sheet ---------- */
function exerciseSheet(){
  let act='walk',val='';
  openSheet('<h2>บันทึกการออกกำลังกาย</h2><p class="mut">ทำอะไรมาวันนี้? Kcal ทั้งหมดเข้ากระเป๋า ไม่มีหาย</p>'+
   '<div class="chips" id="acts">'+ACTS.map(a=>'<button class="chip" data-a="'+a.k+'">'+a.i+' '+a.n+'</button>').join('')+'</div>'+
   '<label class="mut" for="kIn">เผาผลาญไปกี่ Kcal</label><input type="number" id="kIn" inputmode="numeric" min="1" max="3000" placeholder="0">'+
   '<div class="chips" id="quick">'+[50,100,200,300,500].map(v=>'<button class="chip" data-q="'+v+'">+'+v+'</button>').join('')+'<button class="chip" id="est">ไม่รู้ตัวเลข? ใช้ค่าประมาณ 30 นาที</button></div>'+
   '<div id="exConf"></div><button class="btn kcal" id="exGo">บันทึก</button>'+

   '<p class="note">ตัวเลขเป็นค่าประมาณ ไม่ใช่คำแนะนำทางการแพทย์ · ออกกำลังกายตามความเหมาะสมของร่างกาย ไม่ต้องหักโหมนะ</p>',
  (b)=>{
    const sel=()=>b.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x.dataset.a===act));sel();

    b.querySelector('#acts').onclick=e=>{const x=e.target.closest('[data-a]');if(x){act=x.dataset.a;sel()}};

    b.querySelector('#est').onclick=()=>{const a=ACTS.find(z=>z.k===act);inp.value=a.e;toast(a.n+' 30 นาที ≈ '+a.e+' Kcal (ค่าประมาณ)')};
    const list=()=>{const d=dayIdx();const es=S.entries.filter(x=>x.d===d);b.querySelector('#exToday').textContent=fmt(todayKcal())+' Kcal';
      b.querySelector('#exList').innerHTML=es.length?es.map(x=>{const a=ACTS.find(z=>z.k===x.a)||ACTS[5];return'<div class="li"><span>'+a.i+' '+a.n+' <b class="num">'+fmt(x.k)+'</b> Kcal</span><button class="x" data-del="'+x.ts+'">ลบ</button></div>'}).join(''):'<p class="mut">ยังไม่มีรายการ</p>';
      if(todayKcal()>3000)b.querySelector('#exList').insertAdjacentHTML('beforeend','<p class="note warn">วันนี้ออกกำลังเยอะมากแล้ว พักผ่อนด้วยนะ</p>')};list();
    b.querySelector('#exList').onclick=e=>{const x=e.target.closest('[data-del]');if(!x)return;const en=S.entries.find(z=>z.ts==x.dataset.del);if(!en)return;
      if(S.wallet<en.k){toast('ลบไม่ได้ Kcal ก้อนนี้ใช้ป้อนน้องไปแล้ว');return}
      S.wallet-=en.k;S.totalKcal-=en.k;S.log[en.d]=Math.max(0,(S.log[en.d]||0)-en.k);S.entries=S.entries.filter(z=>z!==en);save();renderTop();list();toast('ลบรายการแล้ว')};
    b.querySelector('#exGo').onclick=()=>{const v=Math.round(+inp.value);const box=b.querySelector('#exConf');
      if(!(v>=1&&v<=3000)){box.innerHTML='<p class="warn">ใส่ตัวเลข 1–3,000 Kcal ต่อครั้งนะ</p>';return}
      const a=ACTS.find(z=>z.k===act);
      box.innerHTML='<div class="card"><p>บันทึก '+a.i+' '+a.n+' <b class="num" style="color:var(--kcal)">'+fmt(v)+'</b> Kcal ใช่ไหม?</p><div class="row"><button class="btn go sm" id="yes" style="flex:1">ยืนยัน</button><button class="btn sm" id="no" style="flex:1">แก้ไข</button></div></div>';

/* ---------- feed sheet ---------- */
function feedSheet(id){
  let p=(id&&S.pets.find(x=>x.id===id))||mainPet();let amt=0;
  openSheet('<h2 id="fdT"></h2>'+(S.pets.length>1?'<div class="fsel" id="fSel"></div>':'')+'<div id="fd"></div>',(b)=>{
    const sel=()=>{b.querySelector('#fdT').textContent='ป้อนพลังให้ '+p.name;const fs=b.querySelector('#fSel');if(!fs)return;
      fs.innerHTML=S.pets.slice().sort((a,c)=>(c.id===S.main)-(a.id===S.main)||c.lv-a.lv).map(x=>'<button data-pid="'+x.id+'" class="'+(x===p?'on':'')+'">'+sprImg(x.sp,formIdx(x.lv),40)+'<span class="num">Lv'+x.lv+'</span></button>').join('');
      fs.querySelectorAll('[data-pid]').forEach(x=>x.onclick=()=>{p=S.pets.find(z=>z.id===x.dataset.pid);amt=0;sel();draw()})};
    const draw=()=>{const al=allowanceLeft(),mx=Math.min(S.wallet,al,toMax(p));if(amt>mx)amt=mx;
      const q=previewFeed(p,amt);const nl=need(p.lv)-p.exp;
      let h='<div class="row" style="gap:12px;flex-wrap:nowrap">'+sprImg(p.sp,formIdx(p.lv),96)+'<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><div class="row sp"><span>Lv <b class="num">'+p.lv+'</b></span><span class="mut num">'+(p.lv>=MAXLV?'MAX':fmt(p.exp)+' / '+fmt(need(p.lv))+' EXP')+'</span></div><div class="bar"><i style="width:'+(p.lv>=MAXLV?100:p.exp/need(p.lv)*100)+'%"></i></div>'+
        '<div class="row sp mut"><span>Kcal ในกระเป๋า</span><b class="num" style="color:var(--kcal)">'+fmt(S.wallet)+'</b></div><div class="row sp mut"><span>วันนี้ย่อยได้อีก</span><b class="num" style="color:var(--good)">'+fmt(al)+' / '+fmt(S.cap)+'</b></div></div></div>';
      if(S.snacks>0&&p.lv<MAXLV)h+='<button class="btn sm" id="snack">🍪 ให้ขนม 1 ชิ้น · +40 EXP (มี '+S.snacks+')</button>';

function encode(o){const s=JSON.stringify(o);const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function whyBad(t){const c=String(t||'').replace(/[^A-Za-z0-9+\/=_-]/g,'');if(!c.length)return'ยังไม่ได้วางรหัส';if(c.length<200)return'รหัสสั้นเกินไป (มี '+c.length+' ตัวอักษร) น่าจะคัดลอกมาไม่ครบ';return'รหัสไม่ครบหรือมีบางตัวเพี้ยน (มี '+c.length+' ตัวอักษร) ลองกด 📋 คัดลอกรหัสใหม่แล้ววางอีกครั้ง'}
function decode(t){let c=String(t||'').replace(/[^A-Za-z0-9+\/=_-]/g,'').replace(/-/g,'+').replace(/_/g,'/');const j=c.indexOf('eyJ');if(j>0)c=c.slice(j);c=c.replace(/=+$/,'');if(c.length<40)throw 0;
  for(let cut=0;cut<=8;cut++){let x=c.slice(0,c.length-cut);while(x.length%4)x+='=';try{const bin=atob(x);const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))));if(o&&Array.isArray(o.pets))return o}catch(e){}}
  throw 0}

const SKD=[{m:1.4,k:'one'},{m:1.9,k:'one'},{k:'guard'},{m:1.6,k:'all'},{m:3.5,k:'one'}];
const skillList=()=>[{i:-1,n:'ตีธรรมดา',e:0,lv:1,m:1,k:'one',d:'แรง ×1.0'}].concat(SKILLS.map((s,i)=>Object.assign({i},s,SKD[i])));
const BEATS={fire:'leaf',leaf:'water',water:'fire'};
const elMul=(a,d)=>BEATS[a]===d?1.25:BEATS[d]===a?.8:1;
function hit(R,atk,mul,df,ea,ed){let v=atk*mul*30/(30+df)*(.9+R()*.2);const crit=R()<.1;if(crit)v*=1.5;return{v:v*elMul(ea,ed),crit}}
function makeUnit(p){const s=stats(p);return{p,id:p.id,sp:p.sp,name:p.name,lv:p.lv,star:p.star||1,el:SPECIES[p.sp].el,hp:s.hp,max:s.hp,atk:s.atk,df:s.df,reg:s.en,en:penergy(p),guard:0,tank:p.preset==='tank'}}
function makeBattle(ph,i,team){const st=PHASES[ph].stages[i];return{ph,i,st,t:1,over:null,team:team.map(makeUnit),
  mons:Array.from({length:st.n},(_,k)=>({k,sp:st.m,name:SPECIES[st.m].name+(st.n>1?' '+'ABC'[k]:''),hp:st.hp,max:st.hp,atk:st.atk,df:st.df,el:st.el,boss:!!st.boss}))}}
const aliveM=B=>B.mons.filter(m=>m.hp>0), aliveT=B=>B.team.filter(u=>u.hp>0);
function autoSkill(B,u){const L=skillList(),am=aliveM(B).length;
  for(let i=5;i>=1;i--){const s=L[i];if(u.lv<s.lv||u.en<s.e)continue;if(s.k==='guard'&&u.hp>u.max*.45)continue;if(s.k==='all'&&am<2)continue;return s}return L[0]}
function autoTarget(B){const a=aliveM(B);return a.reduce((x,m)=>m.hp<x.hp?m:x,a[0])}
function petAct(B,u,s,tgt,R){const ev=[{t:'act',u,s}];u.en-=s.e;
  if(s.k==='guard'){const solo=B.team.length===1;for(const v of aliveT(B)){if(!solo||v===u){const h=Math.min(v.max-v.hp,v.max*(solo?.3:.2));v.hp+=h;ev.push({t:'heal',u:v,v:h})}v.guard=2}}
  else{const targets=s.k==='all'?aliveM(B):[tgt&&tgt.hp>0?tgt:autoTarget(B)];
    for(const m of targets){const r=hit(R,u.atk,s.m,m.df,u.el,m.el);m.hp-=r.v;ev.push({t:'hit',m,v:r.v,crit:r.crit});
      if(m.hp<=0){m.hp=0;ev.push({t:'kill',m});for(const v of aliveT(B)){const h=Math.min(v.max-v.hp,v.max*.25);v.hp+=h;if(h>0.5)ev.push({t:'heal',u:v,v:h})}u.en=Math.min(EN_MAX,u.en+30)}}}
  u.en=Math.min(EN_MAX,u.en+u.reg);if(!aliveM(B).length)B.over='win';return ev}
function pickW(tm,R){const w=tm.map(u=>u.tank?2:1);let r=R()*w.reduce((a,b)=>a+b);for(let i=0;i<tm.length;i++){r-=w[i];if(r<=0)return tm[i]}return tm[tm.length-1]}
function monPhase(B,R){const ev=[],heavy=B.t%3===0;
  for(const m of aliveM(B)){const tm=aliveT(B);if(!tm.length)break;const big=m.boss&&heavy;
    for(const u of(big&&B.team.length>1?tm:[pickW(tm,R)])){const r=hit(R,m.atk,big?1.8:1,u.df,m.el,u.el);const v=r.v*(u.guard>0?.5:1);u.hp-=v;ev.push({t:'mhit',m,u,v,crit:r.crit,big,g:u.guard>0});if(u.hp<=0){u.hp=0;ev.push({t:'down',u})}}}
  for(const u of B.team)u.guard--;B.t++;if(!aliveT(B).length)B.over='lose';return ev}
function simStage(ph,i,lv,star,size,en0,n){let w=0;const R=Math.random;
  for(let k=0;k<n;k++){const team=['bal','atk','tank'].slice(0,size).map((pr,j)=>{const p={id:'x'+j,sp:'shiba',name:'x',lv,star,exp:0,preset:pr,pts:{hp:0,atk:0,df:0,en:0},free:0,energy:en0};addPoints(p,lv-1);return p});const B=makeBattle(ph,i,team);
    for(let g=0;g<200&&!B.over;g++){for(const u of aliveT(B)){if(B.over)break;petAct(B,u,autoSkill(B,u),autoTarget(B),R)}if(!B.over)monPhase(B,R)}if(B.over==='win')w++}return w/n}

function logB(t){if(BT)BT.el.querySelector('#bLog').textContent=t}
async function playEvents(ev){for(const e of ev){if(!BT||BT.quit)return;
  if(e.t==='act'){SND.play(e.s.k==='guard'?'guard':e.s.i>=0?'skill':'tap');anim(petEl(e.u),'lunge');logB(e.u.name+' ใช้ '+e.s.n);await sleep(260)}
  else if(e.t==='hit'){SND.play(e.crit?'crit':'hit');const n=monEl(e.m);anim(n,'shake');e.m.hurt=1;BT.redraw();pop(n,(e.crit?'คริ! ':'')+Math.round(e.v),e.crit?'crit':'');renderBattle(BT.active);await sleep(330);e.m.hurt=0;BT.redraw()}
  else if(e.t==='kill'){SND.play('kill');logB(e.m.name+' หมดแรงแล้ว!');renderBattle(BT.active);await sleep(250)}
  else if(e.t==='heal'){pop(petEl(e.u),'+'+Math.round(e.v),'heal');renderBattle(BT.active);await sleep(180)}
  else if(e.t==='mhit'){const mn=monEl(e.m);anim(mn,'mlunge');await sleep(180);anim(petEl(e.u),'shake');SND.play(e.big?'big':'hurt');pop(petEl(e.u),(e.big?'💥':'')+(e.crit?'คริ! ':'')+Math.round(e.v),e.crit||e.big?'crit':'');
    logB(e.m.name+(e.big?' ใช้ท่าแรง!':' โจมตี')+(e.g?' (โล่ช่วยรับ)':''));renderBattle(BT.active);await sleep(380)}
  else if(e.t==='down'){logB(e.u.name+' หมดแรง...');renderBattle(BT.active);await sleep(300)}}}
async function runBattle(){const B=BT.B;await sleep(450);
  while(BT&&!B.over&&!BT.quit){
    for(const u of B.team){if(!BT||B.over||BT.quit)break;if(u.hp<=0)continue;
      renderBattle(u);let s=null;
      if(BT.mode==='manual'){const pick=await new Promise(r=>{BT.wait=r;drawSkills()});if(!BT)return;BT.wait=null;if(BT.quit)return;if(pick&&pick!=='assist')s=pick}
      if(!s){s=autoSkill(B,u);drawSkills();await sleep(BT.mode==='auto'?380:120);if(!BT||BT.quit)return}
      drawSkills('mon');BT.el.querySelector('#bSk').innerHTML='<p class="mut" style="text-align:center;padding:10px 0">'+esc(u.name)+' ใช้ '+s.n+'!</p>';
      const tg=BT.tgt&&BT.tgt.hp>0?BT.tgt:null;await playEvents(petAct(B,u,s,tg,BT.R));if(!BT)return;if(BT.tgt&&BT.tgt.hp<=0)BT.tgt=null;renderBattle()}
    if(!BT||B.over||BT.quit)break;
    drawSkills('mon');await sleep(260);await playEvents(monPhase(B,BT.R));if(!BT)return;renderBattle();await sleep(200)}
  if(BT&&!BT.quit){BT.el.querySelector('#bWarn').hidden=true;await sleep(350);finishBattle()}}
function finishBattle(){const B=BT.B,st=B.st,id=sid(B.ph,B.i),first=!isClear(B.ph,B.i);const p=mainPet();let ups=[],h;questState().fights++;
  B.team.forEach(u=>u.p.energy=Math.max(0,Math.min(EN_MAX,u.en+EN_AFTER)));const enTxt='<p class="mut" style="font-size:12px">⚡ หลังสู้ฟื้น Energy +'+EN_AFTER+' · '+B.team.map(u=>esc(u.name)+' '+Math.round(penergy(u.p))).join(' · ')+'</p>';
  SND.music('home');SND.play(B.over==='win'?'win':'lose');
  if(B.over==='win'){const rec=S.stages[id]||{};rec.clear=true;rec.best=Math.min(rec.best||999,B.t-1);rec.wins=(rec.wins||0)+1;S.stages[id]=rec;
    B.team.forEach(u=>u.happy=1);BT.redraw();
    let gain='';
    const per=[];
    if(first){B.team.forEach(u=>{const x=addExp(u.p,st.exp);if(x.length)per.push([u.p,x]);ups=ups.concat(x)});S.stars+=st.st;if(st.boss){S.eggs++;if(B.ph===0)S.slots=Math.max(S.slots,2);if(B.ph===1)S.slots=Math.max(S.slots,3)}
      gain='<p>+<b class="num">'+st.exp+'</b> EXP · ⭐ +<b class="num">'+st.st+'</b>'+(st.boss?' · 🥚 ไข่ฟรี 1 ใบ':'')+'</p>'+(st.boss?'<p class="note">ไข่ฟรีเปิดได้ที่หน้ากาชา'+(B.ph<2?' · ช่องทีมที่ '+(B.ph+2)+' เปิดแล้ว! ไปจัดทีมได้ที่ฟาร์มและทีม':'')+(B.ph<9?' · เฟส '+(B.ph+2)+' เปิดแล้ว!':' · 🏆 พิชิตหอคอยครบ 100 ด่าน!')+'</p>':'')}
    else if(replayLeft()>0){S.replay.n++;B.team.forEach(u=>{const x=addExp(u.p,10);if(x.length)per.push([u.p,x]);ups=ups.concat(x)});gain='<p>ชนะซ้ำ +<b class="num">10</b> EXP <span class="mut">(วันนี้เหลือ '+replayLeft()+' ครั้ง)</span></p>'}
    else gain='<p class="mut">วันนี้รับ EXP จากการชนะซ้ำครบ 3 ครั้งแล้ว</p>';
    save();renderTop();
    per.forEach(([pp,uu])=>{const last=uu[uu.length-1],evo=uu.some(u=>formIdx(u.to)!==formIdx(u.from)),sk=SKILLS.filter(x=>uu.some(u=>x.lv>u.from&&x.lv<=u.to));
      gain+='<div class="card'+(evo?' flash':'')+'" style="text-align:center"><p>🎉 '+esc(pp.name)+' เลเวลอัปเป็น <b class="num">Lv '+last.to+'</b>!'+(evo?' เปลี่ยนร่างเป็น<b>'+FORMS[formIdx(last.to)].n+'</b>':'')+'</p><p class="mut">ได้ +'+(uu.length*10)+' แต้ม'+(pp.preset?' (จัดให้อัตโนมัติ)':' รอจัดเองในหน้าน้อง')+'</p>'+sk.map(x=>'<p>ปลดสกิล <b>'+x.n+'</b></p>').join('')+'</div>'});
    h='<div style="display:flex;flex-direction:column;gap:10px;text-align:center"><h3>ด่าน '+(B.ph*10+B.i+1)+'</h3><div class="big" style="color:var(--good)">ชนะ!</div><div class="row" style="justify-content:center">'+B.team.map(u=>sprImg(u.sp,formIdx(u.p.lv),B.team.length>1?88:120)).join('')+'</div>'+gain+enTxt+'<p class="mut">ใช้ '+(B.t-1<1?1:B.t-1)+' ตา</p>'+
      (B.i<9||B.ph<9?'<button class="btn kcal" id="rNext">'+(B.i<9?'ด่านต่อไป ▶':'ไปเฟส '+(B.ph+2)+' ▶')+'</button>':'')+'<button class="btn" id="rMap">🗺️ กลับแผนที่</button></div>'}
  else{const gap=B.team.reduce((a,u)=>a+kcalTo(u.p,st.rec),0),sg=B.team.filter(u=>(u.p.star||1)<st.star).length,lowE=B.team.some(u=>u.en<40);
    h='<div style="display:flex;flex-direction:column;gap:10px;text-align:center"><h3>ด่าน '+(B.ph*10+B.i+1)+'</h3><div class="big" style="color:#ff9a9a">แพ้แล้ว...</div><p>ไม่เป็นไรนะ แพ้ไม่เสียอะไรเลย</p>'+
      (gap>0?'<p class="note" style="text-align:left">ด่านนี้แนะนำน้อง Lv '+st.rec+' ขาดอีก <b class="num">'+fmt(gap)+'</b> Kcal ≈ เดินเร็วประมาณ '+walkMin(gap)+' นาที แล้วกลับมาสู้ใหม่!</p>':(sg?'<p class="note" style="text-align:left">ด่านนี้แนะนำ ★'+st.star+' ยังขาด '+sg+' ตัว อัปดาวได้ที่หน้าน้อง</p>':lowE?'<p class="note" style="text-align:left">⚡ Energy น้องเหลือน้อย ใช้สกิลไม่ค่อยได้ ลอง 🌙 พักจอเติมพลังแล้วกลับมาใหม่</p>':'<p class="note" style="text-align:left">เลเวลถึงแล้ว ลองอีกครั้ง เลือกน้องธาตุที่ได้เปรียบ หรือกด 🎮 สั่งเอง แล้วใช้โล่ตอนเห็นคำเตือนท่าแรง</p>'))+enTxt+
      '<button class="btn kcal" id="rRetry">↺ ลองอีกครั้ง</button><button class="btn" id="rMap">🗺️ กลับแผนที่</button></div>'}
  const ph=B.ph,i=B.i;
  openSheet(h,(b,ov)=>{const go=fn=>()=>{closeSheet(ov);endBattle();fn()};
    const n=b.querySelector('#rNext');if(n)n.onclick=go(()=>i<9?adventureSheet(ph,i+1):adventureSheet(ph+1,0));
    const r=b.querySelector('#rRetry');if(r)r.onclick=go(()=>startBattle(ph,i));
    b.querySelector('#rMap').onclick=go(()=>adventureSheet(ph,B.over==='win'&&i<9?i+1:i))},{noClose:true});
}
function endBattle(){SND.music('home');if(!BT)return;clearInterval(BT.idle);BT.el.remove();BT=null;renderTop()}

/* ---------- gacha ---------- */
const EGG_COST=200;
function newPet(sp){return{id:'p_'+sp+'_'+Date.now().toString(36),sp,name:SPECIES[sp].name,lv:1,exp:0,preset:'bal',pts:{hp:0,atk:0,df:0,en:0},free:0,resetUsed:false,born:Date.now()}}
const owns=sp=>S.pets.some(p=>p.sp===sp);
function rollRarity(){if(S.pity.l>=40)return'L';const x=Math.random()*100;let r=x<3?'L':x<15?'E':x<45?'R':'B';if(S.pity.e>=10&&(r==='B'||r==='R'))r='E';return r}
function pullOne(){const r=rollRarity();S.pity.l=r==='L'?0:S.pity.l+1;S.pity.e=(r==='E'||r==='L')?0:S.pity.e+1;
  const pool=POOL.filter(k=>SPECIES[k].r===r),sp=pool[Math.floor(Math.random()*pool.length)];
  if(owns(sp)){const st=RAR[r].dupe;S.stars+=st;S.book[sp]=1;return{sp,r,dupe:st}}
  const p=newPet(sp);S.pets.push(p);S.book[sp]=1;return{sp,r,p}}
const rarTag=r=>'<span class="tag" style="border-color:'+RAR[r].c+';color:'+RAR[r].c+'">'+RAR[r].n+'</span>';

  openSheet('<div class="row sp"><h2>กาชาไข่น้อง</h2><span class="tag">⭐ <span class="num" id="gSt"></span></span></div><div id="gB"></div>',(b,ov)=>{

        '<p class="mut" style="font-size:12px">การันตี Epic ขึ้นไปในอีก <b class="num" style="color:'+RAR.E.c+'">'+Math.max(1,11-S.pity.e)+'</b> ใบ · Legendary ในอีก <b class="num" style="color:'+RAR.L.c+'">'+Math.max(1,41-S.pity.l)+'</b> ใบ</p>';
      if(full)h+='<p class="warn">ฟาร์มเต็มแล้ว ('+S.pets.length+'/'+S.farmCap+') ขยายฟาร์มก่อนนะ</p><button class="btn" id="gFarm">🏡 ไปที่ฟาร์ม</button>';
      else{if(S.eggs>0)h+='<button class="btn go" id="gFree" style="width:100%">🥚 เปิดไข่ฟรี (มี '+S.eggs+' ใบ)</button>';
        h+=confirm?'<div class="card" style="background:var(--edge);width:100%"><p>ใช้ <b class="num" style="color:var(--kcal)">'+EGG_COST+'</b> Kcal สุ่มไข่ 1 ใบ?</p><div class="row"><button class="btn go sm" id="gY" style="flex:1">ยืนยัน</button><button class="btn sm" id="gN" style="flex:1">ยกเลิก</button></div></div>':
          '<button class="btn kcal" id="gBuy" style="width:100%" '+(S.wallet<EGG_COST?'disabled':'')+'>สุ่ม 1 ใบ · '+EGG_COST+' Kcal</button>'+(S.wallet<EGG_COST?'<p class="mut" style="font-size:12px">Kcal ในกระเป๋ามี '+fmt(S.wallet)+'</p>':'')}
      h+='</div>';
      h+='<div class="card"><div class="row sp"><h3>สมุดสะสม</h3><span class="mut num">'+POOL.filter(owns).length+' / '+POOL.length+'</span></div><div class="book" id="gBook">'+

      h+='<div class="card"><h3>อัตราออก</h3>'+['B','R','E','L'].map(r=>{const n=POOL.filter(k=>SPECIES[k].r===r).length;return'<div class="row sp" style="font-size:13px">'+rarTag(r)+'<span class="num">'+RAR[r].p+'% · '+n+' ตัว · ตัวละ '+(Math.round(RAR[r].p/n*100)/100)+'%</span></div>'}).join('')+
        '<p class="note">ได้ตัวที่มีแล้ว → เปลี่ยนเป็นดาวเศษ Basic 2 · Rare 5 · Epic 15 · Legendary 40 · ดาวเศษใช้แลกน้องที่ยังไม่มีในสมุดสะสม</p></div>';

document.addEventListener('pointerdown',()=>SND.unlock(),{capture:true});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&!b.closest('#bSk')&&!b.dataset.nosnd)SND.play('tap')},{capture:true});
function soundCard(){const P=SND.P;return'<div class="card" id="sndC"><div class="row sp"><h3>เสียง</h3><button class="btn sm" id="sMute" style="min-width:110px">'+(P.mute?'🔇 ปิดเสียงอยู่':'🔊 เปิดเสียงอยู่')+'</button></div>'+
  [['vol','ระดับเสียงรวม',null],['music','เพลงพื้นหลัง','musicOn'],['sfx','เสียงประกอบ','sfxOn']].map(([k,n,on])=>'<div class="sndrow"><span>'+n+'</span>'+(on?'<button class="x" data-tg="'+on+'" style="color:'+(P[on]?'var(--good)':'var(--muted)')+'">'+(P[on]?'✓ เปิดอยู่':'✕ ปิดอยู่')+'</button>':'<span></span>')+
    '<div class="row" style="flex-wrap:nowrap;gap:6px;grid-column:1/-1"><button class="x" data-dn="'+k+'" aria-label="ลดเสียง'+n+'">－</button><input type="range" min="0" max="100" step="5" id="v_'+k+'" value="'+Math.round(P[k]*100)+'" aria-label="'+n+'"><button class="x" data-up="'+k+'" aria-label="เพิ่มเสียง'+n+'">＋</button><span class="num" style="width:38px;text-align:right">'+Math.round(P[k]*100)+'%</span></div></div>').join('')+
  '<p class="mut" style="font-size:11px">บน iPhone ถ้าเปิดสวิตช์โหมดเงียบไว้ เสียงจากหน้าเว็บจะไม่ดัง</p></div>'}
function bindSound(b){const P=SND.P,re=()=>{b.querySelector('#sndC').outerHTML=soundCard();bindSound(b)};
  b.querySelector('#sMute').onclick=()=>{SND.set('mute',!P.mute);re()};
  b.querySelectorAll('[data-tg]').forEach(x=>x.onclick=()=>{const k=x.dataset.tg;SND.set(k,!P[k]);if(k==='musicOn'&&P[k])SND.restart();re()});
  const setv=(k,v)=>{v=Math.max(0,Math.min(1,v));SND.set(k,v);if(v>0&&P.mute)SND.set('mute',false);if(k==='music'&&v>0&&!P.musicOn){SND.set('musicOn',true);SND.restart()}if(k==='sfx'&&v>0&&!P.sfxOn)SND.set('sfxOn',true);SND.play('pet');re()};
  ['vol','music','sfx'].forEach(k=>{const r=b.querySelector('#v_'+k);r.onchange=()=>setv(k,r.value/100);r.oninput=()=>{r.nextElementSibling.nextElementSibling.textContent=r.value+'%'};
    b.querySelector('[data-dn="'+k+'"]').onclick=()=>setv(k,P[k]-.1);b.querySelector('[data-up="'+k+'"]').onclick=()=>setv(k,P[k]+.1)})}
/* ---------- dock ---------- */
const DOCK=[{i:'🐾',n:'น้อง',fn:petSheet},{i:'🗺️',n:'ผจญภัย',fn:()=>adventureSheet()},{i:'🥚',n:'กาชา',fn:gachaSheet},{i:'🏡',n:'ฟาร์มและทีม',fn:farmSheet},{i:'📜',n:'ภารกิจ',fn:questSheet},{i:'🌙',n:'พักจอ',fn:detoxStart},{i:'📊',n:'สถิติ',fn:statsSheet},{i:'❓',n:'วิธีเล่น',fn:()=>tutorial()},{i:'⚙️',n:'ตั้งค่า',fn:settingsSheet},{i:'🚪',n:'ออกจากเกม',fn:exitSheet}];
function buildDock(){const d=$('dock');d.innerHTML=DOCK.map((x,i)=>'<button class="di'+(x.lock?' lock':'')+'" data-d="'+i+'"><span>'+x.i+'</span><span>'+x.n+'</span></button>').join('');
  d.onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const x=DOCK[+b.dataset.d];if(x.lock){toast(x.n+' จะเปิดในรอบถัดไปนะ');return}toggleDock(false);x.fn()}}
function toggleDock(v){const d=$('dock');const open=v==null?d.hidden:v;d.hidden=!open;$('dockArrow').textContent=open?'▼':'▲';$('dockTog').setAttribute('aria-expanded',open)}
function exitSheet(){openSheet('<h2>ออกจากเกม?</h2><p>ข้อมูลบันทึกอัตโนมัติแล้ว กลับมาเมื่อไหร่ '+esc(mainPet().name)+' ก็รออยู่นะ 💕</p><p class="note">ถ้าเปลี่ยนเครื่องบ่อย คัดลอกรหัสสำรองไว้ในหน้าตั้งค่าด้วย</p><button class="btn" id="toSet">⚙️ ไปคัดลอกรหัสสำรอง</button><button class="btn go" id="bye">กลับหน้าปก</button>',(b,ov)=>{
  b.querySelector('#toSet').onclick=()=>{closeSheet(ov);settingsSheet()};b.querySelector('#bye').onclick=()=>{save();closeAll();showCover()}},{closeText:'เล่นต่อ'})}

/* ---------- start / welcome ---------- */
function migrate(){const f=fresh();for(const k in f)if(S[k]===undefined)S[k]=f[k];if(!S.team.length&&S.main)S.team=[S.main];S.pets.forEach(p=>S.book[p.sp]=1);S.pets.forEach(p=>{if(p.free==null)p.free=0;if(!p.pts)p.pts={hp:0,atk:0,df:0,en:0};if(p.energy==null)p.energy=100;if(!p.star)p.star=1})}
function welcome(){
  openSheet('<div class="center" style="display:flex;flex-direction:column;gap:12px;text-align:center"><h2>ยินดีต้อนรับสู่ Kcal Pet Dungeon!</h2><p>ออกกำลังกายจริง → ได้ Kcal → เลี้ยงน้องให้โต แล้วพาไปผจญภัย</p><p class="mut">เคยเล่นมาก่อนไหม?</p><button class="btn kcal" id="wNew">🥚 เริ่มใหม่ รับไข่ฟรี!</button><button class="btn" id="wOld">🔑 เคยเล่นแล้ว มีรหัสสำรอง</button><div id="wImp"></div></div>',(b,ov)=>{
    b.querySelector('#wNew').onclick=()=>{closeSheet(ov);eggScene()};
    b.querySelector('#wOld').onclick=()=>{const w=b.querySelector('#wImp');w.innerHTML='<textarea id="wTx" placeholder="วางรหัสสำรองที่นี่"></textarea><div id="wMsg"></div><button class="btn go sm" id="wGo">กู้คืน</button>';
      w.querySelector('#wGo').onclick=()=>{let o;try{o=decode(w.querySelector('#wTx').value)}catch(e){w.querySelector('#wMsg').innerHTML='<p class="warn">'+whyBad(w.querySelector('#wTx').value)+'</p>';return}S=o;migrate();save();closeSheet(ov);try{startGame(false)}catch(e){console.error(e)}toast('ยินดีต้อนรับกลับ! '+(mainPet()?mainPet().name:''))}}},{noClose:true})}
function eggScene(){
  const sp=STARTERS[Math.floor(Math.random()*4)];let taps=0;
  openSheet('<div class="center" style="display:flex;flex-direction:column;gap:12px;text-align:center"><h2 id="eT">ไข่ใบแรกของคุณ</h2><p class="mut" id="eS">แตะไข่ 3 ครั้งเพื่อเปิดดูว่าเป็นน้องอะไร</p><canvas id="eggC" class="spr" width="48" height="48" style="width:192px;height:192px;cursor:pointer" role="button" aria-label="แตะไข่"></canvas><div id="eRes"></div></div>',(b,ov)=>{
    const cv=b.querySelector('#eggC');drawTo(cv,'mystery',0,0,'none');
    cv.onclick=()=>{if(taps>=3)return;taps++;SND.play(taps<3?'wiggle':'hatch');cv.classList.remove('wig');void cv.offsetWidth;cv.classList.add('wig');
      if(taps<3){b.querySelector('#eS').textContent=['ขยับนิดนึงแล้ว...','อีกครั้งเดียว!'][taps-1];return}
      cv.classList.add('flash');drawTo(cv,sp,0,0,'open');const s=SPECIES[sp],el=ELEM[s.el];
      b.querySelector('#eT').textContent='ได้ไข่ '+s.name+'! 🎉';b.querySelector('#eS').textContent=el.i+' ธาตุ'+el.n+' · ป้อนพลังจนถึง Lv 3 แล้วไข่จะฟัก';
      b.querySelector('#eRes').innerHTML='<label class="mut" for="nm">ตั้งชื่อน้อง</label><input type="text" id="nm" maxlength="14" value="'+s.name+'" style="margin:6px 0 10px"><button class="btn kcal" id="eGo" style="width:100%">เริ่มเลี้ยงเลย!</button>';
      b.querySelector('#eGo').onclick=()=>{const nm=(b.querySelector('#nm').value||s.name).trim().slice(0,14)||s.name;
        S=fresh();const p={id:'p1',sp,name:nm,lv:1,exp:0,preset:'bal',pts:{hp:0,atk:0,df:0,en:0},free:0,resetUsed:false,born:Date.now()};S.pets.push(p);S.main=p.id;S.team=[p.id];S.book[sp]=1;S.weekStart=null;capWeek();save();
        closeSheet(ov);startGame(true)}}},{noClose:true})}
function startGame(first){
  migrate();capWeek();checkSeason();tickEnergy();if(S.detox)setTimeout(detoxScreen,50);buildDock();layout();renderTop();
  if(first||!S.tutSeen){queuePopup(()=>tutorial(()=>say('สวัสดี! ดูแถบเป้าหมายด้านบนนะ ว่าต้องทำอะไรต่อ ✨',6000)))}
  else setTimeout(()=>say(idleLine(),4000),600);
  if(S.seenVer!==VER){const cur=CHANGES[0];queuePopup(()=>openSheet('<h2>มีอะไรใหม่ใน v'+cur.v+'</h2><ul style="margin:0;padding-left:18px;line-height:1.7">'+cur.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>',null,{closeText:'โอเค!'}));S.seenVer=VER;save()}
  setTimeout(nextPopup,300)}
function showCover(){const c=$('cover');c.hidden=false;
  const bg=$('coverBg');const s=4;drawRoom(bg,Math.ceil(innerWidth/s),Math.ceil(innerHeight/s));
  const sp=S&&mainPet()?mainPet().sp:STARTERS[Math.floor(Math.random()*4)];const f=S&&mainPet()?formIdx(mainPet().lv):1;
  let fr=0;clearInterval(showCover.t);showCover.t=setInterval(()=>{fr^=1;drawTo($('coverPet'),sp,f,fr,'open')},450);drawTo($('coverPet'),sp,f,0,'open')}
function enter(){SND.unlock();SND.play('open');const c=$('cover');if(c.hidden)return;setTimeout(()=>SND.music(S&&S.detox?null:'home'),200);c.hidden=true;clearInterval(showCover.t);
  if(!S)S=load();if(!S||!S.pets.length){S=null;welcome()}else startGame(false)}

/* ---------- wire ---------- */
$('cVer').textContent=VER;
$('cover').addEventListener('click',enter);
$('aEx').onclick=exerciseSheet;$('aFeed').onclick=feedSheet;$('aAdv').onclick=()=>adventureSheet();$('whoBtn').onclick=petSheet;$('kcBtn').onclick=statsSheet;$('alBtn').onclick=()=>feedSheet();
$('dockTog').onclick=()=>toggleDock();
$('goal').onclick=()=>{const f=$('goal')._fn;toggleDock(false);if(f)f()};
$('stage').addEventListener('click',e=>{if(e.target.id==='room'){toggleDock(false);say(idleLine())}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S&&mainPet())layout()},150)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&mainPet()){capWeek();checkSeason();tickEnergy();renderTop();setTimeout(nextPopup,200)}});
setInterval(()=>{if(S&&mainPet()&&$('cover').hidden){renderTop();if(Math.random()<.25&&$('bubble').style.opacity==='0'&&!sheetStack.length)say(idleLine())}},9000);
window.__kpd={get S(){return S},set S(v){S=v},save,dayIdx,capWeek,addExp,renderSprite,SPECIES,STARTERS,simStage,PHASES,get BT(){return BT},pullOne,POOL,buildGen,tickEnergy,detoxApply,checkSeason};
function boot(data){if(data&&data.S){S=data.S}else S=load();showCover();requestAnimationFrame(loop)}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)try{hot.snapshot(()=>({S}))}catch(e){}
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
