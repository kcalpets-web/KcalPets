/* Layout: one-screen handheld — crystal-dungeon room on top, chunky pixel controls below */
:root{
  --bg:#0e0a1c; --panel:#1c1535; --panel2:#272049; --line:#43387a; --edge:#0a0714;
  --fg:#f1ecff; --muted:#a99fd2; --kcal:#ffb547; --kcal-dk:#b86a12; --good:#7fe08c; --pink:#ff8fb6; --crys:#8fd6ff;
  --f-px:"KPD Num","KPD Thai","Pixelify Sans","Mitr",system-ui,sans-serif;
  --f-th:"KPD Num","KPD Thai","Pixelify Sans","Mitr",system-ui,sans-serif;
  color-scheme:dark;
}
*,*:before,*:after{box-sizing:border-box}
html{font-synthesis:none}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-th);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--crys);outline-offset:2px}
.num{font-family:var(--f-px);font-variant-numeric:tabular-nums}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
/* top bar */
.top{display:flex;gap:8px;align-items:stretch;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.pill{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 -3px 0 var(--edge);border-radius:6px;padding:5px 8px;min-width:0}
.who{flex:1;display:flex;flex-direction:column;gap:3px;text-align:left}
.who .nm{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .lv{font-family:var(--f-px);color:var(--crys);margin-right:4px}
.bar{height:7px;background:var(--edge);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--crys),#b8a4ff);width:0}
.kc{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px}
.kc b{font-family:var(--f-px);font-size:17px;color:var(--kcal);line-height:1}
.kc small{font-size:11px;color:var(--muted);white-space:nowrap}
/* stage */
#stage{flex:1;position:relative;isolation:isolate;overflow:hidden;margin:0 6px;border:3px solid var(--edge);border-radius:8px;min-height:0;background:#1a1430}
#room{position:absolute;left:0;top:0;image-rendering:pixelated}
#pet{position:absolute;image-rendering:pixelated;cursor:pointer;transform-origin:50% 100%;touch-action:manipulation}
#shadow{position:absolute;background:rgba(5,3,14,.45);border-radius:50%}
.bubble{position:absolute;background:#fff8e8;color:#2a1d3d;font-size:13px;line-height:1.35;padding:6px 10px;border-radius:8px;border:2px solid #2a1d3d;max-width:210px;pointer-events:none;transform:translate(-50%,-100%);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:opacity .25s;white-space:normal;text-align:center}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#2a1d3d;border-bottom:0}
.heart{position:absolute;color:var(--pink);font-family:var(--f-px);font-size:20px;pointer-events:none;animation:up 1.1s ease-out forwards;text-shadow:0 2px 0 #5b1838}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.float{position:absolute;font-family:var(--f-px);font-size:16px;color:var(--good);pointer-events:none;animation:up 1.3s ease-out forwards;text-shadow:0 2px 0 #123}
/* actions */
.actions{display:grid;grid-template-columns:1fr auto;gap:6px;padding-block:8px 4px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.btn{background:var(--panel2);border:2px solid var(--line);border-radius:7px;box-shadow:inset 0 -4px 0 var(--edge);padding:10px 6px 12px;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.15;min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--edge)}
.btn.kcal{background:var(--kcal);color:#3a1f00;border-color:#ffd38a;box-shadow:inset 0 -4px 0 var(--kcal-dk)}
.btn.go{background:#3f8f6a;border-color:#7fe0ac;box-shadow:inset 0 -4px 0 #1f5a3e}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 8px 8px;font-size:13px}
/* corner menu */
#menuBtn{position:relative;width:62px;min-height:48px;padding:0;border-radius:12px;background:var(--panel2);border:2px solid var(--line);box-shadow:inset 0 -4px 0 var(--edge),0 3px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
#menuBtn:active{transform:translateY(2px)}
#menuBtn i{display:block;width:20px;height:3px;background:var(--fg);border-radius:1px;transition:transform .2s,opacity .2s}
#menuBtn[aria-expanded="true"]{border-color:var(--kcal)}
#menuBtn[aria-expanded="true"] i:nth-child(1){transform:translateY(8px) rotate(45deg)}
#menuBtn[aria-expanded="true"] i:nth-child(2){opacity:0}
#menuBtn[aria-expanded="true"] i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
#menuBtn .dot{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:var(--pink);border:2px solid var(--edge)}
#menuBack{position:absolute;inset:0;z-index:1990;background:rgba(6,4,14,.6)}
#dock{position:absolute;bottom:8px;right:4px;z-index:2000;display:grid;grid-template-columns:repeat(2,76px);gap:8px 4px;justify-items:center}
.di{width:76px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;line-height:1.15;color:var(--fg);position:relative}
.di .lb{background:rgba(14,10,28,.92);border:1px solid var(--line);border-radius:6px;padding:1px 6px 2px;white-space:nowrap}
.di .ic{width:52px;height:52px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);box-shadow:inset 0 -4px 0 var(--edge),0 3px 0 rgba(0,0,0,.45);display:grid;place-items:center;font-size:24px;text-shadow:none}
.di:active .ic{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--edge)}
.di.lock{opacity:.5}
.dunview{position:fixed;inset:0;z-index:24;background:#07060c;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.dunview .dghost{position:relative;flex:1;min-height:0;overflow:hidden;margin:0 8px}
.dunview .dghost canvas{position:absolute;top:0;left:50%;transform:translateX(-50%);image-rendering:pixelated}
.dunview #dgFog{pointer-events:none}
.dgteam{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:6px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.dgp{display:flex;gap:6px;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:4px 6px;min-width:0;font-size:12px}
.dgp>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dgp b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.farmview{position:fixed;inset:0;z-index:26;background:var(--bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.farmview .fvh,.dunview .fvh{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.farmview .fvh h2{flex:1;font-size:18px}
.farmview .fvhost{flex:1;position:relative;overflow:hidden;margin:0 8px;border:3px solid var(--edge);border-radius:8px;min-height:0}
.farmview .fvhost canvas{display:block;image-rendering:pixelated}
.farmview .fvn,.dunview .fvn{font-size:12px;color:var(--muted);text-align:center;padding:6px 12px 0}
.farmview .fvb{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.farmview .fvb .btn{font-size:13px;min-height:46px;padding:8px 4px 10px}
#questBtn{position:absolute;right:10px;bottom:10px;z-index:1980;width:58px;height:58px;padding:0;border-radius:50%;background:var(--panel2);border:2px solid var(--line);box-shadow:inset 0 -4px 0 var(--edge),0 3px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#questBtn:active,#evBtn:active{transform:translateY(2px)}
#evBtn{position:absolute;right:14px;bottom:84px;z-index:1980;width:50px;height:50px;padding:0;border-radius:50%;background:var(--panel2);border:2px solid #8a5ad0;box-shadow:inset 0 -4px 0 var(--edge),0 3px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#evBtn[hidden]{display:none}
#evBtn .qn{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:rgba(14,10,28,.95);border:1px solid var(--line);border-radius:7px;padding:0 5px;font-size:11px;white-space:nowrap}
#evBtn.pend{animation:qbob 1.4s ease-in-out infinite}
#evBtn.pend:after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--edge)}
.wdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.wdgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);color:inherit;font:inherit;font-size:13px;min-height:92px;justify-content:center}
.wdgrid button.on{border-color:var(--kcal);background:rgba(255,200,80,.12)}
.wdgrid button.lock{opacity:.55}
.wdgrid .ic{min-height:44px;display:flex;align-items:center;font-size:22px}
.wdgrid small{font-size:11px;opacity:.8}
.wdprev{display:inline-block;background:radial-gradient(circle,rgba(138,90,208,.25),transparent 70%);border-radius:50%}
.evbar{position:relative;height:12px;margin:22px 8px 8px;background:var(--edge);border-radius:6px;border:1px solid var(--line)}
.evbar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff9a3c,#8a5ad0);border-radius:6px}
.evbar>b{position:absolute;top:50%;transform:translate(-50%,-50%);filter:grayscale(1) brightness(.6)}
.evbar>b.on{filter:none}
#questBtn .qic img{display:block}
#questBtn .qn{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:rgba(14,10,28,.95);border:1px solid var(--line);border-radius:7px;padding:0 6px;font-size:12px;white-space:nowrap}
#questBtn.pend{border-color:var(--kcal);animation:qbob 1.4s ease-in-out infinite}
#questBtn.pend:after{content:"";position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid var(--edge)}
#questBtn.done{opacity:.55}
#questBtn.done .qn{color:var(--good)}
@keyframes qbob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#questBtn.pend{animation:none}}
.fhub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fh{background:var(--panel2);border:2px solid var(--line);border-radius:10px;box-shadow:inset 0 -4px 0 var(--edge);padding:10px 8px 12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left}
.fh:active{transform:translateY(2px)}
.fh .ic{grid-row:span 2;font-size:28px}
.fh b{font-size:15px;font-weight:500}
.fh small{font-size:11.5px;color:var(--muted)}
.pm{display:flex;gap:12px;align-items:center}
.pm>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.di.hot .ic{border-color:var(--kcal);box-shadow:inset 0 -4px 0 var(--edge),0 0 0 3px rgba(255,181,71,.35),0 3px 0 rgba(0,0,0,.45)}
.di.hot .lb{border-color:var(--kcal);color:var(--kcal)}
.di .bd{position:absolute;top:-2px;right:4px;width:13px;height:13px;border-radius:50%;background:var(--pink);border:2px solid var(--edge)}
#dock:not([hidden]) .di{animation:mpop .34s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--k)*30ms)}
@keyframes mpop{from{opacity:0;transform:translate(24px,46px) scale(.2)}}
@media (max-height:700px){#dock{grid-template-columns:repeat(3,76px);bottom:6px;gap:6px 2px}.di .ic{width:46px;height:46px;font-size:21px}}
@media (prefers-reduced-motion:reduce){#dock:not([hidden]) .di{animation:none}#menuBtn i{transition:none}}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(6,4,14,.72);display:flex;align-items:flex-end;justify-content:center;z-index:27}
.sheet{width:100%;max-width:480px;max-height:92%;background:var(--panel);border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 0 rgba(0,0,0,.4)}
.sh-body{overflow-y:auto;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sh-body>*{flex-shrink:0}
.sh-foot{padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:2px solid var(--edge)}
.close{width:100%;min-height:50px;background:var(--panel2);border:2px solid var(--line);border-radius:8px;box-shadow:inset 0 -4px 0 var(--edge);font-size:16px;font-weight:500}
h2{font-size:19px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:500;color:var(--muted);margin:0;letter-spacing:.02em}
p{margin:0;line-height:1.5}
.mut{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:20px;padding:6px 11px;font-size:13px;box-shadow:inset 0 -2px 0 var(--edge)}
.chip.on{background:var(--crys);color:#10213a;border-color:#d4f0ff}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--edge);border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:12px}
input[type=number],input[type=text],textarea{width:100%;background:var(--edge);border:2px solid var(--line);border-radius:7px;color:var(--fg);font:inherit;padding:10px 12px;user-select:text;-webkit-user-select:text}
input[type=number]{font-family:var(--f-px);font-size:24px;text-align:center}
textarea{font-family:ui-monospace,monospace;font-size:11px;min-height:90px;resize:vertical}
.big{font-family:var(--f-px);font-size:30px;color:var(--kcal);line-height:1}
.stat{display:grid;grid-template-columns:76px 1fr 54px;gap:8px;align-items:center;font-size:13px}
.stat .bar{height:9px}
.stat .v{text-align:right;font-family:var(--f-px)}
.sk{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sk:last-child{border-bottom:0}
.sk.off{opacity:.45}
.spr{image-rendering:pixelated;display:block;margin:0 auto}
.center{text-align:center;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:110px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10px;color:var(--muted)}
.week i{display:block;width:70%;background:var(--kcal);border-radius:2px 2px 0 0;min-height:2px}
.week i.today{background:var(--crys)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;background:var(--edge);border-radius:6px;padding:7px 10px}
.x{background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5;border-left:3px solid var(--line);padding-left:8px}
.warn{color:#ffd07a}
.pts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pts button{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px 2px;font-size:12px;box-shadow:inset 0 -3px 0 var(--edge)}
/* toast */
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff8e8;color:#2a1d3d;border:2px solid #2a1d3d;border-radius:8px;padding:8px 14px;font-size:14px;z-index:40;box-shadow:0 4px 0 rgba(0,0,0,.4);max-width:86%;text-align:center}
/* cover */
#cover{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);cursor:pointer;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cover canvas.bgc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.55}
.logo{position:relative;font-family:var(--f-px);font-weight:700;font-size:clamp(34px,11vw,52px);line-height:.95;text-align:center;color:var(--kcal);text-shadow:0 4px 0 var(--kcal-dk),0 8px 0 #2a1608}
.logo small{display:block;font-size:.5em;color:var(--crys);text-shadow:0 3px 0 #1e3c66;margin-top:8px;letter-spacing:.06em}
.tap{position:relative;font-family:var(--f-px);font-size:18px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.copy{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted)}
.lvpop .big{font-size:44px;color:var(--crys)}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(4) saturate(0)}100%{filter:none}}
.wig{animation:wig .35s steps(4)}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
/* adventure map */
.map{display:flex;flex-direction:column;gap:2px;padding:4px 0}
.mrow{display:flex;align-items:center;gap:10px}
.mrow.r{flex-direction:row-reverse}
.pin{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--panel2);border:3px solid var(--line);box-shadow:inset 0 -4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--f-px);font-size:18px;position:relative}
.pin small{font-size:10px;color:var(--muted);font-family:var(--f-th);margin-top:2px}
.pin.clear{border-color:var(--good);background:#244a3c}
.pin.next{border-color:var(--kcal);background:#4a3418;animation:pulse 1.4s ease-in-out infinite}
.pin.lock{opacity:.4}
.pin.boss{width:70px;height:70px;font-size:22px}
.pin .ck{position:absolute;top:-4px;right:-4px;background:var(--good);color:#0e2a1a;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
@keyframes pulse{50%{box-shadow:inset 0 -4px 0 var(--edge),0 0 0 5px rgba(255,181,71,.25)}}
.mlab{flex:1;min-width:0;font-size:13px;line-height:1.35}
.mlab b{font-weight:500}
.mlab .mut{font-size:12px}
.dash{height:14px;border-left:3px dotted var(--line);margin-left:28px}
.mrow.r+.dash,.dash.r{margin-left:auto;margin-right:28px}
.mons-prev{display:flex;gap:4px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
/* battle */
#battle{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:var(--bg)}
#battle .bin{max-width:480px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.bhead{display:flex;align-items:center;gap:6px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.bhead .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .t .num{color:var(--muted);font-size:12px}
.bfield{flex:1;position:relative;margin:0 6px;border:3px solid var(--edge);border-radius:8px;overflow:hidden;min-height:0}
.bfield canvas.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.bmons{position:absolute;left:0;right:0;top:6%;display:flex;justify-content:center;align-items:flex-end;gap:2px;flex-wrap:nowrap;padding:0 6px}
.mon{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer;transition:opacity .4s,filter .4s;min-width:0}
.mon canvas{image-rendering:pixelated;width:96px;height:96px}
.mon.boss canvas{width:200px;height:200px}
.mon .bar{width:74px;height:7px}
.mon.boss .bar{width:150px}
.mon .bar>i{background:linear-gradient(90deg,#ff6b6b,#ffb547)}
.mon .mn{font-size:11px;color:var(--fg);text-shadow:0 1px 0 #000;white-space:nowrap}
.mon.tgt .mn:before{content:"▼ ";color:var(--kcal)}
.mon.dead{opacity:.18;filter:grayscale(1);pointer-events:none}
.bpets{position:absolute;left:6%;bottom:4%;display:flex;gap:8px;align-items:flex-end}
.bpet{position:relative;transition:transform .15s}
.bpet canvas{image-rendering:pixelated;width:150px;height:150px}
.bpet.dead{opacity:.3;filter:grayscale(1)}
.lunge{animation:lunge .32s ease-out}
@keyframes lunge{40%{transform:translate(26px,-26px)}}
.mlunge{animation:mlunge .32s ease-out}
@keyframes mlunge{40%{transform:translate(-14px,22px)}}
.shake{animation:shake .3s steps(3)}
@keyframes shake{33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
.dmg{position:absolute;font-family:var(--f-px);font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 0 #3a0b16,0 0 4px #000;pointer-events:none;animation:up 1s ease-out forwards;z-index:3;white-space:nowrap}
.dmg.crit{color:var(--kcal);font-size:28px}
.dmg.heal{color:var(--good)}
.dmg.small{font-size:15px;color:var(--crys)}
.bwarn{position:absolute;left:50%;top:52%;transform:translateX(-50%);background:#3a0b16;border:2px solid #ff6b6b;color:#ffd0d0;border-radius:6px;padding:4px 10px;font-size:13px;white-space:nowrap}
.blog{position:absolute;left:8px;right:8px;bottom:8px;text-align:right;font-size:12px;color:var(--fg);text-shadow:0 1px 0 #000;pointer-events:none}
.bpanel{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:7px}
.pcard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.pcard.turn{border-color:var(--kcal)}
.pcard .bar{height:9px}
.pcard .hpb>i{background:linear-gradient(90deg,#4cc77a,#9ef0a8)}
.pcard .enb>i{background:linear-gradient(90deg,#ffb547,#ffe08a)}
.pcard .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.skg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skb{background:var(--panel2);border:2px solid var(--line);border-radius:7px;box-shadow:inset 0 -3px 0 var(--edge);padding:7px 4px 8px;font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:46px}
.skb small{font-family:var(--f-px);font-size:11px;color:var(--kcal)}
.skb[disabled]{opacity:.35;cursor:not-allowed}
.skb.lockd small{color:var(--muted)}
.brow{display:flex;gap:6px;align-items:center}
.brow .chip{flex:1;text-align:center}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bk{background:var(--edge);border:2px solid var(--line);border-radius:7px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;line-height:1.15;min-width:0;overflow:hidden}
.bk span{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bk.miss img{filter:brightness(0);opacity:.4}
.bk.miss span{color:var(--muted)}
.tslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ts{background:var(--edge);border:2px solid var(--line);border-radius:8px;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:6px 4px;text-align:center;min-width:0}
.ts span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- core rules ---------- */
function todayKcal(d){return S.log[d==null?dayIdx():d]||0}
function allowanceLeft(){const d=dayIdx();if(S.fed.d!==d){S.fed={d,amt:0}}return Math.max(0,S.cap-S.fed.amt)}
function capWeek(){
  const d=dayIdx();if(S.weekStart==null){S.weekStart=d;return}
  let rolled=0;
  while(d>=S.weekStart+7&&rolled<60){let sum=0;for(let i=0;i<7;i++)sum+=S.log[S.weekStart+i]||0;const avg=sum/7,prev=S.cap;
    let nc=Math.min(Math.max(avg*1.2,prev*.9),prev*1.15);nc=Math.round(Math.min(CAP_MAX,Math.max(CAP_MIN,nc))/10)*10;
    S.capHist.push({ws:S.weekStart,avg:Math.round(avg),cap:nc,prev});S.cap=nc;S.weekStart+=7;rolled++}
  if(rolled){const h=S.capHist[S.capHist.length-1];queuePopup(()=>weeklyPopup(h,rolled));save()}
}
function weeklyPopup(h,rolled){
  const up=h.cap>h.prev,down=h.cap<h.prev;
  const msg=up?TL('เก่งมาก! น้องย่อยพลังได้มากขึ้นแล้ว 💪'):down?TL('สัปดาห์นี้ค่อยๆ ไปด้วยกันนะ น้องรออยู่ 🌙'):TL('สม่ำเสมอดีมาก! รักษาจังหวะนี้ไว้นะ ✨');
  openSheet(TL('<div class="center card" style="text-align:center"><h3>สรุปสัปดาห์ที่ผ่านมา</h3><p>เฉลี่ยวันละ <b class="num" style="color:var(--kcal)">')+fmt(h.avg)+TL('</b> Kcal</p><p>สัปดาห์นี้น้องย่อยพลังได้วันละ</p><div class="big">')+fmt(h.cap)+'</div><p>'+msg+'</p>'+(rolled>1?TL('<p class="mut">ไม่ได้เข้ามา ')+rolled+TL(' สัปดาห์ ยินดีต้อนรับกลับ!</p>'):'')+TL('</div><p class="note">ตัวเลขนี้คิดจากค่าเฉลี่ย 7 วัน × 1.2 ขึ้นได้ไม่เกิน 15% ลดได้ไม่เกิน 10% ต่อสัปดาห์ อยู่ระหว่าง 1,000–2,500 Kcal</p>'),null,{closeText:TL('ไปต่อกัน')})}
function addPoints(p,levels){
  for(let i=0;i<levels;i++){if(p.preset&&PRESETS[p.preset]){PRESETS[p.preset].d.forEach((v,k)=>p.pts[SK[k]]+=v)}else p.free+=10}}
function addExp(p,amt,src){
  if(p.lv>=MAXLV)return[];const ups=[];p.exp+=amt;
  while(p.lv<MAXLV&&p.exp>=need(p.lv)){p.exp-=need(p.lv);const from=p.lv;p.lv++;addPoints(p,1);ups.push({from,to:p.lv})}
  if(p.lv>=MAXLV)p.exp=0;
  return ups}
function previewFeed(p,amt){const q={lv:p.lv,exp:p.exp};let a=amt;while(q.lv<MAXLV&&a>0){const r=need(q.lv)-q.exp;if(a>=r){a-=r;q.lv++;q.exp=0}else{q.exp+=a;a=0}}return q}
function toMax(p){let t=need(p.lv)-p.exp;for(let l=p.lv+1;l<MAXLV;l++)t+=need(l);return p.lv>=MAXLV?0:t}
function showLevelUps(p,ups){
  if(!ups.length)return;const last=ups[ups.length-1];const evo=ups.filter(u=>formIdx(u.to)!==formIdx(u.from));
  const sk=SKILLS.filter(s=>ups.some(u=>s.lv>u.from&&s.lv<=u.to));
  queuePopup(()=>{SND.play(evo.length?'evolve':'level');
    const f=formIdx(p.lv);const pr=p.preset&&PRESETS[p.preset];const gain=ups.length*10;
    openSheet('<div class="center lvpop" style="display:flex;flex-direction:column;gap:10px;text-align:center"><h3>'+(evo.length?TL('เปลี่ยนร่างแล้ว!'):TL('เลเวลอัป!'))+'</h3><div class="big">Lv '+last.to+'</div>'+
      '<div class="'+(evo.length?'flash':'')+'">'+sprImg(p.sp,f,168,p.acc)+'</div>'+(evo.length?TL('<p>ร่างใหม่: <b>')+FORMS[f].n+'</b></p>':'')+
      TL('<p>ได้ <b class="num">+')+gain+TL('</b> แต้ม')+(pr?TL(' · จัดให้อัตโนมัติแบบ')+pr.n:TL(' · <span class="warn">รอจัดเองในหน้าน้อง</span>'))+'</p>'+
      sk.map(s=>TL('<p>ปลดสกิลใหม่: <b>')+s.n+'</b> <span class="mut">('+s.d+')</span></p>').join('')+'</div>',null,{closeText:TL('เยี่ยม!')})})}

function renderTop(){const p=mainPet();if(!p)return;
  $('tLv').textContent='Lv'+p.lv;$('tName').textContent=p.name;
  $('tExp').style.width=(p.lv>=MAXLV?100:p.exp/need(p.lv)*100)+'%';
  $('tKcal').textContent=fmt(S.wallet);$('tAllow').textContent=fmt(allowanceLeft());try{renderGoal()}catch(e){}}
let room={W:160,H:200,s:3,wallH:80,ps:4},roamers=[];
function homeIds(){const ids=teamPets().map(p=>p.id);if(S.main&&!ids.includes(S.main))ids.unshift(S.main);else if(S.main){ids.splice(ids.indexOf(S.main),1);ids.unshift(S.main)}return ids}
function syncRoamers(){if(!S)return;const ids=homeIds(),box=$('roam');
  roamers=roamers.filter(r=>{if(ids.includes(r.id))return true;r.el.remove();r.sh.remove();return false});
  ids.forEach(id=>{if(roamers.find(r=>r.id===id))return;const sh=document.createElement('div');sh.className='pshadow';const el=document.createElement('canvas');el.width=el.height=G;el.className='petc';el.setAttribute('role','button');el.setAttribute('aria-label',TL('แตะเพื่อลูบหัว'));
    el.addEventListener('click',e=>petTap(e,id));box.appendChild(sh);box.appendChild(el);roamers.push({id,el,sh,x:30+Math.random()*120,y:9999,tx:0,ty:0,dir:1,fr:0,eyes:'open',until:0,wait:0,blink:0,lastFr:0})});
  roamers.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));sizeRoamers()}
function bounds(r){const st=$('stage');return{minY:room.wallH*room.s-r.sz*.5,maxY:Math.max(room.wallH*room.s-r.sz*.5,st.clientHeight-r.sz*.98),maxX:Math.max(0,st.clientWidth-r.sz)}}
function sizeRoamers(){roamers.forEach((r,i)=>{r.sz=G*(i===0?room.ps:room.ps-1);r.el.style.width=r.el.style.height=r.sz+'px';const B=bounds(r);if(r.y===9999){r.x=Math.random()*B.maxX;r.y=B.minY+Math.random()*(B.maxY-B.minY)}r.x=Math.min(Math.max(r.x,0),B.maxX);r.y=Math.min(Math.max(r.y,B.minY),B.maxY);pickTarget(r)})}
function pickTarget(r){const B=bounds(r);for(let k=0;k<10;k++){r.tx=Math.random()*B.maxX;r.ty=B.minY+Math.random()*(B.maxY-B.minY);if(!(r.tx>B.maxX-80&&r.ty>B.maxY-(evActive()?140:70)))break}r.wait=performance.now()+1500+Math.random()*3000}
function layout(){const st=$('stage');const bw=st.clientWidth,bh=st.clientHeight;if(!bw||!bh)return;
  const s=Math.max(2,Math.round(bw/150));const W=Math.ceil(bw/s),H=Math.ceil(bh/s);
  room={W,H,s,wallH:drawRoom($('room'),W,H),ps:s+2};const cv=$('room');cv.style.width=W*s+'px';cv.style.height=H*s+'px';syncRoamers()}
function happy(id,ms){const r=roamers.find(x=>x.id===id);if(r){r.eyes='happy';r.until=performance.now()+(ms||1500)}}
let lastT=0;
function loop(t){requestAnimationFrame(loop);if(!S||!mainPet()||!$('cover').hidden)return;
  const dt=Math.min(50,t-(lastT||t));lastT=t;const hour=new Date().getHours(),night=hour>=22||hour<6;
  roamers.forEach((r,i)=>{const p=S.pets.find(x=>x.id===r.id);if(!p)return;const f=formIdx(p.lv);
    if(t>r.wait){const dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);
      if(d<2)pickTarget(r);else{const sp=(f===0?.018:.045)*dt;r.x+=dx/d*Math.min(sp,d);r.y+=dy/d*Math.min(sp,d);if(Math.abs(dx)>1)r.dir=dx>0?1:-1}}
    if(t-r.lastFr>(f===0?700:430)){r.lastFr=t;r.fr^=1}
    let eyes=r.until>t?r.eyes:'open';
    if(eyes==='open'){if(night)eyes='sleep';else if(t>r.blink){eyes='blink';if(t>r.blink+140)r.blink=t+2200+Math.random()*3000}}
    if(f===0&&eyes!=='blink')eyes='open';
    drawTo(r.el,p.sp,f,r.fr,eyes,p.acc);r.el.style.left=r.x+'px';r.el.style.top=r.y+'px';r.el.style.transform='scaleX('+(-r.dir)+')';r.el.style.zIndex=10+Math.round(r.y);
    const sr=SPECIES[p.sp].r,glow=(f>=4||sr==='L'||(sr==='E'&&f>=3))?ELEM[SPECIES[p.sp].el].g:null;r.el.style.filter=glow?'drop-shadow(0 0 '+(4+2*Math.sin(t/300+i))+'px '+glow+')':'';
    const w=r.sz*.5;r.sh.style.width=w+'px';r.sh.style.height=w*.28+'px';r.sh.style.left=(r.x+r.sz/2-w/2)+'px';r.sh.style.top=(r.y+r.sz*.86)+'px';r.sh.style.zIndex=9+Math.round(r.y);
    if(i===0){const b=$('bubble');b.style.left=(r.x+r.sz/2)+'px';b.style.top=(r.y+r.sz*(f===0?.32:.12))+'px'}});
}

function petTap(e,id){const p=S.pets.find(x=>x.id===id);const r=roamers.find(x=>x.id===id);if(!p||!r)return;const d=dayIdx();if(S.petting.d!==d)S.petting={d,n:0,last:S.petting.last||0};
  const now=Date.now();const st=$('stage').getBoundingClientRect();const x=(e.clientX||st.left+r.x+50)-st.left,y=(e.clientY||st.top+r.y)-st.top;
  heart(x,y);r.el.classList.remove('wig');void r.el.offsetWidth;r.el.classList.add('wig');happy(id,1400);

  if(S.petting.n>=PET_MAX){say(who+TL('วันนี้ลูบครบแล้ว ขอบคุณน้า 💕'));return}
  const left=S.petting.last+PET_CD-now;if(left>0){const m=Math.floor(left/60000),s=Math.ceil(left%60000/1000);say(who+TL('ชอบจัง~ ลูบได้อีกครั้งใน ')+m+':'+String(s).padStart(2,'0'));return}
  S.petting.n++;S.petting.last=now;let ups=[];SND.play('pet');{const q=questState();q.pets=(q.pets||0)+1}
  if(p.lv<MAXLV){ups=addExp(p,5,'pet');floatTxt(x,y-20,'+5 EXP')}
  say(who+[TL('ฮิฮิ จั๊กจี้~'),TL('ชอบที่สุดเลย!'),TL('อีกนิด อีกนิด~'),TL('💕 รักนะ')][Math.floor(Math.random()*4)]);
  save();renderTop();showLevelUps(p,ups)}

function encode(o){const s=JSON.stringify(o);const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function whyBad(t){const c=String(t||'').replace(/[^A-Za-z0-9+\/=_-]/g,'');if(!c.length)return TL('ยังไม่ได้วางรหัส');if(c.length<200)return TL('รหัสสั้นเกินไป (มี ')+c.length+TL(' ตัวอักษร) น่าจะคัดลอกมาไม่ครบ');return TL('รหัสไม่ครบหรือมีบางตัวเพี้ยน (มี ')+c.length+TL(' ตัวอักษร) ลองกด 📋 คัดลอกรหัสใหม่แล้ววางอีกครั้ง')}
function decode(t){let c=String(t||'').replace(/[^A-Za-z0-9+\/=_-]/g,'').replace(/-/g,'+').replace(/_/g,'/');const j=c.indexOf('eyJ');if(j>0)c=c.slice(j);c=c.replace(/=+$/,'');if(c.length<40)throw 0;
  for(let cut=0;cut<=8;cut++){let x=c.slice(0,c.length-cut);while(x.length%4)x+='=';try{const bin=atob(x);const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))));if(o&&Array.isArray(o.pets))return o}catch(e){}}
  throw 0}

/* ---------- real-time exercise timer ----------
   walk/run  → treadmill model (ACSM): speed km/h + incline %, kcal integrated every tick
   others    → MET by talk-test effort, asked every 10 active minutes and at the end
   kcal/min  = VO2(ml/kg/min) × kg / 1000 × 5   ·   MET: kcal/min = MET × 3.5 × kg / 200 */
let WK=null,WK_BB=null;
const WK_TM={walk:{spd:5,inc:0},run:{spd:8,inc:0}};
const WK_MET={bike:[4,6.8,10],swim:[5.8,8.3,9.8],gym:[3.5,5,6],etc:[3.5,5,7]};
const WK_EFF=[{n:TL('เบา'),d:TL('ยังคุยหรือร้องเพลงได้สบาย')},{n:TL('ปานกลาง'),d:TL('หายใจแรงขึ้น พูดเป็นประโยคได้ แต่ร้องเพลงไม่ไหว')},{n:TL('หนัก'),d:TL('หอบ พูดได้ทีละไม่กี่คำ')}];
const WK_CHEER=[TL('สู้ๆ นะ!'),TL('เก่งมาก ไปต่อ!'),TL('หายใจลึกๆ นะ'),TL('อีกนิดเดียว!'),TL('ดื่มน้ำด้วยนะ'),TL('ภูมิใจในตัวเธอ!')];
const WK_ASK=10*60000;
function bodyKg(){return(S.health&&S.health.kg)||60}
function wkIsTM(w){return w.a==='walk'||w.a==='run'}
function tmKcalMin(spd,inc){const S_=spd*1000/60,G=inc/100,vo2=spd<7?0.1*S_+1.8*S_*G+3.5:0.2*S_+0.9*S_*G+3.5;return vo2*bodyKg()/1000*5}
function metKcalMin(a,i){return(WK_MET[a]||WK_MET.etc)[i]*3.5*bodyKg()/200}
function wkActive(w){const now=Date.now();return Math.max(0,now-w.t-w.paused-(w.pausedAt?now-w.pausedAt:0))}
/* advance the running totals up to "now" (only active time counts) */
function wkTick(w){const act=wkActive(w),d=act-(w.acc||0);if(d<=0)return;w.acc=act;
  if(wkIsTM(w)){w.kcal+=d/60000*tmKcalMin(w.spd,w.inc);w.dist+=w.spd*d/3600000}
  else w.pend+=d}
function wkShownKcal(w){return Math.round(w.kcal+(wkIsTM(w)?0:w.pend/60000*metKcalMin(w.a,w.lastEff==null?1:w.lastEff)))}
function wkFmt(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function wkStart(act,nm){const go=()=>{const tm=WK_TM[act];S.workout={a:act,nm,t:Date.now(),paused:0,pausedAt:null,acc:0,kcal:0,dist:0,pend:0,lastEff:null,nextAsk:WK_ASK,spd:tm?tm.spd:0,inc:tm?tm.inc:0};save();closeAll();workoutScreen()};
  if(!S.health||!S.health.kg){healthSheet(go)}else go()}

/* pet exercise animation */

  const rate=wkIsTM(w)?Math.max(120,520-w.spd*28):300,fr=paused?0:Math.floor(now/rate)%2,bob=paused?0:(fr?-P:0);
  const spr=renderSprite(mp.sp,f,fr,paused?'open':'happy',mp.acc),SZ=48*P*.62,cx=W/2,base=H-26;

  if(a==='walk'||a==='run'){const tilt=Math.min(15,w.inc)*.012;c.save();c.translate(cx,base);c.rotate(-tilt);
      c.fillStyle='#3a3550';c.fillRect(-W*.38,0,W*.76,14);c.fillStyle='#22202f';c.fillRect(-W*.38,14,W*.76,6);
      const off=paused?0:(now*w.spd/90)%24;c.save();c.beginPath();c.rect(-W*.38+2,0,W*.76-4,14);c.clip();c.fillStyle='#4f4a6e';for(let x=-W*.38-24+off;x<W*.38;x+=24)c.fillRect(Math.round(x),4,10,4);c.restore();
      c.fillStyle='#8a88a8';c.fillRect(W*.30,-70,6,70);c.fillRect(W*.24,-74,26,6);c.restore();pet(0,bob-4)}
  else if(a==='bike'){c.fillStyle='#3a3550';c.fillRect(0,base+8,W,4);const off=paused?0:(now/6)%20;c.fillStyle='#5a5480';for(let x=-20+(20-off);x<W;x+=20)c.fillRect(Math.round(x),base+14,8,2);
      const wr=16,ang=paused?0:now/120;[[cx-34,base-6],[cx+34,base-6]].forEach(([x,y])=>{c.strokeStyle='#d6d3ea';c.lineWidth=4;c.beginPath();c.arc(x,y,wr,0,7);c.stroke();c.lineWidth=2;for(let k=0;k<3;k++){const t=ang+k*2.09;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(t)*wr,y+Math.sin(t)*wr);c.stroke()}});
      c.fillStyle='#e8434f';c.fillRect(cx-34,base-10,68,5);c.fillRect(cx+20,base-34,5,26);c.fillRect(cx+14,base-36,16,4);pet(-6,bob-22)}

      c.save();c.beginPath();c.rect(0,0,W,wl+2);c.clip();c.drawImage(spr,Math.round(cx-SZ/2+sx),Math.round(wl-SZ*.80+bob*.5),SZ,SZ);c.restore();
      c.fillStyle='rgba(143,214,255,.85)';for(let x=0;x<W;x+=16){const y=wl+Math.round(Math.sin(now/300+x/20)*2);c.fillRect(x,y,10,3)}}

}

const STAR_COST=[0,0,20,50,100,200],STAR_LV=[0,0,3,6,9,12],STAR_B=.08;

/* ---------- battle engine (same rules as the balance simulation) ---------- */
const SKD=[{m:1.4,k:'one'},{m:1.9,k:'one'},{k:'guard'},{m:1.6,k:'all'},{m:3.5,k:'one'}];
const skillList=()=>[{i:-1,n:TL('ตีธรรมดา'),e:0,lv:1,m:1,k:'one',d:TL('แรง ×1.0')}].concat(SKILLS.map((s,i)=>Object.assign({i},s,SKD[i])));
const BEATS={fire:'leaf',leaf:'water',water:'fire'};
const elMul=(a,d)=>BEATS[a]===d?1.25:BEATS[d]===a?.8:1;
function hit(R,atk,mul,df,ea,ed){let v=atk*mul*30/(30+df)*(.9+R()*.2);const crit=R()<.1;if(crit)v*=1.5;return{v:v*elMul(ea,ed),crit}}
function makeUnit(p){const s=stats(p);return{p,id:p.id,sp:p.sp,name:p.name,lv:p.lv,star:p.star||1,el:SPECIES[p.sp].el,hp:s.hp,max:s.hp,atk:s.atk,df:s.df,reg:s.en,en:penergy(p),guard:0,tank:p.preset==='tank'}}
function makeBattle(ph,i,team,opt){let st=PHASES[ph].stages[i];const cm=opt&&opt.mon;if(cm)st=Object.assign({},st,{m:cm.sp,n:1,hp:cm.hp,atk:cm.atk,df:cm.df,boss:false,rec:cm.rec,el:cm.el,hint:null});return{ph,i,st,t:1,over:null,team:team.map(makeUnit),
  mons:Array.from({length:st.n},(_,k)=>({k,sp:st.m,name:cm?cm.name:SPECIES[st.m].name+(st.n>1?' '+'ABC'[k]:''),hp:st.hp,max:st.hp,atk:st.atk,df:st.df,el:st.el,boss:!!st.boss}))}}
const aliveM=B=>B.mons.filter(m=>m.hp>0), aliveT=B=>B.team.filter(u=>u.hp>0);
function autoSkill(B,u){const L=skillList(),am=aliveM(B).length;
  for(let i=5;i>=1;i--){const s=L[i];if(u.lv<s.lv||u.en<s.e)continue;if(s.k==='guard'&&u.hp>u.max*.45)continue;if(s.k==='all'&&am<2)continue;return s}return L[0]}
function autoTarget(B){const a=aliveM(B);return a.reduce((x,m)=>m.hp<x.hp?m:x,a[0])}
function petAct(B,u,s,tgt,R){const ev=[{t:'act',u,s}];u.en-=s.e;
  if(s.k==='guard'){const solo=B.team.length===1;for(const v of aliveT(B)){if(!solo||v===u){const h=Math.min(v.max-v.hp,v.max*(solo?.3:.2));v.hp+=h;ev.push({t:'heal',u:v,v:h})}v.guard=2}}
  else{const targets=s.k==='all'?aliveM(B):[tgt&&tgt.hp>0?tgt:autoTarget(B)];
    for(const m of targets){const r=hit(R,u.atk,s.m,m.df,u.el,m.el);m.hp-=r.v;ev.push({t:'hit',m,v:r.v,crit:r.crit});
      if(m.hp<=0){m.hp=0;ev.push({t:'kill',m});for(const v of aliveT(B)){const h=Math.min(v.max-v.hp,v.max*.25);v.hp+=h;if(h>0.5)ev.push({t:'heal',u:v,v:h})}u.en=Math.min(EN_MAX,u.en+30)}}}
  u.en=Math.min(EN_MAX,u.en+u.reg);if(!aliveM(B).length)B.over='win';return ev}
function pickW(tm,R){const w=tm.map(u=>u.tank?2:1);let r=R()*w.reduce((a,b)=>a+b);for(let i=0;i<tm.length;i++){r-=w[i];if(r<=0)return tm[i]}return tm[tm.length-1]}
function monPhase(B,R){const ev=[],heavy=B.t%3===0;
  for(const m of aliveM(B)){const tm=aliveT(B);if(!tm.length)break;const big=m.boss&&heavy;
    for(const u of(big&&B.team.length>1?tm:[pickW(tm,R)])){const r=hit(R,m.atk,big?1.8:1,u.df,m.el,u.el);const v=r.v*(u.guard>0?.5:1);u.hp-=v;ev.push({t:'mhit',m,u,v,crit:r.crit,big,g:u.guard>0});if(u.hp<=0){u.hp=0;ev.push({t:'down',u})}}}
  for(const u of B.team)u.guard--;B.t++;if(!aliveT(B).length)B.over='lose';return ev}
function simStage(ph,i,lv,star,size,en0,n){let w=0;const R=Math.random;
  for(let k=0;k<n;k++){const team=['bal','atk','tank'].slice(0,size).map((pr,j)=>{const p={id:'x'+j,sp:'shiba',name:'x',lv,star,exp:0,preset:pr,pts:{hp:0,atk:0,df:0,en:0},free:0,energy:en0};addPoints(p,lv-1);return p});const B=makeBattle(ph,i,team);
    for(let g=0;g<200&&!B.over;g++){for(const u of aliveT(B)){if(B.over)break;petAct(B,u,autoSkill(B,u),autoTarget(B),R)}if(!B.over)monPhase(B,R)}if(B.over==='win')w++}return w/n}

    else{q.dataset.sure=1;q.textContent=TL('แตะอีกครั้งเพื่อออก');setTimeout(()=>{if(q.isConnected){q.dataset.sure='';q.textContent=TL('✕ ออก')}},2500)}};

const DW=11,DH=15,DT=16;          // map size in tiles, tile art size in px
let DG=null;
function dunRng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
const GATE={water:{n:'บ่อน้ำลึก',hint:'ต้องมีน้องธาตุน้ำในทีม พาว่ายข้าม',ok:' ว่ายพาทีมข้ามบ่อน้ำ!'},fire:{n:'ดงหนาม',hint:'ต้องมีน้องธาตุไฟในทีม เผาดงหนาม',ok:' เผาดงหนามจนโล่ง!'},leaf:{n:'กำแพงราก',hint:'ต้องมีน้องธาตุใบไม้ในทีม ปีนกำแพงราก',ok:' ปีนกำแพงรากพาทีมข้ามไป!'}};
function dunGen(ph,i){
  const R=dunRng('kpd|'+S.season+'|'+ph+'|'+i),ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  const g=Array.from({length:DH},()=>Array(DW).fill(1));          // 1 wall, 0 floor
  const rooms=[];
  {const w=ri(3,4),h=ri(2,3),x=ri(1,DW-1-w);rooms.push({x,y:DH-1-h,w,h})}
  for(let t=0;t<600&&rooms.length<8;t++){const w=ri(2,4),h=ri(2,3),x=ri(1,DW-1-w),y=ri(1,DH-1-h);
    if(rooms.some(r=>x<=r.x+r.w&&x+w>=r.x&&y<=r.y+r.h&&y+h>=r.y))continue;rooms.push({x,y,w,h})}
  rooms.forEach(r=>{r.cx=r.x+Math.floor(r.w/2);r.cy=r.y+Math.floor(r.h/2)});
  {const ord=[rooms[0]],rest=rooms.slice(1);while(rest.length){const a=ord[ord.length-1];let bi=0,bd=1e9;rest.forEach((r,k)=>{const d=Math.abs(r.cx-a.cx)+Math.abs(r.cy-a.cy)*1.3;if(d<bd){bd=d;bi=k}});ord.push(rest.splice(bi,1)[0])}rooms.length=0;rooms.push(...ord)}
  rooms.forEach(r=>{for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)g[y][x]=0});
  const dig=(x,y)=>{if(x>0&&y>0&&x<DW-1&&y<DH-1)g[y][x]=0};
  const links=[];for(let k=1;k<rooms.length;k++)links.push([rooms[k-1],rooms[k]]);if(rooms.length>4&&R()<.6)links.push([rooms[1],rooms[rooms.length-2]]);
  for(const[a,b]of links){let x=a.cx,y=a.cy;const hf=R()<.5;
    if(hf){while(x!==b.cx){dig(x,y);x+=Math.sign(b.cx-x)}while(y!==b.cy){dig(x,y);y+=Math.sign(b.cy-y)}}
    else{while(y!==b.cy){dig(x,y);y+=Math.sign(b.cy-y)}while(x!==b.cx){dig(x,y);x+=Math.sign(b.cx-x)}}dig(x,y)}
  const N4=[[1,0],[-1,0],[0,1],[0,-1]],fl=(x,y)=>x>=0&&y>=0&&x<DW&&y<DH&&g[y][x]===0;
  const bfs=(sx,sy,block)=>{const d=Array.from({length:DH},()=>Array(DW).fill(-1)),q=[[sx,sy]];d[sy][sx]=0;
    while(q.length){const[x,y]=q.shift();for(const[a,b]of N4){const X=x+a,Y=y+b;if(fl(X,Y)&&d[Y][X]<0&&!(block&&block(X,Y))){d[Y][X]=d[y][x]+1;q.push([X,Y])}}}return d};
  const st=rooms[0],start={x:st.cx,y:st.y+st.h-1};g[start.y][start.x]=0;
  let d=bfs(start.x,start.y),far={x:start.x,y:start.y,v:0};
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++)if(d[y][x]>far.v)far={x,y,v:d[y][x]};
  const stairs={x:far.x,y:far.y};
  // path start→stairs
  const path=[];{let x=stairs.x,y=stairs.y;while(d[y][x]>0){path.unshift([x,y]);for(const[a,b]of N4){const X=x+a,Y=y+b;if(fl(X,Y)&&d[Y][X]===d[y][x]-1){x=X;y=Y;break}}}}
  const guard={x:path[path.length-2][0],y:path[path.length-2][1]};
  const used=new Set([start.x+','+start.y,stairs.x+','+stairs.y,guard.x+','+guard.y]);
  const free=(x,y)=>fl(x,y)&&!used.has(x+','+y);
  const ents=[{t:'guard',x:guard.x,y:guard.y,id:'g'}];
  // wandering monsters on the way
  const nMin=i===9?1:ri(1,2);
  for(let k=0;k<nMin;k++){const at=path[Math.floor(path.length*(k?.62:.32))];if(at&&free(at[0],at[1])){used.add(at.join(','));ents.push({t:'mon',x:at[0],y:at[1],id:'m'+k})}}
  // treasure alcove behind an element gate
  const el=['water','fire','leaf'][(ph+i)%3];

function rollRarity(){if(S.pity.l>=40)return'L';const x=Math.random()*100;let r=x<3?'L':x<15?'E':x<45?'R':'B';if(S.pity.e>=10&&(r==='B'||r==='R'))r='E';return r}

  const pool=POOL.filter(k=>SPECIES[k].r===r),sp=pool[Math.floor(Math.random()*pool.length)];
  if(owns(sp)){const st=RAR[r].dupe;S.stars+=st;S.book[sp]=1;return{sp,r,dupe:st}}
  const p=newPet(sp);S.pets.push(p);S.book[sp]=1;return{sp,r,p}}

function evActive(){const d=gameDate(),y=d.getFullYear(),md=(d.getMonth()+1)*100+d.getDate();for(const k in EVENTS){const e=EVENTS[k],a=e.from[0]*100+e.from[1],b=e.to[0]*100+e.to[1];if(md>=a&&md<=b)return{k,e,id:k+y,end:new Date(y,e.to[0]-1,e.to[1])}}return null}
function evState(){const a=evActive();if(!a)return null;if(!S.ev||S.ev.id!==a.id)S.ev={id:a.id,k:0,seen:false};return S.ev}
function evDaysLeft(){const a=evActive();if(!a)return 0;const d=gameDate();d.setHours(0,0,0,0);return Math.round((a.end-d)/86400000)+1}
function evItems(k){return ACC_ORDER.filter(n=>ACC[n].ev===k).sort((a,b)=>ACC[a].need-ACC[b].need)}
function evAdd(v){const a=evActive(),st=evState();if(!a||!st)return;const before=st.k;st.k=Math.max(0,st.k+v);if(v<=0)return;
  const got=evItems(a.k).filter(n=>!S.wardrobe[n]&&before<ACC[n].need&&st.k>=ACC[n].need);got.forEach(n=>S.wardrobe[n]=1);
  if(got.length){save();setTimeout(()=>accGotSheet(got),700)}renderEvBtn()}
function accGotSheet(list){const p=mainPet();SND.play('legend');
  openSheet(TL('<div style="display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center"><h3>ได้ชุดใหม่!</h3>')+(p?'<div class="flash">'+sprImg(p.sp,formIdx(p.lv),132,list[list.length-1])+'</div>':'')+
    '<p>'+list.map(n=>accIcon(n,28)+' <b>'+TL(ACC[n].n)+'</b>').join('<br>')+'</p><button class="btn go" id="agW">'+TL('ใส่ให้น้องเลย')+'</button></div>',(b,ov)=>{
    b.querySelector('#agW').onclick=()=>{if(p){p.acc=list[list.length-1];save()}closeSheet(ov);if(p)wardrobeSheet(p.id)}})}
function evCard(){const a=evActive(),st=evState();if(!a)return'';const items=evItems(a.k),next=items.find(n=>!S.wardrobe[n]),top=ACC[items[items.length-1]].need;
  return'<div class="card evc"><div class="row sp"><h3>'+accIcon(a.e.i,28)+' '+TL(a.e.n)+'</h3><span class="tag">'+(LANG==='en'?evDaysLeft()+' days left':'เหลือ '+evDaysLeft()+' วัน')+'</span></div>'+
    '<p class="mut" style="font-size:12px;margin:0">'+TL('เผาผลาญ Kcal จากการออกกำลังกายช่วงอีเวนต์ ปลดล็อกชุดฟรี! ชุดที่ได้แล้วใส่ได้ตลอดไป')+'</p>'+
    '<div class="evbar"><i style="width:'+Math.min(100,st.k/top*100)+'%"></i>'+items.map(n=>'<b class="'+(S.wardrobe[n]?'on':'')+'" style="left:'+(ACC[n].need/top*100)+'%">'+accIcon(n,32)+'</b>').join('')+'</div>'+
    '<p class="num" style="margin:4px 0 0;font-size:13px">'+fmt(st.k)+' Kcal'+(next?TL(' · อีก ')+fmt(ACC[next].need-st.k)+TL(' Kcal ได้')+' '+TL(ACC[next].n):TL(' · ปลดล็อกครบทุกชุดแล้ว 🎉'))+'</p></div>'}
function evSheet(){openSheet('<div id="evB"></div><button class="btn" id="evW">'+accIcon('witch',36)+' '+TL('ไปแต่งตัวให้น้อง')+'</button>',(b,ov)=>{b.querySelector('#evB').innerHTML=evCard();
  b.querySelector('#evW').onclick=()=>{closeSheet(ov);const p=mainPet();if(p)wardrobeSheet(p.id)}})}
function wardrobeSheet(id){let p=S.pets.find(x=>x.id===id)||mainPet();if(!p)return;
  openSheet('<h2>'+TL('ตู้เสื้อผ้า')+'</h2><div id="wdB"></div>',(b)=>{
    const draw=()=>{const a=evActive(),f=formIdx(p.lv),egg=f===0;
      const list=ACC_ORDER.filter(n=>S.wardrobe[n]||(a&&ACC[n].ev===a.k));
      let h='<div style="text-align:center"><div class="wdprev">'+sprImg(p.sp,f,144,p.acc)+'</div><b>'+esc(p.name)+'</b></div>';
      if(egg)h+='<p class="warn">'+TL('น้องยังเป็นไข่อยู่ ฟักออกมาก่อนถึงจะใส่ชุดได้นะ')+'</p>';
      h+='<div class="wdgrid"><button data-acc="" class="'+(!p.acc?'on':'')+'"><span class="ic">✕</span><span>'+TL('ไม่ใส่')+'</span></button>'+
        list.map(n=>{const own=!!S.wardrobe[n];return'<button data-acc="'+n+'" class="'+(p.acc===n?'on':'')+(own?'':' lock')+'"><span class="ic">'+accIcon(n,56)+'</span><span>'+TL(ACC[n].n)+'</span>'+(own?'':'<small class="num">🔒 '+fmt(ACC[n].need)+' Kcal</small>')+'</button>'}).join('')+'</div>';
      if(a)h+=evCard();
      b.querySelector('#wdB').innerHTML=h;
      b.querySelectorAll('[data-acc]').forEach(x=>x.onclick=()=>{const n=x.dataset.acc;if(egg)return;if(n&&!S.wardrobe[n]){toast(TL('เผาผลาญให้ครบ ')+fmt(ACC[n].need)+TL(' Kcal ในช่วงอีเวนต์เพื่อปลดล็อก'));return}
        if(n)p.acc=n;else delete p.acc;SND.play('coin');save();draw()})};
    draw()})}

function pxShade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f>0?255:0,a=Math.abs(f);r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);return'rgb('+r+','+g+','+b+')'}
function pxCanvas(name){const rows=PXI[name];const w=Math.max(...rows.map(r=>r.length)),h=rows.length,S=Math.max(w,h)+2;
  const ox=Math.floor((S-w)/2),oy=Math.floor((S-h)/2);const G=[];for(let y=0;y<S;y++){G.push([]);for(let x=0;x<S;x++){const r=rows[y-oy];const ch=r&&r[x-ox];G[y].push(ch&&ch!=='.'?ch:null)}}
  const cv=document.createElement('canvas');cv.width=cv.height=S;const c=cv.getContext('2d');const at=(x,y)=>(G[y]&&G[y][x])||null;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const ch=at(x,y);if(ch){const base=PXPAL[ch];let f=0;if(at(x,y-1)!==ch)f=.32;else if(at(x,y+1)!==ch||at(x+1,y)!==ch)f=-.28;c.fillStyle=f?pxShade(base,f):base;c.fillRect(x,y,1,1)}
    else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){c.fillStyle='#1a1230';c.fillRect(x,y,1,1)}}

    const p=L.pond;ellipse(g,p.x,p.y+1,p.rx+2,p.ry+2,phase==='night'?'#3b3a36':'#a8946a');ellipse(g,p.x,p.y,p.rx,p.ry,phase==='night'?'#1d3a6b':'#4aa8e8');ellipse(g,p.x-4,p.y-3,p.rx-8,p.ry-6,phase==='night'?'#24467e':'#69c2f5');
    px(g,p.x-p.rx+4,p.y-p.ry+3,4,1,'rgba(255,255,255,.5)');
    for(const[dx,dy]of[[-20,-5],[18,4],[-10,8]]){ellipse(g,p.x+dx,p.y+dy,3,1,'#3f9d4a');px(g,p.x+dx+1,p.y+dy-1,1,1,'#ff9fc8')}
    // rocks + campfire
    const rk=L.rocks;ellipse(g,rk.x,rk.y,9,3,'#9a98b8');ellipse(g,rk.x-1,rk.y-1,7,2,'#b9b7d2');ellipse(g,rk.x+14,rk.y+2,6,2,'#8a88a8');
    px(g,rk.x-18,rk.y+1,8,2,'#6a3a22');px(g,rk.x-17,rk.y,6,1,'#8a4a2a');
    // tree trunk + canopy (canopy drawn later on top? trunk only here)
    const tr=L.tree;px(g,tr.x-3,tr.top+10,7,tr.base-tr.top-10,'#7a4d2a');px(g,tr.x-3,tr.top+10,2,tr.base-tr.top-10,'#946038');
    ellipse(g,tr.x,tr.base,9,2,'rgba(0,0,0,.18)');
    bg=o;
  }
  const sway={up:0,low:0};
  function canopy(){const tr=L.tree,P=PAL[phase],dark=phase==='night';
    const cols=dark?['#1f4a35','#2a5e44','#357253']:['#3f9d4a','#56b85a','#7fd06b'];
    // lower leaf clusters cover the two sitting spots (no bare branches)
    c.save();c.translate(sway.low,0);
    ellipse(c,tr.x-13,tr.top+21,10,7,cols[0]);ellipse(c,tr.x+12,tr.top+26,10,7,cols[0]);
    ellipse(c,tr.x-14,tr.top+18,7,4,cols[1]);ellipse(c,tr.x+11,tr.top+23,7,4,cols[1]);
    c.restore();c.save();c.translate(sway.up,0);
    ellipse(c,tr.x,tr.top+6,20,12,cols[0]);ellipse(c,tr.x-9,tr.top+10,12,8,cols[0]);ellipse(c,tr.x+10,tr.top+12,11,7,cols[0]);
    ellipse(c,tr.x-2,tr.top+3,15,8,cols[1]);ellipse(c,tr.x-6,tr.top,8,4,cols[2]);
    if(!dark)for(const[dx,dy]of[[-10,6],[8,2],[2,10]])c.fillStyle='#ff6b6b',c.fillRect((tr.x+dx)*s,(tr.top+dy)*s,s,s);
    c.restore()}
  function mix(a,b,k){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const r=(A>>16)+((B>>16)-(A>>16))*k,g=(A>>8&255)+((B>>8&255)-(A>>8&255))*k,bl=(A&255)+((B&255)-(A&255))*k;return'rgb('+(r|0)+','+(g|0)+','+(bl|0)+')'}
  function inPond(x,y){const p=L.pond;return((x-p.x)/(p.rx+3))**2+((y-p.y)/(p.ry+3))**2<1}
  function depthAt(x,y){const p=L.pond,v=((x-p.x)/p.rx)**2+((y-p.y)/p.ry)**2;return v>=1?0:Math.min(1,(1-v)/.55)}
  function pushOut(a){const p=L.pond,dx=(a.x-p.x)/(p.rx+4),dy=(a.y-p.y)/(p.ry+4),v=Math.hypot(dx,dy);if(v<1){const k=1/(v||1e-3);a.x=p.x+dx*k*(p.rx+4);a.y=p.y+dy*k*(p.ry+4)}}

  // ---- pets ----
  const A=pets.map((p,i)=>({p,el:K.SPECIES[p.sp].el,x:20+((i*37)%80),y:0,tx:0,ty:0,face:1,task:'idle',until:0,spd:0,bob:0,zz:0,hearts:[],slot:-1,lift:0}));
  const taken={branch:[-1,-1]};
  function freeBranch(){return taken.branch.findIndex(v=>v<0)}
  function pickMeadow(){for(let k=0;k<20;k++){const x=L.meadow.x0+Math.random()*(L.meadow.x1-L.meadow.x0),y=L.meadow.y0+Math.random()*(L.meadow.y1-L.meadow.y0);if(!inPond(x,y)&&!(Math.abs(x-L.tree.x)<8&&y<L.tree.base+2))return[x,y]}return[60,L.meadow.y1-10]}
  function pickPond(){const p=L.pond;const a=Math.random()*6.28,r=Math.random()*.45;return[p.x+Math.cos(a)*p.rx*r,p.y+Math.sin(a)*p.ry*r+3]}
  function isEgg(a){return(K.formIdx?K.formIdx(a.p.lv):(a.p.lv<3?0:1))===0}
  function release(a){if(a.slot>=0){taken.branch[a.slot]=-1;a.slot=-1}a.lift=0}
  function choose(a,now){
    release(a);const r=Math.random();let task='walk';
    if(phase==='night'){task='sleep'}
    else if(a.el==='water'&&r<.6)task='swim';
    else if(a.el==='leaf'&&r<.5&&freeBranch()>=0)task='climb';
    else if(a.el==='fire'&&r<.5)task='sun';
    else if(r<.35&&A.length>1)task='chase';
    a.task=task;a.until=now+9000+Math.random()*12000;
    if(task==='walk'){[a.tx,a.ty]=pickMeadow();a.spd=0.0096}
    if(task==='swim'){const an=Math.random()*6.28;a.tx=L.pond.x+Math.cos(an)*(L.pond.rx+5);a.ty=L.pond.y+Math.sin(an)*(L.pond.ry+5);a.spd=0.0078;a.sub='toPond'}
    if(task==='climb'){a.slot=freeBranch();taken.branch[a.slot]=a;a.tx=L.tree.x+(a.slot?3:-3);a.ty=L.tree.base+2;a.spd=0.0078;a.sub='toTree'}
    if(task==='sun'){a.tx=L.rocks.x-4+Math.random()*10;a.ty=L.rocks.y+1;a.spd=0.0096}
    if(task==='chase'){a.mate=A.filter(b=>b!==a)[Math.floor(Math.random()*(A.length-1))];a.spd=0.0132}
    if(task==='sleep'){const i=A.indexOf(a),m=L.meadow,cols=4,rows=Math.ceil(A.length/cols);let x=m.x0+8+(i%cols)*((m.x1-m.x0-16)/(cols-1))+((i*7)%5-2),y=m.y0+6+Math.floor(i/cols)*((m.y1-m.y0-10)/Math.max(1,rows))+((i*5)%4);if(inPond(x,y))x+=L.pond.rx+8;a.tx=x;a.ty=y;a.spd=0.0072;a.until=now+1e9}
  }
  function step(a,dt,now){
    if(!a.placed){a.placed=1;if(isEgg(a)){const n=A.filter(b=>isEgg(b)).indexOf(a),spots=[[L.tree.x-14,L.tree.base+6],[L.tree.x+13,L.tree.base+8],[L.tree.x-2,L.tree.base+12],[L.tree.x-24,L.tree.base+14],[L.tree.x+22,L.tree.base+16]];[a.x,a.y]=spots[n%spots.length];a.y+=Math.floor(n/spots.length)*10;a.task='egg';a.until=1e15;return}[a.x,a.y]=pickMeadow()}
    if(isEgg(a)){a.moving=false;return}
    if(now>a.until||!a.task||a.task==='idle')choose(a,now);
    const go=(sp)=>{const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<.6)return true;const m=Math.min(d,sp*dt),wasIn=inPond(a.x,a.y);a.x+=dx/d*m;a.y+=dy/d*m;if(a.task!=='swim'&&!wasIn&&inPond(a.x,a.y))pushOut(a);if(Math.abs(dx)>.3)a.face=dx>0?1:-1;a.bob+=dt;return false};
    a.moving=false;
    switch(a.task){
      case 'walk':if(go(a.spd))a.task='idle2';else a.moving=true;break;
      case 'idle2':if(Math.random()<.004){[a.tx,a.ty]=pickMeadow();a.task='walk'}break;
      case 'swim':
        if(a.sub==='toPond'){a.moving=!go(a.spd);if(!a.moving){a.sub='in';[a.tx,a.ty]=pickPond()}}
        else{if(go(.0035)){[a.tx,a.ty]=pickPond()}a.moving=true}
        break;
      case 'climb':
        if(a.sub==='toTree'){a.moving=!go(a.spd);if(!a.moving)a.sub='up'}
        else if(a.sub==='up'){const b=L.branches[a.slot];a.lift=Math.min(a.lift+dt*.0045,(L.tree.base+2)-b.y);a.moving=true;a.climb=true;if(a.lift>=(L.tree.base+2)-b.y){a.sub='sit';a.x=b.x;a.climb=false;a.face=a.slot?1:-1}}
        else if(a.sub==='sit'&&now>a.until-1500){a.sub='down';a.x=L.tree.x+(a.slot?3:-3)}
        else if(a.sub==='down'){a.lift=Math.max(0,a.lift-dt*.0055);a.climb=true;a.moving=true;if(a.lift<=0){a.climb=false;a.until=0}}
        break;
      case 'sun':a.moving=!go(a.spd);break;
      case 'chase':{const m=a.mate;if(!m){a.until=0;break}a.tx=m.x-6*a.face;a.ty=m.y+1;a.moving=!go(a.spd);if(Math.random()<.003)a.hearts.push({x:a.x,y:a.y-PET,t:now});break}
      case 'sleep':a.moving=!go(a.spd);break;
    }
  }
  // ---- draw ----
  function sprite(a,now){
    const f=K.formIdx?K.formIdx(a.p.lv):Math.min(4,Math.floor(a.p.lv/3));
    let eyes='open';if(a.task==='sleep'&&!a.moving)eyes='sleep';else if(a.task==='sun'&&!a.moving)eyes='happy';
    const fr=a.task==='egg'?((Math.floor(now/400)+A.indexOf(a)*3)%9===0?1:0):a.moving?(Math.floor(now/340)%2):(Math.floor(now/700)%2&&eyes!=='sleep'?1:0);
    return K.renderSprite(a.p.sp,f,fr,eyes,a.p.acc)}
  function drawPet(a,now){
    const spr=sprite(a,now),ps=s/2;let x=a.x,y=a.y-a.lift;
    const w=48*ps,h=48*ps;let X=Math.round(x*s-w/2);const Y=Math.round(y*s-h+2*s);
    const dep=a.lift>0?0:depthAt(a.x,a.y),swim=dep>0,cut=1-.4*dep;
    if(a.task==='climb'&&a.sub==='sit')X+=sway.low;
    if(a.task==='egg'){c.fillStyle='#a8743c';c.fillRect(X+w*.22,Y+h-3*s,w*.56,2*s);c.fillStyle='#c99a5a';c.fillRect(X+w*.26,Y+h-3*s,w*.48,s/2)}
    if(!swim&&a.lift<1){c.fillStyle='rgba(0,0,0,.2)';c.fillRect(X+w*.28,Y+h-2*s,w*.44,s)}
    c.save();
    if(swim){c.beginPath();c.rect(X-10,Y-40*s,w+20,h*cut+40*s);c.clip()}
    if(a.face<0){c.translate(X+w,Y);c.scale(-1,1);c.drawImage(spr,0,0,w,h)}else c.drawImage(spr,X,Y,w,h);
    c.restore();
    if(swim){const wl=Y+h*cut,ph=now/300;c.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<5;i++){const xx=X+w*.18+i*w*.16+Math.sin(ph+i)*s*.5;c.fillRect(Math.round(xx),Math.round(wl),Math.round(w*.09),s/2)}}
    if(a.task==='sun'&&!a.moving&&Math.floor(now/400+a.x)%3===0){c.fillStyle='#ffd23f';c.fillRect(X+w*.7,Y+h*.3,s/2,s/2)}
    if(eyesSleep(a)){const k=(now/900+A.indexOf(a)*.37)%1;c.fillStyle='rgba(255,255,255,'+(1-k)+')';c.font=(6*s)+'px "Pixelify Sans",monospace';c.fillText('z',X+w*.7+k*4*s,Y+h*.35-k*10*s)}
  }
  function eyesSleep(a){return a.task==='sleep'&&!a.moving}
  function frame(now){
    if(!W)layout();if(!bg)drawBG();
    const dt=Math.min(60,now-(frame.last||now));frame.last=now;
    A.forEach(a=>step(a,dt,now));
    c.imageSmoothingEnabled=false;c.drawImage(bg,0,0);
    if(phase==='night'){for(const[x,y]of stars){if((x*7+y*13+Math.floor(now/500))%9)c.fillStyle='#fff',c.fillRect(x*s,y*s,s/2,s/2)}}
    // campfire flame
    const rk=L.rocks,fl=Math.floor(now/120)%3;c.fillStyle='#ff9a3c';c.fillRect((rk.x-16)*s,(rk.y-3-fl)*s,4*s,(3+fl)*s);c.fillStyle='#ffd23f';c.fillRect((rk.x-15)*s,(rk.y-2-fl)*s,2*s,(2+fl)*s);
    // pond ripple shimmer
    const p=L.pond;c.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<3;i++){const k=((now/1600)+i/3)%1;c.fillRect(Math.round((p.x-10+i*9)*s),Math.round((p.y+3-k*4)*s),3*s,s/2)}
    sway.up=Math.round(Math.sin(now/1900)*s*.75);sway.low=Math.round(Math.sin(now/1900-.6)*s*.4);
    // grass tufts swaying in the breeze
    {const P=PAL[phase];for(const[tx,ty,i]of tufts){const o=Math.sin(now/1100+i)>.35?1:Math.sin(now/1100+i)<-.35?-1:0;c.fillStyle=P.grass2;c.fillRect(tx*s,(ty-1)*s,s/2,s);c.fillRect((tx+1)*s,(ty-2)*s,s/2,2*s);c.fillStyle=P.grass3;c.fillRect((tx+1)*s+o*s/2,(ty-3)*s,s/2,s);c.fillRect((tx+2)*s,(ty-1)*s,s/2,s)}}
    // drifting clouds + gentle sun rays + birds
    if(phase!=='night'){const cc=phase==='eve'?'rgba(255,236,220,.9)':'rgba(255,255,255,.9)';
      [[0,12,8,0],[45,20,6,1],[85,8,7,2]].forEach(([x0,y,r,i])=>{const x=((x0+now/(2600+i*700))%(BW+34))-17;ellipse(c,Math.round(x),y,r+2,3,cc);ellipse(c,Math.round(x)+5,y-2,r-2,3,cc)});
      const sx=phase==='eve'?20:96,sy=phase==='eve'?L.g-8:12,ang=now/2400;c.fillStyle=phase==='eve'?'rgba(255,207,107,.8)':'rgba(255,241,168,.85)';
      for(let k=0;k<8;k++){if((k+Math.floor(now/600))%2)continue;const a2=ang+k*Math.PI/4;c.fillRect(Math.round((sx+Math.cos(a2)*9)*s),Math.round((sy+Math.sin(a2)*9)*s),s,s)}
      const bt=(now/1000)%16;if(bt<9){const bx=-6+bt*(BW+12)/9,by=14+Math.sin(bt*2)*2,fl=Math.floor(now/220)%2;c.fillStyle='#3a3550';for(const o of[0,6]){const X0=Math.round((bx-o)*s),Y0=Math.round((by+o*.4)*s);c.fillRect(X0-s,Y0-(fl?s:0),s,s);c.fillRect(X0,Y0,s,s);c.fillRect(X0+s,Y0-(fl?s:0),s,s)}}}
    // falling leaves from the tree
    if(phase!=='night'&&now-lastLeaf>2600){lastLeaf=now;leaves.push({x:L.tree.x-14+Math.random()*28,y:L.tree.top+14,t:now})}
    leaves=leaves.filter(l=>now-l.t<9000);
    // depth sort: tree-climbers are drawn above the canopy
    const order=A.slice().sort((a,b)=>(a.y)-(b.y));
    const onTree=order.filter(a=>a.task==='climb'&&a.lift>0),ground=order.filter(a=>!(a.task==='climb'&&a.lift>0));
    ground.forEach(a=>drawPet(a,now));
    canopy();
    onTree.forEach(a=>drawPet(a,now));
    leaves.forEach(l=>{const k=(now-l.t)/1000,ground=L.tree.base+6,y=Math.min(ground,l.y+k*4),x=l.x+Math.sin(k*2.2)*3,al=y>=ground?Math.max(0,1-(k-(ground-l.y)/4)/2):1;c.fillStyle='rgba(86,184,90,'+al+')';c.fillRect(Math.round(x*s),Math.round(y*s),s,s/2)});
    // butterflies (day) / fireflies (night)
    for(let i=0;i<4;i++){const tt=now/1000+i*1.7,x=20+i*25+Math.sin(tt*.9)*10,y=L.g+20+i*12+Math.sin(tt*1.7)*6;
      if(phase==='night'){c.fillStyle=Math.sin(tt*3)>0?'#e8ff7a':'rgba(232,255,122,.3)';c.fillRect(Math.round(x*s),Math.round(y*s),s/2,s/2)}
      else{c.fillStyle=['#ff8fb6','#ffd23f','#ffffff','#b48bff'][i];const o=Math.sin(tt*12)>0?1:0;c.fillRect(Math.round((x-o)*s),Math.round(y*s),s/2,s/2);c.fillRect(Math.round((x+1+o)*s),Math.round(y*s),s/2,s/2)}}
    // hearts
    A.forEach(a=>{a.hearts=a.hearts.filter(h=>now-h.t<1200);a.hearts.forEach(h=>{const k=(now-h.t)/1200;c.fillStyle='rgba(255,143,182,'+(1-k)+')';const X=h.x*s,Y=(h.y-k*10)*s;c.fillRect(X-s,Y,s,s);c.fillRect(X+s/2,Y,s,s);c.fillRect(X-s/2,Y+s,2*s,s)})});
    const P=PAL[phase];if(P.tint){c.fillStyle=P.tint;c.fillRect(0,0,W,H)}
    if(phase==='night'){const g=c.createRadialGradient((rk.x-14)*s,(rk.y-2)*s,2*s,(rk.x-14)*s,(rk.y-2)*s,22*s);g.addColorStop(0,'rgba(255,170,80,.35)');g.addColorStop(1,'rgba(255,170,80,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
    if(alive)raf=requestAnimationFrame(frame)}
  let raf=requestAnimationFrame(frame),alive=true;
  cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*BW,y=(e.clientY-r.top)/r.height*BH;
    let best=null,bd=1e9;A.forEach(a=>{const ay=a.y-a.lift-PET*.4,d=Math.hypot(a.x-x,ay-y);if(d<bd){bd=d;best=a}});
    if(best&&bd<PET*.6){best.hearts.push({x:best.x,y:best.y-best.lift-PET,t:performance.now()});if(opts.onTap)opts.onTap(best.p)}});
  const ro=new ResizeObserver(()=>{W=0});ro.observe(host);
  return{dbg:()=>({BW,BH,pets:A.map(a=>[a.x,a.y-a.lift-PET*.4,a.task])}),setPhase(p){phase=p;bg=null;A.forEach(a=>{a.until=0})},destroy(){alive=false;cancelAnimationFrame(raf);ro.disconnect();cv.remove()},phase:()=>phase};
}
window.KPDFarm={mount,phaseNow};
})();

</script>
